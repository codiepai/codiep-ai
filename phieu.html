<style>
@font-face{font-family:"OpSym";src:local("Arial");unicode-range:U+2B,U+2D,U+3C,U+3E,U+3D,U+D7,U+F7}

:root{--xanh:#0b5cab;--chu:#12304a;--phu:#4a6378}

body{margin:0;font-family:"Be Vietnam Pro",Arial,sans-serif;background:#eaf5ff;color:var(--chu)}
.bang{max-width:760px;margin:0 auto;padding:16px}

.nut{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

.to{background:#fff;margin:14px auto;padding:22px 26px;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.12);font-family:"Andika",Arial,sans-serif}
.to .dau{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-bottom:2px solid #1d3557;padding-bottom:8px;margin-bottom:12px}
.to h2{font-family:"Baloo 2",sans-serif;text-align:center;margin:4px 0 12px;font-size:24px;color:#1d3557}
.luoi{display:grid;grid-template-columns:repeat(6,1fr);gap:34px 16px}.bai{grid-column:span 2}
.bai{font-size:23px;line-height:1.7}.bai:not(.rong){white-space:nowrap}
.bai i{display:inline-block;min-width:54px;border-bottom:2px solid #1d3557;height:34px;vertical-align:bottom}
.bai.rong{grid-column:span 3}.bai small{color:#5b6b80;font-size:14px;margin-right:4px}
.chan{margin-top:16px;text-align:right;font-size:12px;color:#5b7aa0}
.dapan{page-break-before:always}
@media (max-width:560px){.luoi{grid-template-columns:repeat(4,1fr)}.bai.rong{grid-column:span 4}.bai{font-size:20px}.hang{grid-template-columns:1fr}}
@media print{
  body{background:#fff}.bang>*:not(.in-ra){display:none!important}
  .bang{padding:0;max-width:none}.to{box-shadow:none;margin:0;padding:6mm 4mm}
  .xem-dap{display:none}
}
.ch-bai label{display:block;font-weight:700;margin:0 0 4px;color:#0b5cab}
.ch-bai{margin-bottom:6px;padding-bottom:10px;border-bottom:2px dashed #cfe6fb}
.bai svg{vertical-align:middle}.bai small.cd{font-size:13px;color:#5b6b80}

b.o.r{border-color:#e53935}b.o.b{border-color:#1e88e5}b.o.g{border-color:#43a047}b.o.p{border-color:#8e24aa}b.o.y{border-color:#fb8c00}

.noi2{display:flex;justify-content:space-between;gap:4mm}.nd{margin:1.2mm 0;white-space:nowrap}.the5{border:1.5px solid #555;border-radius:2mm;padding:0 2mm}

    <div class="hang">
      <div id="o-dang"><label for="dang">Dạng bài</label>

          <optgroup label="Số và so sánh">
            <option value="dem">Đếm hình, viết số</option>

      <div><label for="pv">Phạm vi</label>

      <div id="o-sl"><label for="sl">Số bài</label>

      <div><label for="kho">Khổ giấy</label>
        <select id="kho"><option value="a5" selected>A5 - mẫu phiếu ôn cuối tuần</option><option value="a4">A4 - mẫu đề khảo sát</option><option value="tudo">Phiếu tự do (chọn dạng bài)</option></select></div>

        <select id="phong"><option value="vni">VNI-Avo</option><option value="times">Times New Roman</option><option value="hp">Chữ tiểu học (HP)</option></select></div>

        <select id="hp"><option>HP001 4 hàng</option><option>HP001 5 hàng</option><option>HP001 4H</option><option>HP001 5H</option><option>HP001 4 hàng 1 ô ly</option><option>HP001 4 hàng 2 ô ly</option><option>HP001 Tap Do</option></select></div>

        <select id="co"><option>11</option><option>12</option><option>13</option><option selected>14</option><option>15</option><option>16</option></select></div>
      <div><label for="ten">Tên phiếu</label><input id="ten" type="text" value="Phiếu luyện tính"></div>

    <div class="nut"><button id="tao">Tạo phiếu</button><button class="in" id="in">In phiếu</button></div>

    <p class="ghi">Miễn phí cho thầy cô. Bấm <b>In phiếu</b>, trong hộp in chọn <b>Lưu thành PDF</b> để tải phiếu về máy.</p>

<script>
const $ = id => document.getElementById(id);
const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[r(0, a.length - 1)];
const O = '<i></i>', Os = '<i style="min-width:46px"></i>', Ow = '<i style="min-width:150px"></i>';
const hinh = ['🍎', '⭐', '🐟', '🌸', '🚗', '🐥', '🍓'];
const CHU = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín', 'mười'];
const MAU = ['#e63946', '#1d7bd8', '#f77f00', '#2a9d4a', '#7b2ff7'];
const VAT = ['quả cam', 'cái kẹo', 'bông hoa', 'con gà', 'quyển vở', 'quả bóng'];

/* Dạng bài theo từng bài của sách Toán 1 Kết nối tri thức (tập 1) */
const BAI = {
  1:  {ten: 'Các số 0, 1, 2, 3, 4, 5', pv: 5,  d: ['dem', 'chonso', 'doc', 'lienke', 'dayso']},
  2:  {ten: 'Các số 6, 7, 8, 9, 10', pv: 10, d: ['dem', 'chonso', 'doc', 'lienke', 'dayso']},
  3:  {ten: 'Nhiều hơn, ít hơn, bằng nhau', pv: 8, d: ['nhieuit']},
  4:  {ten: 'So sánh số', pv: 10, d: ['sosanhso', 'lonnhat', 'xep']},
  5:  {ten: 'Mấy và mấy', pv: 7, d: ['tachgom', 'tach']},
  6:  {ten: 'Luyện tập chung', pv: 10, d: ['dem', 'doc', 'sosanhso', 'lonnhat', 'xep', 'tachgom', 'dayso']},
  7:  {ten: 'Hình vuông, hình tròn, hình tam giác, hình chữ nhật', pv: 10, d: ['tenhinh', 'hinh', 'tomau']},
  8:  {ten: 'Thực hành lắp ghép, xếp hình', pv: 10, d: ['tomau', 'hinh', 'tenhinh']},
  9:  {ten: 'Luyện tập chung (hình phẳng)', pv: 10, d: ['tenhinh', 'hinh', 'tomau', 'dem']},
  10: {ten: 'Phép cộng trong phạm vi 10', pv: 10, d: ['cong', 'thieucong', 'tach', 'bacong', 'toanvan']},
  11: {ten: 'Phép trừ trong phạm vi 10', pv: 10, d: ['tru', 'thieutru', 'batru', 'toanvan']},
  12: {ten: 'Bảng cộng, bảng trừ trong phạm vi 10', pv: 10, d: ['batso', 'cong', 'tru']},
  13: {ten: 'Luyện tập chung (cộng, trừ)', pv: 10, d: ['thieu', 'sosanh', 'dau', 'baba', 'tron']},
  14: {ten: 'Khối lập phương, khối hộp chữ nhật', pv: 10, d: ['tenkhoi', 'khoi']},
  15: {ten: 'Vị trí, định hướng trong không gian', pv: 10, d: ['vitri']},
  16: {ten: 'Luyện tập chung (hình khối, vị trí)', pv: 10, d: ['tenkhoi', 'khoi', 'vitri', 'tenhinh', 'hinh']},
  17: {ten: 'Ôn tập các số trong phạm vi 10', pv: 10, d: ['dem', 'doc', 'sosanhso', 'lonnhat', 'xep', 'lienke', 'tachgom']},
  18: {ten: 'Ôn tập phép cộng, phép trừ trong phạm vi 10', pv: 10, d: ['cong', 'tru', 'baba', 'thieu', 'dau', 'toanvan']},
  19: {ten: 'Ôn tập hình học', pv: 10, d: ['tenhinh', 'tenkhoi', 'hinh', 'khoi', 'tomau', 'vitri']},
  20: {ten: 'Ôn tập chung', pv: 10, d: ['dem', 'sosanhso', 'xep', 'cong', 'tru', 'thieu', 'dau', 'tenhinh', 'tenkhoi', 'hinh', 'vitri', 'toanvan']}
};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
/* ===== Phông chữ khi in: VNI-Avo, Times New Roman, chữ tiểu học HP ===== */
const VNI_T1 = {'́': 'ù', '̀': 'ø', '̉': 'û', '̃': 'õ', '̣': 'ï'};
const VNI_T2 = {'́': 'á', '̀': 'à', '̉': 'å', '̃': 'ã', '̣': 'ä'};
const VNI_T3 = {'́': 'é', '̀': 'è', '̉': 'ú', '̃': 'ü', '̣': 'ë'};
const VNI_I = {'́': 'í', '̀': 'ì', '̉': 'æ', '̃': 'ó', '̣': 'ò'};
function vniChar(c){
  if (c === 'đ') return 'ñ'; if (c === 'Đ') return 'Ñ';
  const d = c.normalize('NFD'); if (d.length === 1) return c;
  const up = d[0] !== d[0].toLowerCase(), b = d[0].toLowerCase();
  let mod = '', tone = '';
  for (const m of d.slice(1)){ if ('̛̂̆'.includes(m)) mod = m; else tone = m; }
  let out;
  if (b === 'i') out = tone ? VNI_I[tone] : 'i';
  else if (b === 'y') out = tone ? (tone === '̣' ? 'î' : 'y' + VNI_T1[tone]) : 'y';
  else if (!mod) out = b + (tone ? VNI_T1[tone] : '');
  else if (mod === '̂') out = b + (tone ? VNI_T2[tone] : 'â');
  else if (mod === '̆') out = 'a' + (tone ? VNI_T3[tone] : 'ê');
  else if (mod === '̛') out = (b === 'o' ? 'ô' : 'ö') + (tone ? VNI_T1[tone] : '');
  else out = c;

  4: ['sosanh', 'lonnhat', 'xep', 'dayso', 'dem', 'nhieuit'],
  5: ['tach', 'gom', 'dem', 'sosanh', 'dayso'],
  6: ['dem', 'sosanh', 'xep', 'lonnhat', 'tach', 'gom', 'dayso'],
  7: ['hinhdem', 'noihinh', 'khacloai', 'tieptheo'],
  8: ['hinhdem', 'khacloai', 'tieptheo', 'noihinh'],
  9: ['hinhdem', 'noihinh', 'khacloai', 'tieptheo', 'dem', 'sosanh'],
  10: ['tinh', 'thieu', 'tach', 'toanvan', 'chuoi', 'sosanhpt', 'dem'],
  11: ['tinh', 'thieu', 'tach', 'toanvan', 'chuoi', 'sosanhpt', 'dem'],
  12: ['batso', 'tinh', 'thieu', 'sosanhpt', 'dau', 'toanvan'],
  13: ['thieu', 'sosanhpt', 'dau', 'chuoi', 'toanvan', 'tinh', 'batso'],
  14: ['khoi', 'vitri', 'dem', 'khacloai'],
  15: ['vitri', 'khoi', 'hinhdem', 'dem'],
  16: ['khoi', 'vitri', 'hinhdem', 'tieptheo', 'dem'],
  17: ['dem', 'sosanh', 'xep', 'lonnhat', 'tach', 'gom', 'dayso', 'vietso'],
  18: ['tinh', 'thieu', 'dau', 'chuoi', 'sosanhpt', 'toanvan', 'batso'],
  19: ['hinhdem', 'khoi', 'noihinh', 'khacloai', 'tieptheo', 'vitri'],
  20: ['dem', 'sosanh', 'xep', 'tinh', 'thieu', 'hinhdem', 'toanvan', 'dau', 'tieptheo']
};
const OPS_BAI = {10: '+', 11: '-'};

function dungPhan(ds, a5){
  /* ds: các phần đã dựng; trả về HTML theo mẫu */
  let stt = 1, h = '';
  const tieu = (s, i) => '<b class="mht">' + (i + 1) + '. ' + s.t + '</b>';
  if (a5){
    let i = 0;
    while (i < ds.length){
      const s = ds[i];
      if (s.w === 'n' && ds[i + 1] && ds[i + 1].w === 'n'){
        h += '<div class="r2"><div class="c">' + tieu(s, i) + s.h + '</div><div class="c">' + tieu(ds[i + 1], i + 1) + ds[i + 1].h + '</div></div>'; i += 2;
      } else { h += '<div class="r1">' + tieu(s, i) + s.h + '</div>'; i++; }
    }
  } else {
    h += '<table class="mt"><tbody>';
    let i = 0;
    while (i < ds.length){
      const s = ds[i];
      if (s.w === 'n' && ds[i + 1] && ds[i + 1].w === 'n'){
        h += '<tr><td class="c2">' + tieu(s, i) + s.h + '</td><td class="c2">' + tieu(ds[i + 1], i + 1) + ds[i + 1].h + '</td></tr>'; i += 2;
      } else { h += '<tr><td colspan="2">' + tieu(s, i) + s.h + '</td></tr>'; i++; }
    }
    h += '</tbody></table>';
  }
  return h;
}

function taoMauToan(){
  const k = $('kho').value, a5 = k === 'a5', bai = $('bai').value, p = +$('pv').value;
  const so = bai === 'tu' ? 20 : +bai;
  const ctx = {p, ops: OPS_BAI[so] || 'both'};
  let loai = (PHAN[so] || PHAN[20]).slice();
  /* xếp đủ phần: dựng thêm phần nếu cần để lấp đầy trang */
  const PHANG_ = ['hinhdem', 'khacloai', 'noihinh', 'tieptheo'], KHOI_ = ['khoi', 'vitri'];
  const nhomHinh = so >= 7 && so <= 9 ? PHANG_ : so === 14 || so === 15 ? KHOI_ : so === 16 || so === 19 ? PHANG_.concat(KHOI_) : null;
  const them = tronT(Object.keys(SEC).filter(x => !loai.includes(x) && (nhomHinh ? nhomHinh.includes(x) : !PHANG_.includes(x) && !KHOI_.includes(x) && x !== 'noiso' && x !== 'vietso')));
  const day = loai.concat(them);
  const tatca = day.map(x => SEC[x](ctx));
  const ten = $('ten').value.replace(/[<>&]/g, '') || 'Phiếu luyện Toán';
  const to = $('to'), dap = $('dapan'), cao = (a5 ? 190 : 273) * 96 / 25.4;
  const dauA5 = '<div class="mdau"><span>Họ và tên: ........................... Lớp: 1.....</span><b>TOÁN</b></div>';
  const dauA4 = '<div class="mdau4"><span>Họ tên: ..................................................................... - Lớp: 1/..............</span></div><h2 class="mt4">' + esc(ten).toUpperCase() + '</h2>';
  to.className = 'to ' + (a5 ? 'mau5t' : 'mau4t'); dap.className = 'to dapan ' + (a5 ? 'mau5t' : 'mau4t');
  let dung = 1;
  const ve = n => { to.innerHTML = '<div class="mf' + (a5 ? '5' : '4') + 't">' + (a5 ? dauA5 : dauA4) + dungPhan(tatca.slice(0, n), a5) + '</div>'; apPhong(to); to.firstElementChild.style.setProperty('--f', 1); return to.firstElementChild; };
  for (let n = tatca.length; n >= 1; n--){ const b = ve(n); if (b.scrollHeight <= cao){ dung = n; break; } dung = n; }
  const box = ve(dung);
  if (box.scrollHeight > cao){ let f = 1; for (let i = 0; i < 24 && box.scrollHeight > cao; i++){ f -= .03; box.style.setProperty('--f', f.toFixed(2)); }
    $('phong-ghi').textContent += ' Chữ đã thu nhỏ còn ' + (Math.round(+$('co').value * f * 10) / 10) + ' pt cho vừa một trang.'; }
  dap.innerHTML = '<h2 style="text-align:center;font-family:Arial">Đáp án: ' + esc(ten) + '</h2><ol class="dapso">' + tatca.slice(0, dung).map(s => '<li><b>' + esc(s.t) + '</b> ' + s.a + '</li>').join('') + '</ol>';
}

const TAT = ['dem','chonso','doc','lienke','dayso','nhieuit','sosanhso','lonnhat','xep','tachgom','cong','tru','bacong','baba','thieu','dau','sosanh','tach','batso','toanvan','hinh','khoi','vitri'];

function svgHinh(loai, c){
  const f = 'fill="' + c + '"';
  if (loai === 0) return '<svg width="34" height="34"><circle cx="17" cy="17" r="14" ' + f + '/></svg>';
  if (loai === 1) return '<svg width="34" height="34"><rect x="3" y="3" width="28" height="28" ' + f + '/></svg>';
  if (loai === 2) return '<svg width="34" height="34"><polygon points="17,3 32,31 2,31" ' + f + '/></svg>';
  return '<svg width="44" height="34"><rect x="2" y="7" width="40" height="22" ' + f + '/></svg>';
}
const TENHINH = ['hình tròn', 'hình vuông', 'hình tam giác', 'hình chữ nhật'];
function svgKhoi(loai){
  if (loai === 0) return '<svg width="42" height="42"><polygon points="4,14 24,14 24,36 4,36" fill="#4aa3f0"/><polygon points="4,14 12,6 32,6 24,14" fill="#9bd0ff"/><polygon points="24,14 32,6 32,28 24,36" fill="#2b79c2"/></svg>';
  return '<svg width="58" height="42"><polygon points="3,16 41,16 41,36 3,36" fill="#f5a04a"/><polygon points="3,16 11,8 49,8 41,16" fill="#ffd199"/><polygon points="41,16 49,8 49,28 41,36" fill="#c9742a"/></svg>';
}
const TENKHOI = ['khối lập phương', 'khối hộp chữ nhật'];

function mot(dang, p, bai){
  if (dang === 'hon') dang = pick(['cong','tru','thieu','sosanh','dau','tach','lienke','baba','dem','sosanhso','hinh','toanvan']);
  if (dang === 'tron') dang = Math.random() < .5 ? 'cong' : 'tru';
  const q = Math.min(p, 10);
  switch (dang){
    case 'dem': { const n = r(1, q), e = pick(hinh); return {h: Array(n).fill(e).join('') + ' có ' + O + ' hình', d: n, rong: 1, id: e + n + Math.random()}; }
    case 'chonso': {
      const n = r(1, q), e = pick(hinh), op = new Set([n]); while (op.size < 3) op.add(r(Math.max(0, n - 2), Math.min(q + 1, n + 2)));
      return {h: Array(n).fill(e).join('') + '<br><small class="cd">Khoanh vào số đúng:</small> ' + [...op].sort((a, b) => a - b).join(' &nbsp; ') , d: n, rong: 1, id: e + n + Math.random()};
    }
    case 'doc': {
      const n = r(0, q);
      return Math.random() < .5 ? {h: 'Số ' + n + ' đọc là: ' + Ow, d: CHU[n], rong: 1} : {h: 'Số "' + CHU[n] + '" viết là: ' + Os, d: n, rong: 1};
    }
    case 'lienke': { const n = r(1, Math.max(2, p - 1)); return Math.random() < .5 ? {h: Os + ' , ' + n, d: n - 1} : {h: n + ' , ' + Os, d: n + 1}; }
    case 'dayso': {
      const buoc = p >= 100 && Math.random() < .5 ? 10 : (p >= 20 && Math.random() < .5 ? 2 : (p >= 10 && Math.random() < .25 ? 2 : 1));
      const s0 = r(0, Math.max(0, p - buoc * 5)), day = [0,1,2,3,4,5].map(i => s0 + i * buoc);
      if (Math.random() < .35) day.reverse();
      const an = new Set(); while (an.size < 2) an.add(r(1, 4));
      return {h: day.map((x, i) => an.has(i) ? Os : x).join(' , '), d: day.filter((x, i) => an.has(i)).join(' ; '), rong: 1};
    }
    case 'nhieuit': {
      const a = r(1, Math.min(p, 8)), b = r(1, Math.min(p, 8)), e1 = pick(hinh); let e2 = pick(hinh); if (e2 === e1) e2 = hinh[(hinh.indexOf(e1) + 1) % hinh.length];
      return {h: Array(a).fill(e1).join('') + '<br>' + Array(b).fill(e2).join('') + '<br><small class="cd">Hàng trên</small> ' + Ow + ' <small class="cd">hàng dưới</small><br><small class="cd">(nhiều hơn / ít hơn / bằng nhau)</small>',
        d: a > b ? 'nhiều hơn' : a < b ? 'ít hơn' : 'bằng nhau', rong: 1, id: a + e1 + b + e2 + Math.random()};
    }
    case 'sosanhso': { const a = r(0, q), b = r(0, q); return {h: a + ' ' + Os + ' ' + b, d: a > b ? '>' : a < b ? '<' : '='}; }
    case 'lonnhat': {
      const tap = new Set(); while (tap.size < (q >= 6 ? 4 : 3)) tap.add(r(0, q));
      const ds = [...tap], lon = Math.random() < .5;
      return {h: ds.join(' , ') + '<br><small class="cd">' + (lon ? 'Số lớn nhất là:' : 'Số bé nhất là:') + '</small> ' + Os, d: lon ? Math.max(...ds) : Math.min(...ds), rong: 1};
    }
    case 'xep': {
      const tap = new Set(); while (tap.size < 4) tap.add(r(0, p));
      const ds = [...tap], tang = Math.random() < .5, sx = [...ds].sort((x, y) => tang ? x - y : y - x);
      return {h: ds.join(' , ') + '<br><small class="cd">' + (tang ? 'Xếp từ bé đến lớn' : 'Xếp từ lớn đến bé') + ':</small> ' + Array(4).fill('<i style="min-width:52px"></i>').join(' '), d: sx.join(' , '), rong: 1};
    }
    case 'tachgom': {
      const t = r(2, q), a = r(1, t - 1);
      return Math.random() < .6 ? {h: t + ' gồm ' + a + ' và ' + Os, d: t - a} : {h: a + ' và ' + (t - a) + ' được ' + Os, d: t};
    }
    case 'cong': { const t = r(2, p), a = r(0, t), b = t - a; return {h: a + ' + ' + b + ' = ' + O, d: t}; }
    case 'tru': { const a = r(2, p), b = r(0, a); return {h: a + ' - ' + b + ' = ' + O, d: a - b}; }
    case 'thieucong': { const t = r(2, p), a = r(0, t), b = t - a; return Math.random() < .5 ? {h: Os + ' + ' + b + ' = ' + t, d: a} : {h: a + ' + ' + Os + ' = ' + t, d: b}; }
    case 'thieutru': { const t = r(1, p), a = r(0, t); return Math.random() < .5 ? {h: t + ' - ' + Os + ' = ' + a, d: t - a} : {h: Os + ' - ' + (t - a) + ' = ' + a, d: t}; }
    case 'thieu': {
      const t = r(2, p), a = r(1, t - 1), b = t - a;
      return Math.random() < .5 ? {h: Os + ' + ' + b + ' = ' + t, d: a} : {h: t + ' - ' + Os + ' = ' + a, d: b};
    }
    case 'sosanh': {
      if (Math.random() < .35){ const a = r(0, p), b = r(0, p); return {h: a + ' ' + Os + ' ' + b, d: a > b ? '>' : a < b ? '<' : '='}; }
      const x = r(1, p), y = r(0, x), z = r(0, p), ok = x + y <= p, v = ok ? x + y : x;
      return Math.random() < .5 ? {h: (ok ? x + ' + ' + y : String(x)) + ' ' + Os + ' ' + z, d: v > z ? '>' : v < z ? '<' : '='}
        : {h: z + ' ' + Os + ' ' + (ok ? x + ' + ' + y : String(x)), d: z > v ? '>' : z < v ? '<' : '='};
    }
    case 'dau': {
      const a = r(1, p), b = r(1, p);
      if (Math.random() < .5 && a + b <= p) return {h: a + ' ' + Os + ' ' + b + ' = ' + (a + b), d: '+'};
      const m = Math.max(a, b), n = Math.min(a, b);
      if (m === n) return mot(dang, p, bai);
      return {h: m + ' ' + Os + ' ' + n + ' = ' + (m - n), d: '-'};
    }
    case 'bacong': for (;;){ const a = r(0, p), b = r(0, p), c = r(0, p); if (a + b + c <= p) return {h: a + ' + ' + b + ' + ' + c + ' = ' + O, d: a + b + c, rong: 1}; }
    case 'batru': for (;;){ const a = r(2, p), b = r(0, a), c = r(0, a - b); return {h: a + ' - ' + b + ' - ' + c + ' = ' + O, d: a - b - c, rong: 1}; }
    case 'baba': for (;;){
      const a = r(0, p), b = r(0, p), c = r(0, p), o1 = Math.random() < .5 ? '+' : '-', o2 = Math.random() < .5 ? '+' : '-';
      const m = o1 === '+' ? a + b : a - b; if (m < 0 || m > p) continue;
      const k = o2 === '+' ? m + c : m - c; if (k < 0 || k > p) continue;
      return {h: a + ' ' + o1 + ' ' + b + ' ' + o2 + ' ' + c + ' = ' + O, d: k, rong: 1};
    }
    case 'tach': { const t = r(3, p), a = r(1, t - 1); return {h: t + ' = ' + a + ' + ' + Os, d: t - a}; }
    case 'batso': {
      const a = r(1, p - 1), b = r(1, p - a), t = a + b;
      return {h: '<small class="cd">Ba số ' + a + ', ' + b + ', ' + t + '</small><br>' + a + ' + ' + b + ' = ' + O + ' &nbsp; ' + t + ' - ' + a + ' = ' + O, d: t + ' ; ' + b, rong: 1};
    }
    case 'toanvan': {
      const v = pick(VAT), ten = pick(['Mai', 'Nam', 'Lan', 'Bình', 'An', 'Hà']);
      if (Math.random() < .5){ const a = r(1, p - 1), b = r(1, p - a); return {h: ten + ' có ' + a + ' ' + v + ', được cho thêm ' + b + '. Có tất cả ' + Os + ' ' + v + '?', d: a + b, rong: 1}; }
      const a = r(2, p), b = r(1, a - 1); return {h: ten + ' có ' + a + ' ' + v + ', cho bạn ' + b + '. Còn lại ' + Os + ' ' + v + '?', d: a - b, rong: 1};
    }
    case 'hinh': {
      const n = r(5, 9), ds = []; for (let i = 0; i < n; i++) ds.push(r(0, 3));
      const loai = pick([...new Set(ds)]), dem = ds.filter(x => x === loai).length;
      return {h: ds.map(x => svgHinh(x, pick(MAU))).join(' ') + '<br><small class="cd">Có</small> ' + Os + ' <small class="cd">' + TENHINH[loai] + '</small>', d: dem, rong: 1, id: ds.join('') + Math.random()};
    }
    case 'khoi': {
      const n = r(4, 8), ds = []; for (let i = 0; i < n; i++) ds.push(r(0, 1));
      if (!ds.includes(0)) ds[0] = 0; if (!ds.includes(1)) ds[1] = 1;
      const loai = r(0, 1), dem = ds.filter(x => x === loai).length;
      return {h: ds.map(svgKhoi).join(' ') + '<br><small class="cd">Có</small> ' + Os + ' <small class="cd">' + TENKHOI[loai] + '</small>', d: dem, rong: 1, id: ds.join('') + Math.random()};
    }
    case 'tenhinh': {
      const l = r(0, 3), c = pick(MAU);
      return {h: svgHinh(l, c) + ' &nbsp; <small class="cd">Đây là</small> ' + Ow + '<br><small class="cd">(hình tròn / vuông / tam giác / chữ nhật)</small>', d: TENHINH[l], rong: 1, id: 'th' + l + Math.random()};
    }
    case 'tenkhoi': {
      const l = r(0, 1);
      return {h: svgKhoi(l) + ' &nbsp; <small class="cd">Đây là</small> ' + Ow + '<br><small class="cd">(khối lập phương / khối hộp chữ nhật)</small>', d: TENKHOI[l], rong: 1, id: 'tk' + l + Math.random()};
    }
    case 'tomau': {
      const n = r(6, 9), ds = []; for (let i = 0; i < n; i++) ds.push(r(0, 3));
      const loai = pick([...new Set(ds)]), dem = ds.filter(x => x === loai).length, mau = pick(['đỏ', 'xanh', 'vàng']);
      const vien = x => svgHinh(x, '#fff').replace(/fill="#fff"/, 'fill="#fff" stroke="#1d3557" stroke-width="2"');
      return {h: ds.map(vien).join(' ') + '<br><small class="cd">Tô màu ' + mau + ' vào các ' + TENHINH[loai] + '. Tô được</small> ' + Os + ' <small class="cd">hình</small>', d: dem, rong: 1, id: 'tm' + ds.join('') + Math.random()};
    }
    case 'vitri': {
      const tap = new Set(); while (tap.size < 3) tap.add(pick(hinh));
      const [x, y, z] = [...tap], vt = r(0, 2), ten = ['bên trái', 'ở giữa', 'bên phải'][vt];
      return {h: x + ' ' + y + ' ' + z + '<br><small class="cd">Hình ' + ten + ' là:</small> ' + Os, d: [x, y, z][vt], rong: 1, id: x + y + z + vt};
    }
  }
  return mot('cong', p, bai);
}

function tao(){
  if ($('kho').value !== 'tudo'){ taoMauToan(); return; }
  $('to').className = 'to'; $('dapan').className = 'to dapan';
  $('to').style.fontFamily = '';
  const bai = $('bai').value, p = +$('pv').value, n = +$('sl').value;
  const ds = bai === 'tu' ? [$('dang').value] : BAI[+bai].d;
  kq = []; const thay = new Set(); let thu = 0, i = 0;
  while (kq.length < n && thu++ < 4000){
    const dang = ds[i++ % ds.length];
    const o = mot(dang, p, bai), k = o.id || o.h;
    if (thay.has(k) && thu < 2500) continue;
    o.loai = (i - 1) % ds.length; thay.add(k); kq.push(o);
  }
  if (ds.length > 1) kq.sort((x, y) => (x.loai || 0) - (y.loai || 0));
  const khung = (nd, td) => '<div class="dau"><span>Họ và tên: ................................</span><span>Lớp: ........</span></div><h2>' + td + '</h2>' + nd + '<div class="chan">Điệp Trần tặng thầy cô</div>';
  const ten = $('ten').value.replace(/[<>&]/g, '') || 'Phiếu luyện tính';
  const the = (o, i, nd) => '<div class="bai' + (o.rong ? ' rong' : '') + '"><small>' + (i + 1) + '.</small>' + nd + '</div>';
  $('to').innerHTML = khung('<div class="luoi">' + kq.map((o, i) => the(o, i, o.h)).join('') + '</div>', ten);
  $('dapan').innerHTML = khung('<div class="luoi">' + kq.map((o, i) => the({rong: o.rong}, i, o.d)).join('') + '</div>', 'Đáp án: ' + ten);
  apPhong($('to'));
}
let kq = [];
function doiBai(){
  const b = $('bai').value;
  $('o-dang').style.display = b === 'tu' ? '' : 'none';
  if (b !== 'tu'){
    $('pv').value = String(BAI[+b].pv);
    $('ten').value = 'Phiếu luyện Toán 1 - Bài ' + b + ': ' + BAI[+b].ten;
  } else $('ten').value = 'Phiếu luyện tính';
  tao();
}
function apKho(doi){
  const k = $('kho').value, tudo = k === 'tudo';
  $('o-dang').style.display = tudo ? '' : 'none'; $('o-sl').style.display = tudo ? '' : 'none';
  $('pg').textContent = k === 'a5' ? '@page{size:A5;margin:8mm}' : '@page{size:A4;margin:12mm}';
  if (doi && tudo) $('sl').value = '10';
}
$('kho').onchange = () => { apKho(true); tao(); };
$('tao').onclick = tao;
$('phong').onchange = $('hp').onchange = $('co').onchange = tao;
$('bai').onchange = doiBai;
$('dang').onchange = $('pv').onchange = $('sl').onchange = tao;
$('in').onclick = () => { $('dapan').hidden = true; $('dap').textContent = 'Xem đáp án'; window.print(); };
$('dap').onclick = () => { const h = $('dapan').hidden; $('dapan').hidden = !h; $('dap').textContent = h ? 'Ẩn đáp án' : 'Xem đáp án'; };
{ const co = ['HP001 4 hàng', 'HP001 5 hàng', 'HP001 4H', 'HP001 5H', 'HP001 4 hàng 2 ô ly', 'HP001 4 hang 1 ô ly', 'HP001 Tap Do'].filter(coFont);
  if (co.length) $('hp').innerHTML = co.map(x => '<option>' + x + '</option>').join(''); }
$('phong').value = coFont('VNI-Avo') ? 'vni' : 'times';
apKho(false); $('bai').value = '10'; doiBai();
</script>
