<style>

<script>
/* ============ DỮ LIỆU ============ */
const KHOA = 'skkn_codiep_v1';
const BUOC = ['Thông tin', 'Đề tài', 'Khung sáng kiến', 'Số liệu', 'Viết nội dung', 'Hình và ảnh', 'Kiểm tra', 'Xuất Word'];
const LOAI = { tieu_de: 'Tiêu đề phần', nhom: 'Tiêu đề mục', noi_dung: 'Nội dung', giai_phap: 'Giải pháp', bang_truoc: 'Bảng khảo sát đầu năm', bang_sosanh: 'Bảng so sánh trước sau', cam_doan: 'Lời cam đoan', tai_lieu: 'Tài liệu tham khảo' };
const TU_MOI_TRANG = 320;
let uid = 1;
let S = macDinh();
let IMG = {};          // ảnh: khóa -> dataURL (lưu IndexedDB)
let buoc = 0, mucChon = 0;

function macDinh() {
  return {
    info: { cap: 'Tiểu học', mon: '', lop: '', siso: 0, namhoc: '2026 - 2027', mucdich: 'Công nhận sáng kiến cấp cơ sở', vande: '', boicanh: '', sonam: '', chuyenthat: '', tacgia: '', chucvu: 'Giáo viên', truong: '', coquan: '', diadanh: '', thangnam: '' },
    detai: '', sogp: 3, gp: ['', '', '', ''],
    mau: 'mau3', khung: [],
    solieu: { muc: ['Đạt yêu cầu', 'Chưa đạt yêu cầu'], nguon: 'Quan sát, phiếu khảo sát, sản phẩm học sinh', tc: [] },
    doichieu: [],
    anh: {}
  };
}
function luu() { try { localStorage.setItem(KHOA, JSON.stringify(S)); } catch (e) {} }
function tai() { try { const t = localStorage.getItem(KHOA); if (t) S = Object.assign(macDinh(), JSON.parse(t)); } catch (e) {} uid = 1 + Math.max(0, ...S.khung.map(k => k.id || 0)); }

/* ảnh trong IndexedDB */
function idb() { return new Promise((ok, no) => { const r = indexedDB.open('skkn_anh', 1); r.onupgradeneeded = () => r.result.createObjectStore('a'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function idbPut(k, v) { try { const d = await idb(); d.transaction('a', 'readwrite').objectStore('a').put(v, k); } catch (e) {} }
async function idbDel(k) { try { const d = await idb(); d.transaction('a', 'readwrite').objectStore('a').delete(k); } catch (e) {} }
async function idbTatCa() { try { const d = await idb(); return await new Promise(ok => { const o = {}; const c = d.transaction('a').objectStore('a').openCursor(); c.onsuccess = () => { const x = c.result; if (x) { o[x.key] = x.value; x.continue(); } else ok(o); }; c.onerror = () => ok(o); }); } catch (e) { return {}; } }

/* ============ TIỆN ÍCH ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const san = t => String(t || '').replace(/[—–]/g, '-');
function bao(t) { const e = $('toast'); e.textContent = t; e.classList.add('hien'); clearTimeout(bao.t); bao.t = setTimeout(() => e.classList.remove('hien'), 2200); }
function chep(t) {
  const xong = () => bao('Đã chép. Dán vào ChatGPT hoặc Gemini nhé.');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(xong, () => dự(t)); else dự(t);
  function dự(t) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); xong(); } catch (e) { bao('Không chép được, hãy bôi đen rồi Ctrl+C'); } a.remove(); }
}
function datPath(o, p, v) { const k = p.split('.'); for (let i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = v; }
function pct(n, tong) { if (!tong) return '0%'; const v = Math.round(n * 1000 / tong) / 10; const s = String(v).replace('.', ','); return s + '%'; }
function pnum(n, tong) { return tong ? Math.round(n * 1000 / tong) / 10 : 0; }
function soTu(t) { return (String(t || '').trim().match(/\S+/g) || []).length; }
function coNhap(v) { return v !== null && v !== undefined && v !== '' && !isNaN(v); }

/* ============ KHUNG MẪU ============ */
function dong(cap, ten, loai, trang) { return { id: uid++, cap, ten, loai, trang, text: '', chuyen: '' }; }
function dungKhung(kieu) {
  const gp = [];
  for (let i = 0; i < S.sogp; i++) gp.push(dong(2, `2.${i + 1}. Giải pháp ${i + 1}: ${S.gp[i] || '[cần bổ sung: tên giải pháp]'}`, 'giai_phap', 2.5));
  let k;
  if (kieu === 'mauMD') {
    k = [dong(1, 'PHẦN I. MỞ ĐẦU', 'tieu_de', 0), dong(1, '1. Lý do chọn đề tài', 'noi_dung', 1.5), dong(1, '2. Mục đích nghiên cứu', 'noi_dung', 0.7), dong(1, '3. Đối tượng và phạm vi nghiên cứu', 'noi_dung', 0.7), dong(1, '4. Phương pháp nghiên cứu', 'noi_dung', 0.7),
      dong(1, 'PHẦN II. NỘI DUNG', 'tieu_de', 0), dong(1, '1. Cơ sở lý luận', 'noi_dung', 1.5), dong(1, '2. Cơ sở thực tiễn và khảo sát đầu năm', 'bang_truoc', 1), dong(1, '3. Các giải pháp thực hiện', 'nhom', 0), ...gp, dong(1, '4. Hiệu quả sau khi áp dụng', 'bang_sosanh', 1),
      dong(1, 'PHẦN III. KẾT LUẬN VÀ KIẾN NGHỊ', 'tieu_de', 0), dong(1, '1. Kết luận', 'noi_dung', 0.6), dong(1, '2. Kiến nghị', 'noi_dung', 0.6),
      dong(1, 'LỜI CAM ĐOAN VÀ XÁC NHẬN', 'cam_doan', 0), dong(1, 'TÀI LIỆU THAM KHẢO', 'tai_lieu', 0)];
  } else {
    k = [dong(1, 'PHẦN I. ĐẶT VẤN ĐỀ', 'tieu_de', 0), dong(1, '1. Tính cấp thiết phải tiến hành sáng kiến', 'noi_dung', 1.5), dong(1, '2. Mục đích của đề tài', 'noi_dung', 0.7),
      dong(1, '3. Thời gian, đối tượng, phạm vi nghiên cứu', 'nhom', 0), dong(2, '3.1. Thời gian nghiên cứu', 'noi_dung', 0.4), dong(2, '3.2. Đối tượng nghiên cứu', 'noi_dung', 0.4), dong(2, '3.3. Phạm vi nghiên cứu', 'noi_dung', 0.4),
      dong(1, 'PHẦN II. NỘI DUNG SÁNG KIẾN', 'tieu_de', 0), dong(1, '1. Hiện trạng của vấn đề', 'nhom', 0), dong(2, '1.1. Thuận lợi', 'noi_dung', 0.6), dong(2, '1.2. Khó khăn', 'noi_dung', 0.7), dong(2, '1.3. Khảo sát đầu năm', 'bang_truoc', 0.5),
      dong(1, '2. Các biện pháp thực hiện', 'nhom', 0), ...gp,
      dong(1, '3. Kết quả sau khi áp dụng', 'bang_sosanh', 1), dong(1, '4. Hiệu quả áp dụng của sáng kiến', 'nhom', 0), dong(2, '4.1. Hiệu quả về khoa học', 'noi_dung', 0.6), dong(2, '4.2. Hiệu quả về kinh tế', 'noi_dung', 0.4), dong(2, '4.3. Hiệu quả về xã hội', 'noi_dung', 0.5),
      dong(1, '5. Tính khả thi và khả năng nhân rộng', 'noi_dung', 0.5),
      dong(1, 'PHẦN III. KIẾN NGHỊ VÀ ĐỀ XUẤT', 'tieu_de', 0), dong(1, '1. Kiến nghị và đề xuất', 'noi_dung', 0.6), dong(1, 'LỜI CAM ĐOAN VÀ XÁC NHẬN', 'cam_doan', 0), dong(1, 'TÀI LIỆU THAM KHẢO', 'tai_lieu', 0)];
  }
  return k;
}
function phanTichMau(text) {
  const ds = text.split('\n').map(x => x.trim()).filter(Boolean).map(t => {
    let cap = 1, loai = 'noi_dung', trang = 0.8;
    if (/^(PHẦN|CHƯƠNG|[IVX]+[.)])\s/i.test(t)) { loai = 'tieu_de'; trang = 0; }
    else if (/^\d+\.\d+/.test(t)) cap = 2;
    if (/cam đoan/i.test(t)) { loai = 'cam_doan'; trang = 0; }
    else if (/tài liệu tham khảo/i.test(t)) { loai = 'tai_lieu'; trang = 0; }
    else if (/giải pháp|biện pháp/i.test(t) && cap === 2) { loai = 'giai_phap'; trang = 2.5; }
    else if (/khảo sát đầu năm|thực trạng/i.test(t) && /\d/.test(t[0])) loai = 'bang_truoc';
    else if (/so sánh|kết quả sau/i.test(t)) loai = 'bang_sosanh';
    return dong(cap, t, loai, trang);
  });
  ds.forEach((d, i) => { if (d.loai === 'noi_dung' && d.cap === 1 && ds[i + 1] && ds[i + 1].cap === 2) { d.loai = 'nhom'; d.trang = 0; } });
  return ds;
}

/* ============ CÂU LỆNH CHO AI ============ */
const LUAT = `Quy tắc viết:
- Viết ngôi thứ nhất (tôi), giọng giáo viên đứng lớp, đời thường, câu ngắn đến vừa, có chi tiết cụ thể của lớp.
- Tuyệt đối KHÔNG bịa số liệu, tên người, tên trường, tên sách, ngày tháng. Chỗ nào chưa có dữ kiện thì ghi đúng dạng [cần bổ sung: ...].
- Không ghi họ tên học sinh.
- Không dùng gạch dài (— hoặc –), không dùng các cụm sáo rỗng như "góp phần quan trọng", "trong bối cảnh", "hành trình", "đóng vai trò then chốt", "không chỉ... mà còn".
- Không viết lại tiêu đề, chỉ viết phần nội dung. Không dùng ký hiệu markdown (#, **).`;
function nguCanh() {
  const i = S.info;
  return `THÔNG TIN THẬT CỦA GIÁO VIÊN:
- Cấp học: ${i.cap}. Môn/lĩnh vực: ${i.mon || '[chưa nhập]'}. Lớp: ${i.lop || '[chưa nhập]'}. Sĩ số: ${i.siso || '[chưa nhập]'}. Năm học: ${i.namhoc}.
- Số năm đứng lớp: ${i.sonam || '[chưa nhập]'}.
- Vấn đề đang gặp ở lớp: ${i.vande || '[chưa nhập]'}
- Bối cảnh, điều kiện dạy học: ${i.boicanh || '[chưa nhập]'}
- Chuyện thật, cách làm riêng của giáo viên: ${i.chuyenthat || '[chưa nhập]'}
- Đề tài sáng kiến: ${S.detai || '[chưa chọn]'}`;
}
function textSoLieu() {
  const si = S.info.siso, [m1, m2] = S.solieu.muc;
  return S.solieu.tc.filter(t => t.ten).map((t, i) => {
    let s = `${i + 1}. ${t.ten}: đầu năm ${m1} ${t.t[0] ?? '?'} em (${coNhap(t.t[0]) ? pct(t.t[0], si) : '?'}), ${m2} ${t.t[1] ?? '?'} em (${coNhap(t.t[1]) ? pct(t.t[1], si) : '?'})`;
    if (coNhap(t.s[0])) s += `; cuối năm ${m1} ${t.s[0]} em (${pct(t.s[0], si)}), ${m2} ${t.s[1] ?? '?'} em (${coNhap(t.s[1]) ? pct(t.s[1], si) : '?'})`;
    return s;
  }).join('\n');
}
function khungText() { return S.khung.map(k => (k.cap === 2 ? '    ' : '') + k.ten).join('\n'); }
function lenhDeTai() {
  return `${nguCanh()}\n\nHãy gợi ý 5 đề tài sáng kiến kinh nghiệm bám sát đúng vấn đề thật ở trên, không chung chung, hợp chương trình GDPT 2018. Với mỗi đề tài ghi: tên đề tài; điểm nổi bật; hướng triển khai; minh chứng có thể thu được ở lớp; 3 giải pháp ngắn gọn. Không bịa số liệu.`;
}
function lenhGiaiPhap() {
  return `${nguCanh()}\n\nĐề tài đã chọn: ${S.detai}\nHãy đề xuất ${S.sogp} tên giải pháp (mỗi tên một dòng, ngắn gọn, làm được ở lớp thật, không trùng ý nhau). Chỉ trả lời danh sách tên.`;
}
function lenhMuc(m) {
  const trang = m.trang || 0.7, tu = Math.round(trang * TU_MOI_TRANG);
  let yc = `Hãy viết mục "${m.ten}" của sáng kiến. Độ dài khoảng ${tu} từ.`;

function tangGiam(t, si) { const d = Math.round((pnum(t.s[0], si) - pnum(t.t[0], si)) * 10) / 10; return (d >= 0 ? '+' : '') + String(d).replace('.', ',') + ' điểm %'; }
function vecot(cv, tieude, nhan, chuoi, mau, ten) {
  const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.fillStyle = '#000'; g.textAlign = 'center'; g.font = 'bold 34px Arial'; g.fillText(tieude, W / 2, 52);
  const x0 = 120, y0 = 110, x1 = W - 60, y1 = H - 250; g.font = '22px Arial';
  for (let v = 0; v <= 100; v += 20) { const y = y1 - (y1 - y0) * v / 100; g.strokeStyle = '#ddd'; g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke(); g.fillStyle = '#444'; g.textAlign = 'right'; g.fillText(v + '%', x0 - 12, y + 7); }
  const n = nhan.length, k = chuoi.length, slot = (x1 - x0) / n, bw = Math.min(70, slot / (k + 1.2));
  for (let i = 0; i < n; i++) {
    const cx = x0 + slot * (i + .5);
    for (let j = 0; j < k; j++) { const v = chuoi[j][i], bx = cx + (j - (k - 1) / 2) * (bw + 6), top = y1 - (y1 - y0) * v / 100; g.fillStyle = mau[j]; g.fillRect(bx - bw / 2, top, bw, y1 - top); g.fillStyle = '#000'; g.textAlign = 'center'; g.font = '20px Arial'; g.fillText(String(v).replace('.', ',') + '%', bx, top - 7); }
    let cur = '', dongs = []; nhan[i].split(' ').forEach(w => { if ((cur + ' ' + w).trim().length > 16) { dongs.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }); dongs.push(cur);

  }
  g.strokeStyle = '#000'; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, y1); g.lineTo(x1, y1); g.stroke(); g.lineWidth = 1;
