<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chiếc Nón Kì Diệu</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d3557;--red:#e63946;--yel:#ffd166;--grn:#2a9d4a;--blu:#1d7bd8;--soft:#5b6b80}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 12% 8%,#ffe0ec 0,transparent 35%),radial-gradient(circle at 90% 90%,#fff0c9 0,transparent 38%),linear-gradient(160deg,#d8efff,#fff6e0);
  background-attachment:fixed;display:flex;flex-direction:column;align-items:center;padding:14px 12px 70px;overflow-x:hidden}
.cloud{position:fixed;font-size:64px;opacity:.55;pointer-events:none;animation:drift 38s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
h1{font:800 clamp(34px,7vw,66px)/1 'Baloo 2';color:var(--red);text-align:center;text-shadow:3px 3px 0 #fff,5px 5px 0 rgba(29,53,87,.15);letter-spacing:1px}
.slogan{font:700 clamp(15px,2.6vw,22px) 'Baloo 2';color:#fff;background:linear-gradient(90deg,#ff5d8f,#ff9a3c);padding:4px 22px;border-radius:30px;margin:8px 0 12px;text-align:center}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:6px}
.chip{background:#fff;border-radius:18px;padding:6px 16px;font:700 20px 'Baloo 2';box-shadow:0 6px 14px rgba(29,53,87,.12)}
.chip b{color:var(--red)}
select{font:700 18px 'Be Vietnam Pro';padding:7px 12px;border-radius:14px;border:3px solid #fff;background:#fff;color:var(--ink);box-shadow:0 6px 14px rgba(29,53,87,.12)}
.stage{position:relative;width:min(86vw,440px);aspect-ratio:1;margin:8px auto 6px}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:44px solid var(--red);filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
#wheel{width:100%;height:100%;filter:drop-shadow(0 14px 18px rgba(29,53,87,.3))}
.hint{font:600 17px 'Be Vietnam Pro';color:var(--soft);text-align:center;min-height:26px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
button{font:800 clamp(18px,3.6vw,26px) 'Baloo 2';border:0;border-radius:40px;padding:10px 30px;cursor:pointer;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
button:disabled{opacity:.5;cursor:not-allowed}
.b-spin{background:linear-gradient(90deg,#ff5d8f,#ff9a3c);font-size:clamp(24px,5vw,36px);padding:12px 44px}
.b-blue{background:var(--blu)}.b-green{background:var(--grn)}.b-gray{background:#7a8aa0}
.sign{position:fixed;left:0;right:0;bottom:0;text-align:center;padding:10px;font:600 15px 'Be Vietnam Pro';color:var(--soft);background:rgba(255,255,255,.75)}
/* hộp câu hỏi */
.ov{position:fixed;inset:0;background:rgba(29,53,87,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.ov.on{display:flex}
.card{background:#fff;border-radius:28px;padding:22px 22px 18px;width:min(96vw,720px);max-height:94vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.tag{display:inline-block;background:var(--yel);color:var(--ink);font:800 22px 'Baloo 2';border-radius:20px;padding:2px 18px;margin-bottom:8px}
.q{font:700 clamp(22px,4.4vw,32px)/1.35 'Be Vietnam Pro';margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;font:700 clamp(18px,3.6vw,26px) 'Be Vietnam Pro';color:var(--ink);background:#eef6ff;border:4px solid #cfe3fa;border-radius:20px;padding:12px 14px;box-shadow:none}
.opt i{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blu);color:#fff;font:800 24px/44px 'Baloo 2';text-align:center;font-style:normal}
.opt.ok{background:#d9f5df;border-color:var(--grn)}.opt.ok i{background:var(--grn)}
.opt.no{background:#ffe1e1;border-color:var(--red);opacity:.75}.opt.no i{background:var(--red)}
.msg{font:800 clamp(24px,5vw,34px) 'Baloo 2';margin-top:12px;min-height:44px;text-align:center}
.msg.good{color:var(--grn)}.msg.bad{color:var(--red)}
.rowb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.res{text-align:center}
.res .big{font:800 72px/1 'Baloo 2';color:var(--red)}
.res .stars{font-size:46px;margin:6px 0}
.res p{font:600 20px 'Be Vietnam Pro';margin:4px 0}
.confetti{position:fixed;top:-20px;font-size:28px;z-index:20;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
</style></head><body>
<div class="cloud" style="top:6%;left:-100px">☁️</div><div class="cloud" style="top:38%;left:-100px;animation-delay:-16s;font-size:46px">☁️</div>

<h1>CHIẾC NÓN KÌ DIỆU</h1>
<div class="slogan">HỌC MÀ CHƠI, CHƠI MÀ HỌC</div>

<div class="bar">
  <button class="b-blue" id="bo" style="font-size:18px;padding:6px 18px" title="Chọn hoặc dán bộ câu hỏi">📚 Bộ câu hỏi</button>
  <div class="chip">Điểm: <b id="diem">0</b></div>
  <div class="chip">Câu: <b id="cau">0</b>/<span id="tong">10</span></div>
  <button class="b-blue" id="hd" style="font-size:18px;padding:6px 18px">❓ Hướng dẫn</button>
  <button class="b-gray" id="tat" style="font-size:18px;padding:6px 16px" title="Bật hoặc tắt âm thanh">🔊 Âm thanh</button>
</div>

<div class="stage">
  <div class="pointer"></div>
  <svg id="wheel" viewBox="-210 -210 420 420" aria-label="Chiếc nón kì diệu"></svg>
</div>
<div class="hint" id="hint">Bấm "QUAY NÓN" để bắt đầu!</div>
<div class="btns">
  <button class="b-spin" id="quay">QUAY NÓN</button>
  <button class="b-blue" id="xem">Xem điểm</button>
  <button class="b-green" id="lai">Chơi lại</button>
</div>

<div class="sign">Cô Hồng Điệp - TH Kim Đồng</div>

<!-- hộp câu hỏi -->
<div class="ov" id="ovq"><div class="card">
  <div class="tag" id="qtag"></div>
  <div class="q" id="qtext"></div>
  <div class="opts" id="opts"></div>
  <div class="msg" id="msg"></div>
  <div class="rowb"><button class="b-green" id="tiep" style="display:none">Câu hỏi tiếp theo ▶</button></div>
</div></div>

<!-- hộp điểm -->
<div class="ov" id="ovr"><div class="card res">
  <div class="tag">KẾT QUẢ</div>
  <div class="big" id="rdiem">0</div>
  <div class="stars" id="rsao"></div>
  <p id="rchu"></p>
  <div class="rowb" style="margin-top:14px">
    <button class="b-blue" id="dong">Tiếp tục chơi</button>
    <button class="b-green" id="lai2">Chơi lại</button>
  </div>
</div></div>

  /* ---- đọc và kiểm tra văn bản dán vào ---- */
  function phanTich(txt) {
    var cau = [], loi = [], cur = null, stt = 0;
    function xong() {
      if (!cur) return;
      stt++;
      var tom = cur.c.length > 36 ? cur.c.slice(0, 36) + '...' : cur.c;
      if (cur.a.length < 2) loi.push('Câu ' + stt + ' ("' + tom + '"): cần ít nhất 2 đáp án A, B.');
      else if (cur.a.length > 4) loi.push('Câu ' + stt + ' ("' + tom + '"): có ' + cur.a.length + ' đáp án, chỉ nhận tối đa 4 (A, B, C, D).');
      else if (cur.d >= cur.a.length) loi.push('Câu ' + stt + ' ("' + tom + '"): đáp án ghi là ' + 'ABCD'[cur.d] + ' nhưng câu chỉ có ' + cur.a.length + ' đáp án.');
      else if (cur.d < 0) loi.push('Câu ' + stt + ' ("' + tom + '"): chưa ghi đáp án đúng. Thêm dòng "Đáp án: B" hoặc gõ dấu * trước đáp án đúng.');
      else cau.push({ c: cur.c, a: cur.a, d: cur.d });
      cur = null;
    }
    var dong = String(txt || '').replace(/\r/g, '').replace(/ /g, ' ').split('\n');
    for (var i = 0; i < dong.length; i++) {
      var l = dong[i].trim(), m;
      if (!l) continue;
      if (cur && (m = l.match(/^(\*?)\s*\(?([A-Ha-h])\s*[.):\-]\s*(.+)$/))) {
        cur.a.push(m[3].trim());
        if (m[1]) cur.d = cur.a.length - 1;
        continue;
      }
      if (cur && (m = l.match(/^(?:đáp án|dap an|đ\/a|đ\.a|đa)\s*[:\-]\s*\(?([A-Ha-h])/i))) {
        cur.d = 'ABCDEFGH'.indexOf(m[1].toUpperCase());
        continue;
      }
      var q = l.replace(/^(câu|cau)\s*\d+\s*[:.)\-]?\s*/i, '').replace(/^\d+\s*[.):]\s*/, '');
      if (cur && cur.a.length === 0) { cur.c += ' ' + q; continue; }   // câu hỏi viết nhiều dòng
      xong();
      cur = { c: q, a: [], d: -1 };
    }
    xong();
    return { cau: cau, loi: loi };
  }

    var am_=(i*60+30-90)*Math.PI/180;
    var t=el("text",{x:125*Math.cos(am_),y:125*Math.sin(am_),"text-anchor":"middle","dominant-baseline":"central",
      "font-family":"Baloo 2, sans-serif","font-weight":800,"font-size":64,fill:"#fff",stroke:"rgba(0,0,0,.35)","stroke-width":4,"paint-order":"stroke",
      transform:"rotate("+(i*60+30)+" "+125*Math.cos(am_)+" "+125*Math.sin(am_)+")"},gRot);
    t.textContent=i+1;
  }
  for(var r=40;r<=190;r+=30) el("circle",{r:r,fill:"none",stroke:"rgba(120,70,20,.28)","stroke-width":3},gRot);  // vòng nan nón lá
  el("circle",{r:188,fill:"none",stroke:"#a9692a","stroke-width":8,"stroke-dasharray":"2 10"},gRot);
  el("circle",{r:30,fill:"#c9873a",stroke:"#fff","stroke-width":4},gRot);                                  // chóp nón
  el("text",{x:0,y:2,"text-anchor":"middle","dominant-baseline":"central","font-size":30},gRot).textContent="👒";
  setRot(0);
}
function setRot(d){rot=d;gRot.setAttribute("transform","rotate("+d+")")}

/* ---- âm thanh (tạo bằng trình duyệt, không cần file) ---- */
var AC=null;
function beep(f,dur,type,vol,when){
  if(!am)return; try{
    AC=BoCauHoi.ctx();
    var t0=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur);
  }catch(e){}
}
function nhacDung(){[523,659,784,1047].forEach(function(f,i){beep(f,.18,"triangle",.2,i*.1)})}
function nhacSai(){beep(200,.25,"sawtooth",.15,0);beep(150,.35,"sawtooth",.15,.2)}
function nhacXong(){[523,659,784,659,784,1047].forEach(function(f,i){beep(f,.2,"triangle",.2,i*.12)})}

/* ---- trộn ngẫu nhiên ---- */
function tron(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---- ván mới: nhận danh sách câu từ khung "Bộ câu hỏi" ---- */
var tenBo="",dsGoc=[],gGiay=0,hetGio=false;
function vanMoi(dsCau,ten,giay){
  if(ten)tenBo=ten;
  if(dsCau)dsGoc=dsCau;
  if(giay!=null)gGiay=giay;
  hetGio=false;
  BoCauHoi.gio.chuan(gGiay,khiHetGio);          // hiện đồng hồ, chạy từ lần QUAY NÓN đầu tiên
  ds=(dsCau||[]).map(function(q,i){
    var dapan=q.a.map(function(t,k){return{t:t,dung:k===q.d}});
    return{o:(i%6)+1,c:q.c,a:tron(dapan),xong:false};           // chia đều các số 1-6 cho các câu
  });
  soCau=0;diem=0;dung=0;cur=null;ketThuc=false;
  $("diem").textContent=0;$("cau").textContent=0;$("tong").textContent=ds.length;
  $("hint").textContent=ds.length?(tenBo+(gGiay?' ('+(gGiay/60)+' phút): bấm "QUAY NÓN", đồng hồ chạy từ lần quay đầu!':': bấm "QUAY NÓN" để bắt đầu!')):'Bấm "Bộ câu hỏi" để chọn câu hỏi.';
  $("quay").disabled=!ds.length;
}
function chonBo(thoat){
  BoCauHoi.mo({coThoat:thoat,thoiGian:true,huongDan:BoCauHoi.HD.non,khiChon:function(dsCau,ten,giay){vanMoi(dsCau,ten,giay)}});
}

/* ---- quay nón ---- */
function quay(){
  if(spinning||ketThuc)return;
  var con=ds.filter(function(q){return!q.xong});
  if(!con.length){hienKetQua();return}
  BoCauHoi.gio.bat();
  spinning=true;$("quay").disabled=true;$("hint").textContent="Nón đang quay...";
  var kq=Math.floor(Math.random()*6);                       // ô số ngẫu nhiên: 0..5 ~ số 1..6
  var dich=rot+360*(4+Math.floor(Math.random()*3))+((360-(kq*60+30))-(rot%360)+360)%360+(Math.random()*30-15);
  var t0=performance.now(),D=4200,d0=rot,lastTick=Math.floor(d0/60);
  function buoc(now){
    var p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3.2),d=d0+(dich-d0)*e;
    setRot(d);
    var tk=Math.floor(d/60);if(tk!==lastTick){lastTick=tk;beep(700+Math.random()*120,.05,"square",.06)}
    if(ketThuc){spinning=false;return}
    if(p<1)requestAnimationFrame(buoc);else{rot=dich;spinning=false;lamCau(kq+1)}
  }
  requestAnimationFrame(buoc);
}

/* ---- chọn câu theo số trên nón ---- */
function lamCau(so){
  var con=ds.filter(function(q){return!q.xong});
  var nhom=con.filter(function(q){return q.o===so});
  var chon=nhom.length?nhom:con;           // hết câu của số này thì lấy câu còn lại
  cur=chon[Math.floor(Math.random()*chon.length)];
  lanTL=0;soCau++;$("cau").textContent=soCau;
  $("hint").textContent="Nón dừng ở số "+so+"!";
  beep(880,.12,"triangle",.18);
  $("qtag").textContent="Số "+so;
  $("qtext").textContent=cur.c;
  $("msg").textContent="";$("msg").className="msg";$("tiep").style.display="none";
  var h=$("opts");h.innerHTML="";
  cur.a.forEach(function(o,i){
    var b=document.createElement("button");b.className="opt";b.type="button";
    b.innerHTML="<i>"+"ABCD"[i]+"</i><span></span>";b.lastChild.textContent=o.t;
    b.onclick=function(){traLoi(i,b)};h.appendChild(b);
  });
  $("ovq").classList.add("on");
}

/* ---- trả lời ---- */
function traLoi(i,btn){
  if(cur.xong)return;
  var o=cur.a[i];
  if(o.dung){
    var d=lanTL===0?DIEM_DUNG:DIEM_LAN_2;diem+=d;dung++;cur.xong=true;
    btn.classList.add("ok");$("diem").textContent=diem;
    $("msg").textContent="Chính xác! +"+d+" điểm";$("msg").className="msg good";
    nhacDung();phao();khoa();hienTiep();
  }else{
    lanTL++;btn.classList.add("no");btn.disabled=true;nhacSai();
    if(lanTL>=2){                                             // sai 2 lần: hiện đáp án đúng
      cur.xong=true;
      [].forEach.call($("opts").children,function(b,k){if(cur.a[k].dung)b.classList.add("ok")});
      $("msg").textContent="Chưa chính xác. Đáp án đúng đã được tô xanh.";$("msg").className="msg bad";
      khoa();hienTiep();
    }else{
      $("msg").textContent="Chưa chính xác, hãy thử lại!";$("msg").className="msg bad";
    }
  }
}
function khoa(){[].forEach.call($("opts").children,function(b){b.disabled=true})}
function hienTiep(){
  var het=ds.every(function(q){return q.xong});
  var b=$("tiep");b.style.display="";b.textContent=het?"Xem kết quả ▶":"Câu hỏi tiếp theo ▶";
}
function tiepTheo(){
  $("ovq").classList.remove("on");
  if(ds.every(function(q){return q.xong})){ketThuc=true;hienKetQua();return}
  $("quay").disabled=false;$("hint").textContent='Bấm "QUAY NÓN" để quay tiếp!';
}

/* ---- kết quả ---- */
function hienKetQua(){
  var tong=ds.length*DIEM_DUNG,pt=tong?diem/tong:0;
  $("rdiem").textContent=diem+" điểm";
  var sao=pt>=.9?3:pt>=.6?2:pt>0?1:0;
  $("rsao").textContent=("⭐".repeat(sao)+"☆".repeat(3-sao));
  $("rchu").textContent="Trả lời đúng "+dung+"/"+ds.length+" câu"+(soCau<ds.length?" (mới chơi "+soCau+" câu)":"")+". "+
    (pt>=.9?"Giỏi quá, xuất sắc!":pt>=.6?"Khá lắm, cố gắng thêm nhé!":"Cố lên, chơi lại để đạt điểm cao hơn nhé!");
  $("dong").style.display=ketThuc?"none":"";
  document.querySelector("#ovr .tag").textContent=hetGio?"⏰ HẾT GIỜ":"KẾT QUẢ";
  $("ovr").classList.add("on");
  if(ketThuc){BoCauHoi.gio.huy();nhacXong();phao()}
}
function phao(){
  var e=["🎉","⭐","🎈","🌟","🎊"];
  for(var i=0;i<22;i++){var s=document.createElement("div");s.className="confetti";s.textContent=e[i%5];
    s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.6+"s";s.style.fontSize=(20+Math.random()*20)+"px";
    document.body.appendChild(s);setTimeout(function(x){x.remove()},3200,s)}
}

$("quay").onclick=quay;
$("tiep").onclick=tiepTheo;
$("xem").onclick=hienKetQua;
$("dong").onclick=function(){$("ovr").classList.remove("on")};
function choiLai(){$("ovq").classList.remove("on");$("ovr").classList.remove("on");vanMoi(dsGoc,tenBo,gGiay)}
/* HẾT GIỜ: dừng ngay, đóng câu hỏi đang mở, chốt điểm */
function khiHetGio(){
  if(ketThuc)return;
  hetGio=true;ketThuc=true;
  $("ovq").classList.remove("on");
  $("quay").disabled=true;
  $("hint").textContent="Hết giờ!";
  hienKetQua();
}
$("lai").onclick=choiLai;$("lai2").onclick=choiLai;
$("hd").onclick=function(){BoCauHoi.huongDan(BoCauHoi.HD.non)};
$("bo").onclick=function(){$("ovq").classList.remove("on");$("ovr").classList.remove("on");chonBo(true)};
$("tat").onclick=function(){am=!am;this.textContent=am?"🔊 Âm thanh":"🔇 Đã tắt";if(am)nhacDung()};   // bật lại thì kêu thử một tiếng

veNon();vanMoi([],"");chonBo(false);
</script></body></html>
