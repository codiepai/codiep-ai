<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mèo con hái táo - Khởi động Bài 42</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Trò khởi động chiếu tivi, nhân vật theo vần mới ao, eo: chú mèo, quả táo, ngôi sao, cái kẹo.
     Mỗi quả táo trên cây là một câu ôn. Đúng thì mèo chạy tới, táo rơi vào giỏ.
     Đủ táo thì ngôi sao trên ngọn cây sáng, bấm vào: cả lớp đếm, mưa kẹo rơi, hé lộ bài mới. */
  [hidden] { display: none !important; }
  :root {
    --u: min(1vh, 1.6vw);
    --chu: #12304a;
    --xanh: #0b5cab;
    --do: #e03131;
    --la: #2f9e44;
    --la-dam: #1e6b2e;
    --cam: #f08c00;
    --cam-dam: #b86200;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu);
    background: linear-gradient(#d0ebff, #fff4e6 60%, #ebfbee);
    display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--u) * 1.4) 16px; gap: calc(var(--u) * .8);
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden;
  }
  button { font-family: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible, .qua:focus-visible, #sao:focus-visible { outline: 5px solid var(--xanh); outline-offset: 4px; }
  h1 { font-size: max(28px, calc(var(--u) * 7.5)); line-height: 1; color: var(--do); text-shadow: 0 4px 0 #fff; }
  .goi-y { font-size: max(18px, calc(var(--u) * 3.6)); color: var(--xanh); text-align: center; min-height: 1.3em; }

  .vuon { position: relative; flex: 1; min-height: 0; width: 100%; }
  .vuon > svg { width: 100%; height: 100%; display: block; }
  .vuon text { font-family: var(--font); font-weight: 800; }
  .qua { cursor: pointer; outline: none; }
  .qua .nhun { animation: nhun 2.4s ease-in-out infinite; }
  @keyframes nhun { 50% { transform: translateY(-8px); } }
  #sao { outline: none; }
  #sao.mo-duoc { cursor: pointer; }
  .vong-sang { animation: sang 1.1s ease-in-out infinite; }
  @keyframes sang { 50% { stroke-opacity: .2; stroke-width: 6; } }
  .may { animation: may 45s linear infinite; }
  @keyframes may { from { transform: translateX(-300px); } to { transform: translateX(1900px); } }
  .buom { animation: buom 14s ease-in-out infinite; }
  @keyframes buom { 0%,100% { transform: translate(0,0); } 25% { transform: translate(160px,-60px); } 50% { transform: translate(300px,10px); } 75% { transform: translate(140px,50px); } }
  .canh-buom { animation: dap .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes dap { to { transform: scaleX(.3); } }
  .lac-cay { animation: lac-cay .6s ease-in-out 2; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes lac-cay { 25% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); } }
  .lac-dau { animation: lac-dau .5s ease-in-out; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes lac-dau { 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }

  .hang-duoi { display: flex; gap: 14px; align-items: center; }
  .nut-nho { font-size: max(15px, calc(var(--u) * 2.6)); padding: 4px 18px; border-radius: 30px; border: 3px solid var(--xanh); background: #fff; color: var(--xanh); }

  .man { position: fixed; inset: 0; background: rgba(18, 48, 74, .82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .the-hoi {
    width: min(100%, 1100px); max-height: 100%; overflow-y: auto;
    background: #fff; border-radius: calc(var(--u) * 4); border: 8px solid var(--mau, var(--do));
    padding: calc(var(--u) * 3) calc(var(--u) * 4);
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.5); text-align: center;
    animation: bung .45s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes bung { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .so-qua { font-size: max(18px, calc(var(--u) * 3.4)); color: #fff; background: var(--mau, var(--do)); border-radius: 30px; padding: 2px 22px; }
  .cau { font-size: max(28px, calc(var(--u) * 6.5)); line-height: 1.2; text-wrap: balance; }
  .hinh { font-family: var(--emoji); font-size: max(80px, calc(var(--u) * 20)); line-height: 1; }
  .tu { font-size: max(52px, calc(var(--u) * 15)); line-height: 1.15; white-space: pre; }
  .tu .o { display: inline-block; min-width: 1.2em; border: 6px dashed var(--do); border-radius: 18px; color: var(--do); padding: 0 .15em; }
  .tu .o.xong { border-style: solid; border-color: var(--la); color: var(--la); background: #d3f9d8; }
  .doc { font-size: max(40px, calc(var(--u) * 10)); line-height: 1.25; color: var(--xanh); text-wrap: balance; }
  .chon { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 3); }
  .chon button {
    min-width: max(90px, calc(var(--u) * 20)); padding: calc(var(--u) * 1) calc(var(--u) * 4);
    font-size: max(40px, calc(var(--u) * 11)); line-height: 1.1;
    color: #fff; background: var(--cam); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--cam-dam);
  }
  .chon button:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--cam-dam); }
  .chon button.sai { background: #b9c2cc; box-shadow: 0 8px 0 #8a949e; animation: lac .4s; }
  .chon button.dung, .chon button.doc-xong { background: var(--la); box-shadow: 0 8px 0 var(--la-dam); }
  .chon button.doc-xong { font-size: max(26px, calc(var(--u) * 6)); }
  @keyframes lac { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .loi { min-height: 1.2em; font-size: max(24px, calc(var(--u) * 5.5)); }
  .loi.sai { color: #e8590c; }
  .loi.dung { color: var(--la); }

  .nut-lon { font-size: max(26px, calc(var(--u) * 6)); padding: calc(var(--u) * .6) calc(var(--u) * 6); color: #fff; background: var(--la); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--la-dam); }
  .so-dem { font-size: max(80px, calc(var(--u) * 24)); color: var(--cam); line-height: 1; animation: nay .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes nay { from { transform: translateY(60px) scale(0); } to { transform: none; } }
  .bai-moi { font-size: max(26px, calc(var(--u) * 5.6)); color: var(--xanh); }
  .am-moi { display: flex; gap: calc(var(--u) * 6); justify-content: center; flex-wrap: wrap; }
  .am-moi > div { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1); }
  .am-moi .chu-to { font-size: max(60px, calc(var(--u) * 15)); line-height: 1; color: var(--do); }
  .am-moi .vd-hang { display: flex; gap: calc(var(--u) * 3); }
  .am-moi .vd { font-size: max(22px, calc(var(--u) * 4.4)); display: flex; flex-direction: column; align-items: center; line-height: 1.1; animation: nay .6s cubic-bezier(.3,1.6,.5,1) backwards; }
  .am-moi .vd span { font-family: var(--emoji); font-size: 1.9em; }
  .am-moi .vd b { color: var(--do); }

  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
  #phao i { position: absolute; top: -20px; width: 14px; height: 20px; border-radius: 3px; animation: roi linear forwards; }
  #phao span { position: absolute; top: -80px; font-family: var(--emoji); line-height: 1; animation: roi linear forwards; }
  @keyframes roi { to { transform: translateY(115vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) {
    .the-hoi, .so-dem, .am-moi .vd, .may, .buom, .canh-buom, .qua .nhun, .vong-sang, .lac-cay, .lac-dau { animation: none !important; }
    #phao { display: none; }
  }
</style>
</head>
<body>
<h1>Mèo con hái táo</h1>
<div class="goi-y" id="goi-y">Mời bạn chọn một quả trên cây nhé!</div>
<div class="vuon">
  <svg viewBox="0 0 1600 820" preserveAspectRatio="xMidYMid meet">
    <!-- mặt trời, mây, đồi -->
    <circle cx="1450" cy="95" r="60" fill="#ffd43b" stroke="#f59f00" stroke-width="6"/>
    <g class="may"><g fill="#fff"><ellipse cx="0" cy="90" rx="80" ry="30"/><ellipse cx="50" cy="70" rx="55" ry="35"/><ellipse cx="-45" cy="75" rx="40" ry="28"/></g></g>
    <g class="may" style="animation-delay:-25s"><g fill="#fff"><ellipse cx="0" cy="170" rx="65" ry="24"/><ellipse cx="35" cy="155" rx="42" ry="28"/></g></g>
    <path d="M0 640 Q300 560 650 630 T1600 600 V820 H0 Z" fill="#b2f2bb"/>
    <rect x="0" y="720" width="1600" height="100" fill="#69db7c"/>
    <path d="M0 720 H1600" stroke="#2b8a3e" stroke-width="6"/>
    <!-- hoa cỏ -->
    <g font-size="44" style="font-family:var(--emoji)"><text x="120" y="790">🌼</text><text x="320" y="800">🌷</text><text x="1000" y="795">🌼</text><text x="1480" y="800">🌷</text></g>
    <!-- bướm -->
    <g class="buom"><g transform="translate(1000 300)"><ellipse class="canh-buom" cx="-14" cy="0" rx="16" ry="22" fill="#f783ac" stroke="#12304a" stroke-width="3"/><ellipse class="canh-buom" cx="14" cy="0" rx="16" ry="22" fill="#f783ac" stroke="#12304a" stroke-width="3"/><rect x="-3" y="-18" width="6" height="36" rx="3" fill="#12304a"/></g></g>
    <!-- cây táo -->
    <g id="cay">
      <path d="M610 735 Q615 600 625 430 L680 430 Q690 600 700 735 Z" fill="#a9744f" stroke="#12304a" stroke-width="6" stroke-linejoin="round"/>
      <g fill="#40c057" stroke="#12304a" stroke-width="6">
        <circle cx="440" cy="360" r="140"/><circle cx="860" cy="360" r="140"/>
        <circle cx="560" cy="230" r="150"/><circle cx="760" cy="230" r="150"/>
        <circle cx="650" cy="390" r="170"/>
      </g>
      <g fill="#51cf66"><circle cx="440" cy="360" r="128"/><circle cx="860" cy="360" r="128"/><circle cx="560" cy="230" r="138"/><circle cx="760" cy="230" r="138"/><circle cx="650" cy="390" r="158"/></g>
      <g fill="#8ce99a" opacity=".7"><circle cx="520" cy="190" r="40"/><circle cx="800" cy="300" r="30"/><circle cx="400" cy="330" r="26"/></g>
    </g>
    <g id="sao"></g>
    <g id="cac-qua"></g>
    <g id="meo"></g>
    <g id="qua-roi"></g>
  </svg>
</div>
<div class="hang-duoi"><button class="nut-nho" id="choi-lai">Chơi lại từ đầu</button></div>

<div class="man" id="man" hidden><div class="the-hoi" id="the-hoi"></div></div>
<div id="phao"></div>

<script>
// ====== NỘI DUNG (cô sửa ở đây cho bài khác) ======
// Ôn bài 37-41 (em êm im um, ai ay ây, oi ôi ơi, ôn tập, ui ưi) trước Bài 42 ao eo.
// Câu hỏi chỉ dùng âm, vần đã học, KHÔNG dùng ao, eo. Nhân vật (mèo, táo, sao, kẹo) là tranh, chữ để dành cho màn cuối.
// Mỗi quả táo một câu, chọn quả nào cũng được (tối đa 6 câu):
//   chon: { hoi, hinh?, tu?: [trước, chữ cần điền, sau], dap, cacChon }  - bé chạm chọn đáp án
//   doc:  { hoi, doc }                                                     - cả lớp đọc to, cô bấm nút khi đọc đúng
const CAU = [
  { kieu: 'chon', hoi: 'Đây là con gì? Chọn vần đúng nhé!', hinh: '🦌', tu: ['con n', 'ai', ''], dap: 'ai', cacChon: ['ay', 'ai', 'ây'] },
  { kieu: 'chon', hoi: 'Tiếng nào có vần ây?', dap: 'mây', cacChon: ['mai', 'may', 'mây'] },
  { kieu: 'chon', hoi: 'Đây là cái gì? Chọn vần đúng nhé!', hinh: '👜', tu: ['cái t', 'úi', ''], dap: 'úi', cacChon: ['úi', 'ứi', 'ối'] },
  { kieu: 'chon', hoi: 'Đây là gì? Chọn vần đúng nhé!', hinh: '🍦', tu: ['que k', 'em', ''], dap: 'em', cacChon: ['im', 'êm', 'em'] },
  { kieu: 'doc', hoi: 'Cả lớp cùng đọc to nào!', doc: 'Bà gửi cho Hà túi quà.' }
];
// màn cuối: mỗi vần kèm các nhân vật trong game. [hình, chữ trước vần, vần, chữ sau]
const BAI_MOI = { ten: 'Bài 42: ao eo', am: [
  ['ao', [['🍎', 'quả t', 'áo', ''], ['⭐', 'ngôi s', 'ao', '']]],
  ['eo', [['🐱', 'chú m', 'èo', ''], ['🍬', 'cái k', 'ẹo', '']]]
] };
// ====================================================

const MAU_QUA = ['#e03131', '#1c7ed6', '#f08c00', '#ae3ec9', '#0ca678', '#f06595'];
const KHEN = ['Hoan hô!', 'Giỏi quá!', 'Tuyệt vời!', 'Xuất sắc!', 'Đúng rồi!'];
const VI_TRI = [[470, 300], [650, 190], [830, 330], [560, 470], [760, 480], [420, 450]];
const SAO = { x: 655, y: 70 };
const MEO_NHA = 1250, DAT = 735;
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
let daHai = [], meoX = MEO_NHA, banRon = false, amThanh = null;
const itDong = matchMedia('(prefers-reduced-motion: reduce)').matches;

function keu(dsTanSo, kieu = 'triangle', cach = 0.12) {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    if (amThanh.state === 'suspended') amThanh.resume();
    dsTanSo.forEach((f, i) => {
      const o = amThanh.createOscillator(), g = amThanh.createGain();
      const t = amThanh.currentTime + i * cach;
      o.frequency.value = f; o.type = kieu;
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.connect(g); g.connect(amThanh.destination);
      o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}
// tiếng "meo": cao lên rồi trượt xuống
function meo(buon) {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    if (amThanh.state === 'suspended') amThanh.resume();
    const o = amThanh.createOscillator(), g = amThanh.createGain(), t = amThanh.currentTime;
    o.type = 'sawtooth';
    const f = buon ? 420 : 600;
    o.frequency.setValueAtTime(f * .8, t); o.frequency.linearRampToValueAtTime(f * 1.3, t + .12); o.frequency.exponentialRampToValueAtTime(f * (buon ? .6 : .9), t + .45);
    const loc = amThanh.createBiquadFilter(); loc.type = 'lowpass'; loc.frequency.value = 1800;
    g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.3, t + .05); g.gain.exponentialRampToValueAtTime(0.001, t + .5);
    o.connect(loc); loc.connect(g); g.connect(amThanh.destination); o.start(t); o.stop(t + .52);
  } catch (e) {}
}

function taoHinh(cx, cy, r, mau) {
  return `<path d="M${cx} ${cy - r * .75} q4 -${r * .45} ${r * .18} -${r * .55}" stroke="#7a4e2d" stroke-width="${r * .14}" stroke-linecap="round" fill="none"/>
    <path d="M${cx + r * .1} ${cy - r * .95} q${r * .5} -${r * .35} ${r * .75} ${r * .05} q-${r * .45} ${r * .3} -${r * .75} -${r * .05} Z" fill="#40c057" stroke="#12304a" stroke-width="3"/>
    <path d="M${cx} ${cy - r * .7} c-${r * .9} -${r * .5} -${r * 1.3} ${r * .4} -${r * .8} ${r * 1.1} c${r * .25} ${r * .45} ${r * .6} ${r * .45} ${r * .8} ${r * .3} c${r * .2} ${r * .15} ${r * .55} ${r * .15} ${r * .8} -${r * .3} c${r * .5} -${r * .7} ${r * .1} -${r * 1.6} -${r * .8} -${r * 1.1} Z" fill="${mau}" stroke="#12304a" stroke-width="5"/>
    <ellipse cx="${cx - r * .38}" cy="${cy - r * .25}" rx="${r * .13}" ry="${r * .22}" fill="#fff" opacity=".7"/>`;
}

function veQua() {
  const g = $('cac-qua');
  g.textContent = '';
  CAU.forEach((_, i) => {
    if (daHai[i]) return;
    const [x, y] = VI_TRI[i];
    const q = document.createElementNS(NS, 'g');
    q.setAttribute('class', 'qua');
    q.setAttribute('role', 'button');
    q.setAttribute('tabindex', '0');
    q.setAttribute('aria-label', `Quả số ${i + 1}`);
    q.innerHTML = `<g class="nhun" style="animation-delay:${-i * .5}s">${taoHinh(x, y, 62, '#fa5252')}
      <circle cx="${x + 6}" cy="${y + 4}" r="27" fill="#fff" stroke="${MAU_QUA[i % MAU_QUA.length]}" stroke-width="5"/>
      <text x="${x + 6}" y="${y + 6}" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#12304a">${i + 1}</text></g>`;
    q.onclick = () => chamQua(i);
    q.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chamQua(i); } };
    g.appendChild(q);
  });
  veSao();
}

function veSao() {
  const du = daHai.every(Boolean), s = $('sao');
  s.setAttribute('class', du ? 'mo-duoc' : '');
  s.setAttribute('role', 'button');
  s.setAttribute('tabindex', du ? '0' : '-1');
  s.setAttribute('aria-label', du ? 'Ngôi sao trên ngọn cây, bấm được rồi' : 'Ngôi sao trên ngọn cây, còn tắt');
  const { x, y } = SAO, r = 62, ri = 26;
  let d = '';
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? ri : r;
    d += (k ? 'L' : 'M') + (x + rr * Math.cos(a)).toFixed(1) + ' ' + (y + rr * Math.sin(a)).toFixed(1) + ' ';
  }
  s.innerHTML = `${du ? `<circle class="vong-sang" cx="${x}" cy="${y}" r="82" fill="#fff3bf" fill-opacity=".6" stroke="#ffd43b" stroke-width="12"/>` : ''}
    <path d="${d}Z" fill="${du ? '#ffd43b' : '#dee2e6'}" stroke="${du ? '#e67700' : '#868e96'}" stroke-width="6" stroke-linejoin="round"/>
    ${du ? `<circle cx="${x - 13}" cy="${y - 2}" r="5" fill="#12304a"/><circle cx="${x + 13}" cy="${y - 2}" r="5" fill="#12304a"/>
            <path d="M${x - 10} ${y + 10} q10 9 20 0" fill="none" stroke="#12304a" stroke-width="4" stroke-linecap="round"/>`
         : `<text x="${x}" y="${y + 6}" font-size="30" text-anchor="middle" dominant-baseline="central" style="font-family:var(--emoji)">🔒</text>`}`;
  s.onclick = chamSao;
  s.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chamSao(); } };
}

// chú mèo vẽ tại gốc (0,0) = giữa chân, giỏ ở bên trái
function veMeo() {
  const soTao = daHai.filter(Boolean).length;
  let tao = '';
  for (let k = 0; k < soTao; k++) tao += `<circle cx="${-150 + (k % 3) * 28}" cy="${-62 - Math.floor(k / 3) * 22}" r="17" fill="#fa5252" stroke="#12304a" stroke-width="3"/>`;
  $('meo').innerHTML = `<g id="than-meo">
    <path d="M60 -30 q70 -10 55 -90 q-5 -20 -20 -10 q10 60 -45 70" fill="#ff922b" stroke="#12304a" stroke-width="5"/>
    <ellipse cx="0" cy="-45" rx="62" ry="50" fill="#ff922b" stroke="#12304a" stroke-width="5"/>
    <ellipse cx="0" cy="-35" rx="34" ry="30" fill="#ffe8cc"/>
    <ellipse cx="-30" cy="-4" rx="22" ry="12" fill="#ffe8cc" stroke="#12304a" stroke-width="5"/>
    <ellipse cx="30" cy="-4" rx="22" ry="12" fill="#ffe8cc" stroke="#12304a" stroke-width="5"/>
    <g id="dau-meo">
      <path d="M-55 -120 L-50 -185 L-12 -150 Z M55 -120 L50 -185 L12 -150 Z" fill="#ff922b" stroke="#12304a" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-46 -135 L-44 -168 L-24 -150 Z M46 -135 L44 -168 L24 -150 Z" fill="#ffa8a8"/>
      <circle cx="0" cy="-120" r="58" fill="#ff922b" stroke="#12304a" stroke-width="5"/>
      <path d="M-20 -170 q5 15 0 25 M0 -176 v28 M20 -170 q-5 15 0 25" stroke="#d9480f" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-22" cy="-122" rx="10" ry="14" fill="#12304a"/><ellipse cx="22" cy="-122" rx="10" ry="14" fill="#12304a"/>
      <circle cx="-19" cy="-127" r="4" fill="#fff"/><circle cx="25" cy="-127" r="4" fill="#fff"/>
      <path d="M-6 -104 h12 l-6 7 Z" fill="#f06595"/>
      <path d="M0 -97 q-8 10 -16 4 M0 -97 q8 10 16 4" stroke="#12304a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-30 -102 h-38 M-30 -95 l-36 8 M30 -102 h38 M30 -95 l36 8" stroke="#12304a" stroke-width="3"/>
      <circle cx="-38" cy="-108" r="8" fill="#ff8787" opacity=".6"/><circle cx="38" cy="-108" r="8" fill="#ff8787" opacity=".6"/>
    </g>
    ${tao}
    <path d="M-175 -60 h110 l-14 58 h-82 Z" fill="#d9a066" stroke="#12304a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-168 -40 h96 M-162 -20 h84" stroke="#a9744f" stroke-width="4"/>
    <path d="M-160 -60 q40 -60 80 0" fill="none" stroke="#a9744f" stroke-width="7"/>
    <path d="M-70 -45 q20 -5 35 5" stroke="#12304a" stroke-width="5" fill="#ff922b"/>
  </g>`;
  datMeo(meoX, 0);
}
function datMeo(x, nay) { $('meo').setAttribute('transform', `translate(${x} ${DAT - nay})`); }
const GIO = 120; // khoảng từ chân mèo tới giữa giỏ

function chay(den, xong) {
  const tu = meoX;
  if (itDong || Math.abs(den - tu) < 2) { meoX = den; datMeo(den, 0); xong(); return; }
  const t0 = performance.now(), lau = Math.min(1100, 300 + Math.abs(den - tu) * 1.2);
  const buoc = now => {
    const t = Math.min(1, (now - t0) / lau), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    meoX = tu + (den - tu) * e;
    datMeo(meoX, Math.abs(Math.sin(t * Math.PI * 6)) * 14);
    if (t < 1) requestAnimationFrame(buoc); else { datMeo(meoX, 0); xong(); }
  };
  requestAnimationFrame(buoc);
}

function roiQua(i, xong) {
  const [x, y] = VI_TRI[i], g = $('qua-roi');
  const dich = { x: meoX - GIO, y: DAT - 75 };
  g.innerHTML = taoHinh(0, 0, 62, '#fa5252');
  if (itDong) { g.textContent = ''; xong(); return; }
  const t0 = performance.now(), lau = 800;
  const buoc = now => {
    const t = Math.min(1, (now - t0) / lau), e = t * t;
    const s = 1 - .45 * t;
    g.setAttribute('transform', `translate(${x + (dich.x - x) * t} ${y + (dich.y - y) * e}) scale(${s}) rotate(${t * 200})`);
    if (t < 1) requestAnimationFrame(buoc); else { g.textContent = ''; g.removeAttribute('transform'); xong(); }
  };
  requestAnimationFrame(buoc);
}

function chamQua(i) {
  if (banRon || daHai[i]) return;
  moCau(i);
}

function moCau(i) {
  const c = CAU[i], mau = MAU_QUA[i % MAU_QUA.length], the = $('the-hoi');
  the.style.setProperty('--mau', mau);
  let h = `<div class="so-qua">Quả số ${i + 1}</div><div class="cau">${c.hoi}</div>`;
  if (c.hinh) h += `<div class="hinh">${c.hinh}</div>`;
  if (c.tu) h += `<div class="tu">${c.tu[0]}<span class="o" id="o">?</span>${c.tu[2]}</div>`;
  if (c.kieu === 'doc') h += `<div class="doc">${c.doc}</div>`;
  h += `<div class="chon" id="chon"></div><div class="loi" id="loi"></div>
    <button class="nut-nho" id="de-sau">Để bạn khác trả lời</button>`;
  the.innerHTML = h;
  $('de-sau').onclick = () => { $('man').hidden = true; };
  const chon = $('chon');
  if (c.kieu === 'doc') {
    const b = document.createElement('button');
    b.className = 'doc-xong'; b.textContent = 'Cả lớp đọc đúng rồi ✓';
    b.onclick = () => dung(i);
    chon.appendChild(b);
  } else {
    c.cacChon.forEach(v => {
      const b = document.createElement('button');
      b.textContent = v;
      b.onclick = () => {
        if (b.disabled || chon.dataset.xong) return;
        if (v === c.dap) {
          chon.dataset.xong = '1';
          b.classList.add('dung');
          if (c.tu) { $('o').textContent = c.dap; $('o').classList.add('xong'); }
          $('loi').className = 'loi dung'; $('loi').textContent = KHEN[i % KHEN.length];
          keu([523, 659, 784]);
          setTimeout(() => dung(i), 1000);
        } else {
          b.classList.add('sai'); b.disabled = true;
          $('loi').className = 'loi sai'; $('loi').textContent = 'Meo meo! Bạn thử lại nhé!';
          meo(true);
        }
      };
      chon.appendChild(b);
    });
  }
  $('man').hidden = false;
  keu([392, 523], 'sine');
}

// đúng: mèo chạy tới dưới quả, cây rung, quả rơi vào giỏ
function dung(i) {
  $('man').hidden = true;
  banRon = true;
  const den = Math.max(330, Math.min(1450, VI_TRI[i][0] + GIO));
  chay(den, () => {
    const cay = $('cay');
    cay.classList.remove('lac-cay'); void cay.getBBox(); cay.classList.add('lac-cay');
    daHai[i] = true;
    veQua(); daHai[i] = false; // vẽ lại cây không có quả này, giỏ chưa thêm
    roiQua(i, () => {
      daHai[i] = true;
      veMeo(); veSao();
      meo(false);
      keu([523, 659, 784, 1047], 'triangle', .1);
      phaoGiay(30);
      banRon = false;
      const conLai = daHai.filter(x => !x).length;
      $('goi-y').textContent = conLai
        ? `Giỏi quá! Còn ${conLai} quả trên cây. Mời bạn chọn quả tiếp theo nhé!`
        : 'Hái hết rồi! Ngôi sao trên ngọn cây sáng lên kìa. Bấm vào ngôi sao nhé!';
    });
  });
}

function chamSao() {
  if (banRon) return;
  if (!daHai.every(Boolean)) {
    keu([220, 196]);
    const d = $('dau-meo'); d.classList.remove('lac-dau'); void d.getBBox(); d.classList.add('lac-dau');
    $('goi-y').textContent = `Hái đủ ${CAU.length} quả thì ngôi sao mới sáng nhé!`;
    return;
  }
  demRoiMo();
}

function demRoiMo() {
  const the = $('the-hoi');
  the.style.setProperty('--mau', '#fab005');
  const so = ['Một...', 'Hai...', 'Ba...'];
  $('man').hidden = false;
  let k = 0;
  const buoc = () => {
    if (k < so.length) {
      the.innerHTML = `<div class="so-qua">Cả lớp cùng đếm nào!</div><div class="so-dem">${so[k]}</div>`;
      keu([392 + k * 131], 'sine'); k++; setTimeout(buoc, 1000);
    } else moBaiMoi();
  };
  buoc();
}

function moBaiMoi() {
  const the = $('the-hoi');
  the.style.setProperty('--mau', '#fab005');
  let n = 0;
  the.innerHTML = `<div class="so-qua">Mưa kẹo!</div>
    <div class="bai-moi">Hôm nay chúng mình học ${BAI_MOI.ten}</div>
    <div class="am-moi">${BAI_MOI.am.map(([chu, vd]) => `<div><div class="chu-to">${chu}</div>
      <div class="vd-hang">${vd.map(([hinh, truoc, van, sau]) => `<div class="vd" style="animation-delay:${.3 + (n++) * .35}s"><span>${hinh}</span><div>${truoc}<b>${van}</b>${sau}</div></div>`).join('')}</div></div>`).join('')}</div>
    <button class="nut-lon" id="dong">Vào bài mới!</button>`;
  $('dong').onclick = () => { $('man').hidden = true; };
  $('dong').focus();
  muaKeo(60);
  meo(false);
  keu([392, 523, 659, 784, 1047, 1319, 1568]);
  $('goi-y').textContent = 'Hoan hô cả lớp! Mèo con hái được cả giỏ táo!';
}

function phaoGiay(soLuong) {
  const p = $('phao');
  p.textContent = '';
  const mau = [...MAU_QUA, '#ffd43b'];
  for (let i = 0; i < soLuong; i++) {
    const g = document.createElement('i');
    g.style.left = Math.random() * 100 + 'vw';
    g.style.background = mau[i % mau.length];
    g.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    g.style.animationDelay = Math.random() * 1 + 's';
    p.appendChild(g);
  }
  setTimeout(() => { p.textContent = ''; }, 6500);
}
// mưa kẹo, táo, sao
function muaKeo(soLuong) {
  const p = $('phao');
  p.textContent = '';
  const hinh = ['🍬', '🍭', '🍬', '🍎', '⭐', '🍬'];
  for (let i = 0; i < soLuong; i++) {
    const s = document.createElement('span');
    s.textContent = hinh[i % hinh.length];
    s.style.left = Math.random() * 96 + 'vw';
    s.style.fontSize = (28 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2.8 + Math.random() * 2.5) + 's';
    s.style.animationDelay = Math.random() * 2 + 's';
    p.appendChild(s);
  }
  setTimeout(() => { p.textContent = ''; }, 8000);
}

function batDau() {
  daHai = CAU.map(() => false); meoX = MEO_NHA; banRon = false;
  $('man').hidden = true;
  $('qua-roi').textContent = '';
  veMeo(); veQua();
  $('goi-y').textContent = 'Mời bạn chọn một quả trên cây nhé!';
}
$('choi-lai').onclick = batDau;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('man').hidden && $('dong')) $('dong').click(); });
batDau();
</script>
</body>
