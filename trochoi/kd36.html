<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đoàn tàu về xóm - Khởi động Bài 36</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Trò khởi động chiếu tivi: đoàn tàu 5 toa ôn bài cũ + 1 toa bí mật hé lộ bài mới.
     Cô gọi bạn lên chọn toa, toa mở ra câu hỏi, trả lời đúng thì toa được chất hàng.
     Chất đủ 5 toa thì toa bí mật sáng lên; mở toa bí mật là tàu kéo còi chạy về xóm và hiện bài mới.
     Đổi bài: chỉ sửa khối NỘI DUNG đầu phần script. */
  :root {
    --u: min(1vh, 1.6vw);
    --chu: #12304a; --xanh: #0b5cab; --do: #e03131; --la: #2f9e44; --la-dam: #1e6b2e;
    --cam: #f08c00; --cam-dam: #b86200; --vang: #ffd43b;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu);
    background:
      radial-gradient(circle at 86% 12%, #fff3a3 0 4%, transparent 4.5%),
      linear-gradient(#bde0fe 0%, #e7f5ff 52%, #b2f2bb 52.2%, #69db7c 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--u) * 2) 16px; gap: calc(var(--u) * 1.5);
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    overflow: hidden;
  }
  button { font-family: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible { outline: 5px solid var(--xanh); outline-offset: 4px; }
  h1 { font-size: max(28px, calc(var(--u) * 8)); line-height: 1; color: var(--do); text-shadow: 0 4px 0 #fff, 0 7px 0 rgba(0,0,0,.08); }
  .goi-y { font-size: max(18px, calc(var(--u) * 3.6)); color: var(--xanh); background: rgba(255,255,255,.85); border-radius: 30px; padding: 0 20px; text-align: center; }

  /* xóm nhỏ phía xa */
  .xom { font-family: var(--emoji); font-size: max(30px, calc(var(--u) * 7)); letter-spacing: calc(var(--u) * 2); line-height: 1; opacity: .9; }

  /* đường ray + đoàn tàu */
  .san-ga { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; }
  .doan-tau { display: flex; align-items: flex-end; justify-content: center; gap: calc(var(--u) * .4); flex-wrap: wrap; row-gap: calc(var(--u) * 4); transition: transform 2.6s ease-in; }
  .doan-tau.chay { transform: translateX(120vw); }
  .ray { height: calc(var(--u) * 2.2); margin-top: -2px; background:
      linear-gradient(#6b4f2a, #6b4f2a) 0 0 / 100% 30% no-repeat,
      repeating-linear-gradient(90deg, #8d6e3f 0 calc(var(--u) * 1.6), transparent calc(var(--u) * 1.6) calc(var(--u) * 4.5)); }
  .toa { position: relative; background: none; border: none; padding: 0; display: flex; flex-direction: column; align-items: center; }
  .toa svg { width: max(80px, calc(var(--u) * 19)); height: auto; overflow: visible; display: block; }
  .dau-may svg { width: max(92px, calc(var(--u) * 22)); }
  .toa text { font-family: var(--font); font-weight: 800; }
  .toa .hang-hoa { font-family: var(--emoji); }
  .toa:not(.da-mo):not(.khoa):not(.dau-may) svg { animation: nhun 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * .25s); }
  @keyframes nhun { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .toa:not(.da-mo):not(.khoa):not(.dau-may):hover svg { transform: scale(1.06); }
  .toa.khoa { cursor: not-allowed; }
  .toa.khoa svg { filter: grayscale(.8) opacity(.6); }
  .toa.bi-mat.mo-duoc svg { animation: sang 1.2s ease-in-out infinite; }
  @keyframes sang { 0%, 100% { filter: drop-shadow(0 0 0 #ffd43b); } 50% { filter: drop-shadow(0 0 22px #ffd43b); } }
  .dau-may { cursor: default; }
  .khoi { position: absolute; left: 22%; top: -8%; width: 30%; pointer-events: none; }
  .khoi i { position: absolute; left: 0; bottom: 0; width: calc(var(--u) * 4); height: calc(var(--u) * 4); border-radius: 50%; background: rgba(255,255,255,.9); animation: khoi 2.4s ease-out infinite; opacity: 0; }
  .khoi i:nth-child(2) { animation-delay: .8s; } .khoi i:nth-child(3) { animation-delay: 1.6s; }
  @keyframes khoi { 0% { transform: translate(0, 0) scale(.4); opacity: .9; } 100% { transform: translate(calc(var(--u) * -6), calc(var(--u) * -10)) scale(1.8); opacity: 0; } }

  .hang-duoi { display: flex; gap: 14px; }
  .nut-nho { font-size: max(15px, calc(var(--u) * 2.6)); padding: 4px 18px; border-radius: 30px; border: 3px solid var(--xanh); background: #fff; color: var(--xanh); }

  /* cửa sổ câu hỏi */
  .man { position: fixed; inset: 0; background: rgba(18, 48, 74, .82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .the-hoi {
    width: min(100%, 1100px); max-height: 100%; overflow-y: auto;
    background: #fff; border-radius: calc(var(--u) * 4); border: 8px solid var(--mau, var(--cam));
    padding: calc(var(--u) * 3) calc(var(--u) * 4);
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.5); text-align: center;
    animation: bung .45s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes bung { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .so-toa { font-size: max(18px, calc(var(--u) * 3.4)); color: #fff; background: var(--mau, var(--cam)); border-radius: 30px; padding: 2px 22px; }
  .cau { font-size: max(28px, calc(var(--u) * 6.5)); line-height: 1.2; text-wrap: balance; }
  .hinh { font-family: var(--emoji); font-size: max(70px, calc(var(--u) * 15)); line-height: 1; }
  .tu { font-size: max(52px, calc(var(--u) * 15)); line-height: 1.15; white-space: pre; }
  .tu .o { display: inline-block; min-width: 1.2em; border: 6px dashed var(--do); border-radius: 18px; color: var(--do); padding: 0 .15em; }
  .tu .o.xong { border-style: solid; border-color: var(--la); color: var(--la); background: #d3f9d8; }
  .doc { font-size: max(40px, calc(var(--u) * 10)); line-height: 1.25; color: var(--xanh); text-wrap: balance; }
  .chon { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 3); }
  .chon button {
    min-width: max(90px, calc(var(--u) * 20)); padding: calc(var(--u) * 1) calc(var(--u) * 4);
    font-size: max(40px, calc(var(--u) * 11)); line-height: 1.1;
    color: #fff; background: var(--cam); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--cam-dam);
  }
  .chon button:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--cam-dam); }
  .chon button.sai { background: #b9c2cc; box-shadow: 0 8px 0 #8a949e; animation: lac .4s; }
  .chon button.dung, .chon button.doc-xong { background: var(--la); box-shadow: 0 8px 0 var(--la-dam); }
  .chon button.doc-xong { font-size: max(26px, calc(var(--u) * 6)); }
  @keyframes lac { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .loi { min-height: 1.2em; font-size: max(24px, calc(var(--u) * 5.5)); }
  .loi.sai { color: #e8590c; } .loi.dung { color: var(--la); }

  .qua-to { font-family: var(--emoji); font-size: max(110px, calc(var(--u) * 26)); line-height: 1; animation: nay .7s cubic-bezier(.3,1.6,.5,1); }
  @keyframes nay { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
  .hoan-ho { font-size: max(36px, calc(var(--u) * 9)); color: var(--do); }
  .nut-lon { font-size: max(26px, calc(var(--u) * 6)); padding: calc(var(--u) * .6) calc(var(--u) * 6); color: #fff; background: var(--la); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--la-dam); }
  .bai-moi { font-size: max(26px, calc(var(--u) * 5.6)); color: var(--xanh); }
  .am-moi { display: flex; gap: calc(var(--u) * 5); justify-content: center; flex-wrap: wrap; }
  .am-moi div { display: flex; flex-direction: column; align-items: center; }
  .am-moi .chu-to { font-size: max(60px, calc(var(--u) * 14)); line-height: 1; color: var(--do); }
  .am-moi .vd { font-size: max(24px, calc(var(--u) * 4.6)); display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .am-moi .vd span { font-family: var(--emoji); font-size: 1.9em; }

  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
  #phao i { position: absolute; top: -20px; width: 14px; height: 20px; border-radius: 3px; animation: roi linear forwards; }
  @keyframes roi { to { transform: translateY(110vh) rotate(720deg); } }
  @media (max-aspect-ratio: 1/1) { :root { --u: min(0.7vh, 1.1vw); } .toa svg { width: max(84px, 27vw); } .dau-may svg { width: max(96px, 31vw); } }
  @media (prefers-reduced-motion: reduce) {
    .toa svg, .the-hoi, .qua-to, .khoi i { animation: none !important; }
    .doan-tau { transition: none; }
    #phao { display: none; }
  }
</style>
</head>
<body>
<h1>Đoàn tàu về xóm</h1>
<div class="goi-y" id="goi-y">Mời bạn lên chọn một toa tàu nhé!</div>
<div class="xom" aria-hidden="true">🏡🌳🏠🌳🏡</div>
<div class="san-ga">
  <div class="doan-tau" id="tau"></div>
  <div class="ray"></div>
</div>
<div class="hang-duoi"><button class="nut-nho" id="choi-lai">Chơi lại từ đầu</button></div>

<div class="man" id="man" hidden><div class="the-hoi" id="the-hoi"></div></div>
<div id="phao"></div>

<script>
// ====== NỘI DUNG (cô sửa ở đây cho bài khác) ======
// Ôn bài 31-35 (an ăn ân, on ôn ơn, en ên in un, am ăm âm) trước Bài 36 om ôm ơm.
// Chỉ dùng âm, vần đã học, KHÔNG dùng om, ôm, ơm (để dành cho toa bí mật).
// Mỗi câu một kiểu:
//   chon: { hoi, hinh?, tu?: [trước, chữ cần điền, sau], dap, cacChon }  - bé chạm chọn đáp án
//   doc:  { hoi, doc }                                                     - cả lớp đọc to, cô bấm nút khi đọc đúng
const CAU = [
  { kieu: 'chon', hoi: 'Đây là quả gì? Chọn vần đúng nhé!', hinh: '🍊', tu: ['quả c', 'am', ''], dap: 'am', cacChon: ['ăm', 'am', 'âm'] },
  { kieu: 'chon', hoi: 'Đây là con gì? Chọn vần đúng nhé!', hinh: '🐶', tu: ['c', 'ún', ' con'], dap: 'ún', cacChon: ['ún', 'ín', 'ến'] },
  { kieu: 'chon', hoi: 'Tiếng nào có vần ơn?', dap: 'sơn', cacChon: ['sen', 'sân', 'sơn'] },
  { kieu: 'chon', hoi: 'Chọn tiếng để tạo từ', hinh: '🚣', tu: ['', 'bến', ' đò'], dap: 'bến', cacChon: ['bến', 'bận', 'bốn'] },
  { kieu: 'doc', hoi: 'Cả lớp cùng đọc to nào!', doc: 'Mùa hè, ve râm ran, sen nở thắm.' }
];
const BAI_MOI = { ten: 'Bài 36: om ôm ơm', am: [['om', '🏡', 'xóm'], ['ôm', '🦐', 'tôm'], ['ơm', '🌾', 'rơm']] };
// ====================================================

const MAU_TOA = ['#e03131', '#1c7ed6', '#2f9e44', '#f08c00', '#ae3ec9'];
const HANG = ['🍉', '🍌', '🥕', '🍎', '🌽', '🍇', '🎁', '🧸', '🍍', '🥥'];
const KHEN = ['Hoan hô!', 'Giỏi quá!', 'Tuyệt vời!', 'Xuất sắc!', 'Đúng rồi!'];
const $ = id => document.getElementById(id);
let daMo = [], hangCuaToa = [], amThanh = null;

function tron(m) { for (let i = m.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [m[i], m[j]] = [m[j], m[i]]; } return m; }

function keu(dsTanSo, kieu = 'triangle', cach = 0.12) {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    if (amThanh.state === 'suspended') amThanh.resume();
    dsTanSo.forEach((f, i) => {
      const o = amThanh.createOscillator(), g = amThanh.createGain();
      const t = amThanh.currentTime + i * cach;
      o.frequency.value = f; o.type = kieu;
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.connect(g); g.connect(amThanh.destination);
      o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}
// còi tàu: hai tiếng "tu tu"
const coiTau = () => { keu([587, 587], 'square', 0.35); setTimeout(() => keu([494, 494], 'square', 0.35), 800); };

// đầu máy
function veDauMay() {
  return `<svg viewBox="0 0 230 180">
    <rect x="58" y="10" width="26" height="36" rx="4" fill="#495057" stroke="#12304a" stroke-width="5"/>
    <rect x="50" y="2" width="42" height="14" rx="5" fill="#343a40" stroke="#12304a" stroke-width="5"/>
    <rect x="20" y="46" width="130" height="86" rx="12" fill="#c92a2a" stroke="#12304a" stroke-width="5"/>
    <rect x="132" y="22" width="80" height="110" rx="10" fill="#e03131" stroke="#12304a" stroke-width="5"/>
    <rect x="148" y="38" width="48" height="38" rx="6" fill="#d0ebff" stroke="#12304a" stroke-width="4"/>
    <path d="M20 132 L4 150 L40 150 Z" fill="#ffd43b" stroke="#12304a" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="20" cy="88" r="10" fill="#fff3bf" stroke="#12304a" stroke-width="4"/>
    <text x="85" y="98" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#fff">Lớp 1</text>
    ${banh(52)}${banh(112)}${banh(178)}
  </svg><div class="khoi"><i></i><i></i><i></i></div>`;
}
function banh(x) {
  return `<g><circle cx="${x}" cy="150" r="22" fill="#343a40" stroke="#12304a" stroke-width="4"/><circle cx="${x}" cy="150" r="8" fill="#adb5bd"/></g>`;
}
// một toa: mo = đã chất hàng
function veToa(mau, nhan, mo, hang, biMat) {
  return `<svg viewBox="0 0 200 180">
    ${mo ? `<text class="hang-hoa" x="100" y="14" font-size="84" text-anchor="middle" dominant-baseline="central">${hang}</text>` : ''}
    <rect x="-6" y="118" width="22" height="10" fill="#495057"/>
    <rect x="12" y="56" width="176" height="78" rx="10" fill="${mau}" stroke="#12304a" stroke-width="5"/>
    ${biMat ? '' : `<rect x="12" y="56" width="176" height="14" fill="rgba(255,255,255,.25)"/>`}
    <circle cx="100" cy="94" r="30" fill="#fff" stroke="#12304a" stroke-width="4"/>
    <text x="100" y="96" font-size="38" text-anchor="middle" dominant-baseline="central" fill="#12304a">${nhan}</text>
    ${banh(52)}${banh(148)}
  </svg>`;
}

function veTau() {
  const t = $('tau');
  t.textContent = '';
  const dm = document.createElement('div');
  dm.className = 'toa dau-may'; dm.innerHTML = veDauMay(); dm.setAttribute('aria-hidden', 'true');
  t.appendChild(dm);
  CAU.forEach((c, i) => {
    const h = document.createElement('button');
    h.className = 'toa' + (daMo[i] ? ' da-mo' : '');
    h.style.setProperty('--i', i);
    h.setAttribute('aria-label', `Toa số ${i + 1}` + (daMo[i] ? ', đã chất hàng' : ''));
    h.innerHTML = veToa(MAU_TOA[i % MAU_TOA.length], i + 1, daMo[i], hangCuaToa[i]);
    h.onclick = () => { if (!daMo[i]) moCau(i); };
    t.appendChild(h);
  });
  const du = daMo.filter(Boolean).length === CAU.length;
  const h = document.createElement('button');
  h.className = 'toa bi-mat' + (du ? ' mo-duoc' : ' khoa');
  h.setAttribute('aria-label', du ? 'Toa bí mật, mở được rồi' : 'Toa bí mật, còn khóa');
  h.innerHTML = veToa('#f2b705', du ? '?' : '🔒', false, '', true);
  h.onclick = () => {
    if (!du) { keu([220, 196]); $('goi-y').textContent = `Chất hàng đủ ${CAU.length} toa thì toa bí mật mới mở được nhé!`; return; }
    tauChay();
  };
  t.appendChild(h);
  $('goi-y').textContent = du ? 'Toa bí mật sáng lên rồi! Mời bạn mở cho tàu chạy nhé!' : 'Mời bạn lên chọn một toa tàu nhé!';
}

function moCau(i) {
  const c = CAU[i], mau = MAU_TOA[i % MAU_TOA.length], the = $('the-hoi');
  the.style.setProperty('--mau', mau);
  let noiDung = `<div class="so-toa">Toa số ${i + 1}</div><div class="cau">${c.hoi}</div>`;
  if (c.hinh) noiDung += `<div class="hinh">${c.hinh}</div>`;
  if (c.tu) noiDung += `<div class="tu" id="tu">${c.tu[0]}<span class="o" id="o">?</span>${c.tu[2]}</div>`;
  if (c.kieu === 'doc') noiDung += `<div class="doc">${c.doc}</div>`;
  noiDung += `<div class="chon" id="chon"></div><div class="loi" id="loi"></div>
    <button class="nut-nho" id="de-sau">Đóng toa, để bạn khác</button>`;
  the.innerHTML = noiDung;
  $('de-sau').onclick = () => { $('man').hidden = true; };
  const chon = $('chon');
  if (c.kieu === 'doc') {
    const b = document.createElement('button');
    b.className = 'doc-xong'; b.textContent = 'Cả lớp đọc đúng rồi ✓';
    b.onclick = () => chatHang(i);
    chon.appendChild(b);
  } else {
    c.cacChon.forEach(v => {
      const b = document.createElement('button');
      b.textContent = v;
      b.onclick = () => {
        if (b.disabled || chon.dataset.xong) return;
        if (v === c.dap) {
          chon.dataset.xong = '1';
          b.classList.add('dung');
          if (c.tu) { $('o').textContent = c.dap; $('o').classList.add('xong'); }
          $('loi').className = 'loi dung'; $('loi').textContent = 'Đúng rồi!';
          keu([523, 659, 784]);
          setTimeout(() => chatHang(i), 900);
        } else {
          b.classList.add('sai'); b.disabled = true;
          $('loi').className = 'loi sai'; $('loi').textContent = 'Bạn thử lại nhé!';
          keu([220, 196]);
        }
      };
      chon.appendChild(b);
    });
  }
  $('man').hidden = false;
  keu([392, 523], 'sine');
}

function chatHang(i) {
  daMo[i] = true;
  const the = $('the-hoi');
  the.innerHTML = `<div class="so-toa">Toa số ${i + 1}</div>
    <div class="qua-to">${hangCuaToa[i]}</div>
    <div class="hoan-ho">${KHEN[i % KHEN.length]} Toa ${i + 1} đã chất hàng!</div>
    <button class="nut-lon" id="dong">Về đoàn tàu</button>`;
  $('dong').onclick = dong;
  $('dong').focus();
  phaoGiay(50);
  keu([523, 659, 784, 1047, 1319]);
}

// mở toa bí mật: tàu kéo còi chạy đi rồi hiện bài mới
function tauChay() {
  $('goi-y').textContent = 'Tu tu! Tàu chạy về xóm rồi!';
  coiTau();
  $('tau').classList.add('chay');
  setTimeout(moBaiMoi, 2400);
}

function moBaiMoi() {
  const the = $('the-hoi');
  the.style.setProperty('--mau', '#f2b705');
  the.innerHTML = `<div class="so-toa">Toa bí mật</div>
    <div class="bai-moi">Tàu chở về xóm ba vần mới. Hôm nay chúng mình học ${BAI_MOI.ten}</div>
    <div class="am-moi">${BAI_MOI.am.map(([chu, hinh, vd]) => `<div><div class="chu-to">${chu}</div><div class="vd"><span>${hinh}</span>${vd}</div></div>`).join('')}</div>
    <button class="nut-lon" id="dong">Vào bài mới!</button>`;
  $('dong').onclick = () => { $('man').hidden = true; $('tau').classList.remove('chay'); veTau(); };
  $('man').hidden = false;
  $('dong').focus();
  phaoGiay(90);
  keu([392, 523, 659, 784, 1047, 1319, 1568]);
}

function dong() { $('man').hidden = true; veTau(); }

function phaoGiay(soLuong) {
  const p = $('phao');
  p.textContent = '';
  const mau = [...MAU_TOA, '#ffd43b', '#ec5a93'];
  for (let i = 0; i < soLuong; i++) {
    const g = document.createElement('i');
    g.style.left = Math.random() * 100 + 'vw';
    g.style.background = mau[i % mau.length];
    g.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    g.style.animationDelay = Math.random() * 1 + 's';
    p.appendChild(g);
  }
  setTimeout(() => { p.textContent = ''; }, 6500);
}

function batDau() {
  daMo = CAU.map(() => false);
  hangCuaToa = tron([...HANG]).slice(0, CAU.length);
  $('man').hidden = true;
  $('tau').classList.remove('chay');
  veTau();
}
$('choi-lai').onclick = batDau;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('man').hidden && $('dong')) $('dong').click(); });
batDau();
</script>
