<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>Ném bóng vào rổ - Khởi động Toán 1 Bài 9</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Khởi động chiếu tivi, cô điều khiển. Có 5 quả bóng đánh số dưới sân, mỗi quả là 1 câu ôn.
     Trả lời đúng thì quả bóng bay vào rổ, bảng điểm tăng 1. Đủ 5 quả thì cả lớp "vô địch" và hiện bài học.
     Đổi nội dung: chỉ sửa khối DỮ LIỆU (CAU, BAI_MOI). */
  :root {
    --u: min(1vh, 1.25vw);
    --chu: #12304a; --xanh: #1864ab; --do: #e03131; --la: #2f9e44; --la-dam: #1e6b2e; --cam: #f08c00; --cam-dam: #b86200; --vang: #ffe066;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu);
    background: linear-gradient(#d0ebff 0 62%, #e8a46a 62% 100%);
    display: flex; flex-direction: column; gap: calc(var(--u) * 1);
    padding: calc(var(--u) * 1.2) max(14px, 2vw);
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden;
  }
  button { font-family: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--chu); outline-offset: 3px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; }
  h1 { font-size: max(20px, calc(var(--u) * 4.4)); color: var(--xanh); line-height: 1.1; }
  #loi { text-align: center; font-size: max(20px, calc(var(--u) * 4.6)); line-height: 1.2; text-wrap: balance; }

  #san { flex: 1; min-height: 0; position: relative; }
  /* rổ bóng: bảng, vành, lưới */
  #ro { position: absolute; left: 50%; top: 2%; transform: translateX(-50%); width: max(170px, calc(var(--u) * 34)); display: flex; flex-direction: column; align-items: center; }
  #bang { width: 100%; aspect-ratio: 5 / 3; background: #fff; border: 6px solid #495057; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: center; }
  #bang::after { content: ""; position: absolute; left: 32%; right: 32%; bottom: 10%; height: 34%; border: 5px solid #e03131; }
  #diem { position: absolute; top: 4px; font-size: max(22px, calc(var(--u) * 5)); color: var(--xanh); line-height: 1; }
  #vanh { width: 46%; height: max(10px, calc(var(--u) * 1.8)); background: #f76707; border-radius: 6px; margin-top: -2px; position: relative; z-index: 3; }
  #luoi { width: 40%; height: max(40px, calc(var(--u) * 8)); background: repeating-linear-gradient(60deg, transparent 0 8px, #fff 8px 11px), repeating-linear-gradient(-60deg, transparent 0 8px, #fff 8px 11px);
    clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%); }
  #luoi.rung { animation: rung .5s; transform-origin: top; }
  @keyframes rung { 30% { transform: scaleY(1.25); } 60% { transform: scaleY(.9); } }
  #cot { width: max(10px, calc(var(--u) * 2)); background: #868e96; position: absolute; top: 2%; bottom: 30%; left: 50%; transform: translateX(-50%); z-index: 0; border-radius: 0 0 4px 4px; }
  #ro { z-index: 1; } #hang-bong { z-index: 2; }

  #hang-bong { position: absolute; left: 0; right: 0; bottom: 4%; display: flex; justify-content: center; gap: max(14px, calc(var(--u) * 5)); }
  .bong { width: max(64px, calc(var(--u) * 13)); height: max(64px, calc(var(--u) * 13)); border-radius: 50%; border: 4px solid #7a3a00;
    background: radial-gradient(circle at 35% 30%, #ffa94d, #e8590c 70%); position: relative; color: #fff;
    font-size: max(26px, calc(var(--u) * 6)); text-shadow: 0 2px 0 #7a3a00; box-shadow: 0 8px 0 rgba(0,0,0,.18); }
  .bong::before, .bong::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
  .bong::before { border-left: 3px solid #7a3a00; border-right: 3px solid #7a3a00; inset: 0 22%; border-radius: 50%; }
  .bong::after { border-top: 3px solid #7a3a00; inset: 48% 0 auto 0; height: 0; border-radius: 0; }
  .bong:hover { transform: translateY(-4px); }
  .bong.nem { animation: nem 1.1s ease-in forwards; z-index: 2; }
  @keyframes nem {
    0% { transform: translate(0, 0) scale(1); }
    55% { transform: translate(calc(var(--dx) * .8), calc(var(--dy) - 90px)) scale(.75); }
    80% { transform: translate(var(--dx), calc(var(--dy) - 10px)) scale(.6); opacity: 1; }
    100% { transform: translate(var(--dx), calc(var(--dy) + 60px)) scale(.55); opacity: 0; }
  }
  .bong.xong { visibility: hidden; }

  #nut-cuoi { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: max(20px, calc(var(--u) * 4.6)); padding: 8px 26px; white-space: nowrap;
    border: none; border-radius: 22px; color: #fff; background: var(--do); box-shadow: 0 6px 0 #a61e1e; animation: nhip 1.2s infinite; z-index: 4; }
  @keyframes nhip { 50% { transform: translateX(-50%) scale(1.06); } }

  .phu { position: fixed; inset: 0; z-index: 10; background: rgba(24, 100, 171, .9); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .the { background: #fff; color: var(--chu); border-radius: 28px; border: 8px solid var(--vang); padding: calc(var(--u) * 3) calc(var(--u) * 4); text-align: center;
    width: min(100%, calc(var(--u) * 130)); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.2); font-size: max(18px, calc(var(--u) * 3.8)); }
  .the .so-bong { font-size: max(18px, calc(var(--u) * 3.6)); color: #fff; background: #e8590c; border-radius: 30px; padding: 2px 18px; }
  .the h2 { font-size: max(28px, calc(var(--u) * 7)); line-height: 1.15; text-wrap: balance; }
  .the .tranh { display: flex; gap: calc(var(--u) * 3); justify-content: center; align-items: center; flex-wrap: wrap; font-family: var(--emoji); font-size: max(60px, calc(var(--u) * 15)); line-height: 1; }
  .the .tranh svg { width: max(60px, calc(var(--u) * 13)); height: max(60px, calc(var(--u) * 13)); }
  .the .tranh .nhom { display: flex; flex-wrap: wrap; justify-content: center; max-width: 6em; gap: 4px; border: 4px dashed #74c0fc; border-radius: 16px; padding: 6px; font-size: max(36px, calc(var(--u) * 8)); }
  .the .so { font-size: max(48px, calc(var(--u) * 13)); color: var(--xanh); }
  .chon { display: flex; gap: calc(var(--u) * 3); justify-content: center; flex-wrap: wrap; }
  .chon button { border: none; border-radius: 20px; color: #fff; background: var(--cam); box-shadow: 0 7px 0 var(--cam-dam);
    font-size: max(28px, calc(var(--u) * 7)); min-width: max(80px, calc(var(--u) * 18)); padding: 4px 20px; line-height: 1.2; }
  .chon button:active { transform: translateY(4px); }
  .chon button.sai { background: #b9c2cc; box-shadow: 0 7px 0 #8a949e; animation: lac .4s; opacity: .6; }
  .chon button.dung { background: var(--la); box-shadow: 0 7px 0 var(--la-dam); }
  @keyframes lac { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .bao { min-height: 1.3em; font-size: max(22px, calc(var(--u) * 5)); }
  .bao.dung { color: var(--la); } .bao.sai { color: #e8590c; }
  .hang-nut { display: flex; gap: 12px; }
  .nut-phu { font-size: max(16px, calc(var(--u) * 3.2)); padding: 4px 16px; border-radius: 30px; border: 3px solid var(--xanh); background: #fff; color: var(--xanh); }
  .bai-moi { font-size: max(20px, calc(var(--u) * 4.4)); color: #fff; background: var(--do); border-radius: 30px; padding: 2px 22px; }
  .lon { font-family: var(--emoji); font-size: max(64px, calc(var(--u) * 14)); line-height: 1; animation: nay 1s ease-in-out infinite alternate; }
  @keyframes nay { to { transform: translateY(-10px) rotate(6deg); } }
  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 11; }
  #phao i { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: roi linear forwards; }
  @keyframes roi { to { transform: translateY(110vh) rotate(720deg); } }
  #loi-may { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 20; background: #fff; color: #c00; border: 3px solid #c00; border-radius: 12px; padding: 8px; font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { .bong.nem, #nut-cuoi, .lon, #luoi.rung { animation: none; } .bong.nem { visibility: hidden; } #phao { display: none; } }
</style>

<header>
  <h1>🏀 Ném bóng vào rổ</h1>
</header>
<div id="loi"></div>
<div id="san">
  <div id="cot"></div>
  <div id="ro"><div id="bang"><span id="diem">0</span></div><div id="vanh"></div><div id="luoi"></div></div>
  <div id="hang-bong"></div>
  <button id="nut-cuoi" hidden>🏆 Cả lớp vô địch! Xem bài học</button>
</div>

<div class="phu" id="phu" hidden><div class="the" id="the"></div></div>
<div id="phao"></div>

<script>
// nếu máy nào báo lỗi, hiện lỗi lên màn hình để chụp gửi cô
window.onerror = (m, f, d) => {
  const goc = s => String(s || "").split(/[?#]/)[0];
  if (/zalo|FBNav|instagram/i.test(m) || !f || goc(f) !== goc(location.href)) return; // lỗi của app Zalo/Facebook chèn vào, không phải của trò chơi
  const o = document.getElementById('loi-may') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'loi-may' }));
  o.textContent = 'Lỗi: ' + m + ' (dòng ' + d + ')';
};
const HINH = { vuong: '<rect x="8" y="8" width="84" height="84"/>', tron: '<circle cx="50" cy="50" r="44"/>', tamgiac: '<polygon points="50,6 96,92 4,92"/>', chunhat: '<rect x="2" y="25" width="96" height="50"/>' };
const ve = (k, mau) => `<svg viewBox="0 0 100 100">${HINH[k].replace(/\/>$/, ` fill="${mau}" stroke="#12304a" stroke-width="4" stroke-linejoin="round"/>`)}</svg>`;
const nhom = (vat, n) => `<div class="nhom">${vat.repeat(n)}</div>`;

// ====== DỮ LIỆU (bài khác chỉ cần thay khối này) ======
const QUYEN_VO = `<svg viewBox="0 0 100 100" style="width:max(110px, calc(var(--u)*24));height:auto"><rect x="4" y="18" width="92" height="64" rx="3" fill="#4a90e2" stroke="#12304a" stroke-width="4"/><rect x="28" y="34" width="44" height="20" rx="3" fill="#fff"/></svg>`;
const HAI_TAM_GIAC = `<svg viewBox="0 0 100 100"><polygon points="8,8 92,8 8,92" fill="#94d82d" stroke="#12304a" stroke-width="4" stroke-linejoin="round"/><polygon points="92,8 92,92 8,92" fill="#82c91e" stroke="#12304a" stroke-width="4" stroke-linejoin="round"/></svg>`;
// 5 câu ôn Bài 7, Bài 8 và số: chon = [nhãn, giá trị]
const CAU = [
  { hoi: 'Quyển vở có dạng hình gì?', tranh: `<div class="tranh">${QUYEN_VO}</div>`, chon: [['Hình tròn', 't'], ['Hình chữ nhật', 'n'], ['Hình tam giác', 'g']], dung: 'n', khen: 'Quyển vở có dạng hình chữ nhật.' },
  { hoi: 'Hai miếng tam giác này ghép thành hình gì?', tranh: `<div class="tranh">${HAI_TAM_GIAC}</div>`, chon: [['Hình vuông', 'v'], ['Hình tròn', 't'], ['Hình chữ nhật', 'n']], dung: 'v', khen: 'Ghép thành hình vuông.' },
  { hoi: 'Có mấy hình tròn?', tranh: `<div class="tranh">${ve('tron', '#4dabf7')}${ve('vuong', '#fab005')}${ve('tron', '#f06595')}${ve('tron', '#82c91e')}${ve('tamgiac', '#e03131')}${ve('tron', '#fab005')}</div>`,
    chon: [['3', '3'], ['4', '4'], ['5', '5']], dung: '4', khen: 'Có 4 hình tròn.' },
  { hoi: 'Số nào lớn hơn?', tranh: '<div class="so">6 &nbsp; và &nbsp; 9</div>', noi: 'Sáu và chín, số nào lớn hơn?', chon: [['6', '6'], ['9', '9']], dung: '9', khen: '9 lớn hơn 6.' },
  { hoi: '3 và 3 được mấy?', tranh: `<div class="tranh">${nhom('🔴', 3)}${nhom('🔵', 3)}</div>`, noi: 'Ba và ba được mấy?', chon: [['5', '5'], ['6', '6'], ['7', '7']], dung: '6', khen: '3 và 3 được 6.' }
];
const BAI_MOI = 'Bài 9: Luyện tập chung';
const LOI_MO = 'Cả lớp cùng thi ném bóng! Chọn một quả bóng, trả lời đúng là bóng bay vào rổ.';
// ======================================================

const $ = id => document.getElementById(id);
const lay = m => m[Math.floor(Math.random() * m.length)];
const KHEN = ['Giỏi quá!', 'Đúng rồi!', 'Hoan hô!', 'Tuyệt vời!'];
let vao = new Set(), amThanh = null;

// ---------- âm thanh, giọng đọc (chỉ đọc khi bấm nút loa) ----------
let giongViet = null, choDoc = false;
function timGiong() {
  if (!window.speechSynthesis) return;
  const ds = speechSynthesis.getVoices().filter(v => /^vi/i.test(v.lang));
  giongViet = ds.find(v => /natural|online|hoaimy/i.test(v.name)) || ds[0] || null;
}
if (window.speechSynthesis) { timGiong(); speechSynthesis.onvoiceschanged = timGiong; }
document.addEventListener('click', e => { if (e.target.closest('.nut-nghe, #nut-loa, #nghe, #nut-nghe')) { choDoc = true; setTimeout(() => choDoc = false, 0); } }, true);
function doc(chu) {
  if (!window.speechSynthesis || !giongViet) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(chu); u.voice = giongViet; u.lang = giongViet.lang; u.rate = 0.9; speechSynthesis.speak(u);
}
function keu(ds) {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    if (amThanh.state === 'suspended') amThanh.resume();
    ds.forEach((f, i) => {
      const o = amThanh.createOscillator(), g = amThanh.createGain(), t = amThanh.currentTime + 0.02 + i * 0.12;
      o.frequency.value = f; o.type = 'triangle';
      g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.connect(g); g.connect(amThanh.destination); o.start(t); o.stop(t + 0.26);
    });
  } catch (e) {}
}

function veBong() {
  $('hang-bong').innerHTML = CAU.map((c, i) => `<button class="bong" data-i="${i}" aria-label="Quả bóng số ${i + 1}">${i + 1}</button>`).join('');
  document.querySelectorAll('.bong').forEach(b => b.onclick = () => moCau(+b.dataset.i));
}
function moCau(i) {
  if (vao.has(i)) return;
  const c = CAU[i];
  $('the').innerHTML = `<div class="so-bong">Quả bóng số ${i + 1}</div><h2></h2>${c.tranh}<div class="chon"></div><div class="bao"></div>
    <div class="hang-nut"><button class="nut-phu" id="nut-loa">🔊 Nghe</button><button class="nut-phu" id="nut-dong">Chọn bóng khác</button></div>`;
  $('the').querySelector('h2').textContent = c.hoi;
  const hang = $('the').querySelector('.chon'), bao = $('the').querySelector('.bao');
  c.chon.forEach(([nhan, gt]) => {
    const b = document.createElement('button'); b.innerHTML = nhan;
    b.onclick = () => {
      if (gt === c.dung) {
        b.classList.add('dung'); bao.className = 'bao dung'; bao.textContent = `${lay(KHEN)} ${c.khen}`;
        hang.querySelectorAll('button').forEach(x => x.disabled = true);
        keu([523, 659, 784, 1047]);
        setTimeout(() => { $('phu').hidden = true; nem(i); }, 1300);
      } else { b.classList.add('sai'); b.disabled = true; bao.className = 'bao sai'; bao.textContent = 'Chưa đúng, bạn thử lại nhé!'; keu([220, 196]); }
    };
    hang.appendChild(b);
  });
  $('nut-loa').onclick = () => {
    if (!giongViet) timGiong();
    if (!giongViet) { alert('Máy này chưa có giọng đọc tiếng Việt. Thầy cô thử mở bằng Microsoft Edge nhé.'); return; }
    doc(c.noi || c.hoi);
  };
  $('nut-dong').onclick = () => { $('phu').hidden = true; };
  $('phu').hidden = false;
}
// quả bóng bay theo đường vòng cung vào giữa vành rổ
function nem(i) {
  vao.add(i);
  const b = document.querySelector(`.bong[data-i="${i}"]`), r = b.getBoundingClientRect(), v = $('vanh').getBoundingClientRect();
  b.style.setProperty('--dx', (v.left + v.width / 2 - (r.left + r.width / 2)) + 'px');
  b.style.setProperty('--dy', (v.top - (r.top + r.height / 2)) + 'px');
  b.classList.add('nem'); keu([300, 400, 500]);
  setTimeout(() => {
    b.classList.add('xong'); $('luoi').classList.remove('rung'); void $('luoi').offsetWidth; $('luoi').classList.add('rung');
    $('diem').textContent = vao.size; keu([784, 1047]);
    const con = CAU.length - vao.size;
    $('loi').textContent = con ? `Vào rổ! Được ${vao.size} quả rồi, còn ${con} quả nữa.` : 'Cả 5 quả đều vào rổ! Cả lớp giỏi quá!';
    if (!con) setTimeout(() => { $('nut-cuoi').hidden = false; keu([523, 659, 784, 1047, 1319]); }, 600);
  }, 1050);
}
$('nut-cuoi').onclick = () => {
  $('nut-cuoi').hidden = true;
  $('the').innerHTML = `<div class="lon">🏆</div><div class="bai-moi">Bài học hôm nay</div><h2>${BAI_MOI}</h2>
    <div>Mình cùng ôn lại các hình đã học và luyện ghép hình nhé!</div>
    <div class="tranh">${ve('vuong', '#fab005')}${ve('tron', '#1c7ed6')}${ve('tamgiac', '#e03131')}${ve('chunhat', '#82c91e')}</div>
    <div class="hang-nut"><button class="nut-phu" id="nut-lai">Chơi lại</button></div>`;
  $('nut-lai').onclick = () => { $('phu').hidden = true; batDau(); };
  $('phu').hidden = false;
  phaoGiay(); keu([392, 523, 659, 784, 1047, 1319]);
};
function phaoGiay() {
  const p = $('phao'); p.textContent = '';
  const MAU = ['#e03131', '#1c7ed6', '#2f9e44', '#f08c00', '#ae3ec9', '#ffe066'];
  for (let i = 0; i < 70; i++) {
    const g = document.createElement('i');
    g.style.left = Math.random() * 100 + 'vw'; g.style.background = lay(MAU);
    g.style.animationDuration = (2.5 + Math.random() * 2.5) + 's'; g.style.animationDelay = Math.random() * 1.2 + 's';
    p.appendChild(g);
  }
  setTimeout(() => { p.textContent = ''; }, 7000);
}
function batDau() {
  vao = new Set(); $('diem').textContent = 0; $('nut-cuoi').hidden = true; $('loi').textContent = LOI_MO;
  veBong();
}
batDau();
</script>
</body>
</html>
