<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hộp quà bí mật - Khởi động Bài 27</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Trò khởi động chiếu tivi: 5 hộp quà ôn bài cũ + 1 hộp bí mật hé lộ bài mới.
     Cô gọi bạn lên chọn hộp, hộp mở ra câu hỏi, trả lời đúng thì hiện quà. Kích thước theo --u để vừa tivi lẫn máy tính. */
  :root {
    --u: min(1vh, 1.6vw);
    --nen: #fff4e0;
    --chu: #12304a;
    --xanh: #0b5cab;
    --do: #e03131;
    --la: #2f9e44;
    --la-dam: #1e6b2e;
    --cam: #f08c00;
    --cam-dam: #b86200;
    --vang: #ffd43b;
    --trang: #ffffff;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu);
    background: radial-gradient(circle at 15% 10%, #ffe3ec 0 12%, transparent 13%),
                radial-gradient(circle at 88% 85%, #dff3ff 0 14%, transparent 15%),
                var(--nen);
    display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--u) * 2) 16px; gap: calc(var(--u) * 2);
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    overflow: hidden;
  }
  button { font-family: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible { outline: 5px solid var(--xanh); outline-offset: 4px; }
  h1 { font-size: max(28px, calc(var(--u) * 8)); line-height: 1; color: var(--do); text-shadow: 0 4px 0 #fff, 0 7px 0 rgba(0,0,0,.08); }
  .goi-y { font-size: max(18px, calc(var(--u) * 3.6)); color: var(--xanh); }

  /* bảng 6 hộp */
  .bang { flex: 1; width: min(100%, 1400px); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: calc(var(--u) * 2.5); min-height: 0; }
  .hop { position: relative; background: none; border: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
  .hop svg { height: 100%; max-height: calc(var(--u) * 33); width: auto; max-width: 100%; overflow: visible; transition: transform .2s; }
  .hop:not(.da-mo):not(.khoa):hover svg { transform: scale(1.06) rotate(-2deg); }
  .hop:not(.da-mo):not(.khoa) svg { animation: lac-nhe 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * .3s); }
  @keyframes lac-nhe { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-4deg); } 90% { transform: rotate(4deg); } 95% { transform: rotate(-2deg); } }
  .hop text { font-family: var(--font); font-weight: 800; }
  .hop .qua { font-family: var(--emoji); }
  .hop.khoa { cursor: not-allowed; }
  .hop.khoa svg { filter: grayscale(.85) opacity(.6); }
  .hop.bi-mat.mo-duoc svg { animation: sang 1.2s ease-in-out infinite; }
  @keyframes sang { 0%, 100% { filter: drop-shadow(0 0 0 #ffd43b); } 50% { filter: drop-shadow(0 0 22px #ffd43b); } }

  .hang-duoi { display: flex; gap: 14px; }
  .nut-nho { font-size: max(15px, calc(var(--u) * 2.6)); padding: 4px 18px; border-radius: 30px; border: 3px solid var(--xanh); background: #fff; color: var(--xanh); }

  /* cửa sổ câu hỏi */
  .man {
    position: fixed; inset: 0; background: rgba(18, 48, 74, .82);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5;
  }
  .the-hoi {
    width: min(100%, 1100px); max-height: 100%; overflow-y: auto;
    background: #fff; border-radius: calc(var(--u) * 4); border: 8px solid var(--mau, var(--cam));
    padding: calc(var(--u) * 3) calc(var(--u) * 4);
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.5); text-align: center;
    animation: bung .45s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes bung { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .so-hop { font-size: max(18px, calc(var(--u) * 3.4)); color: #fff; background: var(--mau, var(--cam)); border-radius: 30px; padding: 2px 22px; }
  .cau { font-size: max(28px, calc(var(--u) * 6.5)); line-height: 1.2; text-wrap: balance; }
  .hinh { font-family: var(--emoji); font-size: max(80px, calc(var(--u) * 20)); line-height: 1; }
  .tu { font-size: max(52px, calc(var(--u) * 15)); line-height: 1.15; white-space: pre; }
  .tu .o { display: inline-block; min-width: 1.2em; border: 6px dashed var(--do); border-radius: 18px; color: var(--do); padding: 0 .15em; }
  .tu .o.xong { border-style: solid; border-color: var(--la); color: var(--la); background: #d3f9d8; }
  .doc { font-size: max(40px, calc(var(--u) * 10)); line-height: 1.25; color: var(--xanh); text-wrap: balance; }
  .chon { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 3); }
  .chon button {
    min-width: max(90px, calc(var(--u) * 20)); padding: calc(var(--u) * 1) calc(var(--u) * 4);
    font-size: max(40px, calc(var(--u) * 11)); line-height: 1.1;
    color: #fff; background: var(--cam); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--cam-dam);
  }
  .chon button:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--cam-dam); }
  .chon button.sai { background: #b9c2cc; box-shadow: 0 8px 0 #8a949e; animation: lac .4s; }
  .chon button.dung, .chon button.doc-xong { background: var(--la); box-shadow: 0 8px 0 var(--la-dam); }
  .chon button.doc-xong { font-size: max(26px, calc(var(--u) * 6)); }
  @keyframes lac { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .loi { min-height: 1.2em; font-size: max(24px, calc(var(--u) * 5.5)); }
  .loi.sai { color: #e8590c; }
  .loi.dung { color: var(--la); }

  /* quà và bài mới */
  .qua-to { font-family: var(--emoji); font-size: max(110px, calc(var(--u) * 28)); line-height: 1; animation: nay .7s cubic-bezier(.3,1.6,.5,1); }
  @keyframes nay { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
  .hoan-ho { font-size: max(36px, calc(var(--u) * 9)); color: var(--do); }
  .nut-lon { font-size: max(26px, calc(var(--u) * 6)); padding: calc(var(--u) * .6) calc(var(--u) * 6); color: #fff; background: var(--la); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--la-dam); }
  .bai-moi { font-size: max(30px, calc(var(--u) * 7)); color: var(--xanh); }
  .am-moi { display: flex; gap: calc(var(--u) * 6); justify-content: center; flex-wrap: wrap; }
  .am-moi div { display: flex; flex-direction: column; align-items: center; }
  .am-moi .chu-to { font-size: max(80px, calc(var(--u) * 22)); line-height: 1; color: var(--do); }
  .am-moi .vd { font-size: max(30px, calc(var(--u) * 7)); display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .am-moi .vd span { font-family: var(--emoji); font-size: 1.9em; }

  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
  #phao i { position: absolute; top: -20px; width: 14px; height: 20px; border-radius: 3px; animation: roi linear forwards; }
  @keyframes roi { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) {
    .hop svg, .hop.bi-mat.mo-duoc svg, .the-hoi, .qua-to { animation: none !important; }
    #phao { display: none; }
  }
</style>
</head>
<body>
<h1>Hộp quà bí mật</h1>
<div class="goi-y" id="goi-y">Mời bạn lên chọn một hộp quà nhé!</div>
<div class="bang" id="bang"></div>
<div class="hang-duoi"><button class="nut-nho" id="choi-lai">Chơi lại từ đầu</button></div>

<div class="man" id="man" hidden><div class="the-hoi" id="the-hoi"></div></div>
<div id="phao"></div>

<script>
// ====== NỘI DUNG (cô sửa ở đây cho bài khác) ======
// Ôn bài 25-26 (ôn tập, ph, qu) và âm cũ. Không dùng v, x, y vì các con chưa học.
// Mỗi câu một kiểu:
//   chon: { hoi, hinh?, tu?: [trước, chữ cần điền, sau], dap, cacChon }  - bé chạm chọn đáp án
//   doc:  { hoi, doc }                                                     - cả lớp đọc to, cô bấm nút khi đọc đúng
const CAU = [
  { kieu: 'chon', hoi: 'Điền ph hay qu?', tu: ['', 'qu', 'ả khế'], dap: 'qu', cacChon: ['ph', 'qu'] },
  { kieu: 'chon', hoi: 'Đây là món gì? Chọn tiếng đúng nhé!', hinh: '🍜', dap: 'phở', cacChon: ['quả', 'phở', 'phà'] },
  { kieu: 'chon', hoi: 'Chọn tiếng để tạo từ', tu: ['phố ', 'cổ', ''], dap: 'cổ', cacChon: ['cổ', 'tre', 'rùa'] },
  { kieu: 'chon', hoi: 'Tiếng nào có âm qu?', dap: 'quê', cacChon: ['phố', 'quê', 'thỏ'] },
  { kieu: 'doc', hoi: 'Cả lớp cùng đọc to nào!', doc: 'Bà cho bé quà quê.' }
];
const BAI_MOI = { ten: 'Bài 27', am: [['V v', '🎨', 'vẽ'], ['X x', '🚗', 'xe']] };
// ====================================================

const MAU_HOP = ['#e03131', '#1c7ed6', '#2f9e44', '#f08c00', '#ae3ec9'];
const QUA = ['🧸', '🎈', '🍭', '⭐', '🏆', '🍰', '🎀', '🦄', '🍬', '🌈'];
const KHEN = ['Hoan hô!', 'Giỏi quá!', 'Tuyệt vời!', 'Xuất sắc!', 'Đúng rồi!'];
const $ = id => document.getElementById(id);
let daMo = [], quaCuaHop = [], amThanh = null;

function tron(m) { for (let i = m.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [m[i], m[j]] = [m[j], m[i]]; } return m; }

function keu(dsTanSo, kieu = 'triangle') {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    dsTanSo.forEach((f, i) => {
      const o = amThanh.createOscillator(), g = amThanh.createGain();
      const t = amThanh.currentTime + i * 0.12;
      o.frequency.value = f; o.type = kieu;
      g.gain.setValueAtTime(0.25, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.connect(g); g.connect(amThanh.destination);
      o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}

// vẽ hộp quà: mo = đã mở (bỏ nắp, quà ló ra)
function veHop(mau, nhan, mo, qua) {
  const nap = mo
    ? ``
    : `<rect x="40" y="70" width="200" height="44" rx="8" fill="${mau}" stroke="#12304a" stroke-width="5"/>
       <rect x="125" y="70" width="30" height="44" fill="#ffd43b" stroke="#12304a" stroke-width="4"/>
       <path d="M140 70 C105 30 80 45 100 66 Z M140 70 C175 30 200 45 180 66 Z" fill="#ffd43b" stroke="#12304a" stroke-width="4" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 280 260">
    ${mo ? `<text class="qua" x="140" y="62" font-size="104" text-anchor="middle" dominant-baseline="central">${qua}</text>` : ''}
    <rect x="52" y="112" width="176" height="136" rx="8" fill="${mau}" stroke="#12304a" stroke-width="5"/>
    <rect x="125" y="112" width="30" height="136" fill="#ffd43b" stroke="#12304a" stroke-width="4"/>
    ${nap}
    <circle cx="90" cy="190" r="30" fill="#fff" stroke="#12304a" stroke-width="4"/>
    <text x="90" y="192" font-size="38" text-anchor="middle" dominant-baseline="central" fill="#12304a">${nhan}</text>
  </svg>`;
}

function veBang() {
  const b = $('bang');
  b.textContent = '';
  CAU.forEach((c, i) => {
    const h = document.createElement('button');
    h.className = 'hop' + (daMo[i] ? ' da-mo' : '');
    h.style.setProperty('--i', i);
    h.setAttribute('aria-label', `Hộp số ${i + 1}` + (daMo[i] ? ', đã mở' : ''));
    h.innerHTML = veHop(MAU_HOP[i % MAU_HOP.length], i + 1, daMo[i], quaCuaHop[i]);
    h.onclick = () => { if (!daMo[i]) moCau(i); };
    b.appendChild(h);
  });
  // hộp bí mật: mở được khi đã mở hết 5 hộp
  const du = daMo.filter(Boolean).length === CAU.length;
  const h = document.createElement('button');
  h.className = 'hop bi-mat' + (du ? ' mo-duoc' : ' khoa');
  h.setAttribute('aria-label', du ? 'Hộp bí mật, mở được rồi' : 'Hộp bí mật, còn khóa');
  h.innerHTML = veHop('#f2b705', du ? '?' : '🔒', false, '');
  h.onclick = () => {
    if (!du) { keu([220, 196]); $('goi-y').textContent = `Mở hết ${CAU.length} hộp quà thì hộp bí mật mới mở được nhé!`; return; }
    moBaiMoi();
  };
  b.appendChild(h);
  $('goi-y').textContent = du ? 'Hộp bí mật đã sáng lên rồi! Mời bạn mở nhé!' : 'Mời bạn lên chọn một hộp quà nhé!';
}

function moCau(i) {
  const c = CAU[i], mau = MAU_HOP[i % MAU_HOP.length], the = $('the-hoi');
  the.style.setProperty('--mau', mau);
  let noiDung = `<div class="so-hop">Hộp số ${i + 1}</div><div class="cau">${c.hoi}</div>`;
  if (c.hinh) noiDung += `<div class="hinh">${c.hinh}</div>`;
  if (c.tu) noiDung += `<div class="tu" id="tu">${c.tu[0]}<span class="o" id="o">?</span>${c.tu[2]}</div>`;
  if (c.kieu === 'doc') noiDung += `<div class="doc">${c.doc}</div>`;
  noiDung += `<div class="chon" id="chon"></div><div class="loi" id="loi"></div>
    <button class="nut-nho" id="de-sau">Đóng hộp, để bạn khác</button>`;
  the.innerHTML = noiDung;
  $('de-sau').onclick = () => { $('man').hidden = true; };
  const chon = $('chon');
  if (c.kieu === 'doc') {
    const b = document.createElement('button');
    b.className = 'doc-xong'; b.textContent = 'Cả lớp đọc đúng rồi ✓';
    b.onclick = () => tangQua(i);
    chon.appendChild(b);
  } else {
    c.cacChon.forEach(v => {
      const b = document.createElement('button');
      b.textContent = v;
      b.onclick = () => {
        if (v === c.dap) {
          b.classList.add('dung');
          if (c.tu) { $('o').textContent = c.dap; $('o').classList.add('xong'); }
          $('loi').className = 'loi dung'; $('loi').textContent = 'Đúng rồi!';
          keu([523, 659, 784]);
          setTimeout(() => tangQua(i), 900);
        } else {
          b.classList.add('sai'); b.disabled = true;
          $('loi').className = 'loi sai'; $('loi').textContent = 'Bạn thử lại nhé!';
          keu([220, 196]);
        }
      };
      chon.appendChild(b);
    });
  }
  $('man').hidden = false;
  keu([392, 523], 'sine');
}

function tangQua(i) {
  daMo[i] = true;
  const the = $('the-hoi');
  the.innerHTML = `<div class="so-hop">Hộp số ${i + 1}</div>
    <div class="qua-to">${quaCuaHop[i]}</div>
    <div class="hoan-ho">${KHEN[i % KHEN.length]}</div>
    <button class="nut-lon" id="dong">Về bảng hộp quà</button>`;
  $('dong').onclick = dong;
  $('dong').focus();
  phaoGiay(50);
  keu([523, 659, 784, 1047, 1319]);
}

function moBaiMoi() {
  const the = $('the-hoi');
  the.style.setProperty('--mau', '#f2b705');
  the.innerHTML = `<div class="so-hop">Hộp bí mật</div>
    <div class="bai-moi">Hôm nay chúng mình học ${BAI_MOI.ten}</div>
    <div class="am-moi">${BAI_MOI.am.map(([chu, hinh, vd]) => `<div><div class="chu-to">${chu}</div><div class="vd"><span>${hinh}</span>${vd}</div></div>`).join('')}</div>
    <button class="nut-lon" id="dong">Vào bài mới!</button>`;
  $('dong').onclick = dong;
  $('man').hidden = false;
  $('dong').focus();
  phaoGiay(90);
  keu([392, 523, 659, 784, 1047, 1319, 1568]);
}

function dong() { $('man').hidden = true; veBang(); }

function phaoGiay(soLuong) {
  const p = $('phao');
  p.textContent = '';
  const mau = [...MAU_HOP, '#ffd43b', '#ec5a93'];
  for (let i = 0; i < soLuong; i++) {
    const g = document.createElement('i');
    g.style.left = Math.random() * 100 + 'vw';
    g.style.background = mau[i % mau.length];
    g.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    g.style.animationDelay = Math.random() * 1 + 's';
    p.appendChild(g);
  }
  setTimeout(() => { p.textContent = ''; }, 6500);
}

function batDau() {
  daMo = CAU.map(() => false);
  quaCuaHop = tron([...QUA]).slice(0, CAU.length);
  $('man').hidden = true;
  veBang();
}
$('choi-lai').onclick = batDau;
// phím Esc đóng cửa sổ (khi đang ở màn quà hoặc bài mới)
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('man').hidden && $('dong')) dong(); });
batDau();
</script>
</body>
</html>
