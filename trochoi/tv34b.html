<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Giỏ tre vui vẻ - Bài 34 am ăm âm</title>
<style>
  :root { --u: min(1vw, 1.7vh); --ink: #1d3557; --tre: #d9a441; --tre2: #b9802a; --tre3: #f0cf7a; --b: min(30vw, 34vh); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { font-family: "Andika", "Be Vietnam Pro", "Segoe UI", Arial, sans-serif; color: var(--ink);
         background: linear-gradient(#bfe6ff 0%, #e9f7ff 38%, #cfeeb0 38.1%, #9fd36e 100%); }
  .may { position: absolute; background: #fff; border-radius: 99px; opacity: .85; }
  .m1 { top: 6%; left: 8%; width: calc(var(--u) * 14); height: calc(var(--u) * 4); }
  .m2 { top: 11%; right: 10%; width: calc(var(--u) * 18); height: calc(var(--u) * 5); }
  #khung { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: calc(var(--u) * 2) calc(var(--u) * 2) calc(var(--u) * 1.5); }
  h1 { margin: 0; font-size: calc(var(--u) * 5); letter-spacing: .5px; text-align: center; color: #c2410c; text-shadow: 0 2px 0 #fff; }
  .sub { margin: calc(var(--u) * .6) 0 0; font-size: calc(var(--u) * 2.5); font-weight: 700; text-align: center; background: #ffffffcc; padding: calc(var(--u) * .5) calc(var(--u) * 2); border-radius: 99px; }
  .hang { display: flex; gap: calc(var(--u) * 1.6); align-items: center; margin-top: calc(var(--u) * 1); }
  .nut-nho { font: inherit; font-weight: 700; font-size: calc(var(--u) * 2.4); border: 0; border-radius: 99px; padding: calc(var(--u) * .7) calc(var(--u) * 2); background: #1d7bd8; color: #fff; cursor: pointer; box-shadow: 0 3px 0 #0f4f94; }
  .dem { font-weight: 800; font-size: calc(var(--u) * 2.6); background: #fff; border-radius: 99px; padding: calc(var(--u) * .4) calc(var(--u) * 1.6); }
  #bai { position: relative; flex: none; width: 100%; max-width: calc(var(--u) * 120); }
  #ban { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: calc(var(--u) * 1.4); margin: calc(var(--u) * 1) 0; flex: 1 1 auto; min-height: 0; }
  .tu { font: inherit; font-weight: 800; font-size: calc(var(--u) * 4.8); min-width: calc(var(--u) * 12); text-align: center; padding: calc(var(--u) * .6) calc(var(--u) * 1.8); border-radius: calc(var(--u) * 2.2);
        background: linear-gradient(#fffdf2, #fff3c4); border: calc(var(--u) * .4) solid #e0a526; color: var(--ink); cursor: grab; touch-action: none; box-shadow: 0 calc(var(--u) * .6) 0 #c58a14; }
  .tu.chon { outline: calc(var(--u) * .7) solid #e63946; transform: translateY(-4px); }
  .tu.keo { position: fixed; z-index: 50; pointer-events: none; transform: scale(1.12) rotate(-3deg); box-shadow: 0 calc(var(--u) * 1.6) calc(var(--u) * 2) #0004; }
  .tu.lac { animation: lac .45s; }
  @keyframes lac { 20% { transform: translateX(-9px) rotate(-4deg); } 40% { transform: translateX(9px) rotate(4deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  #gio { display: flex; justify-content: space-around; align-items: flex-end; gap: calc(var(--u) * 1); }
  .gio { position: relative; flex: none; width: var(--b); height: calc(var(--b) * 1.02); cursor: pointer; }
  .gio svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .gio .truoc { z-index: 3; pointer-events: none; }
  .gio .sau { z-index: 1; }
  .gio.sang { filter: drop-shadow(0 0 calc(var(--u) * 1.4) #ffe14d); transform: scale(1.04); }
  .gio .bang { position: absolute; z-index: 4; left: 50%; top: 52%; transform: translateX(-50%) rotate(-2deg); background: linear-gradient(#fff9e0, #ffe9a0); border: calc(var(--u) * .45) solid #8a5a12; border-radius: calc(var(--u) * 1.3);
               font-weight: 800; font-size: calc(var(--u) * 4.8); line-height: 1; padding: calc(var(--u) * .4) calc(var(--u) * 1.8); color: #c2410c; box-shadow: 0 calc(var(--u) * .5) 0 #8a5a12; white-space: nowrap; }
  .gio .bang small { display: block; font-size: calc(var(--u) * 1.3); font-weight: 700; color: var(--ink); text-align: center; }
  .gio .trong { position: absolute; z-index: 5; left: 4%; right: 4%; bottom: 60%; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-end; gap: calc(var(--u) * .4); pointer-events: none; }
  .gio .trong span { font-weight: 800; font-size: calc(var(--u) * 3.4); background: #fffbe8; border: calc(var(--u) * .3) solid #e0a526; border-radius: calc(var(--u) * 1.2); padding: 0 calc(var(--u) * 1); animation: roi .35s; }
  @keyframes roi { from { transform: translateY(-30px) scale(1.2); opacity: .2; } }
  #thong-bao { position: absolute; left: 50%; top: 27%; transform: translateX(-50%); z-index: 20; font-weight: 800; font-size: calc(var(--u) * 3.4); padding: calc(var(--u) * .8) calc(var(--u) * 2.6); border-radius: 99px; background: #fff; box-shadow: 0 4px 12px #0003; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #thong-bao.hien { opacity: 1; }
  #thong-bao.dung { color: #1b7f3a; } #thong-bao.sai { color: #c0392b; }
  .man { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: #1d3557cc; }
  .man[hidden] { display: none; }
  .the-ket { background: #fff; border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 3) calc(var(--u) * 4); text-align: center; max-width: 92vw; box-shadow: 0 10px 30px #0006; border: calc(var(--u) * .6) solid #f2b705; }
  .the-ket h2 { margin: 0 0 calc(var(--u) * 1); font-size: calc(var(--u) * 4.6); color: #c2410c; }
  .the-ket .sao { font-size: calc(var(--u) * 7); letter-spacing: 4px; }
  .the-ket p { margin: calc(var(--u) * .6) 0; font-size: calc(var(--u) * 2.5); }
  .nut-lon { font: inherit; font-weight: 800; font-size: calc(var(--u) * 3.4); border: 0; border-radius: 99px; padding: calc(var(--u) * 1.2) calc(var(--u) * 4); background: #e63946; color: #fff; cursor: pointer; box-shadow: 0 5px 0 #a4202c; margin-top: calc(var(--u) * 1.4); }
  .the-ket input { font: inherit; font-size: calc(var(--u) * 3); padding: calc(var(--u) * 1) calc(var(--u) * 1.6); border: 3px solid #1d7bd8; border-radius: 14px; width: min(70vw, 60ch); text-align: center; margin-top: calc(var(--u) * 1); user-select: text; -webkit-user-select: text; }
  .nho { font-size: calc(var(--u) * 2); color: #5b6b80; }
  .hieu { position: fixed; right: calc(var(--u) * 1.5); bottom: calc(var(--u) * 1); font-size: calc(var(--u) * 1.8); font-weight: 700; color: #3f6b1c; opacity: .85; }
  .hat { position: fixed; z-index: 60; pointer-events: none; font-size: calc(var(--u) * 4); animation: bay 1.4s ease-out forwards; }
  @keyframes bay { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
  @media (max-aspect-ratio: 1/1) { :root { --u: min(1.9vw, 1.2vh); } .tu { min-width: calc(var(--u) * 14); } }
</style>
</head>
<body>
<div class="may m1"></div><div class="may m2"></div>
<div id="khung">
  <h1>Giỏ tre vui vẻ</h1>
  <div class="sub">Kéo mỗi từ vào giỏ có vần đúng nhé!</div>
  <div class="hang"><button class="nut-nho nut-nghe" id="nghe">🔊 Nghe</button><span class="dem" id="dem">0/6</span></div>
  <div id="ban"></div>
  <div id="bai">
    <div id="gio"></div>
  </div>
</div>
<div id="thong-bao"></div>
<div class="hieu">Cô Điệp AI</div>

<div class="man" id="man-dau">
  <div class="the-ket">
    <h2>Giỏ tre vui vẻ</h2>
    <p>Bài 34: am - ăm - âm</p>
    <div id="o-ten" hidden><input id="ten-hs" type="text" maxlength="40" autocomplete="off" placeholder="Họ và tên"></div>
    <button class="nut-lon" id="bat-dau">Bắt đầu!</button>
  </div>
</div>
<div class="man" id="man-cuoi" hidden><div class="the-ket" id="the-cuoi"></div></div>

<script>
window.onerror = (m, f, d) => {
  const goc = s => String(s || "").split(/[?#]/)[0];
  if (/zalo|FBNav|instagram/i.test(m) || !f || goc(f) !== goc(location.href)) return; // lỗi của app Zalo/Facebook chèn vào, không phải của trò chơi
  const o = document.getElementById('loi-may') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'loi-may' }));
  o.style.cssText = 'position:fixed;left:0;top:0;z-index:99;background:#c0392b;color:#fff;padding:6px 10px;font:14px sans-serif';
  o.textContent = 'Lỗi: ' + m + ' (dòng ' + d + ')';
};
// ====== NỘI DUNG BÀI (đổi bài thì chỉ sửa khối này) ======
const D = {
  tenBai: 'Bài 34 am ăm âm - Giỏ tre kéo thả',
  gio: [{ van: 'am', doc: 'am' }, { van: 'ăm', doc: 'ắm' }, { van: 'âm', doc: 'ớm' }],
  tu: [['cam', 'am'], ['khám', 'am'], ['ẵm', 'ăm'], ['cằm', 'ăm'], ['đậm', 'âm'], ['nhẩm', 'âm']]
};
const HD = 'Kéo mỗi từ vào giỏ có vần đúng nhé! Có ba giỏ: vần am, vần ăm, vần âm.';
const KHEN = ['Giỏi quá!', 'Đúng rồi!', 'Hay lắm!', 'Chính xác!'];
// ====== HẾT NỘI DUNG BÀI ======
const $ = id => document.getElementById(id);
const O_NHA = /^https?:/.test(location.protocol) || new URLSearchParams(location.search).has('nha');
const LOP = window.LOP || new URLSearchParams(location.search).get('lop') || '';
let ten = '', sai = {}, xong = 0, dangChon = null;
const trong = {}; // vần -> các từ đã vào

// ---- âm thanh ----
let ac = null;
function keu(fs) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    fs.forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, ac.currentTime + i * .12); g.gain.exponentialRampToValueAtTime(0.5, ac.currentTime + i * .12 + .02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i * .12 + .35);
      o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + i * .12); o.stop(ac.currentTime + i * .12 + .4); });
  } catch (e) {}
}
const vui = () => keu([523, 659, 784]), tiec = () => keu([262, 196]);
// ---- giọng đọc: chỉ đọc khi bấm nút loa ----
let giongViet = null;
function timGiong() {
  if (!window.speechSynthesis) return;
  const ds = speechSynthesis.getVoices().filter(v => /^vi/i.test(v.lang));
  giongViet = ds.find(v => /natural|online|hoaimy/i.test(v.name)) || ds[0] || null;
}
if (window.speechSynthesis) { timGiong(); speechSynthesis.onvoiceschanged = timGiong; }
let choDoc = false;
document.addEventListener('click', e => { if (e.target.closest('.nut-nghe, #nut-loa, #nghe, #nut-nghe')) { choDoc = true; setTimeout(() => choDoc = false, 0); } }, true);
function doc(chu) {
  if (!choDoc || !window.speechSynthesis || !giongViet) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(chu); u.voice = giongViet; u.lang = giongViet.lang; u.rate = 0.85; speechSynthesis.speak(u);
}
$('nghe').onclick = () => doc(HD);

// ---- dựng giao diện ----
const SVG_SAU = `<svg class="sau" viewBox="0 0 200 190"><ellipse cx="100" cy="62" rx="84" ry="22" fill="#8a5a12"/><ellipse cx="100" cy="62" rx="76" ry="17" fill="#5b3a08"/>
  <path d="M30 30 C30 -22 170 -22 170 30" fill="none" stroke="#b9802a" stroke-width="9" stroke-linecap="round"/><path d="M30 30 C30 -14 170 -14 170 30" fill="none" stroke="#f0cf7a" stroke-width="3" stroke-linecap="round"/></svg>`;
const SVG_TRUOC = `<svg class="truoc" viewBox="0 0 200 190"><defs>
  <pattern id="det" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#e3b04e"/>
    <path d="M0 4h16M0 12h16" stroke="#f3d27e" stroke-width="5"/><path d="M4 0v8M12 8v8" stroke="#b9802a" stroke-width="5"/><path d="M0 8h16M0 16h16" stroke="#c28a2e" stroke-width="1"/></pattern></defs>
  <path d="M16 62 Q100 92 184 62 L160 176 Q100 192 40 176 Z" fill="url(#det)" stroke="#8a5a12" stroke-width="4" stroke-linejoin="round"/>
  <path d="M16 62 Q100 92 184 62" fill="none" stroke="#8a5a12" stroke-width="12" stroke-linecap="round"/><path d="M16 62 Q100 92 184 62" fill="none" stroke="#f0cf7a" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 124 Q100 142 170 124" fill="none" stroke="#8a5a12" stroke-width="6" stroke-linecap="round"/></svg>`;
D.gio.forEach(g => {
  const e = document.createElement('div'); e.className = 'gio'; e.dataset.van = g.van;
  e.innerHTML = SVG_SAU + `<div class="trong" id="t-${g.van}"></div>` + SVG_TRUOC + `<div class="bang">${g.van}<small>vần ${g.van}</small></div>`;
  $('gio').appendChild(e); trong[g.van] = [];
});
const mang = D.tu.map(x => x.slice()).sort(() => Math.random() - .5);
function veTu() {
  $('ban').textContent = '';
  mang.forEach(([chu, van]) => {
    if (trong[van].includes(chu)) return;
    const b = document.createElement('div'); b.className = 'tu'; b.textContent = chu; b.dataset.chu = chu; b.dataset.van = van; $('ban').appendChild(b);
  });
  $('dem').textContent = `${xong}/${D.tu.length}`;
}
function noi(chu, loai) {
  const t = $('thong-bao'); t.textContent = chu; t.className = 'hien ' + loai; clearTimeout(noi.h); noi.h = setTimeout(() => t.className = '', 1100);
}
function hat() {
  for (let i = 0; i < 14; i++) { const s = document.createElement('div'); s.className = 'hat'; s.textContent = ['⭐', '🌼', '🐝', '✨'][i % 4];
    s.style.left = (30 + Math.random() * 40) + 'vw'; s.style.top = '40vh'; s.style.setProperty('--dx', (Math.random() * 60 - 30) + 'vw'); s.style.setProperty('--dy', (Math.random() * -40 - 5) + 'vh'); s.style.setProperty('--r', (Math.random() * 360) + 'deg');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1500); }
}
// ---- thả từ vào giỏ ----
function tha(el, giỏ) {
  const chu = el.dataset.chu, van = el.dataset.van, vanGio = giỏ.dataset.van;
  if (van === vanGio) {
    trong[van].push(chu); xong++;
    const s = document.createElement('span'); s.textContent = chu; $('t-' + van).appendChild(s);
    noi(KHEN[Math.floor(Math.random() * KHEN.length)], 'dung'); vui(); dangChon = null; veTu();
    if (xong === D.tu.length) setTimeout(ketThuc, 700);
  } else {
    sai[chu] = (sai[chu] || 0) + 1;
    noi(`Từ "${chu}" chưa vào giỏ vần ${vanGio}. Con thử lại nhé!`, 'sai'); tiec();
    el.classList.remove('chon'); el.classList.add('lac'); setTimeout(() => el.classList.remove('lac'), 500); dangChon = null;
  }
}
function giỏDuoi(x, y) { return [...document.elementsFromPoint(x, y)].map(e => e.closest && e.closest('.gio')).find(Boolean) || null; }
let keo = null;
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('.tu');
  if (!t) return;
  e.preventDefault();
  keo = { t, x0: e.clientX, y0: e.clientY, bay: false, id: e.pointerId, r: t.getBoundingClientRect() };
});
document.addEventListener('pointermove', e => {
  if (!keo || e.pointerId !== keo.id) return;
  if (!keo.bay && Math.hypot(e.clientX - keo.x0, e.clientY - keo.y0) > 8) {
    keo.bay = true; keo.t.classList.add('keo'); keo.t.style.width = keo.r.width + 'px'; keo.t.style.height = keo.r.height + 'px'; dangChon && dangChon.classList.remove('chon');
  }
  if (keo.bay) {
    keo.t.style.left = (e.clientX - keo.r.width / 2) + 'px'; keo.t.style.top = (e.clientY - keo.r.height / 2) + 'px';
    document.querySelectorAll('.gio').forEach(g => g.classList.remove('sang')); const g = giỏDuoi(e.clientX, e.clientY); if (g) g.classList.add('sang');
  }
});
function nha(e) {
  if (!keo || e.pointerId !== keo.id) return;
  const k = keo; keo = null;
  document.querySelectorAll('.gio').forEach(g => g.classList.remove('sang'));
  if (k.bay) {
    const g = giỏDuoi(e.clientX, e.clientY);
    k.t.classList.remove('keo'); k.t.style.cssText = '';
    if (g) tha(k.t, g);
  } else { // chạm nhẹ: chọn từ rồi chạm giỏ (cho các con chưa quen kéo)
    if (dangChon) dangChon.classList.remove('chon');
    dangChon = (dangChon === k.t) ? null : k.t; if (dangChon) dangChon.classList.add('chon');
  }
}
document.addEventListener('pointerup', nha); document.addEventListener('pointercancel', nha);
$('gio').addEventListener('click', e => { const g = e.target.closest('.gio'); if (g && dangChon) tha(dangChon, g); });

// ---- kết thúc + ghi kết quả ----
function chiTiet() {
  const s = Object.keys(sai);
  return `Đúng ngay lần đầu ${D.tu.length - s.length}/${D.tu.length}. ` + (s.length ? 'Cần ôn: ' + s.map(c => `${c} (${sai[c]})`).join(', ') : 'Không, con làm đúng hết');
}
function ketThuc() {
  const diem = D.tu.length - Object.keys(sai).length, sao = diem >= 5 ? '⭐⭐⭐' : diem >= 3 ? '⭐⭐' : '⭐';
  hat(); keu([392, 523, 659, 784, 1047]);
  $('the-cuoi').innerHTML = `<h2>Hoàn thành rồi!</h2><div class="sao">${sao}</div><p>Đúng ngay lần đầu: <b>${diem}/${D.tu.length}</b> từ</p>
    <p>${Object.keys(sai).length ? 'Con ôn thêm: ' + Object.keys(sai).join(', ') : 'Con không sai từ nào!'}</p><div class="nho" id="loi-nhan"></div><button class="nut-lon" id="lai">Chơi lại</button>`;
  $('man-cuoi').hidden = false; $('lai').onclick = () => { $('man-cuoi').hidden = true; choiLai(); };
  guiKetQua(diem);
}
const LINK_SHEET = 'https://script.google.com/macros/s/AKfycbzE5tlog_osSNJ7Tsr4SnJPQCiv5LpyfQaDj8jNHNYzT9YEMGnQHTJrrpNXV_45lq1t/exec';
// Chỉ ghi kết quả khi link có ?lop=... (link lớp mình); link chia sẻ thì không ghi
function guiKetQua(diem) {
  const CHUP = 'Ba mẹ chụp màn hình này gửi cô nhé.';
  if (!LOP) { $('loi-nhan').textContent = O_NHA ? CHUP : ''; return; }
  $('loi-nhan').textContent = 'Đang gửi kết quả cho cô...';
  const d = { lop: LOP, ten, bai: D.tenBai, dungLanDau: diem, soCau: D.tu.length, chiTiet: chiTiet() };
  const ok = () => { $('loi-nhan').textContent = 'Đã gửi kết quả cho cô.'; };
  const loi = () => { $('loi-nhan').textContent = 'Chưa gửi được. ' + CHUP; };
  if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(ok).withFailureHandler(loi).ghiKetQua(d);
  else fetch(LINK_SHEET, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) }).then(ok, loi);
}
function choiLai() {
  sai = {}; xong = 0; dangChon = null; D.gio.forEach(g => { trong[g.van] = []; $('t-' + g.van).textContent = ''; });
  mang.sort(() => Math.random() - .5); veTu();
}
// ---- bắt đầu ----
if (LOP) $('o-ten').hidden = false;
$('bat-dau').onclick = () => {
  if (LOP) { ten = $('ten-hs').value.trim(); if (!ten) { $('ten-hs').focus(); $('ten-hs').placeholder = 'Con ghi họ và tên nhé'; return; } }
  $('man-dau').hidden = true; keu([659]); veTu();
};
veTu();
</script>
</body>
</html>
