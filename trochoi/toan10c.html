<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>Thêm vào bằng mấy - Toán 1 Bài 10 tiết 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Trò lắp ghép miếng bìa theo SGK Toán 1 Bài 8 "Thực hành lắp ghép, xếp hình".
     Kiểu chơi: kéo miếng bìa (hoặc chạm miếng bìa rồi chạm vào chỗ muốn đặt) vào bóng của hình cần ghép.
     Miếng đặt đúng chỗ thì tự xoay cho khớp. Nút "Gợi ý" hiện đường ghép.
     Chặng được khai báo trong khối DỮ LIỆU: loai 'ghep' (lắp ghép), 'dem' (đếm miếng), 'doi' (tìm 2 miếng ghép thành hình).
     Mở file trên máy ở lớp: cả lớp chơi trên tivi. Mở bằng link (hoặc thêm ?nha): con tự chơi, cuối bài có phiếu kết quả. */
  :root {
    --u: min(1vh, 1.25vw);
    --nen: #e6fcf5; --chu: #12304a; --xanh: #0b7285; --do: #e03131; --la: #2f9e44; --la-dam: #1e6b2e;
    --cam: #f08c00; --cam-dam: #b86200; --vang: #ffe066;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu); background: var(--nen);
    display: flex; flex-direction: column; gap: calc(var(--u) * 1);
    padding: calc(var(--u) * 1.2) max(14px, 2vw);
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  button { font-family: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--chu); outline-offset: 3px; }
  input { -webkit-user-select: text; user-select: text; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; }
  h1 { font-size: max(20px, calc(var(--u) * 4.2)); color: var(--xanh); line-height: 1.1; }
  h1 span:first-child { font-family: var(--emoji); }
  #chang { display: flex; gap: 6px; flex-wrap: wrap; }
  #chang button { font-size: max(14px, calc(var(--u) * 2.5)); padding: 3px 12px; border-radius: 30px; border: 3px solid var(--xanh); background: #fff; color: var(--xanh); }
  #chang button.dang { background: var(--xanh); color: #fff; }
  #chang button.xong::after { content: " ✓"; }
  .nut-vien { font-size: max(15px, calc(var(--u) * 2.8)); color: var(--xanh); background: #fff; border: 3px solid var(--xanh); border-radius: 30px; padding: 2px 14px; }
  .diem { font-size: max(16px, calc(var(--u) * 3.2)); color: #c25e00; }

  #de { text-align: center; text-wrap: balance; line-height: 1.2; font-size: max(21px, calc(var(--u) * 4.6)); }
  #de b { color: var(--do); }
  #san { flex: 1; min-height: 0; position: relative; background: #fff; border: 6px solid var(--xanh); border-radius: calc(var(--u) * 4);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 1.4); padding: calc(var(--u) * 1.4); overflow: hidden; }
  #bao { min-height: max(26px, calc(var(--u) * 5.2)); text-align: center; text-wrap: balance; font-size: max(19px, calc(var(--u) * 4.2)); line-height: 1.2; }
  #bao.dung { color: var(--la); } #bao.sai { color: #e8590c; }
  #hang { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: max(10px, calc(var(--u) * 2)); padding-bottom: 8px; }
  .nut { border: none; border-radius: calc(var(--u) * 2.5); color: #fff; background: var(--cam); box-shadow: 0 6px 0 var(--cam-dam);
    font-size: max(24px, calc(var(--u) * 6)); min-width: max(60px, calc(var(--u) * 12)); min-height: max(58px, calc(var(--u) * 11)); padding: 4px max(14px, calc(var(--u) * 3)); line-height: 1.1; }
  .nut:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--cam-dam); }
  .nut.sai { background: #b9c2cc; box-shadow: 0 6px 0 #8a949e; animation: lac .4s; }
  .nut.dung, .nut.xanh { background: var(--la); box-shadow: 0 6px 0 var(--la-dam); }
  .nut svg { width: max(64px, calc(var(--u) * 13)); height: max(64px, calc(var(--u) * 13)); display: block; }
  .nut.hinh { background: #fff; border: 5px solid #63e6be; box-shadow: 0 6px 0 #20c997; color: var(--chu); padding: 6px; }
  .nut.hinh.sai { background: #f1f3f5; opacity: .5; }
  .nut.hinh.dung { background: #d3f9d8; border-color: var(--la); }
  @keyframes lac { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .goi-y-chu { font-size: max(15px, calc(var(--u) * 3)); color: #5c6b7a; text-align: center; }

  /* lắp ghép: bảng hình + khay miếng bìa */
  #bang { flex: 1; min-height: max(150px, 32vh); width: 100%; }
  #bang .bong { fill: #e9ecef; stroke: #e9ecef; stroke-width: 2.5; stroke-linejoin: round; }
  #bang .vien-bong { fill: none; stroke: #868e96; stroke-width: 5; stroke-linejoin: round; }
  #bang .duong { fill: none; stroke: #adb5bd; stroke-width: 2.5; stroke-dasharray: 8 6; }
  #bang .da-dat { stroke: #12304a; stroke-width: 3; stroke-linejoin: round; animation: vao .35s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes vao { from { transform: scale(.6); opacity: .3; } to { transform: scale(1); opacity: 1; } }
  #bang .sai-cho { fill: #ffa8a8; opacity: .7; }
  .khay { display: flex; gap: calc(var(--u) * 2); justify-content: center; flex-wrap: wrap; min-height: max(64px, calc(var(--u) * 12)); }
  .mieng { background: #f8f9fa; border: 4px solid #dee2e6; border-radius: 14px; padding: 6px; touch-action: none; }
  .mieng svg { width: max(52px, calc(var(--u) * 10)); height: max(52px, calc(var(--u) * 10)); display: block; overflow: visible; pointer-events: none; }
  .mieng.chon { border-color: var(--xanh); background: #c3fae8; transform: translateY(-6px); }
  #bong-keo { position: fixed; z-index: 9; pointer-events: none; width: 70px; height: 70px; transform: translate(-50%, -50%); opacity: .85; }
  #bong-keo svg { width: 100%; height: 100%; overflow: visible; }

  /* lật thẻ: cặp thẻ anh em (phép tính và kết quả) */
  .bo-the { display: grid; grid-template-columns: repeat(var(--cot, 4), 1fr); gap: calc(var(--u) * 1.6); width: min(100%, calc(var(--u) * 110)); }
  .the-lat { aspect-ratio: 3 / 2; border-radius: 14px; border: 4px solid #1971c2; background: repeating-linear-gradient(45deg, #4dabf7 0 10px, #74c0fc 10px 20px); color: transparent; font-size: max(20px, calc(var(--u) * 5)); }
  .the-lat.mo { background: #fff; color: var(--chu); }
  .the-lat.phep.mo { background: #ffe3e3; border-color: #e03131; }
  .the-lat.so.mo { background: #e7f5ff; }
  .the-lat.xong { background: #d3f9d8; border-color: var(--la); color: var(--la); }
  @media (max-width: 600px) { .bo-the { --cot: 3; } }
  /* hái quả: cây táo, mỗi quả một phép tính */
  .cay { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .tan { background: radial-gradient(ellipse at 50% 45%, #8ce99a, #2f9e44 72%); border: 5px solid #1e6b2e; border-radius: 50% 50% 46% 46%; padding: calc(var(--u) * 4) calc(var(--u) * 5);
    display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 1.6); max-width: min(100%, calc(var(--u) * 110)); }
  .goc { width: max(30px, calc(var(--u) * 6)); height: max(30px, calc(var(--u) * 6)); background: #8a5221; border: 4px solid #5c3412; border-top: none; }
  .qua { min-width: max(74px, calc(var(--u) * 15)); height: max(64px, calc(var(--u) * 12)); border-radius: 50% 50% 46% 46%; border: 4px solid #a61e1e;
    background: radial-gradient(circle at 35% 30%, #ff8787, #e03131 70%); color: #fff; font-size: max(20px, calc(var(--u) * 4.4)); text-shadow: 0 2px 0 #a61e1e; padding: 0 8px; position: relative; }
  .qua::before { content: ""; position: absolute; top: -10px; left: 50%; width: 5px; height: 12px; background: #5c3412; border-radius: 3px; }
  .qua.da-hai { visibility: hidden; }
  .qua.lac { animation: lac .4s; }
  .gio-qua { position: absolute; right: 2%; bottom: 2%; font-size: max(22px, calc(var(--u) * 5)); background: #fff3bf; border: 4px solid #f08c00; border-radius: 16px; padding: 2px 14px; }
  /* tìm 2 miếng ghép thành hình */
  .doi { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 4); flex-wrap: wrap; }
  .doi svg { width: max(170px, calc(var(--u) * 36)); height: max(170px, calc(var(--u) * 36)); overflow: visible; }
  .doi .dau { font-size: max(36px, calc(var(--u) * 9)); color: var(--xanh); }
  .ghep-xong { animation: vao .5s ease-out; }

  .phu { position: fixed; inset: 0; z-index: 10; background: rgba(11, 114, 133, .93); display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
  .the { background: #fff; border-radius: 26px; border: 8px solid var(--vang); padding: 22px 28px; text-align: center; width: min(100%, 34em);
    display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: max(18px, calc(var(--u) * 3.6)); }
  .the h2 { font-size: max(28px, calc(var(--u) * 7)); color: var(--xanh); line-height: 1.1; }
  .the .lon { font-family: var(--emoji); font-size: max(60px, calc(var(--u) * 13)); line-height: 1; }
  .the .nho { font-size: max(15px, calc(var(--u) * 2.8)); color: #5c6b7a; }
  .thuong-hieu { font-size: max(16px, calc(var(--u) * 3)); background: var(--vang); border-radius: 30px; padding: 2px 18px; }
  #ten-hs { font-family: inherit; font-weight: 800; text-align: center; font-size: max(22px, calc(var(--u) * 4.6)); width: min(100%, 20em); padding: .25em .5em; border: 5px solid var(--vang); border-radius: 16px; color: var(--chu); }
  .phieu { text-align: left; line-height: 1.5; background: #f8f9fa; border-radius: 16px; padding: 10px 18px; width: 100%; }
  .phieu b { color: var(--xanh); }
  #loi-may { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 20; background: #fff; color: #c00; border: 3px solid #c00; border-radius: 12px; padding: 8px; font-size: 15px; }
  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 11; }
  #phao i { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: roi linear forwards; }
  @keyframes roi { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { #phao { display: none; } #bang .da-dat, .ghep-xong { animation: none; } }
</style>

<header>
  <h1><span>➕</span> <span id="ten-tro"></span></h1>
  <div id="chang"></div>
  <button class="nut-vien" id="nut-loa" title="Nghe câu hỏi">🔊 Nghe</button>
  <div class="diem">⭐ <span id="sao">0</span></div>
</header>
<div id="de"></div>
<div id="san"></div>
<div id="bao"></div>
<div id="hang"></div>
<div id="bong-keo" hidden></div>

<div class="phu" id="mo-dau" hidden>
  <div class="the">
    <div class="thuong-hieu">Cô Điệp AI</div>
    <div class="lon">🍎➕🍏</div>
    <h2 id="md-ten"></h2>
    <div id="md-bai"></div>
    <label for="ten-hs">Con tên là gì?</label>
    <input id="ten-hs" type="text" maxlength="40" autocomplete="off" placeholder="Họ và tên">
    <button class="nut xanh" id="nut-bat-dau">Bắt đầu</button>
  </div>
</div>
<div class="phu" id="phu" hidden><div class="the" id="the"></div></div>
<div id="phao"></div>

<script>
// nếu máy nào báo lỗi, hiện lỗi lên màn hình để chụp gửi cô
window.onerror = (m, f, d) => {
  const goc = s => String(s || "").split(/[?#]/)[0];
  if (/zalo|FBNav|instagram/i.test(m) || !f || goc(f) !== goc(location.href)) return; // lỗi của app Zalo/Facebook chèn vào, không phải của trò chơi
  const o = document.getElementById('loi-may') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'loi-may' }));
  o.textContent = 'Lỗi: ' + m + ' (dòng ' + d + ')';
};
// miếng bìa: cạnh hình vuông là 100; tam giác là nửa hình vuông cắt chéo; chữ nhật là nửa hình vuông cắt ngang
const C = 70.7;   // nửa đường chéo hình vuông cạnh 100
const vuong = (x, y) => [[x, y], [x + 100, y], [x + 100, y + 100], [x, y + 100]];
const nhat = (x, y, dung) => dung ? [[x, y], [x + 50, y], [x + 50, y + 100], [x, y + 100]] : [[x, y], [x + 100, y], [x + 100, y + 50], [x, y + 50]];

// ====== DỮ LIỆU (bài khác chỉ cần thay khối này) ======
// Mỗi chặng có hàm tao() tạo câu hỏi mới mỗi lượt chơi.
const CAP = [['🍎', '🍏'], ['🔴', '🔵'], ['🐰', '🐻'], ['🌸', '🌼'], ['🐟', '🐠'], ['🚗', '🚙'], ['🎈', '🧸'], ['🐥', '🦆'], ['🍊', '🍐'], ['⭐', '💎']];
const o2 = (e, n) => n ? `<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:${n > 4 ? 4.6 : n > 3 ? 3.4 : 2.3 * n}em;border:4px dashed #74c0fc;border-radius:16px;padding:8px">${e.repeat(n)}</div>`
  : '<div style="width:2.4em;height:2.4em;border:4px dashed #74c0fc;border-radius:50%;background:#f1f3f5"></div>';
const tranh2 = (e1, n1, e2, n2, duoi = '', giua = '') => `<div style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2)">
  <div style="display:flex;gap:calc(var(--u)*3);align-items:center;justify-content:center;font-family:var(--emoji);font-size:max(34px, calc(var(--u)*8.5));line-height:1.1">${o2(e1, n1)}${giua}${o2(e2, n2)}</div>
  ${duoi ? `<div style="font-size:max(34px, calc(var(--u)*8.5));color:#0b7285;text-align:center">${duoi}</div>` : ''}</div>`;
const o = v => `<span style="display:inline-block;min-width:1.2em;border:4px ${v === '?' ? 'dashed #e03131;color:#e03131' : 'solid #74c0fc'};border-radius:12px;padding:0 .2em;margin:0 .1em">${v}</span>`;
const boSoC = (n, max = 10, min = 0) => { const s = new Set([n]); for (const d of tron([-2, -1, 1, 2])) if (n + d >= min && n + d <= max && s.size < 4) s.add(n + d); return [...s].sort((a, b) => a - b).map(v => [v, v]); };
const SO_CHU = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín', 'mười'];
function capCong(so, max, min = 1) {
  const ds = [];
  for (let a = min; a <= max; a++) for (let b = min; a + b <= max; b++) if (a + b > 0) ds.push([a, b]);
  return tron(ds).slice(0, so);
}
const taoPT = (so, max, min = 1) => () => capCong(so, max, min).map(([a, b]) => {
  const [e1, e2] = lay(CAP), dung = `${a} + ${b} = ${a + b}`, sai = new Set();
  for (const [x, y] of tron([[a, b + 1], [a + 1, b], [a, b - 1], [a - 1, b], [a + 1, b + 1]])) if (x >= 0 && y >= 0 && x + y <= max + 1 && `${x}${y}` !== `${b}${a}` && sai.size < 2) sai.add(`${x} + ${y} = ${x + y}`);
  return { hoi: 'Phép tính nào đúng với tranh?', tranh: tranh2(e1, a, e2, b), nho: true,
    chon: [[dung, 'd'], ...[...sai].map(s => [s, s])], dung: 'd', khen: `Có ${a} và ${b}, tất cả là ${a + b}: ${dung}.` };
});
const taoHai = (dichs, max, min = 1) => () => dichs.map(dich => {
  const dung = tron(capCong(99, dich, min).filter(([a, b]) => a + b === dich)).slice(0, 3).map(([a, b]) => `${a} + ${b}`);
  const sai = tron(capCong(99, max, min).filter(([a, b]) => a + b !== dich)).slice(0, 9 - dung.length).map(([a, b]) => `${a} + ${b}`);
  return { dich, qua: tron([...dung, ...sai]) };
});
// bảng cộng như SGK: hàng trên số thứ nhất, hàng giữa số thứ hai, hàng dưới kết quả; một ô kết quả là ?
const bangCong = (cot, an) => `<table style="border-collapse:collapse;font-size:max(22px, calc(var(--u)*5.2));text-align:center">
  <tr><td rowspan="2" style="background:#ffe8a3;border:3px solid #74c0fc;padding:0 .5em;color:#e8590c">+</td>${cot.map(([a]) => `<td style="background:#ffe8a3;border:3px solid #74c0fc;padding:2px .55em">${a}</td>`).join('')}</tr>
  <tr>${cot.map(([, b]) => `<td style="background:#ffe8a3;border:3px solid #74c0fc;padding:2px .55em">${b}</td>`).join('')}</tr>
  <tr><td style="border:3px solid #74c0fc"></td>${cot.map(([a, b], j) => `<td style="border:3px solid #74c0fc;padding:2px .55em;${j === an ? 'color:#e03131;background:#fff5f5;border:4px dashed #e03131' : 'color:#adb5bd'}">${j === an ? '?' : a + b}</td>`).join('')}</tr></table>`;
const taoBang = (tongs, so) => () => { const daHoi = new Set(); return tron(Array.from({ length: so }, (_, k) => tongs[k % tongs.length])).map(s => {
  const cot = []; for (let a = Math.min(9, s); a >= Math.max(0, s - 9) && cot.length < 6; a--) cot.push([a, s - a]);
  let an; do { an = Math.floor(Math.random() * cot.length); } while (daHoi.has(s + '-' + an) && daHoi.size < cot.length); daHoi.add(s + '-' + an);
  const [a, b] = cot[an];
  return { hoi: `Bảng cộng: ${a} + ${b} = ?`, noi: `${a} cộng ${b} bằng mấy?`,
    tranh: `<div style="flex:1;display:flex;align-items:center;justify-content:center;max-width:100%;overflow:auto">${bangCong(cot, an)}</div>`,
    chon: boSoC(s, 10, 0), dung: s, khen: `${a} + ${b} = ${s}.` };
}); };
// số còn thiếu: a + ? = s hoặc ? + b = s
const taoThieu = (so, max) => () => capCong(so, max).map(([a, b], k) => {
  const truoc = k % 2 === 1, s = a + b;
  const pt = truoc ? `${o('?')} + ${b} = ${s}` : `${a} + ${o('?')} = ${s}`;
  return { hoi: truoc ? `Số nào điền vào ô trống? ? + ${b} = ${s}` : `Số nào điền vào ô trống? ${a} + ? = ${s}`, noi: truoc ? `Mấy cộng ${b} bằng ${s}?` : `${a} cộng mấy bằng ${s}?`,
    tranh: `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2)"><div style="font-size:max(44px, calc(var(--u)*12));color:#0b7285">${pt}</div>
      <div class="goi-y-chu">${truoc ? `Mấy thêm ${b} thì được ${s}?` : `Có ${a}, thêm mấy thì được ${s}?`}</div></div>`,
    chon: boSoC(truoc ? a : b, 10, 0), dung: truoc ? a : b, khen: `${a} + ${b} = ${s}.` };
});
// Tiết 3 (SGK tr.60-61): thêm vào thì bằng mấy, đếm thêm, đường đua; tổng không quá 10
const taoThem = so => () => tron([[5, 2], [6, 1], [4, 3], [7, 2], [6, 3], [5, 3], [8, 1], [7, 3], [6, 4], [4, 2], [8, 2], [5, 4]]).slice(0, so).map(([a, b]) => {
  const [e1, e2] = lay(CAP), dem = Array.from({ length: b + 1 }, (_, k) => a + k).join(', ');
  return { hoi: `Có ${a}, thêm ${b}. ${a} + ${b} = ?`, noi: `Có ${a}, thêm ${b} thì bằng mấy?`,
    tranh: tranh2(e1, a, e2, b, `${o(a)} + ${o(b)} = ${o('?')}`, '<span style="font-size:.7em;color:#0b7285">➕</span>'),

    ds.push({ h, loai, n: loai === 'tat' ? h.mieng.length : h.mieng.filter(m => m[0] === loai).length });

const dem = m => (m || []).filter(Boolean).length;

function chiTiet() {
  const on = [];

  return D.chang.map((c, n) => `${c.ten} ${dem(kq[n])}/${soCau(c)}`).join(', ') + (on.length ? `. Cần ôn: ${on.join('; ')}` : '');

function hetBai() {

  } else {
    const d = new Date(), hai = n => String(n).padStart(2, '0'), dong = [];
    if (ten) dong.push(['Tên', ten]);

    dong.push(['Lúc', `${hai(d.getHours())}:${hai(d.getMinutes())} ngày ${hai(d.getDate())}/${hai(d.getMonth() + 1)}/${d.getFullYear()}`]);
    moThe(`<div class="thuong-hieu">Cô Điệp AI</div><div class="lon">${saoKq}</div><h2>Con giỏi quá!</h2>
      <div class="phieu" id="phieu"></div><div class="nho" id="loi-nhan"></div><button class="nut xanh" id="lai">Chơi lại</button>`);
    dong.forEach(([nhan, gt]) => { const p = document.createElement('div'), b = document.createElement('b'); b.textContent = gt; p.append(nhan + ': ', b); $('phieu').appendChild(p); });

const LINK_SHEET = 'https://script.google.com/macros/s/AKfycbzE5tlog_osSNJ7Tsr4SnJPQCiv5LpyfQaDj8jNHNYzT9YEMGnQHTJrrpNXV_45lq1t/exec';
// Chỉ ghi kết quả khi link có ?lop=... (link lớp mình); link chia sẻ thì không ghi
function guiKetQua(diem) {
  const CHUP = 'Ba mẹ chụp màn hình này gửi cô nhé.';
  const lop = window.LOP || new URLSearchParams(location.search).get('lop') || '';
  if (!lop) { $('loi-nhan').textContent = CHUP; return; }
  $('loi-nhan').textContent = 'Đang gửi kết quả cho cô...';
  const d = { lop, ten, bai: D.tenBai, dungLanDau: diem, soCau: tong(), chiTiet: chiTiet() };
  const xong = () => { $('loi-nhan').textContent = 'Đã gửi kết quả cho cô.'; };
  const loi = () => { $('loi-nhan').textContent = 'Chưa gửi được. ' + CHUP; };
  if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(xong).withFailureHandler(loi).ghiKetQua(d);
  else fetch(LINK_SHEET, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) }).then(xong, loi);
}
