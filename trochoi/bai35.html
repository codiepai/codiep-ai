<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn Bài 35 - Cô Điệp AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Segoe UI",Arial,sans-serif;background:linear-gradient(#cfeeff,#fff7d6);min-height:100vh;color:#23407a}
.hop{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{text-align:center;font-size:28px;margin:8px 0 4px;color:#e0457b}
.phu{text-align:center;font-size:17px;margin:0 0 18px}
.the{display:flex;align-items:center;gap:14px;background:#fff;border:4px solid #7cc7ff;border-radius:22px;padding:14px 16px;margin:12px 0;text-decoration:none;color:#23407a;box-shadow:0 4px 0 #b9dcf5}
.the:active{transform:translateY(2px)}
.so{flex:none;width:46px;height:46px;border-radius:50%;background:#ff9f1c;color:#fff;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center}
.ten{font-size:20px;font-weight:800;line-height:1.2}
.nho{font-size:14px;font-weight:600;color:#5b7bb0}
.xong{margin-left:auto;font-size:26px}
.the.da{border-color:#55c27a;background:#f1fff5}
.the.da .so{background:#55c27a}
.nhac{background:#fff3c4;border-radius:16px;padding:12px 14px;font-size:16px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="hop">
  <h1>Ôn tập Bài 35</h1>
  <p class="phu">Con làm lần lượt 4 trò chơi nhé. Làm xong một trò, bấm nút quay lại để về đây làm trò tiếp theo.</p>
  <div id="ds"></div>
  <div class="nhac">Lỡ thoát ra cũng không sao: mở lại link này, trò nào xong rồi sẽ có dấu tích xanh.</div>
</div>
<script>
var LOP = '';
try { LOP = new URLSearchParams(location.search).get('lop') || ''; } catch (e) {}
var GAME = [
  ['kd35',  'Hộp quà bí mật',  'Khởi động'],
  ['kd35b', 'Đàn cá ôn vần',   'Khởi động'],
  ['tv35',  'Bến đò kéo thả',  'Luyện tập'],
  ['tv35b', 'Bảng vần và đàn cá', 'Luyện tập']
];
var KHOA = 'bai35_da_lam';
var da = {};
try { da = JSON.parse(localStorage.getItem(KHOA) || '{}'); } catch (e) {}
var ds = document.getElementById('ds');
GAME.forEach(function (g, i) {
  var a = document.createElement('a');
  a.className = 'the' + (da[g[0]] ? ' da' : '');
  a.href = g[0] + '.html' + (LOP ? '?lop=' + encodeURIComponent(LOP) : '');
  a.innerHTML = '<span class="so">' + (i + 1) + '</span><span><div class="ten">' + g[1] +
    '</div><div class="nho">' + g[2] + '</div></span><span class="xong">' + (da[g[0]] ? '✅' : '') + '</span>';
  a.addEventListener('click', function () {
    da[g[0]] = 1;
    try { localStorage.setItem(KHOA, JSON.stringify(da)); } catch (e) {}
  });
  ds.appendChild(a);
});
</script>
</body>
</html>
