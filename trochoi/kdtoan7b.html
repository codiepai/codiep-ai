<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>Thắp nến bánh sinh nhật - Khởi động Toán 1 Bài 7 tiết 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Khởi động chiếu tivi, cô điều khiển. Bánh sinh nhật có 5 cây nến chưa thắp, mỗi cây là 1 câu ôn
     (tiết 1 của Bài 7: nhận dạng hình, đếm hình; và mấy và mấy). Đúng thì nến sáng.
     Đủ 5 nến thì cả lớp hô "Phù!" thổi nến, bánh hiện tên bài học: Bài 7 tiết 2 - Luyện tập.
     Đổi nội dung: chỉ sửa mảng CAU và BAI_MOI. */
  :root {
    --u: min(1vh, 1.25vw);
    --chu: #12304a; --xanh: #0b5cab; --do: #e03131; --la: #2f9e44; --la-dam: #1e6b2e; --cam: #f08c00; --cam-dam: #b86200; --vang: #ffe066; --hong: #d6336c;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu);
    background: radial-gradient(circle at 50% 30%, #fff0f6 0, #fcc2d7 75%);
    display: flex; flex-direction: column; gap: calc(var(--u) * 1);
    padding: calc(var(--u) * 1.2) max(14px, 2vw);
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden;
  }
  body.toi { background: radial-gradient(circle at 50% 40%, #5f3dc4 0, #1c1046 75%); color: #fff; }
  button { font-family: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--chu); outline-offset: 3px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; }
  h1 { font-size: max(20px, calc(var(--u) * 4.4)); color: var(--hong); line-height: 1.1; }
  .toi h1 { color: #ffd8e8; }
  .sao { font-size: max(18px, calc(var(--u) * 4)); font-family: var(--emoji); letter-spacing: 2px; }
  #loi { text-align: center; font-size: max(20px, calc(var(--u) * 4.6)); line-height: 1.2; text-wrap: balance; }

  #canh { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  #banh { height: 100%; max-height: calc(var(--u) * 74); width: auto; max-width: 100%; overflow: visible; }
  .nen { cursor: pointer; }
  .nen .lua { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
  .nen.sang .lua { opacity: 1; animation: lap .5s ease-in-out infinite alternate; }
  .nen.sang .the-so { opacity: 0; }
  .nen .khoi { opacity: 0; }
  .nen.tat .khoi { animation: khoi 2s ease-out forwards; }
  .nen.tat .lua { opacity: 0; animation: none; }
  @keyframes lap { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.9, 1.12) rotate(3deg); } }
  @keyframes khoi { 0% { opacity: .9; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } }
  .nen:hover .than { filter: brightness(1.1); }

  #nut-thoi { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: max(20px, calc(var(--u) * 4.6)); padding: 8px 26px; white-space: nowrap;
    border: none; border-radius: 22px; color: #fff; background: var(--hong); box-shadow: 0 6px 0 #a61e4d; animation: nhip 1.2s infinite; }
  @keyframes nhip { 50% { transform: translateX(-50%) scale(1.06); } }

  .phu { position: fixed; inset: 0; z-index: 10; background: rgba(166, 30, 77, .88); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .the { background: #fff; color: var(--chu); border-radius: 28px; border: 8px solid var(--vang); padding: calc(var(--u) * 3) calc(var(--u) * 4); text-align: center;
    width: min(100%, calc(var(--u) * 130)); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.4); }
  .the .so-nen { font-size: max(18px, calc(var(--u) * 3.6)); color: #fff; background: var(--hong); border-radius: 30px; padding: 2px 18px; }
  .the h2 { font-size: max(28px, calc(var(--u) * 7)); line-height: 1.15; text-wrap: balance; }
  .the .tranh { display: flex; gap: calc(var(--u) * 3); justify-content: center; align-items: center; flex-wrap: wrap; font-family: var(--emoji); font-size: max(60px, calc(var(--u) * 15)); line-height: 1; }
  .the .tranh svg { width: max(60px, calc(var(--u) * 13)); height: max(60px, calc(var(--u) * 13)); }
  .the .tranh .nhom { display: flex; flex-wrap: wrap; justify-content: center; max-width: 6em; gap: 4px; border: 4px dashed #faa2c1; border-radius: 16px; padding: 6px; font-size: max(36px, calc(var(--u) * 8)); }
  .chon { display: flex; gap: calc(var(--u) * 3); justify-content: center; flex-wrap: wrap; }
  .chon button { border: none; border-radius: 20px; color: #fff; background: var(--cam); box-shadow: 0 7px 0 var(--cam-dam);
    font-size: max(30px, calc(var(--u) * 7.5)); min-width: max(80px, calc(var(--u) * 18)); padding: 4px 20px; line-height: 1.2; }
  .chon button svg { width: max(56px, calc(var(--u) * 12)); height: max(56px, calc(var(--u) * 12)); display: block; }
  .chon.hinh button { background: #fff; border: 5px solid #74c0fc; box-shadow: 0 7px 0 #4dabf7; padding: 8px; color: var(--chu); font-size: max(20px, calc(var(--u) * 4)); }
  .chon button:active { transform: translateY(4px); }
  .chon button.sai { background: #b9c2cc; box-shadow: 0 7px 0 #8a949e; animation: lac .4s; opacity: .6; }
  .chon button.dung { background: var(--la); box-shadow: 0 7px 0 var(--la-dam); }
  .chon.hinh button.dung { background: #d3f9d8; border-color: var(--la); }
  @keyframes lac { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .bao { min-height: 1.3em; font-size: max(22px, calc(var(--u) * 5)); }
  .bao.dung { color: var(--la); } .bao.sai { color: #e8590c; }
  .hang-nut { display: flex; gap: 12px; }
  .nut-phu { font-size: max(16px, calc(var(--u) * 3.2)); padding: 4px 16px; border-radius: 30px; border: 3px solid var(--hong); background: #fff; color: var(--hong); }
  .bai-moi { font-size: max(20px, calc(var(--u) * 4.4)); color: #fff; background: var(--do); border-radius: 30px; padding: 2px 22px; }
  .ten-tiet { font-size: max(34px, calc(var(--u) * 9)); color: var(--hong); line-height: 1; }
  .bon-hinh { display: flex; gap: calc(var(--u) * 4); justify-content: center; flex-wrap: wrap; }
  .bon-hinh svg { width: max(60px, calc(var(--u) * 13)); height: max(60px, calc(var(--u) * 13)); animation: nay .8s ease-out both; }
  @keyframes nay { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 11; }
  #phao i { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: roi linear forwards; }
  @keyframes roi { to { transform: translateY(110vh) rotate(720deg); } }
  #loi-may { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 20; background: #fff; color: #c00; border: 3px solid #c00; border-radius: 12px; padding: 8px; font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { .nen.sang .lua, #nut-thoi, .bon-hinh svg { animation: none; } #phao { display: none; } }
</style>

<header>
  <h1>🎂 Thắp nến bánh sinh nhật</h1>
  <div class="sao" id="sao"></div>
</header>
<div id="loi">Hôm nay là sinh nhật bạn Hình! Chọn một cây nến, trả lời đúng để thắp sáng nến nhé.</div>
<div id="canh">
  <svg id="banh" viewBox="0 0 420 330"></svg>
  <button id="nut-thoi" hidden>🌬️ Cả lớp cùng thổi nến: Phù!</button>
</div>

<div class="phu" id="phu" hidden><div class="the" id="the"></div></div>
<div id="phao"></div>

<script>
// nếu máy nào báo lỗi, hiện lỗi lên màn hình để chụp gửi cô
window.onerror = (m, f, d) => {
  const goc = s => String(s || "").split(/[?#]/)[0];
  if (/zalo|FBNav|instagram/i.test(m) || !f || goc(f) !== goc(location.href)) return; // lỗi của app Zalo/Facebook chèn vào, không phải của trò chơi
  const o = document.getElementById('loi-may') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'loi-may' }));
  o.textContent = 'Lỗi: ' + m + ' (dòng ' + d + ')';
};

// ---------- hình phẳng dùng trong câu hỏi ----------
const HINH = {
  vuong: '<rect x="8" y="8" width="84" height="84"/>', tron: '<circle cx="50" cy="50" r="44"/>',
  tamgiac: '<polygon points="50,6 96,92 4,92"/>', chunhat: '<rect x="2" y="25" width="96" height="50"/>',
  tamgiac2: '<polygon points="8,8 8,92 92,92"/>', chunhat2: '<rect x="28" y="4" width="44" height="92"/>'
};
const ve = (k, mau) => `<svg viewBox="0 0 100 100">${HINH[k].replace(/\/>$/, ` fill="${mau}" stroke="#12304a" stroke-width="4" stroke-linejoin="round"/>`)}</svg>`;
const DONG_HO = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#2f9e44" stroke-width="7"/><path d="M50 50 V20 M50 50 L72 58" stroke="#12304a" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#12304a"/></svg>`;

// ====== 5 câu ôn (tiết 1 Bài 7 và bài cũ) ======
// hoi: câu hỏi; tranh: hình minh họa; chon: [nhãn hiện, giá trị]; dung: giá trị đúng; hinh: true nếu đáp án là hình
const nhom = (vat, n) => `<div class="nhom">${vat.repeat(n)}</div>`;
const CAU = [
  { hoi: 'Đồng hồ có dạng hình gì?', tranh: `<div class="tranh">${DONG_HO}</div>`,
    chon: [['Hình vuông', 'vuong'], ['Hình tròn', 'tron'], ['Hình tam giác', 'tamgiac']], dung: 'tron', khen: 'Đồng hồ có dạng hình tròn.' },
  { hoi: 'Hình nào là hình tam giác?', tranh: '', hinh: true,
    chon: [[ve('chunhat2', '#82c91e'), 'a'], [ve('tamgiac2', '#f06595'), 'b'], [ve('tron', '#4dabf7'), 'c']], dung: 'b', khen: 'Hình có 3 cạnh là hình tam giác.' },
  { hoi: 'Có mấy hình vuông?', tranh: `<div class="tranh">${ve('vuong', '#fab005')}${ve('tron', '#4dabf7')}${ve('vuong', '#f06595')}${ve('tamgiac', '#e03131')}${ve('vuong', '#82c91e')}</div>`,
    chon: [['2', '2'], ['3', '3'], ['4', '4']], dung: '3', khen: 'Có 3 hình vuông.' },
  { hoi: 'Phong bì thư có dạng hình gì?', tranh: '<div class="tranh">✉️</div>',
    chon: [['Hình tròn', 'tron'], ['Hình chữ nhật', 'chunhat'], ['Hình vuông', 'vuong']], dung: 'chunhat', khen: 'Phong bì thư có dạng hình chữ nhật.' },
  { hoi: '4 và 3 được mấy?', tranh: `<div class="tranh">${nhom('🔴', 4)}${nhom('🔵', 3)}</div>`, noi: 'Bốn và ba được mấy?',
    chon: [['6', '6'], ['7', '7'], ['8', '8']], dung: '7', khen: '4 và 3 được 7.' }
];
const BAI_MOI = 'Bài 7: Hình vuông, hình tròn, hình tam giác, hình chữ nhật';
const TIET = 'Tiết 2: Luyện tập';
// =================================================

const $ = id => document.getElementById(id);
const lay = m => m[Math.floor(Math.random() * m.length)];
const KHEN = ['Giỏi quá!', 'Đúng rồi!', 'Hoan hô!', 'Tuyệt vời!'];
let daThap = new Set(), amThanh = null;

// bánh 2 tầng, trang trí bằng các hình phẳng; 5 cây nến trên mặt bánh
function veBanh() {
  const nen = CAU.map((c, i) => {
    const x = 120 + i * 45;
    return `<g class="nen" data-i="${i}" role="button" aria-label="Cây nến ${i + 1}">
      <rect class="than" x="${x - 9}" y="70" width="18" height="62" rx="4" fill="${['#74c0fc', '#ffa8a8', '#b2f2bb', '#ffe066', '#d0bfff'][i]}" stroke="#12304a" stroke-width="3"/>
      <path d="M${x - 9} 84 L${x + 9} 78 M${x - 9} 100 L${x + 9} 94 M${x - 9} 116 L${x + 9} 110" stroke="#fff" stroke-width="3"/>
      <line x1="${x}" y1="70" x2="${x}" y2="60" stroke="#12304a" stroke-width="3"/>
      <path class="lua" d="M${x} 28 Q${x + 13} 46 ${x + 7} 56 Q${x} 64 ${x - 7} 56 Q${x - 13} 46 ${x} 28 Z" fill="#ffd43b" stroke="#f76707" stroke-width="3"/>
      <circle class="khoi" cx="${x}" cy="50" r="7" fill="#adb5bd"/>
      <g class="the-so"><circle cx="${x}" cy="44" r="16" fill="#fff" stroke="${'#d6336c'}" stroke-width="3"/>
      <text x="${x}" y="53" text-anchor="middle" font-size="24" font-weight="800" fill="#d6336c" font-family="Baloo 2, Segoe UI, sans-serif">${i + 1}</text></g></g>`;
  }).join('');
  $('banh').innerHTML = `
    <ellipse cx="210" cy="312" rx="190" ry="14" fill="#e599f7" opacity=".5"/>
    <rect x="40" y="215" width="340" height="92" rx="14" fill="#f783ac" stroke="#12304a" stroke-width="4"/>
    <path d="M40 232 q28 22 56 0 q28 22 56 0 q28 22 56 0 q28 22 56 0 q28 22 56 0 q28 22 60 0" fill="#fff0f6" stroke="#12304a" stroke-width="3"/>
    <g stroke="#12304a" stroke-width="3">
      <circle cx="80" cy="272" r="14" fill="#ffd43b"/><rect x="118" y="258" width="28" height="28" fill="#4dabf7"/>
      <polygon points="190,286 205,258 220,286" fill="#82c91e"/><rect x="250" y="262" width="44" height="22" fill="#ffa94d"/><circle cx="335" cy="272" r="14" fill="#ffd43b"/>
    </g>
    <rect x="90" y="130" width="240" height="88" rx="12" fill="#fff3bf" stroke="#12304a" stroke-width="4"/>
    <path d="M90 146 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0" fill="#ffc9c9" stroke="#12304a" stroke-width="3"/>
    <g stroke="#12304a" stroke-width="3"><polygon points="128,200 140,176 152,200" fill="#e03131"/><circle cx="210" cy="188" r="12" fill="#e03131"/><polygon points="268,200 280,176 292,200" fill="#e03131"/></g>
    ${nen}`;
  document.querySelectorAll('.nen').forEach(n => n.addEventListener('click', () => moCau(+n.dataset.i)));
}

// ---------- âm thanh, giọng đọc (chỉ đọc khi bấm nút loa) ----------
let giongViet = null, choDoc = false;
function timGiong() {
  if (!window.speechSynthesis) return;
  const ds = speechSynthesis.getVoices().filter(v => /^vi/i.test(v.lang));
  giongViet = ds.find(v => /natural|online|hoaimy/i.test(v.name)) || ds[0] || null;
}
if (window.speechSynthesis) { timGiong(); speechSynthesis.onvoiceschanged = timGiong; }
document.addEventListener('click', e => { if (e.target.closest('.nut-nghe, #nut-loa, #nghe, #nut-nghe')) { choDoc = true; setTimeout(() => choDoc = false, 0); } }, true);
function doc(chu) {
  if (!window.speechSynthesis || !giongViet) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(chu); u.voice = giongViet; u.lang = giongViet.lang; u.rate = 0.9; speechSynthesis.speak(u);
}
function keu(ds) {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    if (amThanh.state === 'suspended') amThanh.resume();
    ds.forEach((f, i) => {
      const o = amThanh.createOscillator(), g = amThanh.createGain(), t = amThanh.currentTime + 0.02 + i * 0.12;
      o.frequency.value = f; o.type = 'triangle';
      g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.connect(g); g.connect(amThanh.destination); o.start(t); o.stop(t + 0.26);
    });
  } catch (e) {}
}

// ---------- câu hỏi của từng cây nến ----------
function moCau(i) {
  if (daThap.has(i) || document.body.classList.contains('toi')) return;
  const c = CAU[i];
  $('the').innerHTML = `<div class="so-nen">Cây nến số ${i + 1}</div><h2></h2>${c.tranh}<div class="chon${c.hinh ? ' hinh' : ''}"></div><div class="bao"></div>
    <div class="hang-nut"><button class="nut-phu" id="nut-loa">🔊 Nghe</button><button class="nut-phu" id="nut-dong">Chọn nến khác</button></div>`;
  $('the').querySelector('h2').textContent = c.hoi;
  const hang = $('the').querySelector('.chon'), bao = $('the').querySelector('.bao');
  c.chon.forEach(([nhan, gt]) => {
    const b = document.createElement('button'); b.innerHTML = nhan;
    b.onclick = () => {
      if (gt === c.dung) {
        b.classList.add('dung'); bao.className = 'bao dung'; bao.textContent = `${lay(KHEN)} ${c.khen}`;
        hang.querySelectorAll('button').forEach(x => x.disabled = true);
        keu([523, 659, 784, 1047]);
        setTimeout(() => { $('phu').hidden = true; thapNen(i); }, 1300);
      } else { b.classList.add('sai'); b.disabled = true; bao.className = 'bao sai'; bao.textContent = 'Chưa đúng, bạn thử lại nhé!'; keu([220, 196]); }
    };
    hang.appendChild(b);
  });
  $('nut-loa').onclick = () => {
    if (!giongViet) timGiong();
    if (!giongViet) { alert('Máy này chưa có giọng đọc tiếng Việt. Thầy cô thử mở bằng Microsoft Edge nhé.'); return; }
    doc(c.noi || c.hoi);
  };
  $('nut-dong').onclick = () => { $('phu').hidden = true; };
  $('phu').hidden = false;
}
function thapNen(i) {
  daThap.add(i);
  document.querySelector(`.nen[data-i="${i}"]`).classList.add('sang');
  $('sao').textContent = '⭐'.repeat(daThap.size);
  const con = CAU.length - daThap.size;
  $('loi').textContent = con ? `Thắp được ${daThap.size} cây nến rồi! Còn ${con} cây nữa.` : 'Đủ 5 cây nến rồi! Tắt đèn, cả lớp cùng hát chúc mừng sinh nhật nào!';
  if (!con) setTimeout(() => { document.body.classList.add('toi'); $('nut-thoi').hidden = false; keu([523, 523, 587, 523, 698, 659]); }, 900);
}

// ---------- thổi nến, hiện bài học ----------
$('nut-thoi').onclick = () => {
  $('nut-thoi').hidden = true;
  document.querySelectorAll('.nen').forEach((n, i) => setTimeout(() => { n.classList.add('tat'); keu([300 - i * 20]); }, i * 180));
  setTimeout(() => {
    document.body.classList.remove('toi');
    $('the').innerHTML = `<div class="bai-moi">Bài học hôm nay</div><h2>${BAI_MOI}</h2><div class="ten-tiet">${TIET}</div>
      <div class="bon-hinh">${['vuong', 'tron', 'tamgiac', 'chunhat'].map((k, i) => ve(k, ['#fab005', '#1c7ed6', '#e03131', '#82c91e'][i]).replace('<svg', `<svg style="animation-delay:${i * 0.3}s"`)).join('')}</div>
      <div class="hang-nut"><button class="nut-phu" id="nut-lai">Chơi lại</button></div>`;
    $('nut-lai').onclick = () => { $('phu').hidden = true; batDau(); };
    $('phu').hidden = false;
    phaoGiay(); keu([392, 523, 659, 784, 1047, 1319]);
  }, 1800);
};

function phaoGiay() {
  const p = $('phao'); p.textContent = '';
  const MAU = ['#e03131', '#1c7ed6', '#2f9e44', '#f08c00', '#ae3ec9', '#ffe066'];
  for (let i = 0; i < 70; i++) {
    const g = document.createElement('i');
    g.style.left = Math.random() * 100 + 'vw'; g.style.background = lay(MAU);
    g.style.animationDuration = (2.5 + Math.random() * 2.5) + 's'; g.style.animationDelay = Math.random() * 1.2 + 's';
    p.appendChild(g);
  }
  setTimeout(() => { p.textContent = ''; }, 7000);
}
function batDau() {
  daThap = new Set(); $('sao').textContent = ''; $('nut-thoi').hidden = true; document.body.classList.remove('toi');
  $('loi').textContent = 'Hôm nay là sinh nhật bạn Hình! Chọn một cây nến, trả lời đúng để thắp sáng nến nhé.';
  veBanh();
}
batDau();
</script>
</body>
</html>
