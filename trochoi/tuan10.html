<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>Xây lâu đài tuần 10: Toán + Tiếng Việt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Bố cục: tiêu đề, dải thưởng (mỗi câu đúng thêm 1 quả bóng / 1 viên gạch), câu hỏi, khung, hàng nút trả lời.
     20 câu: 10 Toán rồi 10 Tiếng Việt. Câu nghe dùng nút ▶ tròn xanh như bài trên mạng của trường.
     Mọi kích thước tính theo --u để vừa cả tivi lẫn điện thoại. */
  :root {
    --u: min(1vh, 1.3vw);
    --nen: #eaf6ff;
    --chu: #12304a;
    --xanh: #0b5cab;
    --khung-tren: #ffffff;
    --khung-duoi: #e3f2ff;
    --o-vien: #4aa3df;
    --o-nen: #ffffff;
    --do: #e03131;
    --dung: #2b8a3e;
    --dung-nen: #d3f9d8;
    --sai: #e8590c;
    --cam: #f08c00;
    --cam-dam: #b86200;
    --la: #2f9e44;
    --la-dam: #1e6b2e;
    --sao: #c25e00;
    --trang: #ffffff;
    --vang-nhat: #ffe066;
    --play: #0a9cf0;
    --phu: rgba(11, 92, 171, 0.94);
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800;
    background: var(--nen); color: var(--chu);
    display: flex; flex-direction: column;
    padding-block: calc(var(--u) * 1.2); padding-inline: max(16px, 2vw);
    gap: calc(var(--u) * 1.2);
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  button { font-family: inherit; font-weight: 800; }
  button:focus-visible { outline: 4px solid var(--chu); outline-offset: 3px; }

  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; }
  h1 { font-size: max(20px, calc(var(--u) * 4)); color: var(--xanh); line-height: 1.1; }
  .diem { font-size: max(16px, calc(var(--u) * 3.2)); color: var(--sao); font-variant-numeric: tabular-nums; }
  .mon { font-size: max(15px, calc(var(--u) * 2.8)); color: #fff; background: var(--xanh); border-radius: 30px; padding: 2px 14px; }
  .mon.tv { background: var(--do); }
  #nut-loa { font-size: max(15px, calc(var(--u) * 2.8)); color: var(--xanh); background: #fff; border: 3px solid var(--xanh); border-radius: 30px; padding: 2px 14px; cursor: pointer; }

  /* ----- dải thưởng ----- */
  #dai {
    flex: none; position: relative;
    display: flex; align-items: center; gap: max(6px, calc(var(--u) * 1.2));
    border-radius: calc(var(--u) * 3); border: 4px solid;
    padding: max(4px, calc(var(--u) * 0.8)) max(10px, calc(var(--u) * 2));
  }
  #dai .dau { font-family: var(--emoji); font-size: max(30px, calc(var(--u) * 7)); line-height: 1; flex: none; }
  #dai .o-dai { flex: 1; display: grid; grid-template-columns: repeat(20, 1fr); gap: max(2px, calc(var(--u) * 0.5)); align-items: end; }
  #dai .cuoi { font-family: var(--emoji); font-size: max(26px, calc(var(--u) * 6)); line-height: 1; flex: none; }
  /* bóng bay */
  .bong #dai { background: linear-gradient(#bfe6ff, #eaf7ff); border-color: #7cc7ec; }
  .bong .o-dai i { display: block; aspect-ratio: 3 / 4; max-height: max(34px, calc(var(--u) * 7)); border-radius: 50% 50% 46% 46%; border: 2px dashed #7cb6d8; position: relative; }
  .bong .o-dai i.co { border: 2px solid #12304a; animation: no 0.6s ease-out; }
  .bong .o-dai i.co::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 40%; background: #12304a; }
  /* lâu đài: 2 hàng gạch */
  .lau #dai { background: linear-gradient(#fff4d6, #ffe8b0); border-color: #d9a441; }
  .lau .o-dai { grid-template-columns: repeat(10, 1fr) !important; }
  .lau .o-dai i { display: block; height: max(14px, calc(var(--u) * 3.2)); border-radius: 3px; border: 2px dashed #d0a85c; }
  .lau .o-dai i.co { background: #e8754a; border: 2px solid #8a3b1c; animation: no 0.6s ease-out; }
  @keyframes no { 0% { transform: scale(0.2); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

  #cau-hoi { text-align: center; text-wrap: balance; line-height: 1.2; font-size: max(22px, calc(var(--u) * 4.8)); }

  #khung {
    flex: 1; min-height: calc(var(--u) * 26);
    background: linear-gradient(var(--khung-tren), var(--khung-duoi));
    border: 6px solid var(--xanh); border-radius: calc(var(--u) * 4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 2); padding: calc(var(--u) * 2); overflow: hidden;
  }

  .the {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--o-nen); color: var(--xanh);
    border: 5px solid var(--o-vien); border-radius: calc(var(--u) * 2.5);
  }
  .the.trong { border-style: dashed; border-color: var(--do); color: var(--do); }
  .the.xong { border-style: solid; border-color: var(--la); background: var(--dung-nen); color: var(--dung); }
  .tu { font-size: max(40px, calc(var(--u) * 11)); line-height: 1.2; white-space: pre; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
  .tu .the { margin: 0 calc(var(--u) * 0.6); min-width: max(56px, calc(var(--u) * 13)); padding: 0 calc(var(--u) * 1.2); height: max(58px, calc(var(--u) * 15)); font-size: inherit; }
  .hinh-nho { font-family: var(--emoji); font-size: max(60px, calc(var(--u) * 15)); line-height: 1; }
  .cau-dai { font-size: max(28px, calc(var(--u) * 7)); line-height: 1.3; text-align: center; text-wrap: balance; }
  .cau-dai .the { padding: 0 calc(var(--u) * 1.5); min-width: max(90px, calc(var(--u) * 22)); height: max(48px, calc(var(--u) * 10)); font-size: inherit; vertical-align: middle; }

  /* Toán */
  .nhom-pt { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 3); flex-wrap: wrap; }
  .nhom { display: flex; flex-wrap: wrap; justify-content: center; max-width: max(150px, calc(var(--u) * 36)); gap: calc(var(--u) * 0.8);
    border: 4px solid var(--o-vien); border-radius: calc(var(--u) * 2.5); padding: calc(var(--u) * 1.2); background: #fff;
    font-family: var(--emoji); font-size: max(34px, calc(var(--u) * 8)); line-height: 1; }
  .nhom span { position: relative; }
  .nhom span b { font-weight: normal; }
  .nhom span.gach b { opacity: 0.35; }
  .nhom span.gach::after { content: ""; position: absolute; left: -6%; right: -6%; top: 45%; height: 7px; background: var(--do); transform: rotate(-35deg); border-radius: 3px; }
  .chuoi { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1); font-size: max(40px, calc(var(--u) * 11)); }
  .chuoi .the { width: max(64px, calc(var(--u) * 16)); height: max(64px, calc(var(--u) * 16)); font-size: inherit; }
  .mui { display: flex; flex-direction: column; align-items: center; color: var(--do); line-height: 1; }
  .mui b { font-size: max(22px, calc(var(--u) * 5)); }
  .mui span { font-size: max(34px, calc(var(--u) * 8)); color: var(--chu); }
  .so-to { font-size: max(70px, calc(var(--u) * 20)); color: var(--xanh); line-height: 1; }

  /* câu nghe: thẻ chữ ở trên, các nút ▶ tròn xanh ở dưới, mỗi nút có ô tròn để chọn */
  .the-nghe { display: flex; align-items: center; gap: calc(var(--u) * 2.5); background: #ece4ff; border: 5px solid #b39ddb; border-radius: calc(var(--u) * 2.5); padding: calc(var(--u) * 1) calc(var(--u) * 4); }
  .the-nghe .chu-to { font-size: max(40px, calc(var(--u) * 11)); color: #6b3e1f; line-height: 1.2; white-space: nowrap; }
  @media (max-width: 600px) { .the-nghe { padding: 6px 14px; gap: 10px; } .the-nghe .chu-to { font-size: 36px; } }
  .the-nghe .hinh-nho { font-size: max(48px, calc(var(--u) * 12)); }
  .hang-nghe { display: flex; justify-content: center; flex-wrap: wrap; gap: calc(var(--u) * 3) calc(var(--u) * 10); }
  .lua-nghe { display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
  .o-chon { width: max(34px, calc(var(--u) * 6.5)); height: max(34px, calc(var(--u) * 6.5)); border-radius: 50%; border: 3px solid #b8c2cc; background: #f4f6f8; cursor: pointer; padding: 0; }
  .o-chon.dung { background: #43a047; border-color: #2e7d32; box-shadow: inset 0 0 0 5px #fff; }
  .o-chon.sai { background: #e03131; border-color: #a61e1e; box-shadow: inset 0 0 0 5px #fff; opacity: 0.6; animation: lac 0.4s; }
  .nut-play { width: max(96px, calc(var(--u) * 19)); height: max(96px, calc(var(--u) * 19)); border-radius: 50%; border: max(6px, calc(var(--u) * 1.1)) solid var(--play); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .nut-play svg { width: 42%; height: 42%; margin-left: 8%; fill: var(--play); }
  .nut-play:active { transform: scale(0.94); }
  .nut-play.dang { background: #e1f3fe; }

  #thong-bao { min-height: max(26px, calc(var(--u) * 5.5)); text-align: center; text-wrap: balance; line-height: 1.2; font-size: max(19px, calc(var(--u) * 4.2)); }
  #thong-bao.dung { color: var(--dung); }
  #thong-bao.sai { color: var(--sai); }

  .lua-chon { display: flex; justify-content: center; flex-wrap: wrap; gap: max(10px, calc(var(--u) * 2.2)); padding-bottom: 8px; }
  .lua-chon button, .nut-lon { border: none; border-radius: calc(var(--u) * 2.5); cursor: pointer; color: var(--trang); }
  .lua-chon button {
    min-width: max(62px, calc(var(--u) * 13)); height: max(62px, calc(var(--u) * 13)); padding: 0 max(12px, calc(var(--u) * 2.5));
    font-size: max(30px, calc(var(--u) * 7.5)); line-height: 1;
    background: var(--cam); box-shadow: 0 6px 0 var(--cam-dam);
  }
  .lua-chon.dai button { font-size: max(22px, calc(var(--u) * 5)); height: auto; min-height: max(56px, calc(var(--u) * 11)); padding-block: 6px; }
  .lua-chon button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--cam-dam); }
  .lua-chon button.sai { animation: lac 0.4s; background: #b9c2cc; box-shadow: 0 6px 0 #8a949e; }
  .lua-chon button.dung { background: var(--la); box-shadow: 0 6px 0 var(--la-dam); }
  @keyframes lac { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .nut-lon { font-size: max(26px, calc(var(--u) * 5.5)); padding: calc(var(--u) * 1) calc(var(--u) * 5); background: var(--la); box-shadow: 0 6px 0 var(--la-dam); }
  .hang-nut { text-align: center; padding-bottom: 8px; }
  /* iPhone: body chặn chọn chữ thì ô tên không gõ được, nên mở lại cho ô nhập */
  input { -webkit-user-select: text; user-select: text; }
  #loi-may { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 20; background: #fff; color: #c00; border: 3px solid #c00; border-radius: 12px; padding: 8px; font-size: 15px; }

  .man-phu {
    position: fixed; inset: 0; background: var(--phu);
    display: flex; flex-direction: column; align-items: center; justify-content: safe center;
    gap: calc(var(--u) * 2.4); color: var(--trang); text-align: center; padding: 16px;
    overflow-y: auto; z-index: 10;
  }
  .man-phu h2 { font-size: max(30px, calc(var(--u) * 7.5)); line-height: 1.1; }
  .man-phu p { font-size: max(22px, calc(var(--u) * 4.8)); color: var(--vang-nhat); line-height: 1.2; }
  .man-phu .nho { font-size: max(16px, calc(var(--u) * 3)); color: var(--trang); }
  #ten-hs {
    font-family: inherit; font-weight: 800; text-align: center;
    font-size: max(22px, calc(var(--u) * 4.6)); width: min(100%, 22em); padding: 0.25em 0.5em;
    border: 5px solid var(--vang-nhat); border-radius: 16px; background: var(--o-nen); color: var(--chu);
  }
  #phieu { background: var(--o-nen); color: var(--chu); border-radius: 20px; padding: 14px 24px; font-size: max(17px, calc(var(--u) * 3.2)); line-height: 1.45; width: min(100%, 25em); }
  #phieu b { color: var(--xanh); }
  .nut-phu { font-size: max(16px, calc(var(--u) * 3)); padding: 0.3em 1em; background: transparent; color: var(--trang); border: 3px solid var(--trang); border-radius: 14px; cursor: pointer; }
  .thuong-hieu { font-size: max(18px, calc(var(--u) * 3.4)); color: var(--chu); background: var(--vang-nhat); border-radius: 30px; padding: 2px 20px; letter-spacing: 1px; }
  .huy { display: flex; align-items: flex-end; gap: calc(var(--u) * 2); font-family: var(--emoji); line-height: 1; }
  .huy .vat { font-size: max(70px, calc(var(--u) * 15)); animation: bay 2s ease-in-out infinite; }
  .huy .hc { font-size: max(80px, calc(var(--u) * 18)); }
  .mo-hinh { font-family: var(--emoji); font-size: max(64px, calc(var(--u) * 14)); line-height: 1; animation: bay 2s ease-in-out infinite; }
  @keyframes bay { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 11; }
  #phao i { position: absolute; font-style: normal; font-family: var(--emoji); line-height: 1; animation: len linear forwards; }
  @keyframes len { from { transform: translateY(0); } to { transform: translateY(-120vh); } }
  @media (prefers-reduced-motion: reduce) {
    .huy .vat, .mo-hinh, .o-dai i.co { animation: none; }
    #phao { display: none; }
  }
</style>

<header>
  <h1 id="tieu-de"></h1>
  <div class="mon" id="mon">Toán</div>
  <button id="nut-loa" title="Nghe lại câu hỏi">🔊 Nghe</button>
  <div class="diem">Câu <span id="so-cau">1</span>/<span id="tong-cau">20</span> · Sao: <span id="so-sao">0</span></div>
</header>

<div id="dai" aria-hidden="true"><span class="dau" id="dai-dau"></span><div class="o-dai" id="o-dai"></div><span class="cuoi" id="dai-cuoi"></span></div>

<div id="cau-hoi"></div>
<div id="khung"></div>
<div id="thong-bao"></div>
<div class="lua-chon" id="lua-chon"></div>
<div class="hang-nut" id="hang-tiep" hidden><button class="nut-lon" id="nut-tiep">Câu tiếp</button></div>

<div id="ket-thuc" class="man-phu" hidden>
  <div class="thuong-hieu">Cô Điệp AI</div>
  <div class="huy"><span class="vat" id="vat-cuoi"></span><span class="hc" id="hc">🥇</span></div>
  <h2 id="loi-xong"></h2>
  <p id="loi-hc">Con được huy chương vàng</p>
  <div id="phieu"></div>
  <div class="nho" id="loi-nhan">Ba mẹ chụp màn hình này gửi cô nhé.</div>
  <button class="nut-lon" id="nut-choi-lai">Chơi lại</button>
  <button class="nut-phu" id="nut-ban-khac">Bạn khác chơi</button>
</div>

<div id="mo-dau" class="man-phu">
  <div class="thuong-hieu">Cô Điệp AI</div>
  <div class="mo-hinh" id="mo-hinh"></div>
  <h2 id="mo-ten"></h2>
  <p><label for="ten-hs">Con tên là gì?</label></p>
  <input id="ten-hs" type="text" maxlength="40" autocomplete="off" placeholder="Họ và tên, lớp">
  <div class="nho" id="mo-loi"></div>
  <button class="nut-lon" id="nut-bat-dau">Bắt đầu</button>
</div>

<div id="phao"></div>

<script>
// nếu máy nào báo lỗi, hiện lỗi lên màn hình để chụp gửi cô
window.onerror = (m, f, d) => {
  const goc = s => String(s || "").split(/[?#]/)[0];
  if (/zalo|FBNav|instagram/i.test(m) || !f || goc(f) !== goc(location.href)) return; // lỗi của app Zalo/Facebook chèn vào, không phải của trò chơi
  const o = document.getElementById('loi-may') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'loi-may' }));
  o.textContent = 'Lỗi: ' + m + ' (dòng ' + d + ')';
};

// ====== DỮ LIỆU TUẦN (tuần sau chỉ cần thay khối này) ======
const TEN_BAI = 'Xây lâu đài tuần 10: Toán + Tiếng Việt';
const TEMA = {
  kieu: 'lau', tieuDe: 'Xây lâu đài tuần 10', dau: '👷', cuoi: '🏰', moHinh: '👷🧱🏰',
  moLoi: 'Mỗi câu đúng, con xây thêm 1 viên gạch. Đủ 20 viên là xong lâu đài!',
  xong: 'Lâu đài xây xong rồi!', vat: '🏰', thuong: n => `Con xây được ${n} viên gạch`,
  nuaDuong: 'Xây được nửa lâu đài rồi!', sapXong: 'Sắp xây xong rồi!', vuaXong: 'Lâu đài xong rồi!'
};
// Toán tuần 10: cộng trong phạm vi 10, làm quen phép trừ (VBT Toán Bài 10-11)
const TOAN = { max: 10, tru: true };
const DANG = [
  ['pt', 'Nhìn tranh chọn phép tính', 'Toán', 3], ['tinh', 'Tính', 'Toán', 3], ['bang', 'Phép tính nào bằng số', 'Toán', 2], ['ds', 'Đúng hay sai', 'Toán', 1], ['dayso', 'Số tiếp theo', 'Toán', 1],
  ['nghe', 'Nghe và chọn', 'Tiếng Việt', 3], ['dien', 'Điền vần', 'Tiếng Việt', 3], ['cau', 'Ghép câu', 'Tiếng Việt', 2], ['tim', 'Tìm tiếng có vần', 'Tiếng Việt', 2]
];
// Tiếng Việt tuần 10 của lớp: Bài 41-45 (ui ưi, ao eo, au âu êu, iu ưu). Chỉ dùng âm, vần đã học.
// Câu nghe: [chữ trên thẻ, hình, cách đọc đúng, cách đọc sai]
const NGHE = [['quả táo', '🍎', 'quả táo', 'quả téo'], ['con mèo', '🐱', 'con mèo', 'con mào'], ['con trâu', '🐃', 'con trâu', 'con trau'],
  ['ngôi sao', '⭐', 'ngôi sao', 'ngôi sau'], ['con gấu', '🐻', 'con gấu', 'con gáu'], ['con cừu', '🐑', 'con cừu', 'con cầu'],
  ['dãy núi', '⛰️', 'dãy núi', 'dãy nối'], ['cây cau', '🌴', 'cây cau', 'cây câu'], ['túi kẹo', '🍬', 'túi kẹo', 'túi kịu']];
// Điền vần: [phần trước, phần sau, vần đúng, 3 vần để chọn, hình]
const DIEN = [['túi k', '', 'ẹo', ['ẹo', 'ạo', 'ịu'], '🍬'], ['quả t', '', 'áo', ['áo', 'éo', 'ấu'], '🍎'], ['ngôi s', '', 'ao', ['ao', 'eo', 'au'], '⭐'],
  ['con tr', '', 'âu', ['âu', 'au', 'ưu'], '🐃'], ['con c', '', 'ừu', ['ừu', 'ầu', 'ìu'], '🐑'], ['dãy n', '', 'úi', ['úi', 'ứi', 'áo'], '⛰️'],
  ['g', ' thư', 'ửi', ['ửi', 'ủi', 'ẩu'], '✉️'], ['con m', '', 'èo', ['èo', 'ào', 'ều'], '🐱'], ['r', ' củ', 'au', ['au', 'âu', 'eo'], '🥕'],
  ['cây c', '', 'au', ['au', 'ao', 'âu'], '🌴'], ['con g', '', 'ấu', ['ấu', 'áu', 'ếu'], '🐻']];
// Ghép câu: [đầu câu, phần đúng, 2 phần sai chọn sẵn cho rõ là sai]
const CAU = [['Bà gửi cho Hà', 'túi kẹo.', ['kêu ríu rít.', 'nước trong veo.']], ['Đàn sẻ nâu', 'kêu ríu rít.', ['túi kẹo.', 'ăn cỏ ở bờ ao.']],
  ['Ao thu lạnh lẽo,', 'nước trong veo.', ['túi kẹo.', 'kêu ríu rít.']], ['Con trâu', 'ăn cỏ ở bờ ao.', ['túi kẹo.', 'nước trong veo.']],
  ['Tàu neo đậu', 'ven bờ.', ['túi kẹo.', 'kêu ríu rít.']], ['Bé có quả táo,', 'quả lựu.', ['kêu ríu rít.', 'ven bờ.']],
  ['Bà đã nghỉ hưu', 'mà luôn bận bịu.', ['ven bờ.', 'túi kẹo.']]];
// Tiếng theo vần: tiếng ở nhóm này không chứa vần của nhóm khác
const VAN = {
  ui: ['túi', 'núi', 'bụi', 'củi', 'mũi'], 'ưi': ['gửi', 'ngửi', 'cửi'], ao: ['sao', 'táo', 'chào', 'ao', 'cao'],
  eo: ['kẹo', 'mèo', 'bèo', 'kéo', 'đèo'], au: ['rau', 'cau', 'tàu', 'sau', 'màu'], 'âu': ['trâu', 'gấu', 'câu', 'nâu', 'đậu'],
  'êu': ['kêu', 'rêu', 'tễu', 'khều', 'sếu'], iu: ['rìu', 'địu', 'xíu', 'dịu', 'chịu'], 'ưu': ['cừu', 'lựu', 'hưu', 'mưu', 'sưu']
};
// ====== HẾT DỮ LIỆU TUẦN ======

const MAU = ['#e8202a', '#1565d8', '#2fa65a', '#f2891f', '#8e24aa', '#ec5a93', '#f7c600'];
const VAT = ['🦆', '🍎', '🦋', '🐟', '🌸', '🐥', '🍓', '⭐'];
let hangDoi = [], thuTu = 0, sao = 0, cau = null, khoa = false, daSai = false;
let dungLanDau = 0, dungTheoDang = {};
let amThanh = null, ten = '';

const $ = id => document.getElementById(id);
const ngau = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const lay = m => m[ngau(0, m.length - 1)];
function tron(m) {
  for (let i = m.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [m[i], m[j]] = [m[j], m[i]]; }
  return m;
}
// 4 số để chọn: số đúng và 3 số gần nó, xếp từ bé đến lớn
function boSo(dung, max = 10, min = 0) {
  const ds = new Set([dung]);
  for (const d of tron([-3, -2, -1, 1, 2, 3])) { const v = dung + d; if (v >= min && v <= max && ds.size < 4) ds.add(v); }
  return [...ds].sort((a, b) => a - b);
}

// giọng đọc tiếng Việt của máy; máy nào không có giọng Việt thì im, không đọc bằng giọng Anh
let giongViet = null;
function timGiong() {
  if (!window.speechSynthesis) return;
  const ds = speechSynthesis.getVoices().filter(v => /^vi/i.test(v.lang));
  giongViet = ds.find(v => /natural|online|hoaimy/i.test(v.name)) || ds[0] || null;
}
if (window.speechSynthesis) { timGiong(); speechSynthesis.onvoiceschanged = timGiong; }
// Tự đọc câu hỏi mới hiện ra (cô Điệp dặn lại 16/10/2026), nút loa 🔊 để nghe lại
let choDoc = false;
document.addEventListener('click', e => { if (e.target.closest('.nut-nghe, #nut-loa, #nghe, #nut-nghe')) { choDoc = true; setTimeout(() => choDoc = false, 0); } }, true);
function doc(chu, cho = 0) {
  if (!window.speechSynthesis || !giongViet || !$('mo-dau').hidden) return;
  speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(chu.replace(/ \+ /g, ' cộng ').replace(/ - /g, ' trừ ').replace(/ = /g, ' bằng '));
    u.voice = giongViet; u.lang = giongViet.lang; u.rate = 0.85;
    speechSynthesis.speak(u);
  }, cho);
}
function coGiong() {
  if (!giongViet) timGiong();
  if (!giongViet) { alert('Máy này chưa có giọng đọc tiếng Việt. Thầy cô và ba mẹ thử mở bằng Microsoft Edge hoặc điện thoại nhé.'); return false; }
  return true;
}

function keu(dsTanSo) {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    if (amThanh.state === 'suspended') amThanh.resume();
    dsTanSo.forEach((f, i) => {
      const o = amThanh.createOscillator(), g = amThanh.createGain();
      const t = amThanh.currentTime + 0.02 + i * 0.13;
      o.frequency.value = f; o.type = 'triangle';
      g.gain.setValueAtTime(0.6, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.connect(g); g.connect(amThanh.destination);
      o.start(t); o.stop(t + 0.26);
    });
  } catch (e) {}
}

const PLAY = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0.5 L9.5 5 L1 9.5 Z"/></svg>';
const nhom = (vat, n, gach = 0) => `<div class="nhom">${Array.from({ length: n }, (_, i) => `<span${i >= n - gach ? ' class="gach"' : ''}><b>${vat}</b></span>`).join('')}</div>`;
// 3 phép tính để chọn, không trùng nhau
function boPhepTinh(a, dau, b) {
  const ds = new Set([`${a} ${dau} ${b}`]);
  const thu = dau === '+' ? [[a, b + 1], [a + 1, b], [a, b - 1], [a - 1, b], [b + 1, a]] : [[a, b + 1], [a + 1, b], [a, b - 1], [a - 1, b]];
  for (const [x, y] of tron(thu)) if (x >= 0 && y >= 0 && (dau === '+' ? x + y <= TOAN.max : x >= y) && ds.size < 3) ds.add(`${x} ${dau} ${y}`);
  return tron([...ds]);
}
const tinhGiaTri = s => s.split(' ').reduce((kq, x, i, m) => i === 0 ? +x : (x === '+' ? kq + +m[i + 1] : x === '-' ? kq - +m[i + 1] : kq), 0);

// Mỗi hàm trả về một câu: { so, hoi, noi, ve(xong), chon[], dung, khen, dai, nghe }
const TAO = {
  // nhìn tranh: hai nhóm đồ vật (hoặc một nhóm bị gạch bớt), chọn phép tính
  pt(truoc, k) {
    const tru = TOAN.tru && k === 2;
    let a, b;
    do {
      if (tru) { a = ngau(3, 6); b = ngau(1, a - 1); }
      else { a = ngau(1, TOAN.max - 1); b = ngau(1, TOAN.max - a); }
    } while (`${a}${b}` === truoc);
    const vat = lay(VAT), dau = tru ? '-' : '+', dap = `${a} ${dau} ${b}`;
    return {
      so: `${a}${b}`, hoi: 'Nhìn tranh, chọn phép tính đúng', chon: boPhepTinh(a, dau, b), dung: dap,
      ve: () => tru ? `<div class="nhom-pt">${nhom(vat, a, b)}</div>` : `<div class="nhom-pt">${nhom(vat, a)}${nhom(vat, b)}</div>`,
      khen: `Đúng rồi! ${dap} = ${tinhGiaTri(dap)}.`,
      noi: tru ? `Có ${a}, bớt đi ${b}. Chọn phép tính đúng.` : `Có ${a}, thêm ${b}. Chọn phép tính đúng.`
    };
  },
  tinh(truoc, k) {
    let p;
    do {
      if (TOAN.max > 7 && k === 2) { const a = ngau(1, 4), b = ngau(1, 3), c = ngau(1, TOAN.max - a - b); p = `${a} + ${b} + ${c}`; }
      else if (TOAN.tru && k === 1) { const a = ngau(2, 6), b = ngau(0, a); p = `${a} - ${b}`; }
      else { const a = ngau(0, TOAN.max), b = ngau(0, TOAN.max - a); p = `${a} + ${b}`; }
    } while (p === truoc);
    const kq = tinhGiaTri(p);
    return {
      so: p, hoi: 'Tính', noi: `${p} bằng mấy?`, chon: boSo(kq, TOAN.max), dung: kq,
      ve: xong => `<div class="tu">${p} = <span class="the trong${xong ? ' xong' : ''}">${xong ? kq : '?'}</span></div>`,
      khen: `Đúng rồi! ${p} = ${kq}.`
    };
  },
  chuoi(truoc) {
    let a, b;
    do { a = ngau(0, TOAN.max - 1); b = ngau(1, TOAN.max - a); } while (`${a}${b}` === truoc);
    const kq = a + b;
    return {
      so: `${a}${b}`, hoi: 'Số nào điền vào ô trống?', noi: `${a} cộng ${b} được mấy?`, chon: boSo(kq, TOAN.max), dung: kq,
      ve: xong => `<div class="chuoi"><span class="the">${a}</span><span class="mui"><b>+${b}</b><span>➜</span></span><span class="the trong${xong ? ' xong' : ''}">${xong ? kq : '?'}</span></div>`,
      khen: `Đúng rồi! ${a} + ${b} = ${kq}.`
    };
  },
  ds(truoc, k) {
    let p, kq, dung;
    do {
      const tru = TOAN.tru && k === 0;
      if (tru) { const a = ngau(2, 6), b = ngau(1, a); p = `${a} - ${b}`; }
      else { const a = ngau(1, TOAN.max - 1), b = ngau(1, TOAN.max - a); p = `${a} + ${b}`; }
      dung = Math.random() < 0.5;
      kq = tinhGiaTri(p) + (dung ? 0 : lay([-1, 1]));
    } while (p === truoc || kq < 0);
    const dap = dung ? 'Đúng' : 'Sai';
    return {
      so: p, hoi: 'Phép tính này đúng hay sai?', noi: `${p} = ${kq}. Đúng hay sai?`, chon: ['Đúng', 'Sai'], dung: dap, dai: true,
      ve: () => `<div class="tu">${p} = ${kq}</div>`,
      khen: dung ? `Đúng rồi! ${p} = ${kq} là đúng.` : `Đúng rồi! Phép tính sai, ${p} = ${tinhGiaTri(p)}.`
    };
  },
  // phép tính nào bằng số này
  bang(truoc) {
    let n; do { n = ngau(4, TOAN.max); } while (n === truoc);
    const a = ngau(1, n - 1), dap = `${a} + ${n - a}`;
    const sai = new Set();
    while (sai.size < 2) { const x = ngau(1, TOAN.max - 1), y = ngau(0, TOAN.max - x); if (x + y !== n) sai.add(`${x} + ${y}`); }
    return {
      so: n, hoi: `Phép tính nào bằng ${n}?`, chon: tron([dap, ...sai]), dung: dap,
      ve: () => `<div class="so-to">${n}</div>`,
      khen: `Đúng rồi! ${dap} = ${n}.`
    };
  },
  // dãy số đếm thêm 2 hoặc bớt 2
  dayso(truoc) {
    let a, buoc; do { buoc = lay([2, -2, 1, -1]); a = buoc > 0 ? ngau(0, TOAN.max - 3 * buoc) : ngau(-3 * buoc, TOAN.max); } while (`${a}${buoc}` === truoc);
    const ds = [a, a + buoc, a + 2 * buoc], kq = a + 3 * buoc;
    return {
      so: `${a}${buoc}`, hoi: 'Số tiếp theo là số nào?', noi: `${ds.join(', ')}. Số tiếp theo là số nào?`, chon: boSo(kq, TOAN.max), dung: kq,
      ve: xong => `<div class="chuoi">${ds.map(x => `<span class="the">${x}</span>`).join('')}<span class="the trong${xong ? ' xong' : ''}">${xong ? kq : '?'}</span></div>`,
      khen: `Đúng rồi! ${[...ds, kq].join(', ')}.`
    };
  },
  // nghe: bấm ▶ nghe từng cách đọc, chọn ô tròn của cách đọc đúng
  nghe(truoc) {
    let i; do { i = ngau(0, NGHE.length - 1); } while (i === truoc);
    const [chu, hinh, dung, sai] = NGHE[i];
    return {
      so: i, hoi: 'Bấm ▶ để nghe. Chọn cách đọc đúng của từ này', noi: 'Bấm nút xanh để nghe. Chọn cách đọc đúng.', nghe: true,
      chon: tron([dung, sai]), dung, chu, hinh,
      khen: `Đúng rồi! Đọc là: ${chu}.`
    };
  },
  dien(truoc) {
    let i; do { i = ngau(0, DIEN.length - 1); } while (i === truoc);
    const [dau, sau, dap, chon, hinh] = DIEN[i];
    return {
      so: i, hoi: 'Chọn vần điền vào chỗ trống', chon: tron([...chon]), dung: dap,
      ve: xong => `<div class="hinh-nho">${hinh}</div><div class="tu">${dau}<span class="the trong${xong ? ' xong' : ''}">${xong ? dap : '?'}</span>${sau}</div>`,
      khen: `Đúng rồi! ${dau}${dap}${sau}.`
    };
  },
  cau(truoc) {
    let i; do { i = ngau(0, CAU.length - 1); } while (i === truoc);
    const [dau, dap, sai] = CAU[i];
    return {
      so: i, hoi: 'Chọn phần còn thiếu để thành câu', noi: `${dau}... Chọn phần còn thiếu.`, chon: tron([dap, ...sai]), dung: dap, dai: true,
      ve: xong => `<div class="cau-dai">${dau} <span class="the trong${xong ? ' xong' : ''}">${xong ? dap : '?'}</span></div>`,
      khen: `Đúng rồi! ${dau} ${dap}`
    };
  },
  tim(truoc) {
    const nhomVan = Object.keys(VAN);
    let v; do { v = lay(nhomVan); } while (v === truoc);
    const dap = lay(VAN[v]);
    const khac = tron(nhomVan.filter(n => n !== v)).slice(0, 2).map(n => lay(VAN[n]));
    return {
      so: v, hoi: `Chạm vào tiếng có vần ${v}`, chon: tron([dap, ...khac]), dung: dap,
      ve: () => `<div class="so-to">${v}</div>`,
      khen: `Đúng rồi! Tiếng ${dap} có vần ${v}.`
    };
  }
};

function taoHangDoi() {
  const ds = [], daCo = new Set();
  DANG.forEach(([dang, , mon, soCau]) => {
    let truoc;
    for (let k = 0; k < soCau; k++) {
      // không ra lại câu đã có trong lượt này
      let c, lan = 0;
      do { c = TAO[dang](truoc, k); lan++; } while (daCo.has(dang + c.hoi + c.khen) && lan < 40);
      daCo.add(dang + c.hoi + c.khen);
      c.dang = dang; c.mon = mon; truoc = c.so;
      ds.push(c);
    }
  });
  return ds;
}

// dải thưởng: 20 ô, mỗi câu đúng tô 1 ô
function veDai() {
  const o = $('o-dai');
  o.textContent = '';
  for (let i = 0; i < hangDoi.length; i++) {
    const b = document.createElement('i');
    if (TEMA.kieu === 'bong') b.dataset.m = MAU[i % MAU.length];
    o.appendChild(b);
  }
}
function toDai(n) {
  const o = $('o-dai').children;
  // lâu đài xây từ hàng dưới lên: ô 0-9 là hàng dưới (nằm sau trong lưới)
  const thuTuO = TEMA.kieu === 'lau' ? i => (i < 10 ? 10 + i : i - 10) : i => i;
  for (let i = 0; i < o.length; i++) {
    const b = o[thuTuO(i)];
    const co = i < n;
    b.classList.toggle('co', co);
    if (TEMA.kieu === 'bong') b.style.background = co ? b.dataset.m : '';
  }
}

function batDau() {
  hangDoi = taoHangDoi(); thuTu = 0; sao = 0; dungLanDau = 0; dungTheoDang = {};
  $('tong-cau').textContent = hangDoi.length;
  $('ket-thuc').hidden = true;
  veDai(); toDai(0);
  raCau();
}

function raCau() {
  cau = hangDoi[thuTu]; khoa = false; daSai = false;
  $('so-cau').textContent = thuTu + 1;
  $('so-sao').textContent = sao;
  $('mon').textContent = cau.mon;
  $('mon').className = 'mon' + (cau.mon === 'Toán' ? '' : ' tv');
  $('cau-hoi').textContent = cau.hoi;
  if (!cau.nghe) doc(cau.noi || cau.hoi, 300); // tự đọc câu hỏi, nút 🔊 Nghe để nghe lại
  $('thong-bao').textContent = ''; $('thong-bao').className = '';
  $('hang-tiep').hidden = true;
  const hang = $('lua-chon'), khung = $('khung');
  hang.textContent = ''; khung.textContent = '';
  if (cau.nghe) { veCauNghe(); return; }
  hang.hidden = false;
  hang.className = 'lua-chon' + (cau.dai ? ' dai' : '');
  khung.innerHTML = cau.ve(false);
  cau.chon.forEach(v => {
    const b = document.createElement('button');
    b.textContent = v;
    b.onclick = () => chon(v, b);
    hang.appendChild(b);
  });
}

// câu nghe giống bài trên mạng của trường: thẻ chữ, dưới là các nút ▶ tròn, bên trái mỗi nút là ô tròn để chọn
function veCauNghe() {
  const khung = $('khung');
  $('lua-chon').hidden = true;
  khung.innerHTML = `<div class="the-nghe"><span class="hinh-nho">${cau.hinh}</span><span class="chu-to"></span></div><div class="hang-nghe"></div>`;
  khung.querySelector('.chu-to').textContent = cau.chu;
  const hang = khung.querySelector('.hang-nghe');
  cau.chon.forEach((v, i) => {
    const o = document.createElement('div'); o.className = 'lua-nghe';
    const r = document.createElement('button'); r.className = 'o-chon'; r.setAttribute('aria-label', 'Chọn cách đọc ' + (i + 1));
    const p = document.createElement('button'); p.className = 'nut-play nut-nghe'; p.innerHTML = PLAY; p.setAttribute('aria-label', 'Nghe cách đọc ' + (i + 1));
    p.onclick = () => {
      if (!coGiong()) return;
      hang.querySelectorAll('.nut-play').forEach(x => x.classList.remove('dang'));
      p.classList.add('dang');
      doc(v);
    };
    r.onclick = () => chon(v, r);
    o.append(r, p);
    hang.appendChild(o);
  });
}

function chon(v, nut) {
  if (khoa) return;
  if (v === cau.dung) {
    khoa = true; sao++;
    if (!daSai) { dungLanDau++; dungTheoDang[cau.dang] = (dungTheoDang[cau.dang] || 0) + 1; }
    nut.classList.add('dung');
    if (!cau.nghe) { $('khung').innerHTML = cau.ve(true); $('lua-chon').hidden = true; }
    const buoc = thuTu + 1;
    toDai(buoc);
    let loi = cau.khen;
    if (buoc === hangDoi.length) loi += ' ' + TEMA.vuaXong;
    else if (buoc === hangDoi.length / 2) loi += ' ' + TEMA.nuaDuong;
    else if (buoc === hangDoi.length - 2) loi += ' ' + TEMA.sapXong;
    $('so-sao').textContent = sao;
    $('thong-bao').className = 'dung';
    $('thong-bao').textContent = loi;
    $('hang-tiep').hidden = false;
    $('nut-tiep').textContent = thuTu === hangDoi.length - 1 ? 'Xem kết quả' : 'Câu tiếp';
    keu([523, 659, 784, 1047]);
  } else {
    daSai = true;
    nut.classList.add('sai'); nut.disabled = true;
    $('thong-bao').className = 'sai';
    $('thong-bao').textContent = 'Con thử lại nhé!';
    keu([220, 196]);
  }
}

// huy chương theo số câu đúng ngay lần đầu
function huyChuong() {
  const n = hangDoi.length;
  if (dungLanDau >= n - 2) return ['🥇', 'vàng'];
  if (dungLanDau >= n - 6) return ['🥈', 'bạc'];
  return ['🥉', 'đồng'];
}

// bóng bay (hoặc pháo) bay lên khi xong
function phaoGiay() {
  const p = $('phao');
  p.textContent = '';
  const ds = TEMA.kieu === 'bong' ? ['🎈'] : ['🎉', '⭐', '🎊'];
  for (let i = 0; i < 26; i++) {
    const g = document.createElement('i');
    g.textContent = lay(ds);
    g.style.left = Math.random() * 95 + 'vw';
    g.style.top = 100 + Math.random() * 20 + 'vh';
    g.style.fontSize = 30 + Math.random() * 40 + 'px';
    g.style.animationDuration = (4 + Math.random() * 3) + 's';
    g.style.animationDelay = Math.random() * 1.5 + 's';
    p.appendChild(g);
  }
  setTimeout(() => { p.textContent = ''; }, 9000);
}

$('nut-tiep').onclick = () => {
  thuTu++;
  if (thuTu >= hangDoi.length) {
    const [hc, loai] = huyChuong();
    $('vat-cuoi').textContent = TEMA.vat;
    $('hc').textContent = hc;
    $('loi-xong').textContent = TEMA.xong;
    $('loi-hc').textContent = `${TEMA.thuong(sao)}, huy chương ${loai}`;
    vePhieu();
    guiKetQua();
    $('ket-thuc').hidden = false;
    phaoGiay();
    keu([523, 659, 784, 1047, 1319]);
  } else raCau();
};
$('nut-choi-lai').onclick = batDau;
$('nut-loa').onclick = () => { if (coGiong()) doc(cau.noi || cau.hoi); };

// điểm từng môn và các dạng còn sai, để cô biết con yếu chỗ nào
function theoMon(mon) {
  let dung = 0, tong = 0;
  DANG.forEach(([dang, , m, soCau]) => { if (m === mon) { tong += soCau; dung += dungTheoDang[dang] || 0; } });
  return `${dung}/${tong}`;
}
function dangSai() {
  return DANG.filter(([dang, , , soCau]) => (dungTheoDang[dang] || 0) < soCau).map(d => d[1]);
}
function chiTiet() {
  const sai = dangSai();
  return `HC ${huyChuong()[1]}. Toán ${theoMon('Toán')}, Tiếng Việt ${theoMon('Tiếng Việt')}` + (sai.length ? `. Cần ôn: ${sai.join(', ')}` : '');
}
function vePhieu() {
  const d = new Date(), hai = n => String(n).padStart(2, '0');
  const luc = `${hai(d.getHours())}:${hai(d.getMinutes())} ngày ${hai(d.getDate())}/${hai(d.getMonth() + 1)}/${d.getFullYear()}`;
  const sai = dangSai(), dong = [];
  if (ten) dong.push(['Tên', ten]);
  dong.push(['Bài', TEN_BAI]);
  dong.push(['Huy chương', huyChuong()[1][0].toUpperCase() + huyChuong()[1].slice(1)]);
  dong.push(['Đúng ngay lần đầu', `${dungLanDau}/${hangDoi.length} câu`]);
  dong.push(['Toán', theoMon('Toán')]);
  dong.push(['Tiếng Việt', theoMon('Tiếng Việt')]);
  dong.push(['Cần ôn thêm', sai.length ? sai.join(', ') : 'Không, con làm đúng hết']);
  dong.push(['Lúc', luc]);
  const phieu = $('phieu');
  phieu.textContent = '';
  dong.forEach(([nhan, gt]) => {
    const p = document.createElement('div'), b = document.createElement('b');
    b.textContent = gt;
    p.append(nhan + ': ', b);
    phieu.appendChild(p);
  });
}

// Link Apps Script nhận kết quả (bản web trên GitHub Pages gửi thẳng tới đây)
const LINK_SHEET = 'https://script.google.com/macros/s/AKfycbzE5tlog_osSNJ7Tsr4SnJPQCiv5LpyfQaDj8jNHNYzT9YEMGnQHTJrrpNXV_45lq1t/exec';
// Chỉ ghi kết quả khi link có &lop=... (link lớp mình); link chia sẻ thì không ghi
function guiKetQua() {
  const CHUP = 'Ba mẹ chụp màn hình này gửi cô nhé.';
  const lop = window.LOP || new URLSearchParams(location.search).get('lop') || '';
  if (!lop) { $('loi-nhan').textContent = CHUP; return; }
  $('loi-nhan').textContent = 'Đang gửi kết quả cho cô...';
  const d = { lop, ten, bai: TEN_BAI, dungLanDau, soCau: hangDoi.length, chiTiet: chiTiet() };
  const xong = () => { $('loi-nhan').textContent = 'Đã gửi kết quả cho cô.'; };
  const loi = () => { $('loi-nhan').textContent = 'Chưa gửi được. ' + CHUP; };
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(xong).withFailureHandler(loi).ghiKetQua(d);
  } else {
    fetch(LINK_SHEET, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) }).then(xong, loi);
  }
}

function vaoChoi() {
  ten = $('ten-hs').value.trim();
  try { localStorage.setItem('ten-hs', ten); } catch (e) {}
  try { $('ten-hs').blur(); } catch (e) {}
  $('mo-dau').hidden = true;
  batDau();
}
try { $('ten-hs').value = localStorage.getItem('ten-hs') || ''; } catch (e) {}
// điện thoại: đang mở bàn phím thì lần chạm đầu có thể chỉ đóng bàn phím, nên bắt cả lúc vừa chạm xuống
$('nut-bat-dau').onclick = vaoChoi;
$('nut-bat-dau').addEventListener('touchend', e => { e.preventDefault(); vaoChoi(); });
$('nut-ban-khac').onclick = () => {
  $('ket-thuc').hidden = true;
  $('ten-hs').value = '';
  $('mo-dau').hidden = false;
};
document.addEventListener('keydown', e => {
  if (!$('mo-dau').hidden) { if (e.key === 'Enter') vaoChoi(); return; }
  if (e.key === 'Enter' && !$('hang-tiep').hidden) $('nut-tiep').click();
});

batDau();
