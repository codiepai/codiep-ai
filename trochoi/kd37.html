<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trốn tìm - Khởi động Bài 37</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Trò khởi động chiếu tivi: các bạn thú trốn sau 5 bụi cây, mỗi bụi là một câu ôn bài cũ.
     Trả lời đúng thì bạn thú ló ra "Tìm thấy rồi!". Tìm đủ 5 bạn thì cây to bí mật mở được:
     cả lớp cùng đếm "một, hai, ba" rồi hiện bài mới.
     Đổi bài: chỉ sửa khối NỘI DUNG đầu phần script. */
  :root {
    --u: min(1vh, 1.6vw);
    --chu: #12304a; --xanh: #0b5cab; --do: #e03131; --la: #2f9e44; --la-dam: #1e6b2e;
    --cam: #f08c00; --cam-dam: #b86200;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu);
    background:
      radial-gradient(ellipse at 20% 12%, #fff 0 4%, transparent 4.5%),
      radial-gradient(ellipse at 26% 10%, #fff 0 3.5%, transparent 4%),
      radial-gradient(ellipse at 74% 16%, #fff 0 4%, transparent 4.5%),
      linear-gradient(#a5d8ff 0%, #e7f5ff 30%, #b2f2bb 30.2%, #8ce99a 60%, #69db7c 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--u) * 2) 16px; gap: calc(var(--u) * 1.5);
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    overflow: hidden;
  }
  button { font-family: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible { outline: 5px solid var(--xanh); outline-offset: 4px; }
  h1 { font-size: max(28px, calc(var(--u) * 8)); line-height: 1; color: var(--do); text-shadow: 0 4px 0 #fff, 0 7px 0 rgba(0,0,0,.08); }
  .goi-y { font-size: max(18px, calc(var(--u) * 3.6)); color: var(--xanh); background: rgba(255,255,255,.88); border-radius: 30px; padding: 0 20px; text-align: center; }

  /* khu vườn: 6 chỗ trốn */
  .vuon { flex: 1; width: min(100%, 1400px); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: calc(var(--u) * 2); min-height: 0; }
  .cho { position: relative; background: none; border: none; padding: 0; display: flex; align-items: flex-end; justify-content: center; min-height: 0; }
  .cho svg { height: 100%; max-height: calc(var(--u) * 34); width: auto; max-width: 100%; overflow: visible; }
  .cho text { font-family: var(--font); font-weight: 800; }
  .cho .thu { font-family: var(--emoji); }
  .cho:not(.da-tim):not(.khoa) .la { animation: rung 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * .4s); transform-origin: 140px 200px; }
  @keyframes rung { 0%, 78%, 100% { transform: rotate(0); } 82% { transform: rotate(-3deg); } 88% { transform: rotate(3deg); } 94% { transform: rotate(-1.5deg); } }
  .cho:not(.da-tim):not(.khoa):hover svg { transform: scale(1.04); }
  .cho .thu-lo { animation: lo .6s cubic-bezier(.3,1.6,.5,1); transform-origin: 140px 90px; }
  @keyframes lo { from { transform: translateY(60px) scale(.4); } to { transform: none; } }
  .cho.khoa { cursor: not-allowed; }
  .cho.khoa svg { filter: grayscale(.75) opacity(.65); }
  .cho.bi-mat.mo-duoc svg { animation: sang 1.2s ease-in-out infinite; }
  @keyframes sang { 0%, 100% { filter: drop-shadow(0 0 0 #ffd43b); } 50% { filter: drop-shadow(0 0 24px #ffd43b); } }

  .hang-duoi { display: flex; gap: 14px; }
  .nut-nho { font-size: max(15px, calc(var(--u) * 2.6)); padding: 4px 18px; border-radius: 30px; border: 3px solid var(--xanh); background: #fff; color: var(--xanh); }

  /* cửa sổ câu hỏi */
  .man { position: fixed; inset: 0; background: rgba(18, 48, 74, .82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .the-hoi {
    width: min(100%, 1100px); max-height: 100%; overflow-y: auto;
    background: #fff; border-radius: calc(var(--u) * 4); border: 8px solid var(--mau, var(--cam));
    padding: calc(var(--u) * 3) calc(var(--u) * 4);
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.5); text-align: center;
    animation: bung .45s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes bung { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .so-cho { font-size: max(18px, calc(var(--u) * 3.4)); color: #fff; background: var(--mau, var(--cam)); border-radius: 30px; padding: 2px 22px; }
  .cau { font-size: max(28px, calc(var(--u) * 6.5)); line-height: 1.2; text-wrap: balance; }
  .hinh { font-family: var(--emoji); font-size: max(70px, calc(var(--u) * 15)); line-height: 1; }
  .tu { font-size: max(52px, calc(var(--u) * 15)); line-height: 1.15; white-space: pre; }
  .tu .o { display: inline-block; min-width: 1.2em; border: 6px dashed var(--do); border-radius: 18px; color: var(--do); padding: 0 .15em; }
  .tu .o.xong { border-style: solid; border-color: var(--la); color: var(--la); background: #d3f9d8; }
  .doc { font-size: max(40px, calc(var(--u) * 10)); line-height: 1.25; color: var(--xanh); text-wrap: balance; }
  .chon { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 3); }
  .chon button {
    min-width: max(90px, calc(var(--u) * 20)); padding: calc(var(--u) * 1) calc(var(--u) * 4);
    font-size: max(40px, calc(var(--u) * 11)); line-height: 1.1;
    color: #fff; background: var(--cam); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--cam-dam);
  }
  .chon button:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--cam-dam); }
  .chon button.sai { background: #b9c2cc; box-shadow: 0 8px 0 #8a949e; animation: lac .4s; }
  .chon button.dung, .chon button.doc-xong { background: var(--la); box-shadow: 0 8px 0 var(--la-dam); }
  .chon button.doc-xong { font-size: max(26px, calc(var(--u) * 6)); }
  @keyframes lac { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .loi { min-height: 1.2em; font-size: max(24px, calc(var(--u) * 5.5)); }
  .loi.sai { color: #e8590c; } .loi.dung { color: var(--la); }

  .thu-to { font-family: var(--emoji); font-size: max(110px, calc(var(--u) * 26)); line-height: 1; animation: nay .7s cubic-bezier(.3,1.6,.5,1); }
  @keyframes nay { from { transform: translateY(80px) scale(0); } to { transform: none; } }
  .hoan-ho { font-size: max(36px, calc(var(--u) * 9)); color: var(--do); }
  .nut-lon { font-size: max(26px, calc(var(--u) * 6)); padding: calc(var(--u) * .6) calc(var(--u) * 6); color: #fff; background: var(--la); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--la-dam); }
  .so-dem { font-size: max(80px, calc(var(--u) * 26)); color: var(--cam); line-height: 1; animation: nay .5s cubic-bezier(.3,1.6,.5,1); }
  .bai-moi { font-size: max(26px, calc(var(--u) * 5.6)); color: var(--xanh); }
  .am-moi { display: flex; gap: calc(var(--u) * 5); justify-content: center; flex-wrap: wrap; }
  .am-moi div { display: flex; flex-direction: column; align-items: center; }
  .am-moi .chu-to { font-size: max(60px, calc(var(--u) * 14)); line-height: 1; color: var(--do); }
  .am-moi .vd { font-size: max(24px, calc(var(--u) * 4.6)); display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .am-moi .vd span { font-family: var(--emoji); font-size: 1.9em; }

  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
  #phao i { position: absolute; top: -20px; width: 14px; height: 20px; border-radius: 3px; animation: roi linear forwards; }
  @keyframes roi { to { transform: translateY(110vh) rotate(720deg); } }
  @media (max-aspect-ratio: 1/1) { .vuon { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); } }
  @media (prefers-reduced-motion: reduce) {
    .cho .la, .cho svg, .the-hoi, .thu-to, .so-dem, .cho .thu-lo { animation: none !important; }
    #phao { display: none; }
  }
</style>
</head>
<body>
<h1>Trốn tìm</h1>
<div class="goi-y" id="goi-y">Các bạn thú đang trốn! Mời bạn chọn một bụi cây nhé!</div>
<div class="vuon" id="vuon"></div>
<div class="hang-duoi"><button class="nut-nho" id="choi-lai">Chơi lại từ đầu</button></div>

<div class="man" id="man" hidden><div class="the-hoi" id="the-hoi"></div></div>
<div id="phao"></div>

<script>
// ====== NỘI DUNG (cô sửa ở đây cho bài khác) ======
// Ôn bài 31-36 (an ăn ân ... om ôm ơm) trước Bài 37 em êm im um.
// Chỉ dùng âm, vần đã học, KHÔNG dùng em, êm, im, um (để dành cho cây bí mật).
// Mỗi câu một kiểu:
//   chon: { hoi, hinh?, tu?: [trước, chữ cần điền, sau], dap, cacChon }  - bé chạm chọn đáp án
//   doc:  { hoi, doc }                                                     - cả lớp đọc to, cô bấm nút khi đọc đúng
const CAU = [
  { kieu: 'chon', hoi: 'Đây là con gì? Chọn vần đúng nhé!', hinh: '🦐', tu: ['con t', 'ôm', ''], dap: 'ôm', cacChon: ['om', 'ơm', 'ôm'] },
  { kieu: 'chon', hoi: 'Tiếng nào có vần ơm?', dap: 'cơm', cacChon: ['cơm', 'cam', 'con'] },
  { kieu: 'chon', hoi: 'Đây là cây gì? Chọn vần đúng nhé!', hinh: '🍄', tu: ['cây n', 'ấm', ''], dap: 'ấm', cacChon: ['ắm', 'ấm', 'ám'] },
  { kieu: 'chon', hoi: 'Chọn tiếng để tạo từ', hinh: '🏡', tu: ['thôn ', 'xóm', ''], dap: 'xóm', cacChon: ['xám', 'xóm', 'xốn'] },
  { kieu: 'doc', hoi: 'Cả lớp cùng đọc to nào!', doc: 'Mẹ khen và thơm lên má Hà.' }
];
const BAI_MOI = { ten: 'Bài 37: em êm im um', am: [['em', '🍦', 'kem'], ['êm', '🌙', 'đêm'], ['im', '🐦', 'chim'], ['um', '🍇', 'chùm nho']] };
// ====================================================

const MAU_CHO = ['#e03131', '#1c7ed6', '#f08c00', '#ae3ec9', '#0ca678'];
const THU = [['🐰', 'Thỏ'], ['🐱', 'Mèo'], ['🐶', 'Cún'], ['🦊', 'Cáo'], ['🐼', 'Gấu trúc'], ['🐻', 'Gấu'], ['🐯', 'Hổ'], ['🐨', 'Gấu túi'], ['🐸', 'Ếch'], ['🐵', 'Khỉ']];
const KHEN = ['Hoan hô!', 'Giỏi quá!', 'Tuyệt vời!', 'Xuất sắc!', 'Đúng rồi!'];
const $ = id => document.getElementById(id);
let daTim = [], thuCuaCho = [], amThanh = null;

function tron(m) { for (let i = m.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [m[i], m[j]] = [m[j], m[i]]; } return m; }

function keu(dsTanSo, kieu = 'triangle', cach = 0.12) {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    if (amThanh.state === 'suspended') amThanh.resume();
    dsTanSo.forEach((f, i) => {
      const o = amThanh.createOscillator(), g = amThanh.createGain();
      const t = amThanh.currentTime + i * cach;
      o.frequency.value = f; o.type = kieu;
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.connect(g); g.connect(amThanh.destination);
      o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}

// bụi cây (hoặc cây to bí mật). thu = bạn thú ló ra khi đã tìm thấy
function veBui(mau, nhan, thu, cayTo) {
  const tan = cayTo
    ? `<rect x="122" y="150" width="36" height="80" rx="6" fill="#8d6e3f" stroke="#12304a" stroke-width="5"/>
       <g class="la"><circle cx="140" cy="95" r="80" fill="#2f9e44" stroke="#12304a" stroke-width="5"/>
       <circle cx="85" cy="125" r="45" fill="#37b24d" stroke="#12304a" stroke-width="5"/><circle cx="195" cy="125" r="45" fill="#37b24d" stroke="#12304a" stroke-width="5"/></g>`
    : `<g class="la"><ellipse cx="140" cy="180" rx="118" ry="58" fill="#2f9e44" stroke="#12304a" stroke-width="5"/>
       <circle cx="80" cy="150" r="46" fill="#37b24d" stroke="#12304a" stroke-width="5"/>
       <circle cx="140" cy="130" r="54" fill="#40c057" stroke="#12304a" stroke-width="5"/>
       <circle cx="200" cy="150" r="46" fill="#37b24d" stroke="#12304a" stroke-width="5"/>
       <circle cx="110" cy="120" r="7" fill="#ff8787"/><circle cx="182" cy="140" r="7" fill="#ffd43b"/><circle cx="70" cy="170" r="7" fill="#ffd43b"/></g>`;
  return `<svg viewBox="0 0 280 240">
    ${thu ? `<g class="thu-lo"><text class="thu" x="140" y="70" font-size="110" text-anchor="middle" dominant-baseline="central">${thu}</text></g>` : ''}
    ${tan}
    <circle cx="${cayTo ? 140 : 140}" cy="${cayTo ? 100 : 175}" r="30" fill="#fff" stroke="${mau}" stroke-width="6"/>
    <text x="140" y="${cayTo ? 102 : 177}" font-size="38" text-anchor="middle" dominant-baseline="central" fill="#12304a">${nhan}</text>
  </svg>`;
}

function veVuon() {
  const v = $('vuon');
  v.textContent = '';
  CAU.forEach((c, i) => {
    const h = document.createElement('button');
    h.className = 'cho' + (daTim[i] ? ' da-tim' : '');
    h.style.setProperty('--i', i);
    h.setAttribute('aria-label', `Bụi cây số ${i + 1}` + (daTim[i] ? ', đã tìm thấy bạn ' + thuCuaCho[i][1] : ''));
    h.innerHTML = veBui(MAU_CHO[i % MAU_CHO.length], i + 1, daTim[i] ? thuCuaCho[i][0] : '', false);
    h.onclick = () => { if (!daTim[i]) moCau(i); };
    v.appendChild(h);
  });
  const du = daTim.filter(Boolean).length === CAU.length;
  const h = document.createElement('button');
  h.className = 'cho bi-mat' + (du ? ' mo-duoc' : ' khoa');
  h.setAttribute('aria-label', du ? 'Cây to bí mật, mở được rồi' : 'Cây to bí mật, còn khóa');
  h.innerHTML = veBui('#f2b705', du ? '?' : '🔒', '', true);
  h.onclick = () => {
    if (!du) { keu([220, 196]); $('goi-y').textContent = `Tìm đủ ${CAU.length} bạn thú thì cây to bí mật mới mở được nhé!`; return; }
    demRoiMo();
  };
  v.appendChild(h);
  const conLai = CAU.length - daTim.filter(Boolean).length;
  $('goi-y').textContent = du ? 'Tìm đủ các bạn rồi! Sau cây to còn một điều bí mật!' : `Còn ${conLai} bạn thú đang trốn! Mời bạn chọn một bụi cây nhé!`;
}

function moCau(i) {
  const c = CAU[i], mau = MAU_CHO[i % MAU_CHO.length], the = $('the-hoi');
  the.style.setProperty('--mau', mau);
  let noiDung = `<div class="so-cho">Bụi cây số ${i + 1}</div><div class="cau">${c.hoi}</div>`;
  if (c.hinh) noiDung += `<div class="hinh">${c.hinh}</div>`;
  if (c.tu) noiDung += `<div class="tu" id="tu">${c.tu[0]}<span class="o" id="o">?</span>${c.tu[2]}</div>`;
  if (c.kieu === 'doc') noiDung += `<div class="doc">${c.doc}</div>`;
  noiDung += `<div class="chon" id="chon"></div><div class="loi" id="loi"></div>
    <button class="nut-nho" id="de-sau">Để bạn khác tìm</button>`;
  the.innerHTML = noiDung;
  $('de-sau').onclick = () => { $('man').hidden = true; };
  const chon = $('chon');
  if (c.kieu === 'doc') {
    const b = document.createElement('button');
    b.className = 'doc-xong'; b.textContent = 'Cả lớp đọc đúng rồi ✓';
    b.onclick = () => timThay(i);
    chon.appendChild(b);
  } else {
    c.cacChon.forEach(v => {
      const b = document.createElement('button');
      b.textContent = v;
      b.onclick = () => {
        if (b.disabled || chon.dataset.xong) return;
        if (v === c.dap) {
          chon.dataset.xong = '1';
          b.classList.add('dung');
          if (c.tu) { $('o').textContent = c.dap; $('o').classList.add('xong'); }
          $('loi').className = 'loi dung'; $('loi').textContent = 'Đúng rồi!';
          keu([523, 659, 784]);
          setTimeout(() => timThay(i), 900);
        } else {
          b.classList.add('sai'); b.disabled = true;
          $('loi').className = 'loi sai'; $('loi').textContent = 'Bạn thử lại nhé!';
          keu([220, 196]);
        }
      };
      chon.appendChild(b);
    });
  }
  $('man').hidden = false;
  keu([392, 523], 'sine');
}

function timThay(i) {
  daTim[i] = true;
  const [thu, ten] = thuCuaCho[i];
  $('the-hoi').innerHTML = `<div class="so-cho">Bụi cây số ${i + 1}</div>
    <div class="thu-to">${thu}</div>
    <div class="hoan-ho">${KHEN[i % KHEN.length]} Tìm thấy bạn ${ten} rồi!</div>
    <button class="nut-lon" id="dong">Tìm bạn tiếp theo</button>`;
  $('dong').onclick = dong;
  $('dong').focus();
  phaoGiay(50);
  keu([523, 659, 784, 1047, 1319]);
}

// cây bí mật: cả lớp đếm một, hai, ba rồi hiện bài mới
function demRoiMo() {
  const the = $('the-hoi');
  the.style.setProperty('--mau', '#f2b705');
  const so = ['Một...', 'Hai...', 'Ba...'];
  $('man').hidden = false;
  let k = 0;
  const buoc = () => {
    if (k < so.length) {
      the.innerHTML = `<div class="so-cho">Cả lớp cùng đếm nào!</div><div class="so-dem">${so[k]}</div>`;
      keu([392 + k * 131], 'sine'); k++; setTimeout(buoc, 1000);
    } else moBaiMoi();
  };
  buoc();
}

function moBaiMoi() {
  const the = $('the-hoi');
  the.innerHTML = `<div class="so-cho">Sau cây to bí mật</div>
    <div class="bai-moi">Tìm thấy rồi! Hôm nay chúng mình học ${BAI_MOI.ten}</div>
    <div class="am-moi">${BAI_MOI.am.map(([chu, hinh, vd]) => `<div><div class="chu-to">${chu}</div><div class="vd"><span>${hinh}</span>${vd}</div></div>`).join('')}</div>
    <button class="nut-lon" id="dong">Vào bài mới!</button>`;
  $('dong').onclick = dong;
  $('dong').focus();
  phaoGiay(90);
  keu([392, 523, 659, 784, 1047, 1319, 1568]);
}

function dong() { $('man').hidden = true; veVuon(); }

function phaoGiay(soLuong) {
  const p = $('phao');
  p.textContent = '';
  const mau = [...MAU_CHO, '#ffd43b', '#ec5a93'];
  for (let i = 0; i < soLuong; i++) {
    const g = document.createElement('i');
    g.style.left = Math.random() * 100 + 'vw';
    g.style.background = mau[i % mau.length];
    g.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    g.style.animationDelay = Math.random() * 1 + 's';
    p.appendChild(g);
  }
  setTimeout(() => { p.textContent = ''; }, 6500);
}

function batDau() {
  daTim = CAU.map(() => false);
  thuCuaCho = tron([...THU]).slice(0, CAU.length);
  $('man').hidden = true;
  veVuon();
}
$('choi-lai').onclick = batDau;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('man').hidden && $('dong')) $('dong').click(); });
batDau();
</script>
</body>
</html>
