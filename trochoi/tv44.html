<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đào kho báu iu ưu - Bài 44</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>

[hidden]{display:none!important}
:root{--u:min(1vh,1.6vw);--chu:#12304a;--xanh:#0b5cab;--do:#e03131;--la:#2f9e44;--cam:#f08c00;--tim:#7048e8;--hong:#e64980;--font:"Baloo 2","Segoe UI",Arial,sans-serif;--emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);font-weight:800;color:var(--chu);display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*1.2) 14px;gap:calc(var(--u)*.8);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
button{font-family:inherit;font-weight:800;cursor:pointer}
button:focus-visible{outline:5px solid var(--xanh);outline-offset:3px}
.top{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top a{color:var(--xanh);text-decoration:none;font-size:max(15px,calc(var(--u)*2.8));background:#ffffffcc;border-radius:30px;padding:4px 14px}
.sao{background:#fff;border-radius:30px;padding:4px 16px;font-size:max(16px,calc(var(--u)*3));color:#b86200;box-shadow:0 3px 0 #0002}
h1{font-size:max(26px,calc(var(--u)*6.4));line-height:1.05;text-align:center;text-shadow:0 4px 0 #fff}
.goiy{font-size:max(18px,calc(var(--u)*3.8));text-align:center;color:var(--xanh);min-height:1.35em}
.tien{display:flex;gap:6px;justify-content:center}
.tien i{width:max(14px,calc(var(--u)*2.4));height:max(14px,calc(var(--u)*2.4));border-radius:50%;background:#fff;border:3px solid #0003}
.tien i.xong{background:var(--la);border-color:#1e6b2e}
.tien i.nay{background:#ffd43b;border-color:var(--cam)}
.nutlon{font-size:max(22px,calc(var(--u)*5));padding:.3em 1.1em;border:none;border-radius:20px;color:#fff;background:var(--cam);box-shadow:0 6px 0 #b86200}
.nutlon:active{transform:translateY(4px);box-shadow:0 2px 0 #b86200}
.phu{background:#fff;color:var(--xanh);box-shadow:0 6px 0 #9bb8d3}
#man{position:fixed;inset:0;background:#0b3a6acc;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#man .hop{background:#fff;border-radius:30px;padding:calc(var(--u)*3) calc(var(--u)*4);text-align:center;max-width:620px;box-shadow:0 10px 0 #0004}
#man h2{font-size:max(30px,calc(var(--u)*7));color:var(--xanh);line-height:1.05}
#man p{font-size:max(18px,calc(var(--u)*3.6));margin:.5em 0 .8em;font-weight:700}
#man .sao3{font-size:max(46px,calc(var(--u)*11));letter-spacing:.1em;margin:.1em 0}
#man .hang{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bay{position:fixed;pointer-events:none;font-family:var(--emoji);z-index:60;animation:bay 1.3s ease-out forwards}
@keyframes bay{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
.lac{animation:lac .4s}
@keyframes lac{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.nhun{animation:nhun .5s}
@keyframes nhun{30%{transform:scale(1.18)}60%{transform:scale(.95)}}
em{font-style:normal;color:var(--do)}

body{background:linear-gradient(#a5d8ff 0,#d0ebff 28%,#ffe8a3 29%,#ffd8a8)}
h1{color:#c92a2a}

.nv{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(var(--u)*1.6);background:#fff;border-radius:22px;padding:calc(var(--u)*1) calc(var(--u)*2.4);box-shadow:0 6px 0 #0002;font-size:max(17px,calc(var(--u)*4.2))}
.nv b{font-size:max(34px,calc(var(--u)*8));color:#e8590c;line-height:1}
.ruong{display:flex;gap:6px;font-family:var(--emoji);font-size:max(24px,calc(var(--u)*5.4))}
.ruong span{opacity:.3;filter:grayscale(1)}
.ruong span.co{opacity:1;filter:none;animation:nhun .5s}
.bai{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1.3);width:100%;max-width:760px;flex:1;min-height:0;align-content:center}
.go{position:relative;border:none;border-radius:50%/42%;aspect-ratio:1/.82;max-height:calc(var(--u)*17);background:radial-gradient(ellipse at 50% 30%,#ffe8a3 0,#f2c66d 55%,#d9a441 100%);box-shadow:0 8px 0 #a8742199,inset 0 -6px 0 #c58b2f55;display:flex;align-items:center;justify-content:center;padding:0;font-family:var(--font)}
.go:active{transform:translateY(4px)}
.go .gi{font-family:var(--emoji);font-size:max(22px,calc(var(--u)*5));opacity:.35}
.go.mo{background:#8d6a3a;box-shadow:inset 0 6px 0 #5c4020;border-radius:20px;aspect-ratio:1/.9;cursor:default}
.go.mo .gi{display:none}
.go.mo .nd{display:flex}
.nd{display:none;flex-direction:column;align-items:center;justify-content:center;line-height:1;width:100%;height:100%;border-radius:18px;animation:nhun .5s}
.nd img{max-height:56%;max-width:76%}
.nd .tx{font-size:max(22px,calc(var(--u)*5.6));color:#fff}
.nd .tx em{color:#ffd43b}
.go.dung .nd{background:linear-gradient(#69db7c,#2f9e44);}
.go.khac .nd{background:linear-gradient(#a5d8ff,#4dabf7)}
.go.cua .nd{background:linear-gradient(#ffc9c9,#fa5252)}
.nd .cua{font-family:var(--emoji);font-size:max(30px,calc(var(--u)*7))}
.noi{display:flex;flex-direction:column;gap:calc(var(--u)*1.6);width:100%;max-width:900px;flex:1;min-height:0;justify-content:center}
.hai{width:100%;display:flex;gap:max(90px,min(calc(var(--u)*22),26vw));justify-content:center}
.cot{display:flex;flex-direction:column;gap:calc(var(--u)*1.4);flex:1 1 0;min-width:0}
.cum{white-space:nowrap;overflow:hidden;touch-action:none;font-size:max(18px,calc(var(--u)*4.4));padding:.45em .4em;border:none;border-radius:16px;background:#fff;color:var(--chu);box-shadow:0 5px 0 #0003;line-height:1.15}
.cum:active{transform:translateY(3px)}
.cum.chon{background:#ffd43b;box-shadow:0 5px 0 #b86200}
.cum.xong{background:#69db7c;color:#fff;box-shadow:none;cursor:default}
.cauxong{display:flex;flex-direction:column;gap:2px;font-size:max(15px,calc(var(--u)*3.4));color:#2b8a3e;text-align:center;min-height:5em}
#day{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#day line{stroke-width:max(7px,calc(var(--u)*1.1));stroke-linecap:round}
.nd small{font-size:max(11px,calc(var(--u)*2));font-weight:700;color:#fff}

</style>
</head>
<body>
<div class="top"><span></span><span class="sao" id="tongSao"></span></div>
<h1>🏝️ Đào kho báu iu - ưu</h1>
<div class="goiy" id="goiy"></div>
<div class="tien" id="tien"></div>

<div class="nv"><span>Tìm 4 kho báu có vần</span><b id="van">iu</b><div class="ruong" id="ruong"></div></div>
<div class="bai" id="bai"></div>
<div class="noi" id="noi" hidden></div>
<svg id="day"></svg>

<div id="man" hidden><div class="hop"><h2></h2><p></p><div class="sao3"></div><div class="hang"><button class="nutlon" id="manOk">Bắt đầu</button></div></div></div>
<script>

const $=i=>document.getElementById(i);
const xao=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cho=ms=>new Promise(r=>setTimeout(r,ms));
const lsx=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let tongSao=parseInt(lsx('vuon-sao')||'0',10)||0; const hienSao=()=>{const e=$('tongSao');if(e)e.textContent='⭐ '+tongSao};
function congSao(n){tongSao+=n;lsx('vuon-sao',tongSao);hienSao()}
/* Doc tieng Viet: uu tien giong Viet co san trong may, khong co thi doc bang giong Viet truc tuyen (can mang) */
let viVoice=null;const layGiong=()=>{if(!window.speechSynthesis)return;viVoice=speechSynthesis.getVoices().filter(x=>/^vi[-_]?/i.test(x.lang)||/vietnam|tiếng việt/i.test(x.name))[0]||null};
if(window.speechSynthesis){layGiong();speechSynthesis.onvoiceschanged=layGiong}
let amDS=[],amTT=0;
function noi(...ds){amTT++;const tt=amTT;amDS.forEach(a=>a.pause());amDS=[];if(window.speechSynthesis)speechSynthesis.cancel();
 if(viVoice&&window.speechSynthesis){ds.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang=viVoice.lang;u.voice=viVoice;u.rate=.8;speechSynthesis.speak(u)});return}
 (function tiep(i){if(i>=ds.length||tt!==amTT)return;const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(ds[i]));amDS.push(a);a.onended=()=>tiep(i+1);a.onerror=()=>tiep(i+1);const p=a.play();if(p&&p.catch)p.catch(()=>{})})(0)}
/* Tieng bip bang WebAudio (khong can file am thanh) */
let ac=null;function bip(loai){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
 const seq=loai==='dung'?[[660,0],[880,.12],[1175,.24]]:loai==='sai'?[[220,0],[180,.14]]:loai==='thang'?[[523,0],[659,.13],[784,.26],[1047,.39],[1319,.52]]:[[600,0]];
 seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=loai==='sai'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.25)})}catch(e){}}
/* Phao hoa emoji */
function phao(x,y,ds,n){ds=ds||['⭐','✨','🎉','🌟'];n=n||14;for(let i=0;i<n;i++){const e=document.createElement('div');e.className='bay';e.textContent=ds[i%ds.length];e.style.left=x+'px';e.style.top=y+'px';e.style.fontSize=(22+Math.random()*22)+'px';e.style.setProperty('--dx',((Math.random()-.5)*360)+'px');e.style.setProperty('--dy',(-60-Math.random()*260)+'px');e.style.setProperty('--r',((Math.random()-.5)*400)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
const giua=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
/* Man hinh bat dau / ket thuc */
function manHinh(tieude,loi,nut,cb,saoSo){const m=$('man');m.hidden=false;m.querySelector('h2').textContent=tieude;m.querySelector('p').textContent=loi;m.querySelector('.sao3').textContent=saoSo?'⭐'.repeat(saoSo)+'☆'.repeat(3-saoSo):'';$('manOk').textContent=nut;$('manOk').onclick=()=>{m.hidden=true;cb()}}
function hienTien(n,xong){$('tien').innerHTML=Array.from({length:n},(_,i)=>'<i class="'+(i<xong?'xong':i===xong?'nay':'')+'"></i>').join('')}
hienSao();
/* To do phan van trong tu: boThanh bo dau thanh (huyen sac hoi nga nang) tung chu, giu nguyen chu cai mu/ngang */
const boThanh=c=>c.normalize('NFD').replace(/[̣̀́̃̉]/g,'').normalize('NFC');
function toVan(w,vans){const ch=[...w],nm=ch.map(boThanh).join('').toLowerCase();let best=null;
 for(const v of vans){const k=nm.lastIndexOf(v);if(k>=0&&(best===null||v.length>best.v.length))best={k,v}}
 if(!best)return w;const n=[...best.v].length;return ch.slice(0,best.k).join('')+'<em>'+ch.slice(best.k,best.k+n).join('')+'</em>'+ch.slice(best.k+n).join('')}


/* Bo giong doc: chi con am thanh dung/sai */
noi=function(){};
const IU=[['rìu','cai-riu'],['địu',''],['dịu',''],['xíu','']],UU=[['lựu','qua-luu'],['cừu','cuu'],['hưu',''],['mưu','']];
const VANS=['iu','ưu'];let vong=0,tim=0,sai=0,khoa=false,o=[];
function batDau(){vong=0;sai=0;$('noi').hidden=true;$('bai').hidden=false;document.querySelector('.nv').hidden=false;man()}
function man(){tim=0;khoa=false;const mucTieu=vong===0?IU:UU,khac=vong===0?UU:IU,v=VANS[vong];$('van').textContent=v;
 $('ruong').innerHTML='<span>💎</span><span>💎</span><span>💎</span><span>💎</span>';$('goiy').textContent='Bấm vào gò cát để đào. Nghe và đọc từ thật kĩ nhé!';hienTien(3,vong);
 o=xao(mucTieu.map(x=>({w:x[0],h:x[1],k:'dung'})).concat(khac.map(x=>({w:x[0],h:x[1],k:'khac'}))).concat([1,2,3,4].map(()=>({k:'cua'}))));
 $('bai').innerHTML=o.map((c,k)=>'<button class="go" data-k="'+k+'" aria-label="gò cát '+(k+1)+'"><span class="gi">🌴</span><div class="nd"></div></button>').join('');
 [...$('bai').children].forEach(b=>b.onclick=()=>dao(b));noi('Tìm kho báu có vần '+v)}
async function dao(b){if(khoa||b.classList.contains('mo'))return;const c=o[+b.dataset.k],v=VANS[vong],nd=b.querySelector('.nd');b.classList.add('mo',c.k);
 if(c.k==='cua'){sai++;bip('sai');nd.innerHTML='<span class="cua">🦀</span><small>cua kẹp!</small>';b.classList.add('lac');noi('ối, con cua');return}
 nd.innerHTML=(c.h?'<img alt="" src="../hinh/'+c.h+'.webp">':'')+'<span class="tx">'+toVan(c.w,['iu','ưu'])+'</span>';noi(c.w);
 if(c.k==='dung'){bip('dung');tim++;[...$('ruong').children][tim-1].classList.add('co');const [x,y]=giua(b);phao(x,y,['💎','✨','⭐'],8);
  if(tim===4){khoa=true;await cho(1200);vong++;if(vong>=2)return manHinh('Giỏi quá, hết kho báu rồi!','Sang chặng 3: nối cụm từ để tạo thành câu nhé.','Đi tiếp',chang3);manHinh('Giỏi quá, hết rương vần '+v+'!','Sang bãi biển bên kia, tìm kho báu vần '+VANS[vong]+' nhé.','Đi tiếp',man)}}
 else{sai++;bip('sai');nd.insertAdjacentHTML('beforeend','<small>vần '+(v==='iu'?'ưu':'iu')+'</small>');b.classList.add('nhun');setTimeout(()=>noi('Từ này không có vần '+v),900)}}
const CAP=[[['Bà gửi cho Hà','túi kẹo.'],['Hai bạn thi','nhảy dây.'],['Voi con mời bạn','đi xem hội.'],['Bà đã nghỉ hưu','mà luôn bận bịu.']],
 [['Ao thu lạnh lẽo','nước trong veo.'],['Đàn sẻ nâu kêu ríu rít','ở sau nhà.'],['Cún con nhìn thấy','dế mèn trên tàu lá.'],['Tàu neo đậu','ven bờ.']]];
let rd=0,nt=0,ch=null;
function chang3(){rd=0;$('bai').hidden=true;document.querySelector('.nv').hidden=true;$('noi').hidden=false;hienTien(3,2);vongNoi()}
function vongNoi(){nt=0;ch=null;khoa=false;const ds=CAP[rd];$('goiy').textContent='Chặng 3: kéo ngón tay từ cụm từ bên trái sang cụm từ bên phải để nối thành câu đúng.';
 const bt=(x,s)=>'<button class="cum" data-s="'+s+'" data-i="'+x.i+'">'+x.t+'</button>';
 dong=[];$('noi').innerHTML='<div class="hai"><div class="cot">'+xao(ds.map((p,i)=>({t:p[0],i}))).map(x=>bt(x,'T')).join('')+'</div><div class="cot">'+xao(ds.map((p,i)=>({t:p[1],i}))).map(x=>bt(x,'P')).join('')+'</div></div><div class="cauxong" id="cx"></div>';
 dong=[];[...$('noi').querySelectorAll('.cum')].forEach(b=>{b.onpointerdown=e=>keoDau(e,b)});vuaChu();noi('Nối cụm từ tạo câu')}
const diem=(b,tay)=>{const r=b.getBoundingClientRect();return[b.dataset.s==='T'?r.right:r.left,r.top+r.height/2]};
let dong=[],keo=null;
function veLai(){const g=$('day');let h='';dong.forEach(([a,b])=>{const [x1,y1]=diem(a),[x2,y2]=diem(b);h+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#2f9e44"/>'});
 if(keo&&keo.x!==undefined){const [x1,y1]=diem(keo.b);h+='<line x1="'+x1+'" y1="'+y1+'" x2="'+keo.x+'" y2="'+keo.y+'" stroke="#f08c00" stroke-dasharray="1 14"/>'}g.innerHTML=h}
function vuaChu(){const ds=[...$('noi').querySelectorAll('.cum')];if(!ds.length)return;ds.forEach(b=>b.style.fontSize='');
 let f=parseFloat(getComputedStyle(ds[0]).fontSize);while(f>10&&ds.some(b=>b.scrollWidth>b.clientWidth+1)){f-=1;ds.forEach(b=>b.style.fontSize=f+'px')}veLai()}
addEventListener('resize',()=>{if(!$('noi').hidden)vuaChu();else if(dong.length||keo)veLai()});
function keoDau(e,b){if(khoa||b.classList.contains('xong'))return;e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}
 keo={b,x0:e.clientX,y0:e.clientY};
 b.onpointermove=ev=>{if(!keo)return;keo.x=ev.clientX;keo.y=ev.clientY;if(Math.hypot(ev.clientX-keo.x0,ev.clientY-keo.y0)>12)keo.dich=true;veLai()};
 b.onpointerup=ev=>{if(!keo)return;const k=keo;keo=null;b.onpointermove=b.onpointerup=b.onpointercancel=null;veLai();
  if(!k.dich){chon(b);return}
  const t=document.elementFromPoint(ev.clientX,ev.clientY),c=t&&t.closest?t.closest('.cum'):null;
  if(c&&c!==b)ghep(b,c)};
 b.onpointercancel=()=>{keo=null;veLai()}}
function chon(b){if(khoa||b.classList.contains('xong'))return;noi(b.textContent);
 if(ch&&ch.dataset.s===b.dataset.s){ch.classList.remove('chon');ch=b;b.classList.add('chon');return}
 if(!ch){ch=b;b.classList.add('chon');return}
 const a=ch;ch=null;a.classList.remove('chon');ghep(a,b)}
async function ghep(a,b){if(khoa||a.classList.contains('xong')||b.classList.contains('xong')||a.dataset.s===b.dataset.s)return;
 if(ch){ch.classList.remove('chon');ch=null}
 if(a.dataset.i!==b.dataset.i){sai++;bip('sai');[a,b].forEach(x=>{x.classList.add('lac');setTimeout(()=>x.classList.remove('lac'),420)});$('goiy').textContent='Chưa thành câu đúng. Thử nối lại nhé!';return}
 [a,b].forEach(x=>x.classList.add('xong'));bip('dung');nt++;const l=a.dataset.s==='T'?a:b,r=a.dataset.s==='T'?b:a,cau=l.textContent+' '+r.textContent;
 dong.push([l,r]);$('cx').insertAdjacentHTML('beforeend','<div>✔ '+cau+'</div>');veLai();noi(cau);const [x,y]=giua(b);phao(x,y,['⭐','✨','💎'],8);$('goiy').textContent='Đúng rồi!';
 if(nt===4){khoa=true;await cho(2200);rd++;if(rd>=CAP.length)return ketThuc();manHinh('Nối giỏi quá!','Nối thêm 4 câu nữa nhé.','Đi tiếp',vongNoi)}}
function ketThuc(){dong=[];veLai();hienTien(3,3);const s=sai<=4?3:sai<=10?2:1;congSao(s);bip('thang');phao(innerWidth/2,innerHeight/2,['💎','⭐','🎉'],26);manHinh('Tìm đủ kho báu rồi!','Con đã tìm được 8 kho báu vần iu, ưu và nối đúng 8 câu.','Chơi lại',batDau,s)}
manHinh('Đào kho báu iu - ưu','Bãi biển có nhiều gò cát. Đào đúng kho báu có vần cô giao, tránh con cua nhé.','Bắt đầu',batDau);

</script>
</body>
</html>
