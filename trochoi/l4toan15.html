<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot trên tia số - Toán 4 Bài 15</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Toán 4 - Bài 15 Làm quen với dãy số tự nhiên. Học sinh chơi ở nhà trên điện thoại/máy tính.
     4 chặng x 5 câu = 20 câu: 1. Đúng hay sai  2. Số liền trước, liền sau (gõ số)
     3. Số còn thiếu trong dãy  4. Xếp từ bé đến lớn. Mỗi câu đúng ngay lần đầu = 1 sao.
     Câu hỏi sinh ngẫu nhiên nên chơi lại lần nào cũng khác.
     Link có ?lop=... thì gửi kết quả về Google Sheet; link chia sẻ thì không gửi. */
  [hidden] { display: none !important; }
  :root {
    --chu: #10243e; --nen: #0b1e3f; --vang: #ffd43b; --cam: #f76707;
    --xanh: #2f9e44; --do: #e03131; --lam: #1c7ed6; --tim: #7048e8;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu);
    background: radial-gradient(ellipse at 50% 0%, #364fc7 0%, #1b2a6b 45%, var(--nen) 100%) fixed;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .7;
    background-image: radial-gradient(2px 2px at 10% 20%, #fff, transparent), radial-gradient(1.5px 1.5px at 30% 70%, #fff, transparent),
      radial-gradient(2px 2px at 70% 15%, #fff, transparent), radial-gradient(1.5px 1.5px at 85% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 40%, #fff, transparent), radial-gradient(2px 2px at 20% 90%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 92% 88%, #fff, transparent), radial-gradient(1.5px 1.5px at 45% 85%, #fff, transparent); }
  button { font-family: inherit; font-weight: 800; cursor: pointer; border: none; color: inherit; }
  button:focus-visible { outline: 4px solid var(--vang); outline-offset: 3px; }
  .khung { position: relative; max-width: 760px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 14px; }
  .thuong-hieu { color: #a5d8ff; font-size: 15px; letter-spacing: .5px; text-align: center; }
  h1 { color: var(--vang); text-align: center; font-size: clamp(28px, 7vw, 46px); line-height: 1.05; text-shadow: 0 4px 0 #862e9c; }
  .phu { color: #e7f5ff; text-align: center; font-size: clamp(16px, 3.6vw, 20px); font-weight: 600; }

  /* tia số: robot đi 1 vạch mỗi câu */
  .tia { background: #fff; border-radius: 20px; padding: 10px 14px 8px; box-shadow: 0 6px 0 #0008; }
  .tia-tren { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
  .sao-dem { color: var(--cam); }
  .duong { position: relative; height: 62px; margin: 0 10px; }
  .duong .vach { position: absolute; bottom: 14px; width: 2px; height: 12px; background: #495057; transform: translateX(-1px); }
  .duong .vach.lon { height: 18px; width: 3px; }
  .duong .so { position: absolute; bottom: -4px; font-size: 12px; transform: translateX(-50%); color: #495057; }
  .duong .truc { position: absolute; left: -6px; right: -14px; bottom: 20px; height: 4px; background: #495057; border-radius: 2px; }
  .duong .truc::after { content: ""; position: absolute; right: -2px; top: -6px; border: 8px solid transparent; border-left: 12px solid #495057; border-right: 0; }
  .duong .dau { position: absolute; bottom: 26px; font-size: 13px; transform: translateX(-50%); }
  #robot { position: absolute; bottom: 22px; font-size: 34px; transform: translateX(-50%); transition: left .6s cubic-bezier(.3,1.4,.5,1); line-height: 1; }

  .chang { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chang span { background: #ffffff22; color: #dbe4ff; border-radius: 99px; padding: 4px 12px; font-size: 14px; }
  .chang span.dang { background: var(--vang); color: var(--chu); }
  .chang span.xong { background: #2f9e44; color: #fff; }

  .the { background: #fff; border-radius: 24px; padding: 18px 16px 20px; box-shadow: 0 8px 0 #0009; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .de { font-size: clamp(19px, 4.4vw, 26px); line-height: 1.3; }
  .de small { display: block; font-size: 15px; color: #868e96; font-weight: 600; }
  .loai { font-size: 14px; color: #fff; background: var(--tim); border-radius: 99px; padding: 2px 12px; }

  .hai-nut { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .nut-ds { min-width: 130px; font-size: 28px; padding: 10px 22px; border-radius: 18px; color: #fff; box-shadow: 0 6px 0 #0005; }
  .nut-ds.d { background: var(--xanh); } .nut-ds.s { background: var(--do); }
  .nut-ds:active, .chon button:active, .phim button:active { transform: translateY(4px); box-shadow: 0 2px 0 #0005; }

  .nhap { min-width: 220px; min-height: 58px; border: 4px dashed var(--lam); border-radius: 16px; font-size: 36px; padding: 2px 16px; color: var(--lam); background: #e7f5ff; }
  .phim { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; justify-content: center; }
  .phim button { height: 56px; border-radius: 14px; font-size: 26px; background: #edf2ff; box-shadow: 0 5px 0 #91a7ff; }
  .phim .xoa { background: #fff4e6; box-shadow: 0 5px 0 #ffa94d; font-size: 20px; }
  .phim .ok { background: var(--xanh); color: #fff; box-shadow: 0 5px 0 #1e6b2e; font-size: 20px; }

  .day { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .o { min-width: 92px; padding: 8px 10px; border-radius: 14px; background: #fff3bf; border: 3px solid #fab005; font-size: clamp(18px, 4.2vw, 24px); }
  .o.trong { background: #e7f5ff; border: 3px dashed var(--lam); color: var(--lam); }
  .chon { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .chon button { min-width: 120px; font-size: 24px; padding: 10px 16px; border-radius: 16px; background: #edf2ff; box-shadow: 0 6px 0 #91a7ff; }
  .chon button.dung, .the-so.dung { background: #b2f2bb; box-shadow: 0 6px 0 var(--xanh); }
  .chon button.sai { background: #ffc9c9; box-shadow: 0 6px 0 var(--do); }

  .hang-xep { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 64px; padding: 8px; border-radius: 16px; background: #f1f3f5; width: 100%; }
  .hang-xep .o { background: #d3f9d8; border-color: var(--xanh); }
  .hang-xep .o b { color: #868e96; font-size: 14px; margin-right: 4px; }
  .the-so { min-width: 110px; font-size: 24px; padding: 12px 14px; border-radius: 14px; background: #fff3bf; box-shadow: 0 6px 0 #fab005; }
  .the-so.sai { background: #ffc9c9; box-shadow: 0 6px 0 var(--do); }
  .the-so[disabled] { opacity: .25; cursor: default; }

  .bao { min-height: 30px; font-size: 18px; line-height: 1.35; }
  .bao.tot { color: var(--xanh); } .bao.chua { color: var(--do); }
  .nut-lon { font-size: 22px; padding: 10px 30px; border-radius: 99px; background: var(--cam); color: #fff; box-shadow: 0 6px 0 #a63c06; }
  .lac { animation: lac .4s; }
  @keyframes lac { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

  #ten-hs { font-family: inherit; font-weight: 800; font-size: 22px; text-align: center; width: min(100%, 420px); padding: 8px 14px; border: 4px solid #74c0fc; border-radius: 18px; color: var(--chu); user-select: text; -webkit-user-select: text; }
  .phieu { text-align: left; font-size: 18px; line-height: 1.6; background: #f8f9fa; border-radius: 16px; padding: 10px 16px; width: 100%; font-weight: 600; }
  .phieu b { font-weight: 800; }
  .sao-to { font-size: 44px; }
  .nho { font-size: 15px; color: #868e96; font-weight: 600; }
  #loi-may { position: fixed; left: 10px; right: 10px; bottom: 10px; background: var(--do); color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 16px; z-index: 50; }
  @media (max-width: 420px) {
    .phim { grid-template-columns: repeat(3, 64px); }
    .o { min-width: 74px; padding: 6px; }
    .nut-ds { min-width: 110px; }
  }
</style>
</head>
<body>
<div class="khung">
  <div class="thuong-hieu">Cô Điệp AI</div>
  <h1>Robot trên tia số</h1>
  <div class="phu">Toán 4 - Bài 15: Làm quen với dãy số tự nhiên</div>

  <div class="tia">
    <div class="tia-tren"><span id="cau-so">Câu 0/20</span><span class="sao-dem" id="sao-dem">⭐ 0</span></div>
    <div class="duong" id="duong"><div class="truc"></div><div id="robot">🤖</div></div>
  </div>
  <div class="chang" id="chang"></div>

  <div class="the" id="mo-dau">
    <div class="de">Chào con! Giúp robot đi hết tia số từ <b>0</b> đến <b>20</b> nhé.<small>4 chặng, 20 câu. Mỗi câu đúng ngay lần đầu được 1 ⭐.</small></div>
    <label for="ten-hs" class="de" style="font-size:18px">Con tên là gì?</label>
    <input id="ten-hs" type="text" maxlength="40" autocomplete="off" placeholder="Họ và tên">
    <button class="nut-lon" id="bat-dau">Bắt đầu</button>
  </div>

  <div class="the" id="cau" hidden></div>
</div>

<script>
window.onerror = (m, f, d) => {
  const goc = s => String(s || "").split(/[?#]/)[0];
  if (/zalo|FBNav|instagram/i.test(m) || !f || goc(f) !== goc(location.href)) return; // lỗi của app Zalo/Facebook chèn vào, không phải của trò chơi
  const o = document.getElementById('loi-may') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'loi-may' }));
  o.textContent = 'Lỗi: ' + m + ' (dòng ' + d + ')';
};
const $ = id => document.getElementById(id);
const TEN_BAI = 'Toán 4 - Bài 15 Dãy số tự nhiên';
const ngau = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const tron = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// viết số như sách: 10 001, 1 991 (khoảng cách không ngắt dòng)
const vs = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

// ====== CHẶNG 1: ĐÚNG HAY SAI (cô sửa/thêm câu ở đây) [câu, đúng?, giải thích] ======
const DS = [
  ['Số 1 000 000 là số tự nhiên lớn nhất.', false, 'Không có số tự nhiên lớn nhất: số nào cũng có số liền sau.'],
  ['Dãy số 1, 2, 3, 4, 5, ... là dãy số tự nhiên.', false, 'Dãy số tự nhiên phải bắt đầu từ 0: 0, 1, 2, 3, ...'],
  ['Số đầu tiên của dãy số tự nhiên là số 0.', true, 'Đúng: số tự nhiên bé nhất là 0.'],
  ['Số liền trước của một số bé hơn số liền sau của số đó 2 đơn vị.', true, 'Đúng: ví dụ 9 và 11 là liền trước, liền sau của 10, hơn kém nhau 2.'],
  ['Không có số tự nhiên lớn nhất.', true, 'Đúng: thêm 1 vào số nào cũng được số lớn hơn.'],
  ['Số tự nhiên bé nhất là 1.', false, 'Số tự nhiên bé nhất là 0.'],
  ['Hai số tự nhiên liên tiếp hơn kém nhau 1 đơn vị.', true, 'Đúng: ví dụ 2 045 và 2 046.'],
  ['Dãy số 0, 1, 2, 3, 4, 5, ... là dãy số tự nhiên.', true, 'Đúng: bắt đầu từ 0, mỗi số hơn số trước 1 đơn vị.'],
  ['Số liền sau của 9 999 là 10 001.', false, 'Số liền sau của 9 999 là 10 000.'],
  ['100 và 102 là hai số tự nhiên liên tiếp.', false, 'Giữa 100 và 102 còn số 101. Hai số liên tiếp chỉ hơn kém nhau 1.'],
  ['Số liền trước của 10 000 là 9 999.', true, 'Đúng: 10 000 - 1 = 9 999.'],
  ['Số 0 không có số liền trước trong dãy số tự nhiên.', true, 'Đúng: 0 là số đầu tiên của dãy.'],
  ['Số liền trước của 2 000 là 1 900.', false, 'Số liền trước của 2 000 là 1 999.']
];

// ====== CHẶNG 2: các số để hỏi liền trước / liền sau (sinh ngẫu nhiên theo kiểu sách) ======
function soChang2() {
  const kieu = [
    () => ngau(21, 99),                              // như 81
    () => ngau(1, 9) * 1000 + ngau(1, 9) * 100 + 91, // như 1 991
    () => ngau(1, 9) * 1000 + ngau(0, 99),           // như 2 045
    () => ngau(1, 9) * 10000,                        // như 10 000
    () => ngau(1, 9) * 1000,                         // 2 000
    () => ngau(1, 9) * 1000 + 999,                   // 4 999 -> liền sau 5 000
    () => ngau(10, 99) * 1000 + ngau(0, 9) * 10 + 9, // 35 029
    () => 100000
  ];
  const ra = new Set();
  while (ra.size < 5) ra.add(kieu[ngau(0, kieu.length - 1)]());
  const truoc = tron([true, true, true, false, false]); // 3 câu liền trước, 2 câu liền sau
  return [...ra].map((n, i) => ({ n, truoc: truoc[i] }));
}

// ====== CHẶNG 3: dãy số liên tiếp, tìm số còn thiếu ======
function soChang3() {
  const dau = [ngau(5, 60), 1000 - ngau(1, 3), 10000 - ngau(1, 3), ngau(1, 9) * 1000 - ngau(1, 3), 100000 - ngau(1, 3), ngau(20, 90) * 100 - 2];
  return tron(dau).slice(0, 5).map(a => {
    const day = [a, a + 1, a + 2, a + 3, a + 4];
    const vt = ngau(1, 4), dung = day[vt];
    const nhieu = new Set([dung]);
    for (const x of tron([dung + 10, dung - 10, dung + 2, dung + 100, Math.max(0, dung - 2)])) { if (nhieu.size < 3 && x >= 0 && !day.includes(x)) nhieu.add(x); }
    return { day, vt, dung, chon: tron([...nhieu]) };
  });
}

// ====== CHẶNG 4: xếp 4 số từ bé đến lớn (như 10 001, 9 999, 9 666, 9 998) ======
function soChang4() {
  const goc = tron([1000, 10000, 10000, 100000, 2000, 5000, 20000]).slice(0, 5);
  return goc.map(B => {
    const a = new Set([B + 1, B - 1, B - 2]);
    const lap = Math.floor((B - 1) / 1000) * 1000 + ngau(1, 9) * 111 % 1000; // số "lặp chữ" nhỏ hơn hẳn, như 9 666
    a.add(lap < B - 2 ? lap : B - 10);
    if (a.size < 4) a.add(B + 10);
    return tron([...a].slice(0, 4));
  });
}

let ten = '', ds, chi = 0, sao = 0, diem, saiNoi, saiLan;
const TEN_CHANG = ['Đúng hay sai', 'Liền trước, liền sau', 'Số còn thiếu', 'Xếp bé đến lớn'];

function veTia() {
  const d = $('duong');
  d.querySelectorAll('.vach, .so').forEach(x => x.remove());
  for (let i = 0; i <= 20; i++) {
    const v = document.createElement('div'); v.className = 'vach' + (i % 5 === 0 ? ' lon' : ''); v.style.left = (i * 5) + '%'; d.appendChild(v);
    if (i % 5 === 0) { const s = document.createElement('div'); s.className = 'so'; s.textContent = i; s.style.left = (i * 5) + '%'; d.appendChild(s); }
  }
}
function diRobot() { $('robot').style.left = (chi * 5) + '%'; $('cau-so').textContent = `Câu ${Math.min(chi + 1, 20)}/20`; $('sao-dem').textContent = '⭐ ' + sao; }
function veChang() {
  const c = Math.min(3, Math.floor(chi / 5));
  $('chang').innerHTML = '';
  TEN_CHANG.forEach((t, i) => { const s = document.createElement('span'); s.textContent = (i + 1) + '. ' + t; if (i < c || chi >= 20) s.className = 'xong'; else if (i === c) s.className = 'dang'; $('chang').appendChild(s); });
}

// âm thanh nhỏ
let am;
function keu(not, dai = 0.12) {
  try {
    am = am || new (window.AudioContext || window.webkitAudioContext)(); if (am.resume) am.resume();
    not.forEach((f, i) => { const o = am.createOscillator(), g = am.createGain(); o.frequency.value = f; o.type = 'triangle';
      g.gain.setValueAtTime(0.4, am.currentTime + i * dai); g.gain.exponentialRampToValueAtTime(0.001, am.currentTime + i * dai + dai * 1.6);
      o.connect(g).connect(am.destination); o.start(am.currentTime + i * dai); o.stop(am.currentTime + i * dai + dai * 1.7); });
  } catch (e) {}
}
const vui = () => keu([659, 880]);
const buon = () => keu([300, 220], 0.15);

// kết thúc một câu: dungNgay = đúng ngay lần đầu
function xongCau(dungNgay, nhan) {
  const c = Math.floor(chi / 5);
  if (dungNgay) { sao++; diem[c]++; } else { saiNoi.push(nhan); }
  chi++; diRobot();
  const tiep = document.createElement('button'); tiep.className = 'nut-lon'; tiep.textContent = chi >= 20 ? 'Xem kết quả' : 'Câu tiếp';
  tiep.onclick = () => chi >= 20 ? ketQua() : veCau();
  $('cau').appendChild(tiep); tiep.focus();
}
function bao(chu, tot) { const b = $('bao'); b.textContent = chu; b.className = 'bao ' + (tot ? 'tot' : 'chua'); }
function dauThe(loai, de) {
  const c = $('cau'); c.hidden = false;
  c.innerHTML = `<span class="loai">${loai}</span><div class="de">${de}</div>`;
  return c;
}

function veCau() {
  veChang(); diRobot(); saiLan = 0;
  const c = Math.floor(chi / 5), k = chi % 5;
  if (c === 0) cauDS(ds.c1[k]);
  else if (c === 1) cauLien(ds.c2[k]);
  else if (c === 2) cauThieu(ds.c3[k]);
  else cauXep(ds.c4[k]);
  window.scrollTo({ top: $('chang').offsetTop - 8, behavior: 'smooth' });
}

function cauDS([cau, dung, giai]) {
  const t = dauThe('Chặng 1 - Đúng hay sai?', cau);
  t.insertAdjacentHTML('beforeend', `<div class="hai-nut"><button class="nut-ds d">Đ</button><button class="nut-ds s">S</button></div><div class="bao" id="bao"></div>`);
  t.querySelectorAll('.nut-ds').forEach(b => b.onclick = () => {
    const chonDung = b.classList.contains('d');
    t.querySelectorAll('.nut-ds').forEach(x => x.disabled = true);
    if (chonDung === dung) { vui(); bao('Chính xác! ' + giai, true); xongCau(true); }
    else { buon(); b.classList.add('lac'); bao('Chưa đúng. Câu này ' + (dung ? 'ĐÚNG' : 'SAI') + '. ' + giai, false); xongCau(false, 'Đúng/sai: ' + cau); }
  });
}

function cauLien({ n, truoc }) {
  const t = dauThe('Chặng 2 - Gõ số', `Số liền <b>${truoc ? 'trước' : 'sau'}</b> của <b style="color:var(--cam)">${vs(n)}</b> là số nào?`);
  t.insertAdjacentHTML('beforeend', `<div class="nhap" id="nhap"></div><div class="phim" id="phim"></div><div class="bao" id="bao"></div>`);
  const dung = truoc ? n - 1 : n + 1;
  let go = '';
  const hien = () => $('nhap').textContent = go ? vs(go) : '';
  const nop = () => {
    if (!go) return;
    if (+go === dung) { vui(); bao(`Đúng rồi! ${vs(n)} ${truoc ? '- 1' : '+ 1'} = ${vs(dung)}`, true); khoa(); xongCau(saiLan === 0, `Số liền ${truoc ? 'trước' : 'sau'} của ${vs(n)}`); return; }
    saiLan++; buon(); $('nhap').classList.remove('lac'); void $('nhap').offsetWidth; $('nhap').classList.add('lac');
    if (saiLan === 1) { bao(`Chưa đúng. Gợi ý: số liền ${truoc ? 'trước thì bớt 1' : 'sau thì thêm 1'}: ${vs(n)} ${truoc ? '- 1' : '+ 1'} = ?`, false); go = ''; hien(); }
    else { bao(`Đáp án là ${vs(dung)}.`, false); go = String(dung); hien(); khoa(); xongCau(false, `Số liền ${truoc ? 'trước' : 'sau'} của ${vs(n)}`); }
  };
  const khoa = () => { $('phim').querySelectorAll('button').forEach(b => b.disabled = true); document.onkeydown = null; };
  ['1','2','3','4','5','6','7','8','9','Xóa','0','OK'].forEach(p => {
    const b = document.createElement('button'); b.textContent = p;
    if (p === 'Xóa') b.className = 'xoa'; if (p === 'OK') b.className = 'ok';
    b.onclick = () => { if (p === 'Xóa') go = go.slice(0, -1); else if (p === 'OK') return nop(); else if (go.length < 7) go = (go === '0' ? '' : go) + p; hien(); };

  });
  document.onkeydown = e => { if (/^[0-9]$/.test(e.key) && go.length < 7) { go = (go === '0' ? '' : go) + e.key; hien(); } else if (e.key === 'Backspace') { go = go.slice(0, -1); hien(); } else if (e.key === 'Enter') nop(); };
}
