<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kéo co vần - Thi đua 2 đội</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Trò thi đua 2 đội chiếu tivi. Mỗi thẻ là một câu (đọc, chọn vần, tìm tiếng). Đội nào làm đúng thì cô bấm,
     sợi dây kéo về phía đội đó. Dây chạm vạch của đội nào trước thì đội đó thắng, hết thẻ thì xem dây nghiêng về bên nào.
     Kích thước theo --u để vừa tivi lẫn máy tính. */
  [hidden] { display: none !important; }
  :root {
    --u: min(1vh, 1.6vw);
    --chu: #12304a;
    --xanh: #1c7ed6;
    --xanh-dam: #1250a0;
    --do: #e03131;
    --do-dam: #a61e1e;
    --la: #2f9e44;
    --la-dam: #1e6b2e;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    --buoc: 4.5cqw;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu);
    background: linear-gradient(90deg, #d0ebff 0 50%, #ffe3e3 50%);
    display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--u) * 1.2) 16px; gap: calc(var(--u) * 1.1);
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden;
  }
  button { font-family: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible { outline: 5px solid var(--chu); outline-offset: 4px; }
  h1 { font-size: max(24px, calc(var(--u) * 6)); line-height: 1; color: #f08c00; text-shadow: 0 4px 0 #fff; }
  .dem-the { font-size: max(14px, calc(var(--u) * 2.8)); }

  /* ----- sân kéo co ----- */
  .san { container-type: inline-size; position: relative; width: min(100%, 1500px); height: calc(var(--u) * 24); flex: none;
    border-radius: calc(var(--u) * 3); overflow: hidden; border: 6px solid #fff;
    background: linear-gradient(#a5d8ff 0 52%, #8ce99a 52% 100%); box-shadow: 0 8px 0 #0002; }
  .vach { position: absolute; top: 0; bottom: 0; width: 1.2cqw; z-index: 1; display: flex; align-items: flex-start; justify-content: center; }
  .vach::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, currentColor 0 12px, #fff 12px 24px); opacity: .85; }
  .vach b { position: relative; margin-top: 4px; font-size: max(12px, 1.6cqw); color: #fff; background: var(--c); border-radius: 20px; padding: 0 .8cqw; white-space: nowrap; }
  .vach.xanh { --c: var(--xanh); color: var(--xanh); left: calc(50% - 5 * var(--buoc) - .6cqw); }
  .vach.do { --c: var(--do); color: var(--do); left: calc(50% + 5 * var(--buoc) - .6cqw); }

  .giua { position: absolute; left: calc(50% - 2px); top: 0; bottom: 0; border-left: 4px dashed #0003; }
  .day { position: absolute; inset: 0; z-index: 2; transform: translateX(calc(var(--pos, 0) * var(--buoc))); transition: transform .7s cubic-bezier(.3,1.4,.5,1); }
  .soi { position: absolute; left: -40%; width: 180%; bottom: 36%; height: 1.1cqw; border-radius: 10px;
    background: repeating-linear-gradient(90deg, #a9743c 0 14px, #8a5a2b 14px 28px); box-shadow: 0 3px 0 #0003; }
  .co { position: absolute; left: calc(50% - 1.6cqw); bottom: calc(36% - .2cqw); width: 3.2cqw; display: flex; flex-direction: column; align-items: center; z-index: 3; }
  .co i { display: block; width: 100%; height: 5cqw; background: #f03e3e; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); border-bottom: 0; margin-bottom: -.5cqw; }
  .co::after { content: ""; display: block; width: 3.4cqw; height: 1.4cqw; background: #ffd43b; border-radius: 4px; border: 2px solid #f08c00; }
  .nguoi { position: absolute; bottom: 7%; width: 6.4cqw; display: flex; flex-direction: column; align-items: center; transform-origin: 50% 100%; }
  .nguoi span { font-family: var(--emoji); font-size: 6cqw; line-height: 1; }
  .nguoi u { display: block; width: 5.2cqw; height: 1.1cqw; border-radius: 10px; text-decoration: none; margin-top: -.4cqw; }
  .nguoi.x { right: calc(50% + 6cqw + var(--i) * 6.6cqw); transform: rotate(-9deg); }
  .nguoi.d { left: calc(50% + 6cqw + var(--i) * 6.6cqw); transform: rotate(9deg); }
  .nguoi.x u { background: var(--xanh); }
  .nguoi.d u { background: var(--do); }
  .day.rung .nguoi { animation: gang .7s; }
  .day.rung .nguoi.x { --g: -9deg; } .day.rung .nguoi.d { --g: 9deg; }
  @keyframes gang { 0%,100% { transform: rotate(var(--g)); } 30% { transform: rotate(calc(var(--g) * 2.3)); } 60% { transform: rotate(calc(var(--g) * .4)); } }

  /* ----- bàn chơi ----- */
  .ban { flex: 1; min-height: 0; width: min(100%, 1500px); display: grid; grid-template-columns: 1fr 2.6fr 1fr; gap: calc(var(--u) * 2); align-items: center; }
  .doi { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.2); }
  .ten-doi { font-size: max(20px, calc(var(--u) * 4.6)); color: #fff; border-radius: 40px; padding: 0 calc(var(--u) * 2.4); outline: none; min-width: 3ch; text-align: center; cursor: text; }
  .ten-doi:focus { box-shadow: 0 0 0 5px #fff, 0 0 0 9px var(--chu); }
  .doi.xanh .ten-doi { background: var(--xanh); }
  .doi.do .ten-doi { background: var(--do); }
  .the-thang { font-size: max(50px, calc(var(--u) * 13)); line-height: 1; font-variant-numeric: tabular-nums; }
  .doi.xanh .the-thang { color: var(--xanh); }
  .doi.do .the-thang { color: var(--do); }
  .the-thang.nhay { animation: nhay .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes nhay { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
  .nhan-nho { font-size: max(12px, calc(var(--u) * 2.2)); color: #495057; margin-top: calc(var(--u) * -1); }
  .cong { font-size: max(18px, calc(var(--u) * 3.6)); padding: calc(var(--u) * .5) calc(var(--u) * 2.4); color: #fff; border: none; border-radius: calc(var(--u) * 3); }
  .doi.xanh .cong { background: var(--xanh); box-shadow: 0 7px 0 var(--xanh-dam); }
  .doi.do .cong { background: var(--do); box-shadow: 0 7px 0 var(--do-dam); }
  .cong:active { transform: translateY(5px); box-shadow: none !important; }
  .cong:disabled { opacity: .4; cursor: default; }

  .the {
    background: #fff; border: 8px solid #f08c00; border-radius: calc(var(--u) * 4);
    height: 100%; max-height: calc(var(--u) * 44); display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(var(--u) * 1.2) calc(var(--u) * 2); text-align: center; box-shadow: 0 10px 0 #e8590c33; gap: calc(var(--u) * 1);
  }
  .the.lat { animation: lat .45s; }
  @keyframes lat { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
  .loai { font-size: max(13px, calc(var(--u) * 2.6)); color: #fff; background: #f08c00; border-radius: 30px; padding: 0 calc(var(--u) * 2); }
  .chu { font-size: max(44px, calc(var(--u) * 13)); line-height: 1.15; text-wrap: balance; }
  .chu.dai { font-size: max(32px, calc(var(--u) * 8.5)); }
  .goi-y { font-size: max(15px, calc(var(--u) * 3)); color: #868e96; }
  .hinh { font-family: var(--emoji); font-size: max(60px, calc(var(--u) * 12)); line-height: 1.05; }
  .tu-trong { font-size: max(40px, calc(var(--u) * 9)); line-height: 1; letter-spacing: .04em; }
  .tu-trong em { font-style: normal; display: inline-block; min-width: 2.2ch; border-bottom: 6px solid var(--do); color: var(--do); }
  .lua { display: flex; gap: calc(var(--u) * 2); justify-content: center; flex-wrap: nowrap; }
  .o { display: flex; align-items: center; gap: calc(var(--u) * 1.2); font-size: max(26px, calc(var(--u) * 6.4)); background: #fff9db; border: 5px solid #ffd43b; border-radius: calc(var(--u) * 2.4); padding: 0 calc(var(--u) * 2.2); transition: .3s; }
  .o b { background: #f08c00; color: #fff; border-radius: 50%; width: 1.3em; height: 1.3em; display: flex; align-items: center; justify-content: center; font-size: .65em; }
  .o.dung { background: #d3f9d8; border-color: var(--la); transform: scale(1.12); }
  .o.dung b { background: var(--la); }
  .o.mo { opacity: .35; }

  .duoi { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .nut-lon { font-size: max(20px, calc(var(--u) * 4.2)); padding: calc(var(--u) * .3) calc(var(--u) * 3.4); color: #fff; background: var(--la); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 6px 0 var(--la-dam); }
  .nut-lon.phu { background: #f08c00; box-shadow: 0 6px 0 #b45309; }
  .nut-nho { font-size: max(14px, calc(var(--u) * 2.4)); padding: 4px 18px; border-radius: 30px; border: 3px solid var(--chu); background: #fff; color: var(--chu); }

  .man { position: fixed; inset: 0; background: rgba(18, 48, 74, .82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .hop-thoai {
    width: min(100%, 1100px); max-height: 100%; overflow-y: auto; background: #fff;
    border-radius: calc(var(--u) * 4); border: 8px solid #f2b705; padding: calc(var(--u) * 3) calc(var(--u) * 4);
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.5); text-align: center;
    animation: bung .45s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes bung { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .cup { font-family: var(--emoji); font-size: max(90px, calc(var(--u) * 22)); line-height: 1; }
  .thang { font-size: max(40px, calc(var(--u) * 10)); line-height: 1.1; }
  .nhan { font-size: max(18px, calc(var(--u) * 3.4)); color: #fff; background: #f2b705; border-radius: 30px; padding: 2px 22px; }
  .bai-moi { font-size: max(28px, calc(var(--u) * 6.5)); color: var(--xanh-dam); }
  .am-moi { display: flex; gap: calc(var(--u) * 6); justify-content: center; flex-wrap: wrap; }
  .am-moi div { display: flex; flex-direction: column; align-items: center; }
  .am-moi .chu-to { font-size: max(80px, calc(var(--u) * 20)); line-height: 1; color: var(--do); }
  .am-moi .vd { font-size: max(30px, calc(var(--u) * 7)); display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .am-moi .vd span { font-family: var(--emoji); font-size: 1.9em; }

  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
  #phao i { position: absolute; top: -20px; width: 14px; height: 20px; border-radius: 3px; animation: roi linear forwards; }
  @keyframes roi { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .the.lat, .the-thang.nhay, .hop-thoai, .day.rung .nguoi { animation: none; } #phao { display: none; } .day { transition: none; } }
</style>
</head>
<body>
<h1>Kéo co vần</h1>
<div class="dem-the">Thẻ <span id="so-the">1</span>/<span id="tong-the">8</span> · Kéo dây chạm vạch của đội mình là thắng</div>

<div class="san">
  <div class="vach xanh"><b id="vx">Đích Xanh</b></div>
  <div class="vach do"><b id="vd">Đích Đỏ</b></div>
  <div class="giua"></div>
  <div class="day" id="day">
    <div class="soi"></div>
    <div class="nguoi x" style="--i:0"><span>👦</span><u></u></div>
    <div class="nguoi x" style="--i:1"><span>👧</span><u></u></div>
    <div class="nguoi x" style="--i:2"><span>🧒</span><u></u></div>
    <div class="nguoi d" style="--i:0"><span>👧</span><u></u></div>
    <div class="nguoi d" style="--i:1"><span>👦</span><u></u></div>
    <div class="nguoi d" style="--i:2"><span>🧒</span><u></u></div>
    <div class="co"><i></i></div>
  </div>
</div>

<div class="ban">
  <div class="doi xanh">
    <div class="ten-doi" id="ten-0" contenteditable="true" spellcheck="false" role="textbox" aria-label="Tên đội Xanh">Đội Xanh</div>
    <div class="the-thang" id="tt-0">0</div>
    <div class="nhan-nho">thẻ thắng</div>
    <button class="cong" id="cong-0">✔ Đúng</button>
  </div>
  <div class="the" id="the"></div>
  <div class="doi do">
    <div class="ten-doi" id="ten-1" contenteditable="true" spellcheck="false" role="textbox" aria-label="Tên đội Đỏ">Đội Đỏ</div>
    <div class="the-thang" id="tt-1">0</div>
    <div class="nhan-nho">thẻ thắng</div>
    <button class="cong" id="cong-1">✔ Đúng</button>
  </div>
</div>

<div class="duoi">
  <button class="nut-lon phu" id="hien">Xem đáp án</button>
  <button class="nut-lon" id="tiep">Thẻ tiếp</button>
  <button class="nut-nho" id="choi-lai">Chơi lại</button>
</div>

<div class="man" id="man" hidden><div class="hop-thoai" id="hop-thoai"></div></div>
<div id="phao"></div>

<script>
// ====== NỘI DUNG (cô sửa ở đây cho bài khác) ======
// Ôn các vần đã học đến Bài 40: am ăm âm, om ôm ơm, em êm im um, ai ay ây, oi ôi ơi.
// Ba loại thẻ:
//   doc  : { k:'doc', t:'chữ cần đọc' }
//   chon : { k:'chon', hinh:'emoji', dau:'âm đầu', van:['vần A','vần B'], dung:0 hoặc 1 }   (từ = dau + vần đúng)
//   tim  : { k:'tim', van:'vần cần tìm', ds:['tiếng 1','tiếng 2','tiếng 3'], dung:chỉ số tiếng đúng }
// Đáp án sai của thẻ chon/tim đã chọn để không ghép thành từ thật mà các con đã học.
const THE = [
  { k: 'doc', t: 'con voi' },
  { k: 'doc', t: 'chim sẻ' },
  { k: 'doc', t: 'gà mái' },
  { k: 'doc', t: 'đôi dép' },
  { k: 'doc', t: 'tủm tỉm' },
  { k: 'doc', t: 'đom đóm' },
  { k: 'doc', t: 'Mẹ mua cam cho bé.' },
  { k: 'doc', t: 'Hai bạn thi nhảy dây.' },
  { k: 'chon', hinh: '🍊', dau: 'c', van: ['am', 'em'], dung: 0 },
  { k: 'chon', hinh: '✋', dau: 't', van: ['oi', 'ay'], dung: 1 },
  { k: 'chon', hinh: '🌳', dau: 'c', van: ['ây', 'um'], dung: 0 },
  { k: 'chon', hinh: '🐦', dau: 'ch', van: ['em', 'im'], dung: 1 },
  { k: 'chon', hinh: '🐘', dau: 'v', van: ['oi', 'um'], dung: 0 },
  { k: 'chon', hinh: '☁️', dau: 'm', van: ['om', 'ây'], dung: 1 },
  { k: 'tim', van: 'ay', ds: ['tay', 'bơm', 'kem'], dung: 0 },
  { k: 'tim', van: 'ôm', ds: ['dây', 'tôm', 'chim'], dung: 1 },
  { k: 'tim', van: 'ơi', ds: ['voi', 'xôi', 'chơi'], dung: 2 },
];
const BAI_MOI = null;   // hoặc { ten: 'Bài 41', am: [['au', '🌾', 'lúa'], ...] } nếu cô muốn hé lộ bài mới sau khi chơi
const WIN = 5;          // số bước kéo để chạm đích
// ====================================================

const $ = id => document.getElementById(id);
const AB = ['A', 'B', 'C'];
let the = [], thuTu = 0, pos = 0, thang = [0, 0], daXong = false, daHien = false, amThanh = null;

function keu(dsTanSo, kieu = 'triangle') {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    amThanh.resume && amThanh.resume();
    dsTanSo.forEach((f, i) => {
      const o = amThanh.createOscillator(), g = amThanh.createGain();
      const t = amThanh.currentTime + i * 0.12;
      o.frequency.value = f; o.type = kieu;
      g.gain.setValueAtTime(0.4, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.connect(g); g.connect(amThanh.destination);
      o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}
// giọng đọc chỉ chạy khi cô bấm nút, không tự đọc
function noi(chu) {
  try {
    const s = window.speechSynthesis; if (!s) return;
    const v = s.getVoices().find(x => /^vi/i.test(x.lang)); if (!v) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(chu); u.voice = v; u.lang = 'vi-VN'; u.rate = .85;
    s.speak(u);
  } catch (e) {}
}
function phaoGiay(soLuong, mau) {
  const p = $('phao'); p.textContent = '';
  for (let i = 0; i < soLuong; i++) {
    const g = document.createElement('i');
    g.style.left = Math.random() * 100 + 'vw';
    g.style.background = mau[i % mau.length];
    g.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    g.style.animationDelay = Math.random() * 1 + 's';
    p.appendChild(g);
  }
  setTimeout(() => { p.textContent = ''; }, 6500);
}
function xaoTron(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function tenDoi(d) { return ($('ten-' + d).textContent.trim() || (d ? 'Đội Đỏ' : 'Đội Xanh')); }
function datTenNut() {
  $('cong-0').textContent = '✔ Đúng';
  $('cong-1').textContent = '✔ Đúng';
  $('vx').textContent = 'Đích ' + tenDoi(0);
  $('vd').textContent = 'Đích ' + tenDoi(1);
}

// chữ cần đọc lại cho thẻ hiện tại
function chuDoc(c) {
  if (c.k === 'doc') return c.t;
  if (c.k === 'chon') return c.dau + c.van[c.dung];
  return c.ds[c.dung];
}

function veThe() {
  const c = the[thuTu], el = $('the');
  if (c.k === 'doc') {
    el.innerHTML = `<div class="loai">Đọc thật nhanh</div><div class="chu${c.t.length > 10 ? ' dai' : ''}">${c.t}</div><div class="goi-y">Đội nào đọc đúng trước?</div>`;
  } else if (c.k === 'chon') {
    el.innerHTML = `<div class="loai">Chọn vần đúng</div><div class="hinh">${c.hinh}</div>
      <div class="tu-trong">${c.dau}<em id="cho-trong">&nbsp;</em></div>
      <div class="lua">${c.van.map((v, i) => `<div class="o" data-i="${i}"><b>${AB[i]}</b>${v}</div>`).join('')}</div>`;
  } else {
    el.innerHTML = `<div class="loai">Tìm tiếng có vần</div><div class="chu" style="font-size:max(40px,calc(var(--u)*10))">${c.van}</div>
      <div class="lua">${c.ds.map((v, i) => `<div class="o" data-i="${i}"><b>${AB[i]}</b>${v}</div>`).join('')}</div>`;
  }
  el.classList.remove('lat'); void el.offsetWidth; el.classList.add('lat');
  $('so-the').textContent = thuTu + 1;
  daXong = daHien = false;
  $('cong-0').disabled = $('cong-1').disabled = false;
  $('hien').textContent = c.k === 'doc' ? '🔊 Đọc mẫu' : 'Xem đáp án';
  $('tiep').textContent = thuTu === the.length - 1 ? 'Xem kết quả' : 'Thẻ tiếp';
  keu([440], 'sine');
}

function hienDapAn() {
  const c = the[thuTu];
  if (c.k === 'doc') return;
  daHien = true;
  document.querySelectorAll('#the .o').forEach(o => o.classList.add(+o.dataset.i === c.dung ? 'dung' : 'mo'));
  const ct = $('cho-trong'); if (ct) ct.textContent = c.van[c.dung];
  $('hien').textContent = '🔊 Nghe đáp án';
}
$('hien').onclick = () => {
  const c = the[thuTu];
  if (c.k === 'doc' || daHien) noi(chuDoc(c)); else hienDapAn();
};

function veKeo() {
  const d = $('day');
  d.style.setProperty('--pos', pos);
  d.classList.remove('rung'); void d.offsetWidth; d.classList.add('rung');
  [0, 1].forEach(i => { $('tt-' + i).textContent = thang[i]; });
}

// mỗi thẻ chỉ kéo cho một đội
function congDiem(doi) {
  if (daXong) return;
  daXong = true;
  thang[doi]++;
  pos += doi ? 1 : -1;
  veKeo();
  const e = $('tt-' + doi);
  e.classList.remove('nhay'); void e.offsetWidth; e.classList.add('nhay');
  hienDapAn();
  $('cong-0').disabled = $('cong-1').disabled = true;
  phaoGiay(20, doi ? ['#e03131', '#ff8787', '#ffd43b'] : ['#1c7ed6', '#74c0fc', '#ffd43b']);
  keu([523, 659, 784]);
  if (Math.abs(pos) >= WIN) setTimeout(ketQua, 1100);
}
$('cong-0').onclick = () => congDiem(0);
$('cong-1').onclick = () => congDiem(1);

function tiep() {
  if (Math.abs(pos) >= WIN) return;
  thuTu++;
  if (thuTu < the.length) veThe(); else ketQua();
}
$('tiep').onclick = tiep;

function ketQua() {
  const hd = $('hop-thoai');
  const hoa = pos === 0;
  const loi = hoa ? 'Hai đội hòa nhau! Cả lớp đều giỏi!' : `${tenDoi(pos < 0 ? 0 : 1)} thắng rồi!`;
  hd.innerHTML = `<div class="cup">${hoa ? '🤝' : '🏆'}</div><div class="thang">${loi}</div>
    <div class="bai-moi">${tenDoi(0)} ${thang[0]} thẻ - ${thang[1]} thẻ ${tenDoi(1)}</div>
    <button class="nut-lon" id="xem-bai">${BAI_MOI ? 'Xem bài mới' : 'Chơi lại'}</button>`;
  $('xem-bai').onclick = BAI_MOI ? moBaiMoi : batDau;
  $('man').hidden = false;
  $('xem-bai').focus();
  phaoGiay(80, ['#1c7ed6', '#e03131', '#ffd43b', '#51cf66', '#cc5de8']);
  keu([523, 659, 784, 1047, 1319]);
}

function moBaiMoi() {
  const hd = $('hop-thoai');
  hd.innerHTML = `<div class="nhan">Bài mới</div>
    <div class="bai-moi">Hôm nay chúng mình học ${BAI_MOI.ten}</div>
    <div class="am-moi">${BAI_MOI.am.map(([chu, hinh, vd]) => `<div><div class="chu-to">${chu}</div><div class="vd"><span>${hinh}</span>${vd}</div></div>`).join('')}</div>
    <button class="nut-lon" id="dong">Vào bài mới!</button>`;
  $('dong').onclick = () => { $('man').hidden = true; };
  $('dong').focus();
  phaoGiay(60, ['#ffd43b', '#f06595', '#51cf66']);
  keu([392, 523, 659, 784, 1047, 1319, 1568]);
}

function batDau() {
  the = xaoTron(THE); thuTu = 0; pos = 0; thang = [0, 0];
  $('tong-the').textContent = the.length;
  $('day').style.setProperty('--pos', 0);
  [0, 1].forEach(i => { $('tt-' + i).textContent = 0; });
  $('man').hidden = true;
  datTenNut();
  veThe();
}
$('choi-lai').onclick = batDau;
[0, 1].forEach(d => {
  $('ten-' + d).addEventListener('input', datTenNut);
  $('ten-' + d).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('man').hidden = true; });
batDau();
</script>
</body>
</html>
