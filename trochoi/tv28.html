<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trò chơi luyện tập</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* KHUÔN TRÒ CHƠI LUYỆN TẬP TIẾNG VIỆT 1 (dùng chung cho nhiều bài).
     Nội dung từng bài nằm ở khối DU_LIEU cuối file (do tao-tro-luyen-tap.ps1 chèn vào).
     Chặng 1: lật thẻ đọc tiếng hoặc bảng ghép. Chặng 2: vật bay tha chữ, chạm đúng chữ cô yêu cầu.
     Chặng 3: đọc đoạn rồi trả lời, hoặc điền chữ.
     Mở file trên máy ở lớp = cả lớp chơi trên tivi; mở bằng link web = con tự chơi ở nhà, gửi kết quả. */
  [hidden] { display: none !important; }
  :root {
    --u: min(1vh, 1.6vw);
    --chu: #12304a; --xanh: #0b5cab; --do: #e03131; --la: #2f9e44; --la-dam: #1e6b2e;
    --cam: #f08c00; --cam-dam: #b86200; --tim: #ae3ec9;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  @media (max-aspect-ratio: 1/1) { :root { --u: min(0.62vh, 0.95vw); } }
  /* màn hình rộng: ô và thẻ rộng ra cho đỡ trống hai bên */
  :root { --kx: 1; --ky: 1; }
  @media (min-aspect-ratio: 16/9) { :root { --kx: 1.5; --ky: .68; } }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu);
    background: linear-gradient(#ffffff 0%, #dff1fb 30%, #8fd0f2 75%, #5bb8ea 100%);
    display: flex; flex-direction: column; overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  body.cd-ca { background: linear-gradient(#e7f5ff 0%, #a5d8ff 25%, #4dabf7 70%, #1c7ed6 100%); }
  body.cd-xe { background: linear-gradient(#ffffff 0%, #d0ebff 40%, #c3fae8 70%, #8ce99a 100%); }
  body.cd-buom { background: linear-gradient(#fff9db 0%, #e6fcf5 40%, #b2f2bb 85%, #8ce99a 100%); }
  button { font-family: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible { outline: 5px solid var(--xanh); outline-offset: 4px; }

  header { display: flex; align-items: center; gap: calc(var(--u) * 2); padding: calc(var(--u) * 1.2) 16px; flex-wrap: wrap; justify-content: center; }
  h1 { font-size: max(24px, calc(var(--u) * 5.5)); line-height: 1; color: var(--do); text-shadow: 0 3px 0 #fff; white-space: nowrap; }
  .chang { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .chang button { font-size: max(15px, calc(var(--u) * 2.6)); padding: 4px 16px; border-radius: 30px; border: 3px solid var(--xanh); background: #fff; color: var(--xanh); }
  .chang button.dang { background: var(--xanh); color: #fff; }
  .chang button.xong::after { content: " ✓"; color: var(--la); }
  .chang button.dang.xong::after { color: #b2f2bb; }
  .chang button:disabled { cursor: default; }

  main { flex: 1; min-height: 0; position: relative; }
  .man-chang { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 0 16px calc(var(--u) * 2); gap: calc(var(--u) * 1.6); overflow-y: auto; }
  #c2 { overflow: hidden; }
  .huong-dan { font-size: max(18px, calc(var(--u) * 3.6)); color: var(--xanh); text-align: center; background: rgba(255,255,255,.85); border-radius: 20px; padding: 2px 20px; }
  .hang-nut { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: auto; }
  .nut-lon { font-size: max(22px, calc(var(--u) * 4.6)); padding: calc(var(--u) * .3) calc(var(--u) * 5); color: #fff; background: var(--la); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 7px 0 var(--la-dam); }
  .nut-lon:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--la-dam); }
  .nut-lon.cam { background: var(--cam); box-shadow: 0 7px 0 var(--cam-dam); }
  .nut-nho { font-size: max(15px, calc(var(--u) * 2.6)); padding: 4px 18px; border-radius: 30px; border: 3px solid var(--xanh); background: #fff; color: var(--xanh); }

  /* ===== Chặng 1 ===== */
  .khu1 { display: flex; gap: calc(var(--u) * 4); flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  table { border-collapse: separate; border-spacing: calc(var(--u) * .7); }
  th, td { width: calc(var(--u) * 15 * var(--kx)); height: calc(var(--u) * 9.5 * var(--ky)); border-radius: calc(var(--u) * 1.4); text-align: center; font-size: max(26px, calc(var(--u) * 6 * var(--ky))); line-height: 1; }
  th { background: #ffe066; color: var(--chu); }
  th.trong { background: none; }
  th.sang { background: #ff922b; color: #fff; }
  td { padding: 0; }
  td button { width: 100%; height: 100%; border: none; border-radius: inherit; font-size: inherit; }
  .o-lat { background: #fff3bf; color: #c9a227; box-shadow: inset 0 -5px 0 #f2d16b; }
  .o-lat.mo { background: #fff; box-shadow: inset 0 0 0 4px #ffe066; color: var(--chu); animation: lat .35s; }
  .o-lat .dau, .o-lat .do { color: var(--do); }
  .o-lat .van { color: var(--xanh); }
  @keyframes lat { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }
  .nhom { display: flex; align-items: center; gap: calc(var(--u) * 1.4); flex-wrap: wrap; justify-content: center; background: rgba(255,255,255,.55); border-radius: calc(var(--u) * 2.5); padding: calc(var(--u) * 1) calc(var(--u) * 2); }
  .nhom .chip { font-size: max(26px, calc(var(--u) * 6.5)); color: #fff; background: var(--do); border-radius: calc(var(--u) * 2); padding: 0 calc(var(--u) * 2.4); line-height: 1.3; }
  .nhom .o-lat { width: calc(var(--u) * 15 * var(--kx)); height: calc(var(--u) * 10); border-radius: calc(var(--u) * 1.6); border: none; font-size: max(26px, calc(var(--u) * 6)); }
  .khu1.nho-the .nhom .o-lat { width: calc(var(--u) * 11.5 * var(--kx)); height: calc(var(--u) * 8.5); font-size: max(22px, calc(var(--u) * 5)); }
  .khu1.nho-the .nhom .chip { font-size: max(22px, calc(var(--u) * 5)); }
  .khu1.nho-the { gap: calc(var(--u) * 1.6); }

  /* ===== Chặng 2 ===== */
  #troi { position: absolute; inset: 0; overflow: hidden; }
  .yeu-cau { position: relative; z-index: 3; display: flex; align-items: center; gap: calc(var(--u) * 2); background: #fff; border: 6px solid var(--cam); border-radius: calc(var(--u) * 3); padding: calc(var(--u) * .5) calc(var(--u) * 3); box-shadow: 0 6px 0 rgba(0,0,0,.12); flex-wrap: wrap; justify-content: center; text-align: center; }
  .yeu-cau .nhan { font-size: max(18px, calc(var(--u) * 3.6)); color: var(--xanh); }
  .yeu-cau .tu-tim { font-size: max(34px, calc(var(--u) * 8)); color: var(--do); line-height: 1.05; }
  .yeu-cau .con { font-size: max(16px, calc(var(--u) * 3)); color: #fff; background: var(--cam); border-radius: 30px; padding: 0 14px; }
  .vat { position: absolute; left: 0; top: 0; cursor: pointer; z-index: 2; will-change: transform; }
  .vat svg { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 6px 4px rgba(0,0,0,.18)); }
  .vat text { font-family: var(--font); font-weight: 800; }
  .canh-y { transform-box: fill-box; transform-origin: 50% 100%; animation: voY .7s ease-in-out infinite alternate; }
  @keyframes voY { from { transform: scaleY(1); } to { transform: scaleY(-.55); } }
  .canh-x { transform-box: fill-box; transform-origin: 50% 50%; animation: voX .35s ease-in-out infinite alternate; }
  @keyframes voX { from { transform: scaleX(1); } to { transform: scaleX(.35); } }
  .canh-tr { transform-box: fill-box; transform-origin: 100% 100%; animation: voR .45s ease-in-out infinite alternate; }
  .canh-ph { transform-box: fill-box; transform-origin: 0% 100%; animation: voL .45s ease-in-out infinite alternate; }
  @keyframes voR { from { transform: rotate(0); } to { transform: rotate(-28deg); } }
  @keyframes voL { from { transform: rotate(0); } to { transform: rotate(28deg); } }
  .duoi-ca { transform-box: fill-box; transform-origin: 100% 50%; animation: quay .5s ease-in-out infinite alternate; }
  @keyframes quay { from { transform: skewY(-12deg); } to { transform: skewY(12deg); } }
  .banh { transform-box: fill-box; transform-origin: 50% 50%; animation: lan 1s linear infinite; }
  @keyframes lan { to { transform: rotate(360deg); } }
  .dung-bay .vat *, .dung-bay .vat { animation-play-state: paused !important; }
  .vat.lac svg { animation: lac .45s; }
  @keyframes lac { 20% { transform: translateX(-14px) rotate(-6deg); } 60% { transform: translateX(14px) rotate(6deg); } }
  .dem-sao { position: absolute; right: 16px; bottom: calc(var(--u) * 1.5); z-index: 3; background: #fff; border: 5px solid var(--cam); border-radius: 30px; padding: 2px 18px; font-size: max(20px, calc(var(--u) * 4.4)); display: flex; align-items: center; gap: 8px; }
  .dem-sao .e { font-family: var(--emoji); }
  .nut-dung { position: absolute; left: 16px; bottom: calc(var(--u) * 1.5); z-index: 3; }

  /* ===== Chặng 3 ===== */
  .doan { background: #fff9c4; border: 6px solid #ffe066; border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 2) calc(var(--u) * 4); font-size: max(28px, calc(var(--u) * 6.6)); line-height: 1.35; max-width: 1250px; text-wrap: pretty; }
  .hoi { font-size: max(26px, calc(var(--u) * 6)); text-align: center; color: var(--xanh); background: rgba(255,255,255,.85); border-radius: 20px; padding: 0 20px; text-wrap: balance; }
  .tu-dien { font-size: max(52px, calc(var(--u) * 14)); line-height: 1.15; white-space: pre; background: rgba(255,255,255,.85); border-radius: 24px; padding: 0 24px; }
  .tu-dien .o { display: inline-block; min-width: 1.1em; border: 6px dashed var(--do); border-radius: 18px; color: var(--do); padding: 0 .12em; text-align: center; }
  .tu-dien .o.xong { border-style: solid; border-color: var(--la); color: var(--la); background: #d3f9d8; }
  .qua { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 3); }
  .qua button { min-width: max(110px, calc(var(--u) * 22 * var(--kx))); padding: calc(var(--u) * 1.2) calc(var(--u) * 3); font-size: max(34px, calc(var(--u) * 8.5)); line-height: 1.05; color: #fff; background: var(--cam); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--cam-dam); }
  .qua button:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--cam-dam); }
  .qua button.dung { background: var(--la); box-shadow: 0 8px 0 var(--la-dam); }
  .qua button.sai { background: #b9c2cc; box-shadow: 0 8px 0 #8a949e; animation: lac .4s; }
  .loi { min-height: 1.3em; font-size: max(22px, calc(var(--u) * 5)); text-align: center; }
  .loi.sai { color: #e8590c; } .loi.dung { color: var(--la); }
  #buoc-hoi { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2); }

  /* thẻ to giữa màn hình */
  .phu { position: fixed; inset: 0; background: rgba(18,48,74,.78); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 8; }
  .the { width: min(100%, 1000px); min-width: min(94vw, calc(var(--u) * 80)); max-height: 100%; overflow-y: auto; background: #fff; border-radius: calc(var(--u) * 4); border: 8px solid var(--mau, var(--cam)); padding: calc(var(--u) * 3) calc(var(--u) * 4); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.5); text-align: center; animation: bung .45s cubic-bezier(.3,1.5,.5,1); }
  @keyframes bung { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .the .nhan { font-size: max(20px, calc(var(--u) * 4.4)); color: var(--xanh); }
  .the .tu-to { font-size: max(64px, calc(var(--u) * 18)); line-height: 1.05; color: var(--do); }
  .the .ket { font-size: max(36px, calc(var(--u) * 9)); color: var(--do); line-height: 1.1; }
  .the .sao { font-family: var(--emoji); font-size: max(50px, calc(var(--u) * 13)); }
  .thuong-hieu { font-size: max(15px, calc(var(--u) * 2.6)); color: #fff; background: var(--tim); border-radius: 30px; padding: 2px 16px; }
  #ten-hs { font-family: inherit; font-weight: 800; font-size: max(22px, calc(var(--u) * 5)); text-align: center; width: min(100%, 520px); padding: 6px 14px; border: 4px solid #74c0fc; border-radius: 20px; color: var(--chu); }
  .phieu { text-align: left; font-size: max(17px, calc(var(--u) * 3.4)); line-height: 1.45; background: #f8f9fa; border-radius: 16px; padding: 10px 20px; width: min(100%, 700px); }
  .phieu b { color: var(--xanh); }
  .nho { font-size: max(15px, calc(var(--u) * 3)); color: #6b7280; }

  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
  #phao i { position: absolute; top: -20px; width: 14px; height: 20px; border-radius: 3px; animation: roi linear forwards; }
  @keyframes roi { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .the { animation: none; } #phao { display: none; } .vat * { animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1 id="ten-tro"></h1>
  <div class="chang" id="chang">
    <button data-c="1"></button>
    <button data-c="2"></button>
    <button data-c="3"></button>
  </div>
</header>

<main>
  <section class="man-chang" id="c1">
    <div class="huong-dan" id="hd1"></div>
    <div class="khu1" id="khu1"></div>
    <div class="hang-nut">
      <button class="nut-nho" id="mo-het">Mở hết</button>
      <button class="nut-lon" id="sang2">Sang chặng 2 ➜</button>
    </div>
  </section>

  <section class="man-chang" id="c2" hidden>
    <div id="troi"></div>
    <div class="yeu-cau"><span class="nhan" id="nhan-tim"></span><span class="tu-tim" id="tu-tim"></span><span class="con" id="con-lai" hidden></span></div>
    <button class="nut-nho nut-dung" id="nut-dung">⏸ Dừng lại</button>
    <div class="dem-sao"><span class="e">⭐</span><span id="dem"></span></div>
  </section>

  <section class="man-chang" id="c3" hidden>
    <div class="doan" id="doan" hidden></div>
    <div id="buoc-doc" hidden><button class="nut-lon" id="doc-xong"></button></div>
    <div id="buoc-hoi" hidden>
      <div class="hoi" id="hoi"></div>
      <div class="tu-dien" id="tu-dien" hidden></div>
      <div class="qua" id="qua"></div>
      <div class="loi" id="loi3"></div>
    </div>
  </section>
</main>

<div class="phu" id="phu" hidden><div class="the" id="the"></div></div>

<div class="phu" id="mo-dau" hidden>
  <div class="the" style="--mau:#1c7ed6">
    <div class="thuong-hieu">Cô Điệp AI</div>
    <div class="ket" id="md-ten"></div>
    <div class="nhan" id="md-bai"></div>
    <label class="nhan" for="ten-hs">Con tên là gì?</label>
    <input id="ten-hs" type="text" maxlength="40" autocomplete="off" placeholder="Họ và tên">
    <button class="nut-lon" id="nut-bat-dau">Bắt đầu!</button>
  </div>
</div>
<div id="phao"></div>

<script>
// ====== NỘI DUNG BÀI (tao-tro-luyen-tap.ps1 thay dòng dưới bằng dữ liệu trong du-lieu-luyen-tap.txt) ======
const D = {
  ten: 'Bướm tha chữ', bai: 'Bài 28: Y y', tenBai: 'Bướm tha chữ: Bài 28 Tiếng Việt',
  to: 'y|ý|ỳ|ỷ|ỹ|ỵ',
  chang1: { ten: 'Đọc tiếng', kieu: 'the', nhom: [
    { dau: 'y', the: ['quy', 'quỳ', 'quý', 'quỹ', 'quỵ', 'ý'] } ] },
  chang2: { ten: 'Bắt bướm', chude: 'buom', nhan: 'Chạm con bướm tha chữ:', dot: [
    { tu: ['y tá', 'dã quỳ', 'đá quý', 'chú ý', 'dì Kha', 'nghe kể'] } ] },
  chang3: { ten: 'Đọc câu', doan: 'Mẹ và Hà ghé nhà dì Kha. Dì kể cho Hà nghe về bà. Hà chú ý nghe dì kể.', hoi: [
    { hoi: 'Mẹ và Hà ghé nhà ai?', dung: ['dì Kha'], chon: ['bà', 'dì Kha', 'cô y tá'] },
    { hoi: 'Dì kể cho Hà nghe về ai?', dung: ['bà'], chon: ['bà', 'mẹ', 'bố'] },
    { hoi: 'Hà làm gì?', dung: ['chú ý nghe dì kể'], chon: ['vẽ xe', 'chú ý nghe dì kể', 'đi chợ'] } ] }
};
// ==========================================================================================================

const O_NHA = location.protocol !== 'file:' || new URLSearchParams(location.search).has('nha');
const L = O_NHA
  ? { hd1: 'Con chạm vào từng ô, đọc to tiếng hiện ra nhé!', docTo: 'Đúng rồi! Con đọc to nào:', docXong: 'Con đọc xong rồi ✓', hoanHo: 'Con giỏi quá!', xongChang2: 'Con làm xong chặng 2 rồi!', luotMoi: 'Giỏi quá! Sang lượt mới nhé!' }
  : { hd1: 'Bạn chạm vào một ô, cả lớp đọc to tiếng hiện ra nhé!', docTo: 'Đúng rồi! Cả lớp đọc to nào:', docXong: 'Cả lớp đọc đúng rồi ✓', hoanHo: 'Hoan hô cả lớp!', xongChang2: 'Cả lớp xong chặng 2 rồi!', luotMoi: 'Giỏi quá! Sang lượt mới nhé!' };
const MAU = ['#e03131', '#1c7ed6', '#2f9e44', '#f08c00', '#ae3ec9', '#0ca678', '#f06595', '#fab005'];
const PASTEL = [['#b2dfa0', '#6aa84f'], ['#d0bfff', '#8c6fd1'], ['#ffc9c9', '#e8737a'], ['#ffd8a8', '#f59f50'], ['#c5d8ff', '#7d9de0'], ['#fff3a3', '#e0b400']];
const $ = id => document.getElementById(id);
let ten = '', chang = 1, xongChang = {}, amThanh = null;

function keu(ds, kieu = 'triangle', cach = 0.12) {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    ds.forEach((f, i) => {
      const o = amThanh.createOscillator(), g = amThanh.createGain(), t = amThanh.currentTime + i * cach;
      o.frequency.value = f; o.type = kieu;
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g); g.connect(amThanh.destination); o.start(t); o.stop(t + 0.22);
    });
  } catch (e) {}
}
const vui = () => keu([523, 659, 784]);
const tiec = () => keu([220, 196]);
function phaoGiay(n) {
  const p = $('phao'); p.textContent = '';
  for (let i = 0; i < n; i++) {
    const g = document.createElement('i');
    g.style.left = Math.random() * 100 + 'vw'; g.style.background = MAU[i % MAU.length];
    g.style.animationDuration = (2.2 + Math.random() * 2.5) + 's'; g.style.animationDelay = Math.random() + 's';
    p.appendChild(g);
  }
  setTimeout(() => { p.textContent = ''; }, 6500);
}
const tron = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function moThe(html, mau) { $('the').style.setProperty('--mau', mau || '#f08c00'); $('the').innerHTML = html; $('phu').hidden = false; }
function dongThe() { $('phu').hidden = true; }
function toDo(w) { return D.to ? w.replace(new RegExp(D.to), m => `<span class="do">${m}</span>`) : w; }

function denChang(n) {
  chang = n;
  [1, 2, 3].forEach(i => { $('c' + i).hidden = i !== n; });
  danhDauChang();
  if (n === 2) batDauBay(); else dungHet();
  if (n === 3) batDauChang3();
}
function danhDauChang() {
  document.querySelectorAll('#chang button').forEach(b => {
    b.classList.toggle('dang', +b.dataset.c === chang);
    b.classList.toggle('xong', !!xongChang[b.dataset.c]);
  });
}
document.querySelectorAll('#chang button').forEach(b => b.onclick = () => denChang(+b.dataset.c));

// ===================== Chặng 1 =====================
function veChang1() {
  const k = $('khu1'), c = D.chang1;
  k.textContent = '';
  if (c.kieu === 'bang') {
    c.bang.forEach((b, bi) => {
      const t = document.createElement('table');
