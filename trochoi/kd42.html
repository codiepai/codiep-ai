<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ếch con nhảy lá sen - Khởi động Bài 42</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Trò khởi động chiếu tivi: ếch con muốn qua ao. Mỗi lá sen là một câu ôn, phải đi lần lượt.
     Đúng thì ếch nhảy sang lá đó, hoa sen nở. Qua hết thì nhảy lên bờ, nụ sen to nở ra hé lộ bài mới. */
  [hidden] { display: none !important; }
  :root {
    --u: min(1vh, 1.6vw);
    --chu: #12304a;
    --xanh: #0b5cab;
    --do: #e03131;
    --la: #2f9e44;
    --la-dam: #1e6b2e;
    --cam: #f08c00;
    --cam-dam: #b86200;
    --font: "Baloo 2", "Segoe UI", Arial, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-weight: 800; color: var(--chu);
    background: linear-gradient(#c5f6fa, #e3fafc 45%, #d3f9d8);
    display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--u) * 1.4) 16px; gap: calc(var(--u) * .8);
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden;
  }
  button { font-family: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible, .la-sen:focus-visible { outline: 5px solid var(--xanh); outline-offset: 4px; }
  h1 { font-size: max(28px, calc(var(--u) * 7.5)); line-height: 1; color: var(--la-dam); text-shadow: 0 4px 0 #fff; }
  .goi-y { font-size: max(18px, calc(var(--u) * 3.6)); color: var(--xanh); text-align: center; min-height: 1.3em; }

  .ao { position: relative; flex: 1; min-height: 0; width: 100%; }
  .ao > svg { width: 100%; height: 100%; display: block; }
  .ao text { font-family: var(--font); font-weight: 800; }
  .la-sen { cursor: pointer; outline: none; }
  .la-sen.khoa { cursor: default; }
  .vong-sang { animation: sang 1.1s ease-in-out infinite; }
  @keyframes sang { 50% { stroke-opacity: .25; stroke-width: 6; } }
  .nu-sen.mo-duoc { cursor: pointer; }
  .nu-sen.mo-duoc .vong-sang { display: inline; }
  .gon { animation: gon 1.6s ease-out forwards; }
  @keyframes gon { from { opacity: .9; } to { opacity: 0; } }
  .song { animation: troi 6s linear infinite; }
  @keyframes troi { to { transform: translateX(-200px); } }
  .may { animation: may 40s linear infinite; }
  @keyframes may { from { transform: translateX(-300px); } to { transform: translateX(1900px); } }
  .ca { animation: ca-nhay 7s ease-in-out infinite; opacity: 0; }
  .ca.hai { animation-delay: 3.5s; }
  @keyframes ca-nhay {
    0%, 70% { opacity: 0; transform: translate(0, 0); }
    72% { opacity: 1; transform: translate(0, 0); }
    80% { opacity: 1; transform: translate(45px, -95px); }
    88% { opacity: 1; transform: translate(90px, 0); }
    90%, 100% { opacity: 0; transform: translate(90px, 0); }
  }

  .hang-duoi { display: flex; gap: 14px; align-items: center; }
  .nut-nho { font-size: max(15px, calc(var(--u) * 2.6)); padding: 4px 18px; border-radius: 30px; border: 3px solid var(--xanh); background: #fff; color: var(--xanh); }

  .man { position: fixed; inset: 0; background: rgba(18, 48, 74, .82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .the-hoi {
    width: min(100%, 1100px); max-height: 100%; overflow-y: auto;
    background: #fff; border-radius: calc(var(--u) * 4); border: 8px solid var(--mau, var(--la));
    padding: calc(var(--u) * 3) calc(var(--u) * 4);
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.5); text-align: center;
    animation: bung .45s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes bung { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .so-la { font-size: max(18px, calc(var(--u) * 3.4)); color: #fff; background: var(--mau, var(--la)); border-radius: 30px; padding: 2px 22px; }
  .cau { font-size: max(28px, calc(var(--u) * 6.5)); line-height: 1.2; text-wrap: balance; }
  .hinh { font-family: var(--emoji); font-size: max(80px, calc(var(--u) * 20)); line-height: 1; }
  .tu { font-size: max(52px, calc(var(--u) * 15)); line-height: 1.15; white-space: pre; }
  .tu .o { display: inline-block; min-width: 1.2em; border: 6px dashed var(--do); border-radius: 18px; color: var(--do); padding: 0 .15em; }
  .tu .o.xong { border-style: solid; border-color: var(--la); color: var(--la); background: #d3f9d8; }
  .doc { font-size: max(40px, calc(var(--u) * 10)); line-height: 1.25; color: var(--xanh); text-wrap: balance; }
  .chon { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 3); }
  .chon button {
    min-width: max(90px, calc(var(--u) * 20)); padding: calc(var(--u) * 1) calc(var(--u) * 4);
    font-size: max(40px, calc(var(--u) * 11)); line-height: 1.1;
    color: #fff; background: var(--cam); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--cam-dam);
  }
  .chon button:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--cam-dam); }
  .chon button.sai { background: #b9c2cc; box-shadow: 0 8px 0 #8a949e; animation: lac .4s; }
  .chon button.dung, .chon button.doc-xong { background: var(--la); box-shadow: 0 8px 0 var(--la-dam); }
  .chon button.doc-xong { font-size: max(26px, calc(var(--u) * 6)); }
  @keyframes lac { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .loi { min-height: 1.2em; font-size: max(24px, calc(var(--u) * 5.5)); }
  .loi.sai { color: #e8590c; }
  .loi.dung { color: var(--la); }

  .nut-lon { font-size: max(26px, calc(var(--u) * 6)); padding: calc(var(--u) * .6) calc(var(--u) * 6); color: #fff; background: var(--la); border: none; border-radius: calc(var(--u) * 3); box-shadow: 0 8px 0 var(--la-dam); }
  .so-dem { font-size: max(80px, calc(var(--u) * 24)); color: var(--la); line-height: 1; animation: nay .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes nay { from { transform: translateY(60px) scale(0); } to { transform: none; } }
  .sen-to { width: max(150px, calc(var(--u) * 30)); animation: nay .8s cubic-bezier(.3,1.6,.5,1); }
  .bai-moi { font-size: max(26px, calc(var(--u) * 5.6)); color: var(--xanh); }
  .am-moi { display: flex; gap: calc(var(--u) * 6); justify-content: center; flex-wrap: wrap; }
  .am-moi > div { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1); }
  .am-moi .chu-to { font-size: max(60px, calc(var(--u) * 15)); line-height: 1; color: var(--do); }
  .am-moi .vd-hang { display: flex; gap: calc(var(--u) * 3); }
  .am-moi .vd { font-size: max(22px, calc(var(--u) * 4.4)); display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .am-moi .vd span { font-family: var(--emoji); font-size: 1.9em; }

  #phao { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
  #phao i { position: absolute; top: -20px; width: 14px; height: 20px; border-radius: 3px; animation: roi linear forwards; }
  @keyframes roi { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) {
    .the-hoi, .so-dem, .sen-to, .song, .may, .ca, .vong-sang { animation: none !important; }
    #phao { display: none; }
  }
</style>
</head>
<body>
<h1>Ếch con nhảy lá sen</h1>
<div class="goi-y" id="goi-y">Ếch con muốn sang bờ bên kia. Mời bạn chọn lá sen số 1 nhé!</div>
<div class="ao">
  <svg viewBox="0 0 1600 820" preserveAspectRatio="xMidYMid meet" id="canh">
    <defs>
      <linearGradient id="nuoc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#66d9e8"/><stop offset="1" stop-color="#1c7ed6"/></linearGradient>
      <clipPath id="cat-ao"><rect x="170" y="230" width="1260" height="590" rx="60"/></clipPath>
    </defs>
    <!-- trời, mặt trời, mây -->
    <circle cx="1460" cy="80" r="55" fill="#ffd43b" stroke="#f59f00" stroke-width="6"/>
    <g class="may"><g fill="#fff"><ellipse cx="0" cy="90" rx="80" ry="30"/><ellipse cx="50" cy="70" rx="55" ry="35"/><ellipse cx="-45" cy="75" rx="40" ry="28"/></g></g>
    <g class="may" style="animation-delay:-22s"><g fill="#fff"><ellipse cx="0" cy="150" rx="65" ry="24"/><ellipse cx="35" cy="135" rx="42" ry="28"/></g></g>
    <!-- hai bờ cỏ -->
    <path d="M0 260 Q120 230 230 280 L230 820 L0 820 Z" fill="#69db7c" stroke="#2b8a3e" stroke-width="6"/>
    <path d="M1600 260 Q1480 230 1370 280 L1370 820 L1600 820 Z" fill="#69db7c" stroke="#2b8a3e" stroke-width="6"/>
    <!-- mặt ao -->
    <rect x="170" y="230" width="1260" height="590" rx="60" fill="url(#nuoc)" stroke="#12304a" stroke-width="6"/>
    <g clip-path="url(#cat-ao)" fill="none" stroke="#e3fafc" stroke-width="5" stroke-linecap="round" opacity=".55">
      <g class="song"><path d="M170 330 q50 -18 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0"/></g>
      <g class="song" style="animation-duration:9s"><path d="M120 560 q50 -18 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0"/></g>
      <g class="song" style="animation-duration:7s"><path d="M170 760 q50 -18 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0"/></g>
      <!-- cá nhảy -->
      <g class="ca"><g transform="translate(560 790)" stroke="#12304a" stroke-width="3" fill="#ff922b" opacity="1"><ellipse rx="26" ry="14"/><path d="M22 0 l20 -14 v28 Z"/><circle cx="-12" cy="-3" r="3" fill="#12304a"/></g></g>
      <g class="ca hai"><g transform="translate(1000 300)" stroke="#12304a" stroke-width="3" fill="#ffd43b" opacity="1"><ellipse rx="22" ry="12"/><path d="M18 0 l18 -12 v24 Z"/><circle cx="-10" cy="-3" r="3" fill="#12304a"/></g></g>
    </g>
    <!-- lau sậy hai bên bờ -->
    <g stroke="#2b8a3e" stroke-width="6" stroke-linecap="round">
      <path d="M40 300 v-110 M70 300 v-140 M100 300 v-95"/><path d="M1500 300 v-110 M1530 300 v-140 M1560 300 v-95"/>
    </g>
    <g fill="#8d6e3f"><rect x="33" y="180" width="14" height="40" rx="7"/><rect x="63" y="150" width="14" height="40" rx="7"/><rect x="93" y="195" width="14" height="36" rx="7"/>
      <rect x="1493" y="180" width="14" height="40" rx="7"/><rect x="1523" y="150" width="14" height="40" rx="7"/><rect x="1553" y="195" width="14" height="36" rx="7"/></g>
    <g id="cac-la"></g>
    <g id="nu-sen"></g>
    <g id="gon-song"></g>
    <g id="ech"></g>
  </svg>
</div>
<div class="hang-duoi"><button class="nut-nho" id="choi-lai">Chơi lại từ đầu</button></div>

<div class="man" id="man" hidden><div class="the-hoi" id="the-hoi"></div></div>
<div id="phao"></div>

<script>
// ====== NỘI DUNG (cô sửa ở đây cho bài khác) ======
// Ôn bài 37-41 (em êm im um, ai ay ây, oi ôi ơi, ôn tập, ui ưi) trước Bài 42 ao eo.
// Chỉ dùng âm, vần đã học, KHÔNG dùng ao, eo (để dành cho nụ sen bí mật).
// Mỗi lá sen một câu, ếch phải đi lần lượt từ lá 1:
//   chon: { hoi, hinh?, tu?: [trước, chữ cần điền, sau], dap, cacChon }  - bé chạm chọn đáp án
//   doc:  { hoi, doc }                                                     - cả lớp đọc to, cô bấm nút khi đọc đúng
const CAU = [
  { kieu: 'chon', hoi: 'Đây là cái gì? Chọn vần đúng nhé!', hinh: '🚜', tu: ['máy c', 'ày', ''], dap: 'ày', cacChon: ['ài', 'ày', 'ầy'] },
  { kieu: 'chon', hoi: 'Tiếng nào có vần oi?', dap: 'voi', cacChon: ['vui', 'voi', 'vai'] },
  { kieu: 'chon', hoi: 'Đây là gì? Chọn vần đúng nhé!', hinh: '⛰️', tu: ['dãy n', 'úi', ''], dap: 'úi', cacChon: ['ủi', 'úi', 'ứi'] },
  { kieu: 'doc', hoi: 'Cả lớp cùng đọc to nào!', doc: 'Hai bạn thi nhảy dây.' },
  { kieu: 'chon', hoi: 'Đây là gì? Chọn vần đúng nhé!', hinh: '🧸', tu: ['đồ ch', 'ơi', ''], dap: 'ơi', cacChon: ['oi', 'ôi', 'ơi'] },
  { kieu: 'doc', hoi: 'Cả lớp cùng đọc to nào!', doc: 'Voi con mời bạn đi xem hội.' }
];
const BAI_MOI = { ten: 'Bài 42: ao eo', am: [['ao', [['⭐', 'ngôi sao'], ['🍎', 'quả táo']]], ['eo', [['🍬', 'cái kẹo'], ['🐱', 'con mèo']]]] };
// ====================================================

const MAU_LA = ['#e03131', '#1c7ed6', '#f08c00', '#ae3ec9', '#0ca678', '#f06595', '#7048e8', '#fab005'];
const KHEN = ['Hoan hô!', 'Giỏi quá!', 'Tuyệt vời!', 'Xuất sắc!', 'Đúng rồi!'];
const BO_TRAI = { x: 95, y: 560 }, BO_PHAI = { x: 1505, y: 600 };
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
let daQua = 0, viTri = null, dangNhay = false, amThanh = null;
const itDong = matchMedia('(prefers-reduced-motion: reduce)').matches;

// lá sen xếp ngoằn ngoèo từ bờ trái sang bờ phải
const LA = CAU.map((_, i) => {
  const n = CAU.length, x = 330 + i * (940 / Math.max(1, n - 1));
  return { x, y: i % 2 ? 450 : 650 };
});

function keu(dsTanSo, kieu = 'triangle', cach = 0.12) {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    if (amThanh.state === 'suspended') amThanh.resume();
    dsTanSo.forEach((f, i) => {
      const o = amThanh.createOscillator(), g = amThanh.createGain();
      const t = amThanh.currentTime + i * cach;
      o.frequency.value = f; o.type = kieu;
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.connect(g); g.connect(amThanh.destination);
      o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}
// tiếng "ộp ộp": hai tiếng trầm trượt xuống
function op() {
  try {
    amThanh = amThanh || new (window.AudioContext || window.webkitAudioContext)();
    if (amThanh.state === 'suspended') amThanh.resume();
    [0, 0.22].forEach(d => {
      const o = amThanh.createOscillator(), g = amThanh.createGain(), t = amThanh.currentTime + d;
      o.type = 'square'; o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(110, t + 0.15);
      g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
      o.connect(g); g.connect(amThanh.destination); o.start(t); o.stop(t + 0.18);
    });
  } catch (e) {}
}

function hoaSen(cx, cy, r) {
  let s = '';
  for (let k = 0; k < 8; k++) {
    const a = k * 45;
    s += `<ellipse cx="${cx}" cy="${cy - r * .55}" rx="${r * .32}" ry="${r * .6}" fill="${k % 2 ? '#fcc2d7' : '#f783ac'}" stroke="#a61e4d" stroke-width="3" transform="rotate(${a} ${cx} ${cy})"/>`;
  }
  return s + `<circle cx="${cx}" cy="${cy}" r="${r * .3}" fill="#ffd43b" stroke="#e67700" stroke-width="3"/>`;
}

function veLa() {
  const g = $('cac-la');
  g.textContent = '';
  LA.forEach((p, i) => {
    const xong = i < daQua, dang = i === daQua, mau = MAU_LA[i % MAU_LA.length];
    const la = document.createElementNS(NS, 'g');
    la.setAttribute('class', 'la-sen' + (dang ? '' : ' khoa'));
    la.setAttribute('role', 'button');
    la.setAttribute('tabindex', dang ? '0' : '-1');
    la.setAttribute('aria-label', `Lá sen số ${i + 1}` + (xong ? ', ếch đã qua' : dang ? ', đến lượt' : ''));
    la.innerHTML = `
      ${dang ? `<ellipse class="vong-sang" cx="${p.x}" cy="${p.y}" rx="112" ry="70" fill="none" stroke="#ffd43b" stroke-width="12"/>` : ''}
      <path d="M${p.x} ${p.y} L${p.x + 89} ${p.y - 20} A95 60 0 1 0 ${p.x + 89} ${p.y + 20} Z" fill="${xong ? '#8ce99a' : '#40c057'}" stroke="#2b8a3e" stroke-width="6" stroke-linejoin="round"/>
      <path d="M${p.x} ${p.y} l-60 -28 M${p.x} ${p.y} l-70 18 M${p.x} ${p.y} l-10 50 M${p.x} ${p.y} l40 42" stroke="#2b8a3e" stroke-width="3" opacity=".6"/>
      ${xong ? hoaSen(p.x + 55, p.y + 18, 34)
             : `<circle cx="${p.x}" cy="${p.y}" r="34" fill="#fff" stroke="${mau}" stroke-width="6"/>
                <text x="${p.x}" y="${p.y + 2}" font-size="42" text-anchor="middle" dominant-baseline="central" fill="#12304a">${i + 1}</text>`}`;
    la.onclick = () => chamLa(i);
    la.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chamLa(i); } };
    g.appendChild(la);
  });
  // nụ sen bí mật trên bờ bên kia
  const du = daQua >= CAU.length, tren = viTri === 'bo-phai';
  const nu = $('nu-sen');
  nu.setAttribute('class', 'nu-sen' + (du && !tren ? ' mo-duoc' : ''));
  nu.setAttribute('role', 'button');
  nu.setAttribute('tabindex', du && !tren ? '0' : '-1');
  nu.setAttribute('aria-label', du ? 'Nụ sen bí mật, mở được rồi' : 'Nụ sen bí mật, còn khóa');
  const x = 1515, y = 300;
  nu.innerHTML = `
    ${du && !tren ? `<circle class="vong-sang" cx="${x}" cy="${y - 30}" r="92" fill="none" stroke="#ffd43b" stroke-width="12"/>` : ''}
    <path d="M${x} ${y + 140} v-90" stroke="#2b8a3e" stroke-width="10"/>
    <path d="M${x} ${y + 50} q-70 -60 0 -150 q70 90 0 150 Z" fill="#f783ac" stroke="#a61e4d" stroke-width="5"/>
    <path d="M${x} ${y + 50} q-45 -40 -5 -110" fill="none" stroke="#a61e4d" stroke-width="3"/>
    <circle cx="${x}" cy="${y - 40}" r="30" fill="#fff" stroke="#f2b705" stroke-width="6"/>
    <text x="${x}" y="${y - 38}" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#12304a">${du ? '?' : '🔒'}</text>`;
  nu.onclick = () => chamNu();
  nu.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chamNu(); } };
}

// chú ếch vẽ tại gốc (0,0) = giữa chân
function veEch() {
  $('ech').innerHTML = `<g id="than-ech">
    <ellipse cx="-38" cy="-8" rx="26" ry="14" fill="#2f9e44" stroke="#12304a" stroke-width="5"/>
    <ellipse cx="38" cy="-8" rx="26" ry="14" fill="#2f9e44" stroke="#12304a" stroke-width="5"/>
    <ellipse cx="0" cy="-45" rx="55" ry="44" fill="#51cf66" stroke="#12304a" stroke-width="5"/>
    <ellipse cx="0" cy="-30" rx="32" ry="22" fill="#d3f9d8"/>
    <circle cx="-26" cy="-88" r="20" fill="#51cf66" stroke="#12304a" stroke-width="5"/>
    <circle cx="26" cy="-88" r="20" fill="#51cf66" stroke="#12304a" stroke-width="5"/>
    <circle cx="-26" cy="-88" r="10" fill="#fff"/><circle cx="26" cy="-88" r="10" fill="#fff"/>
    <circle cx="-23" cy="-87" r="6" fill="#12304a"/><circle cx="29" cy="-87" r="6" fill="#12304a"/>
    <path d="M-22 -56 q22 18 44 0" fill="none" stroke="#12304a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-38" cy="-55" r="7" fill="#ff8787" opacity=".7"/><circle cx="38" cy="-55" r="7" fill="#ff8787" opacity=".7"/>
    <path d="M-16 -128 l8 -18 l8 14 l8 -14 l8 18 Z" fill="#ffd43b" stroke="#e67700" stroke-width="3" stroke-linejoin="round"/>
  </g>`;
}
function datEch(p) { $('ech').setAttribute('transform', `translate(${p.x} ${p.y})`); }
function diemDung(vt) {
  if (vt === 'bo-trai') return BO_TRAI;
  if (vt === 'bo-phai') return BO_PHAI;
  return { x: LA[vt].x, y: LA[vt].y + 10 };
}

// nhảy theo đường vòng cung, đáp xuống thì gợn sóng
function nhay(den, xong) {
  const tu = diemDung(viTri), toi = diemDung(den);
  dangNhay = true;
  op();
  const ket = () => {
    viTri = den; datEch(toi); dangNhay = false;
    if (typeof den === 'number') gonSong(toi);
    keu([700, 450], 'sine', 0.06);
    xong && xong();
  };
  if (itDong) { ket(); return; }
  const t0 = performance.now(), lau = 750, cao = 230;
  const buoc = now => {
    const t = Math.min(1, (now - t0) / lau);
    const x = tu.x + (toi.x - tu.x) * t, y = tu.y + (toi.y - tu.y) * t - cao * 4 * t * (1 - t);
    const co = t < .15 ? 1 - t * 1.5 : 1;
    $('ech').setAttribute('transform', `translate(${x} ${y}) scale(${1 / co} ${co})`);
    if (t < 1) requestAnimationFrame(buoc); else ket();
  };
  requestAnimationFrame(buoc);
}
function gonSong(p) {
  const g = $('gon-song');
  [0, 250].forEach(d => setTimeout(() => {
    const e = document.createElementNS(NS, 'ellipse');
    e.setAttribute('cx', p.x); e.setAttribute('cy', p.y + 5); e.setAttribute('rx', 120); e.setAttribute('ry', 46);
    e.setAttribute('fill', 'none'); e.setAttribute('stroke', '#e3fafc'); e.setAttribute('stroke-width', 5);
    e.setAttribute('class', 'gon');
    g.appendChild(e);
    setTimeout(() => e.remove(), 1700);
  }, d));
}

function chamLa(i) {
  if (dangNhay) return;
  if (i < daQua) { $('goi-y').textContent = 'Ếch con qua lá này rồi! Chọn lá tiếp theo nhé!'; return; }
  if (i > daQua) { keu([220, 196]); $('goi-y').textContent = `Ếch con phải nhảy lần lượt. Chọn lá sen số ${daQua + 1} nhé!`; return; }
  moCau(i);
}

function moCau(i) {
  const c = CAU[i], mau = MAU_LA[i % MAU_LA.length], the = $('the-hoi');
  the.style.setProperty('--mau', mau);
  let h = `<div class="so-la">Lá sen số ${i + 1}</div><div class="cau">${c.hoi}</div>`;
  if (c.hinh) h += `<div class="hinh">${c.hinh}</div>`;
  if (c.tu) h += `<div class="tu">${c.tu[0]}<span class="o" id="o">?</span>${c.tu[2]}</div>`;
  if (c.kieu === 'doc') h += `<div class="doc">${c.doc}</div>`;
  h += `<div class="chon" id="chon"></div><div class="loi" id="loi"></div>
    <button class="nut-nho" id="de-sau">Để bạn khác trả lời</button>`;
  the.innerHTML = h;
  $('de-sau').onclick = () => { $('man').hidden = true; };
  const chon = $('chon');
  if (c.kieu === 'doc') {
    const b = document.createElement('button');
    b.className = 'doc-xong'; b.textContent = 'Cả lớp đọc đúng rồi ✓';
    b.onclick = () => dung(i);
    chon.appendChild(b);
  } else {
    c.cacChon.forEach(v => {
      const b = document.createElement('button');
      b.textContent = v;
      b.onclick = () => {
        if (b.disabled || chon.dataset.xong) return;
        if (v === c.dap) {
          chon.dataset.xong = '1';
          b.classList.add('dung');
          if (c.tu) { $('o').textContent = c.dap; $('o').classList.add('xong'); }
          $('loi').className = 'loi dung'; $('loi').textContent = KHEN[i % KHEN.length] + ' Ếch con nhảy nào!';
          keu([523, 659, 784]);
          setTimeout(() => dung(i), 1000);
        } else {
          b.classList.add('sai'); b.disabled = true;
          $('loi').className = 'loi sai'; $('loi').textContent = 'Ộp ộp! Bạn thử lại nhé!';
          op();
        }
      };
      chon.appendChild(b);
    });
  }
  $('man').hidden = false;
  keu([392, 523], 'sine');
}

function dung(i) {
  $('man').hidden = true;
  nhay(i, () => {
    daQua = i + 1;
    veLa();
    phaoGiay(30);
    keu([523, 659, 784, 1047]);
    const conLai = CAU.length - daQua;
    $('goi-y').textContent = conLai
      ? `Ếch con nhảy được rồi! Còn ${conLai} lá sen. Mời bạn chọn lá số ${daQua + 1} nhé!`
      : 'Ếch con đến lá cuối rồi! Bấm vào nụ sen bên bờ để nhảy lên bờ nhé!';
  });
}

function chamNu() {
  if (dangNhay) return;
  if (daQua < CAU.length) { keu([220, 196]); $('goi-y').textContent = `Ếch con phải qua đủ ${CAU.length} lá sen thì nụ sen mới nở nhé!`; return; }
  if (viTri === 'bo-phai') { moBaiMoi(); return; }
  nhay('bo-phai', () => { veLa(); setTimeout(demRoiMo, 500); });
}

// cả lớp đếm rồi kêu "Ộp!" thì nụ sen nở
function demRoiMo() {
  const the = $('the-hoi');
  the.style.setProperty('--mau', '#f783ac');
  const so = ['Một...', 'Hai...', 'Ba...', 'Ộp!'];
  $('man').hidden = false;
  let k = 0;
  const buoc = () => {
    if (k < so.length) {
      the.innerHTML = `<div class="so-la">Cả lớp cùng đếm nào!</div><div class="so-dem">${so[k]}</div>`;
      if (k < 3) keu([392 + k * 131], 'sine'); else op();
      k++; setTimeout(buoc, 1000);
    } else moBaiMoi();
  };
  buoc();
}

function moBaiMoi() {
  const the = $('the-hoi');
  the.style.setProperty('--mau', '#f783ac');
  the.innerHTML = `<div class="so-la">Nụ sen nở rồi!</div>
    <svg class="sen-to" viewBox="0 0 200 200">${hoaSen(100, 110, 90)}</svg>
    <div class="bai-moi">Ếch con qua ao rồi! Hôm nay chúng mình học ${BAI_MOI.ten}</div>
    <div class="am-moi">${BAI_MOI.am.map(([chu, vd]) => `<div><div class="chu-to">${chu}</div>
      <div class="vd-hang">${vd.map(([hinh, tu]) => `<div class="vd"><span>${hinh}</span>${tu}</div>`).join('')}</div></div>`).join('')}</div>
    <button class="nut-lon" id="dong">Vào bài mới!</button>`;
  $('dong').onclick = () => { $('man').hidden = true; };
  $('dong').focus();
  phaoGiay(90);
  keu([392, 523, 659, 784, 1047, 1319, 1568]);
  $('goi-y').textContent = 'Hoan hô cả lớp! Ếch con đã qua ao!';
}

function phaoGiay(soLuong) {
  const p = $('phao');
  p.textContent = '';
  const mau = [...MAU_LA, '#ffd43b', '#f783ac'];
  for (let i = 0; i < soLuong; i++) {
    const g = document.createElement('i');
    g.style.left = Math.random() * 100 + 'vw';
    g.style.background = mau[i % mau.length];
    g.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    g.style.animationDelay = Math.random() * 1 + 's';
    p.appendChild(g);
  }
  setTimeout(() => { p.textContent = ''; }, 6500);
}

function batDau() {
  daQua = 0; viTri = 'bo-trai'; dangNhay = false;
  $('man').hidden = true;
  $('gon-song').textContent = '';
  veEch(); datEch(BO_TRAI); veLa();
  $('goi-y').textContent = 'Ếch con muốn sang bờ bên kia. Mời bạn chọn lá sen số 1 nhé!';
}
$('choi-lai').onclick = batDau;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('man').hidden && $('dong')) $('dong').click(); });
batDau();
</script>
</body>
</html>
