<script>
/* ============ DỮ LIỆU ============ */
const KHOA = 'giaoan_codiep_v1';
const BUOC = ['Thông tin bài', 'Tiến trình tiết dạy', 'Viết nội dung', 'Kiểm tra và xuất Word'];
let buoc = 0, mucChon = 'yccd', uid = 1;
let G = macDinh();

const MAU_HD = {
  'Toán': [['Khởi động', 4, 'Trò chơi, vấn đáp', 'Cả lớp'], ['Khám phá', 6, 'Trực quan, quan sát, đàm thoại', 'Cả lớp, cặp đôi'], ['Thực hành 1', 5, 'Làm mẫu, thực hành cá nhân, vấn đáp', 'Cá nhân, cả lớp'], ['NGHỈ GIỮA TIẾT', 2, 'Trò chơi vận động', 'Cả lớp'], ['Thực hành 2', 6, 'Thảo luận cặp đôi, hợp tác', 'Cá nhân, cặp đôi'], ['Thực hành 3 (trò chơi)', 6, 'Dạy học qua trò chơi, hợp tác nhóm', 'Nhóm 4, cả lớp'], ['Vận dụng, củng cố, dặn dò', 6, 'Giải quyết tình huống, đánh giá nhanh', 'Cả lớp']],
  'Tiếng Việt': [['Khởi động', 4, 'Trò chơi, vấn đáp', 'Cả lớp'], ['Khám phá: đọc và tìm hiểu bài', 10, 'Đọc mẫu, đọc cá nhân, đàm thoại', 'Cả lớp, cặp đôi'], ['Luyện tập 1', 7, 'Thực hành, thảo luận cặp đôi', 'Cá nhân, cặp đôi'], ['NGHỈ GIỮA TIẾT', 2, 'Trò chơi vận động', 'Cả lớp'], ['Luyện tập 2 (viết, nói và nghe)', 8, 'Thực hành, hợp tác nhóm', 'Cá nhân, nhóm'], ['Vận dụng, củng cố, dặn dò', 4, 'Trò chơi, đánh giá nhanh', 'Cả lớp']],
  'Khác': [['Khởi động', 4, 'Trò chơi, vấn đáp', 'Cả lớp'], ['Khám phá', 10, 'Trực quan, đàm thoại', 'Cả lớp, nhóm'], ['Luyện tập', 10, 'Thực hành, thảo luận', 'Cá nhân, nhóm'], ['NGHỈ GIỮA TIẾT', 2, 'Trò chơi vận động', 'Cả lớp'], ['Vận dụng, củng cố, dặn dò', 9, 'Giải quyết tình huống, đánh giá nhanh', 'Cả lớp']]
};
function macDinh() {
  return {
    info: { mon: 'Toán', lop: '1', sach: 'Kết nối tri thức với cuộc sống', tuan: '', chude: '', bai: '', tiet: '', trang: '', tl: 35, nghi: true, nghiTu: 15, nguoiday: 'Trần Thị Hồng Điệp', ngay: '…/…/…', thaogiang: false, noidung: '', dacdiem: '', trochoi: '', nls: true, gdbvmt: false, khac: '', tomtat: true, khokhan: true },
    hd: [], yccd: '', nls: '', dodungGV: '', dodungHS: '', khokhan: ''
  };
}
function luu() { try { localStorage.setItem(KHOA, JSON.stringify(G)); } catch (e) {} }
function tai() { try { const t = localStorage.getItem(KHOA); if (t) { const o = JSON.parse(t); G = Object.assign(macDinh(), o); G.info = Object.assign(macDinh().info, o.info); } } catch (e) {} uid = 1 + Math.max(0, ...G.hd.map(h => h.id || 0)); }
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const san = t => String(t || '').replace(/[—–]/g, '-');
function bao(t) { const e = $('toast'); e.textContent = t; e.classList.add('hien'); clearTimeout(bao.t); bao.t = setTimeout(() => e.classList.remove('hien'), 2200); }
function chep(t) {
  const xong = () => bao('Đã chép. Dán vào ChatGPT hoặc Gemini nhé.');
  const du = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); xong(); } catch (e) { bao('Không chép được, hãy bôi đen rồi Ctrl+C'); } a.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(xong, du); else du();
}
function datPath(o, p, v) { const k = p.split('.'); for (let i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = v; }

/* ============ TIẾN TRÌNH ============ */
function dungHD() {
  const mau = MAU_HD[G.info.mon] || MAU_HD['Khác'];
  G.hd = mau.filter(m => G.info.nghi || m[0] !== 'NGHỈ GIỮA TIẾT').map(m => ({ id: uid++, ten: m[0], phut: m[1], pp: m[2], ht: m[3], tc: '', loai: m[0] === 'NGHỈ GIỮA TIẾT' ? 'nghi' : 'thuong', muctieu: '', gv: '', hs: '' }));
  chiaLai();
}
function chiaLai() {
  const i = G.info, nghi = G.hd.filter(h => h.loai === 'nghi'), thuong = G.hd.filter(h => h.loai !== 'nghi');
  const phutNghi = nghi.length ? 2 : 0; nghi.forEach(h => h.phut = 2);
  const dich = i.tl - phutNghi, tong = thuong.reduce((a, h) => a + h.phut, 0) || 1;
  let con = dich;
  thuong.forEach((h, k) => { const v = k === thuong.length - 1 ? con : Math.max(1, Math.round(h.phut * dich / tong)); h.phut = v; con -= v; });
}
function mocGio() { let t = 0; return G.hd.map(h => { const s = t; t += +h.phut || 0; return [s, t]; }); }
function tongPhut() { return G.hd.reduce((a, h) => a + (+h.phut || 0), 0); }
function tgStr(h, g) { return `${h.phut} phút / (${g[0]}' - ${g[1]}')`; }
function tenHD(h, n) { return h.loai === 'nghi' ? 'NGHỈ GIỮA TIẾT' : `${n}. ${h.ten}`; }
function danhSoHD() { let n = 0; return G.hd.map(h => h.loai === 'nghi' ? '*' : ++n); }

/* ============ CÂU LỆNH ============ */
const LUAT = `Quy tắc viết:
- Viết như giáo viên tiểu học viết giáo án thật: câu ngắn, hành động cụ thể, có câu hỏi của giáo viên đặt trong ngoặc kép và dự kiến câu trả lời của học sinh.
- CHỈ dựa vào nội dung bài học do giáo viên dán ở trên. Không bịa nội dung sách giáo khoa, số trang, số bài tập, từ ngữ hay số liệu. Chỗ nào thiếu dữ kiện thì ghi đúng dạng [cần bổ sung: ...].
- Không dùng gạch dài (— hoặc –), không dùng ký hiệu markdown (#, **, |) trừ các dấu mốc ## bên dưới.
- Không dùng các cụm sáo rỗng như "góp phần quan trọng", "vô cùng", "hành trình".
- Thời gian mỗi hoạt động khớp với bảng tiến trình.`;
function ctx() {
  const i = G.info, ghi = G.hd.map((h, k) => `${danhSoHD()[k]}. ${h.ten} (${h.phut} phút; phương pháp: ${h.pp || 'tự chọn'}; hình thức: ${h.ht || 'tự chọn'})`);
  return `THÔNG TIN TIẾT DẠY:
- Môn: ${i.mon}. Lớp: ${i.lop}. Bộ sách: ${i.sach}. Tuần: ${i.tuan || '[chưa nhập]'}.
- Chủ đề/chủ điểm: ${i.chude || '[chưa nhập]'}. Tên bài: ${i.bai || '[chưa nhập]'}. Tiết: ${i.tiet || '[chưa nhập]'}. Trang SGK: ${i.trang || '[chưa nhập]'}.
- Thời lượng: ${i.tl} phút${i.nghi ? ' (có nghỉ giữa tiết 2 phút)' : ''}.
- Đặc điểm lớp: ${i.dacdiem || '[không ghi]'}.
- Trò chơi hoặc hoạt động giáo viên muốn dùng: ${i.trochoi || '[để AI gợi ý, ưu tiên trò chơi đơn giản, ít đồ dùng]'}.
- Tích hợp: ${[i.nls ? 'năng lực số (lớp nhỏ ở mức làm quen, giáo viên điều khiển thiết bị)' : '', i.gdbvmt ? 'giáo dục bảo vệ môi trường' : '', i.khac].filter(Boolean).join('; ') || 'không'}.

NỘI DUNG BÀI HỌC DO GIÁO VIÊN DÁN (căn cứ duy nhất):
${i.noidung || '[chưa dán nội dung bài, hãy ghi [cần bổ sung: nội dung bài học] ở những chỗ cần]'}

CÁC HOẠT ĐỘNG VÀ THỜI GIAN:
${ghi.join('\n')}`;
}
function lenhCaTiet() {
  const i = G.info;
  let mau = `##YCCD\n(Yêu cầu cần đạt: viết 3 phần mở đầu "1. Kiến thức, kĩ năng:" "2. Năng lực:" "3. Phẩm chất:", mỗi ý một dòng bắt đầu bằng "- ")\n`;
  if (i.nls) mau += `##NLS\n(Tích hợp năng lực số: mỗi dòng gồm 3 ô ngăn bằng dấu | theo dạng: Thành phần năng lực số | Biểu hiện cụ thể trong tiết học | Công cụ, thiết bị gợi ý. Viết 4 đến 5 dòng, KHÔNG viết dòng tiêu đề)\n`;
  mau += `##DODUNG_GV\n(Đồ dùng của giáo viên, một dòng)\n##DODUNG_HS\n(Đồ dùng của học sinh, một dòng)\n`;
  G.hd.forEach((h, k) => { mau += `##HD${k + 1}_MUCTIEU\n(${h.loai === 'nghi' ? 'Mục đích và hình thức của phần nghỉ giữa tiết' : 'Mục tiêu và phương pháp của hoạt động "' + h.ten + '", viết một đoạn ngắn'})\n##HD${k + 1}_GV\n(Hoạt động của giáo viên: các bước, mỗi bước một dòng, dòng tên trò chơi hoặc tên bước nhỏ bắt đầu bằng "* ")\n##HD${k + 1}_HS\n(Hoạt động của học sinh tương ứng với từng dòng bên giáo viên)\n`; });
  if (i.khokhan) mau += `##KHOKHAN\n(Dự kiến khó khăn của học sinh và cách hỗ trợ, 3 đến 4 dòng bắt đầu bằng "- ")\n`;
  return `${ctx()}\n\nHãy soạn kế hoạch bài dạy cho tiết trên. Trả lời ĐÚNG theo mẫu dưới đây: mỗi phần bắt đầu bằng một dòng dấu mốc (##TÊN) đứng một mình trên dòng, sau đó là nội dung. Không thêm lời dẫn, không thêm phần nào khác.\n\n${LUAT}\n\nMẪU TRẢ LỜI:\n${mau}`;
}
function lenhHD(k) {
  const h = G.hd[k];
  return `${ctx()}\n\nHãy viết lại hoạt động số ${k + 1}: "${h.ten}" (${h.phut} phút). ${h.tc ? 'Trò chơi, công cụ: ' + h.tc + '. ' : ''}Trả lời ĐÚNG theo mẫu, mỗi phần bắt đầu bằng dòng dấu mốc đứng một mình:\n\n##HD${k + 1}_MUCTIEU\n(mục tiêu và phương pháp)\n##HD${k + 1}_GV\n(hoạt động giáo viên, mỗi bước một dòng, tên trò chơi hoặc bước nhỏ bắt đầu bằng "* ")\n##HD${k + 1}_HS\n(hoạt động học sinh tương ứng)\n\n${LUAT}`;
}
function lenhMuc(key) {
  const ten = { yccd: 'Yêu cầu cần đạt', nls: 'Tích hợp năng lực số', dodung: 'Đồ dùng dạy học', khokhan: 'Dự kiến khó khăn và cách hỗ trợ' }[key];
  const mau = { yccd: '##YCCD\n(3 phần "1. Kiến thức, kĩ năng:" "2. Năng lực:" "3. Phẩm chất:", mỗi ý một dòng bắt đầu bằng "- ")', nls: '##NLS\n(mỗi dòng: Thành phần năng lực số | Biểu hiện cụ thể trong tiết học | Công cụ, thiết bị gợi ý. 4 đến 5 dòng, không dòng tiêu đề)', dodung: '##DODUNG_GV\n(một dòng)\n##DODUNG_HS\n(một dòng)', khokhan: '##KHOKHAN\n(3 đến 4 dòng bắt đầu bằng "- ")' }[key];
  return `${ctx()}\n\nHãy viết phần "${ten}". Trả lời đúng mẫu, không lời dẫn:\n\n${mau}\n\n${LUAT}`;
}
function phanTich(text) {
  const re = /^\s*##\s*([A-Z0-9_]+)\s*$/gm; const parts = {}; let m, last = null, idx = 0; const marks = [];
  while ((m = re.exec(text))) marks.push([m[1], m.index, re.lastIndex]);
  marks.forEach((x, n) => { parts[x[0]] = text.slice(x[2], n + 1 < marks.length ? marks[n + 1][1] : text.length).trim(); });
